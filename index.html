<script type="text/plain" class="lesson-src" data-id="c4-ai"># AI có trách nhiệm và prompt 4 thẻ

:::note Mục tiêu
Hiểu AI đứng ở đâu trong lớp học; nhận ra năm lỗi thường gặp; viết được một câu lệnh đủ rõ để dùng, đủ an toàn để không làm hại học sinh.
:::

:::story Lời nhận xét không có thật
Cô Lan nhờ AI viết nhận xét học bạ cho 40 em. Bản nháp trơn tru đến mức cô định dán vào. Đến em Hưng, cô khựng lại: AI viết “em tiếp thu nhanh, thường giúp bạn” — trong khi Hưng ngồi cuối lớp, cả năm gần như không giơ tay. Cô xóa đoạn đó, viết lại bằng điều chính cô từng thấy. Từ đó cô đặt quy tắc riêng: AI viết nháp, cô viết phần con người.
**Liên tưởng:** AI như người thư ký đọc hồ sơ rất nhanh nhưng chưa từng bước vào lớp; chữ ký và trách nhiệm vẫn là của giáo viên.
:::

## Phần 1 · Tương tác ba chiều: Giáo viên – Học sinh – AI

AI không phải người dạy thứ hai. Trong mô hình ba chiều của tài liệu, mỗi bên có một vai trò:

| Bên | Vai trò | Việc cụ thể |
|---|---|---|
| **Giáo viên** | Kiến trúc sư sư phạm, người điều phối | Thiết kế nhiệm vụ, phân tầng theo TC1/TC2/NC1, cài lỗi sai để học sinh phản biện, thẩm định đầu ra |
| **Học sinh** | Người học chủ động, người phản biện | Dùng AI như gia sư gợi mở, không dùng để làm thay; bắt buộc kiểm chứng với nguồn chính thống |
| **AI** | Công cụ gợi ý, không có trách nhiệm | Sinh phương án, tóm tắt, tạo bản nháp; có thể sai, có thể bịa, không chịu trách nhiệm sư phạm |

:::case Một tiết học ba chiều
Giáo viên giao nhiệm vụ: “Nhóm em hãy nhờ AI tóm tắt ba ý về phong trào công nhân, rồi đối chiếu với sách giáo khoa, đánh dấu chỗ AI nói sai hoặc thiếu.” Học sinh làm việc, ghi lại chỗ AI sai. Giáo viên không chấm câu trả lời của AI mà chấm **quá trình kiểm chứng** của học sinh. Đó là dạy AI có trách nhiệm.
:::

## Phần 2 · Năm lỗi thường gặp và cách kiểm

| Lỗi | Biểu hiện | Cách kiểm |
|---|---|---|
| **Ảo giác tri thức** | AI khẳng định chắc chắn một sự kiện, con số không có thật | Đối chiếu sách giáo khoa và ít nhất một nguồn chính thống |
| **Trích dẫn bịa** | Tên bài báo, tác giả, đường link trông rất thật nhưng không tồn tại | Mở thử link; tìm đúng tên tài liệu trên nguồn gốc |
| **Thiên lệch** | AI nghiêng về một quan điểm, bỏ qua nhóm yếu thế | So sánh kết quả của hai công cụ; tìm thêm tiếng nói địa phương |
| **Sai tính toán hoặc logic** | Lời giải có bước nhảy, kết quả không khớp | Tự tính lại; kiểm tra đơn vị, dấu, điều kiện |
| **Nội dung không phù hợp lứa tuổi** | Ví dụ, hình ảnh, cách diễn đạt chưa phù hợp học sinh | Đọc toàn bộ đầu ra trước khi chiếu; không chiếu trực tiếp từ màn hình AI |

:::warn Không đổ lỗi cho AI
Khi AI trả lời sai, đó là dữ liệu để dạy học sinh cách kiểm chứng. Nhưng khi giáo viên đưa nội dung sai vào bài giảng, trách nhiệm thuộc về giáo viên. Vì vậy nguyên tắc là: **AI tạo bản nháp, giáo viên chịu trách nhiệm bản cuối.**
:::

## Phần 3 · Prompt 4 thẻ

Một câu lệnh tốt không cần dài, nhưng cần đủ bốn thẻ:

| Thẻ | Trả lời câu hỏi | Ví dụ |
|---|---|---|
| **1. Ngữ cảnh** | Ai học, học bài gì, trong bao lâu, điều kiện lớp thế nào? | Lớp 8, 40 học sinh, 5 em chưa có thiết bị, tiết 45 phút |
| **2. Dữ liệu** | Được dùng nguồn nào, cấm đưa gì vào? | Chỉ dùng sách giáo khoa và tư liệu của trường; không nhập tên, điểm, ảnh học sinh |
| **3. Hướng dẫn** | AI phải làm gì, theo định dạng nào, phân hóa ra sao? | Gợi ý 4 hoạt động, mỗi hoạt động 4 mục; mức cơ bản và mở rộng |
| **4. Kết quả** | Nhận sản phẩm gì, đạt tiêu chí nào, phải kiểm chứng chỗ nào? | Kế hoạch bài dạy 45 phút; nêu 3 điểm giáo viên phải kiểm tra lại |

### Mẫu câu lệnh ngắn

> “Bạn là người phản biện sư phạm cho giáo viên Ngữ văn THCS, không làm thay giáo viên. **Ngữ cảnh:** lớp 8, bài văn bản thông tin, 45 phút, một số học sinh chưa có thiết bị. **Dữ liệu:** chỉ dùng sách giáo khoa Ngữ văn 8 và Công văn 5512; không đưa tên, điểm, ảnh học sinh vào. **Hướng dẫn:** gợi ý tiến trình 4 hoạt động giúp học sinh kiểm chứng một tin lan truyền bằng SIFT; ghi mã 1.2.TC2a và ATM1 ở đúng hoạt động; có phương án phiếu in. **Kết quả:** bảng 4 hoạt động, mỗi hoạt động gồm mục tiêu, nội dung, sản phẩm, tổ chức; cuối cùng liệt kê 3 điểm tôi phải kiểm chứng lại.”

Câu lệnh này có thể tạo tự động trong [công cụ Prompt 4 thẻ](#/cong-cu/prompt).

:::tip Mẹo sửa câu lệnh
Nếu AI trả lời chung chung, đừng viết lại từ đầu. Thêm một câu: “Chỉ rõ hoạt động nào học sinh làm, hoạt động nào giáo viên làm; bỏ các hoạt động không thể thực hiện khi lớp không có mạng.”
:::

## Phần 4 · Dữ liệu nào không được đưa vào AI

- Họ tên đầy đủ, số định danh cá nhân, địa chỉ nhà, số điện thoại.
- Bảng điểm, nhận xét hạnh kiểm, hồ sơ tâm lý.
- Ảnh chân dung, ảnh nhóm có thể nhận diện học sinh.
- Nội dung trao đổi riêng giữa giáo viên và phụ huynh.

Nếu cần dùng dữ liệu thật để phân tích, hãy thay bằng mã: **HS01, HS02**, bỏ ngày sinh chính xác, bỏ địa chỉ, chỉ giữ thông tin cần cho bài học. Với dữ liệu nhạy cảm, dùng bảng tính nội bộ thay vì công cụ AI công cộng.

## Phần 5 · Minh bạch khi dùng AI

Ba mẫu câu có thể dùng ngay:

- Trong học liệu: “Học liệu được giáo viên biên soạn, có tham khảo gợi ý của công cụ AI ngày …; nội dung đã được kiểm chứng với sách giáo khoa và văn bản hiện hành.”
- Trong bài của học sinh: “Phần tìm ý và dàn ý có sử dụng AI; phần viết, chỉnh sửa và kiểm chứng do em thực hiện.”
- Trong biên bản tổ: “Tổ đã dùng AI để gợi ý cấu trúc biên bản; tổ trưởng rà soát và chịu trách nhiệm nội dung cuối.”

:::do Quy ước với học sinh
Trước khi giao bài có dùng AI, nói rõ ba điều: (1) được dùng AI ở bước nào; (2) phải ghi chú phần có AI hỗ trợ; (3) phải nêu ít nhất một chỗ AI sai hoặc chưa đủ mà em đã sửa. Điều thứ ba biến AI từ “máy làm bài” thành “bài tập kiểm chứng”.
:::

## Việc làm ngay

:::checklist
- [ ] Viết một prompt 4 thẻ cho tiết sắp dạy bằng công cụ trong phòng thực hành.
- [ ] Thử một lần để AI trả lời sai và ghi lại cách bạn phát hiện.
- [ ] Thêm câu ghi chú minh bạch AI vào mẫu học liệu của tổ.
- [ ] Kiểm tra lại danh sách dữ liệu cấm trong sổ chủ nhiệm.
:::

<script type="text/plain" class="lesson-src" data-id="c5-tru-cot"># Năm trụ cột và tích hợp đúng địa chỉ

:::note Mục tiêu
Nhìn một hoạt động học và trả lời được: nó nằm ở trụ cột nào, dùng công cụ gì, nếu mất mạng thì thay bằng gì. Không cần nhớ toàn bộ lý luận.
:::

:::story Sáu phút tra từ
Cô Thảo dạy Văn, từng bị góp ý vì cho học sinh dùng điện thoại tra từ trong tiết. Cô sửa lại: vẫn dùng điện thoại, nhưng chỉ sáu phút, theo năm trụ cột — mục tiêu rõ, công cụ chọn có lý do, học sinh làm chủ, có kiểm chứng, có phương án không thiết bị. Tiết sau, tổ dự giờ thấy học sinh tranh nhau giải nghĩa từ, cô chỉ đứng ghi. Hết giờ, một em còn hỏi: “Cô ơi, từ này có phải gốc Hán không?”
**Liên tưởng:** công nghệ như gia vị; năm trụ cột là công thức liều lượng, thiếu thì nhạt, quá tay thì hỏng món.
:::

## Năm trụ cột

Tài liệu dùng năm trụ cột để một trường không “làm công nghệ rời rạc”. THCS và THPT khác nhau ở trụ cột 2 và 3:

| Trụ cột | THCS | THPT |
|---|---|---|
| 1 | Quản trị số tinh gọn, tối ưu vận hành học đường | Quản trị số tinh gọn, tối ưu vận hành tổ chuyên môn |
| 2 | Sư phạm số thích ứng, trực quan và trò chơi hóa | Sư phạm số thích ứng, phản biện đa chiều và đồng sáng tạo văn hóa |
| 3 | Kết nối cộng đồng số linh hoạt và đồng thuận | Kết nối cộng đồng số linh hoạt, tôn trọng và đồng thuận hướng nghiệp |
| 4 | Phát triển nhân lực số nòng cốt và nâng đỡ nội bộ | Phát triển nhân lực số nòng cốt và cộng đồng học tập chuyên môn |
| 5 | Hạ tầng số an toàn và bảo mật định danh học đường | Hạ tầng số an toàn, bảo mật dữ liệu và thượng tôn pháp luật số |

### Năm giải pháp đi kèm

1. **Văn phòng điện tử liên thông** – giảm giấy, giảm nhập lại dữ liệu.
2. **Chuyển từ truyền thụ sang kiến tạo trải nghiệm** – học sinh làm ra sản phẩm, không chỉ nghe.
3. **Sổ liên lạc điện tử đồng bộ** – một nguồn thông tin giữa trường và gia đình.
4. **Cộng đồng học tập chuyên môn** – tổ cùng soạn, cùng dự giờ, cùng sửa học liệu.
5. **“Vùng xanh” Internet học đường** – phân vùng truy cập, bảo vệ dữ liệu, có quy trình sự cố.

:::tip Cách nhớ
**Một trường số không phải là trường mua nhiều thiết bị.** Đó là trường trả lời được năm câu: việc hành chính đã gọn chưa, học sinh có làm ra sản phẩm chưa, gia đình có nhận đúng thông tin chưa, giáo viên có học cùng nhau chưa, dữ liệu và học sinh có được bảo vệ chưa.
:::

## Tích hợp “đúng địa chỉ”

Bốn nguyên tắc từ tài liệu:

1. **Tin học giữ vai trò chủ đạo** về kiến thức nền; các môn khác tạo bối cảnh thực tiễn để vận dụng.
2. **Đúng địa chỉ, không khiên cưỡng.** Đối chiếu yêu cầu cần đạt của bài với bảng mã TC1/TC2 hoặc NC1 và ATM; chỉ lồng ghép khi hoạt động thật sự cần.
3. **An toàn tâm lý và dữ liệu.** Không dùng tình huống gây sốc, không bắt học sinh kể sự cố cá nhân trước lớp, không dùng vụ việc thật làm ví dụ công khai, ẩn danh dữ liệu trước khi đưa vào AI.
4. **Dùng ma trận tích hợp** để ghi mã vào kế hoạch, không suy diễn.

:::warn Ví dụ về tích hợp khiên cưỡng
Tiết Lịch sử về phong trào công nhân không cần dạy học sinh cài đặt phần mềm. Nhưng hoạt động “kiểm chứng một đoạn tư liệu lịch sử lan truyền trên mạng” lại rất phù hợp: học sinh dùng SIFT, ghi mã 1.2.TC2a và ATM1. Cùng một bài, chọn địa chỉ đúng thì tự nhiên; chọn sai thì thành tiết Tin học gắn mác Lịch sử.
:::

## Mô hình 4C cho một tiết 45 phút

| Bước | Giáo viên làm gì | Học sinh làm gì | Câu hỏi kiểm tra |
|---|---|---|---|
| **Context – Ngữ cảnh** | Nêu một tình huống thật, gần gũi | Nhận ra vấn đề, đặt câu hỏi | “Vì sao việc này liên quan đến em?” |
| **Challenge – Thử thách** | Giao nhiệm vụ có độ khó vừa phải | Thử, sai, trao đổi, điều chỉnh | “Em cần làm gì để giải quyết?” |
| **Concept – Khái niệm** | Gợi mở, không giảng hết | Khám phá, đối chiếu sách giáo khoa, hình thành kiến thức | “Em rút ra được gì?” |
| **Conclusion – Kết luận** | Tổ chức tổng kết, giao vận dụng | Tóm tắt, áp dụng vào tình huống mới | “Em dùng điều này ở đâu?” |

Bốn bước này khớp với bốn hoạt động của Công văn 5512: Mở đầu, Hình thành kiến thức, Luyện tập, Vận dụng. Khi soạn, bạn chỉ cần điền nội dung vào bốn ô, không cần tạo thêm cấu trúc mới.

## Ba cách làm nhẹ, hiệu quả

- **Micro-learning 3 phút:** một video ngắn hoặc một thẻ nội dung cho một khái niệm, dùng ở đầu tiết.
- **Trò chơi hóa:** Quizizz, Wayground hoặc thẻ giấy; mục tiêu là phản hồi nhanh, không phải xếp hạng học sinh.
- **Học liệu mở:** dùng tài nguyên có giấy phép Creative Commons, ghi nguồn ở trang cuối.

:::case Lớp không có mạng vẫn học tốt
Giáo viên in 4 thẻ tình huống, mỗi nhóm nhận một thẻ, thảo luận 5 phút, dán kết quả lên bảng. Giáo viên dùng điện thoại của mình chiếu một đoạn 30 giây nếu có mạng. Hoạt động vẫn đủ Context – Challenge – Concept – Conclusion; công nghệ chỉ hỗ trợ phần trực quan.
:::

## Từ một tiết đến cả trường

Một tiết dạy tốt chưa phải chuyển đổi số. Muốn bền, cần chu trình:

1. Chọn một tiết làm mẫu.
2. Dạy thử, ghi ba điểm vướng.
3. Điều chỉnh học liệu.
4. Chia sẻ cho tổ, cùng dạy lại.
5. Đo bằng sản phẩm học sinh, không đếm số lần dùng công cụ.

Chu trình này được chi tiết hóa thành kế hoạch 4 tuần trong bài cuối của mỗi khóa.

## Việc làm ngay

:::checklist
- [ ] Chọn một tiết và viết 4 dòng cho 4C.
- [ ] Xác định trụ cột nào đang yếu nhất ở tổ của bạn.
- [ ] Chọn một hoạt động có thể thay bằng phiếu in khi mất mạng.
- [ ] Đề xuất một học liệu dùng chung cho tổ trong tháng này.
:::

? Trụ cột 2 của THPT nhấn mạnh điều gì? | Trò chơi hóa | Phản biện đa chiều và đồng sáng tạo văn hóa* | Quản trị văn phòng | THPT nhấn mạnh phản biện và đồng sáng tạo.
? Tích hợp đúng địa chỉ nghĩa là gì? | Gắn mã vào mọi hoạt động | Chỉ gắn khi hoạt động thật sự cần và đúng mã* | Dạy thêm một tiết Tin học | Đúng địa chỉ, không khiên cưỡng.
? Bốn bước 4C theo thứ tự nào? | Context – Challenge – Concept – Conclusion* | Concept – Context – Challenge – Conclusion | Challenge – Concept – Context – Conclusion | 4C đi từ ngữ cảnh đến kết luận.
? Khi lớp mất mạng, cách làm nào phù hợp? | Hủy tiết học | Dùng thẻ tình huống và phiếu in* | Yêu cầu học sinh tự mua dữ liệu | Hai phương án song hành là yêu cầu của chương trình.

<script type="text/plain" class="lesson-src" data-id="a1-prompt"># Câu lệnh 5 thành phần: giao việc rõ cho AI

:::note Mục tiêu
Viết được câu lệnh đủ năm thành phần theo Sổ tay AI của Bộ GDĐT; biết vòng lặp cải thiện câu lệnh; biết ba câu hỏi phải trả lời trước khi cho học sinh dùng AI.
:::

:::story Đơn đặt hàng “mua đồ ăn”
Thầy Dũng nhắn AI: “Soạn giáo án bài thơ Tây Tiến”. Nhận về một dàn ý mà ai cũng viết được. Thầy thử lại, thêm vai trò, người học, mục tiêu, định dạng và một ví dụ mẫu — đủ năm thành phần. Lần này AI trả về đúng thứ thầy cần: bốn hoạt động cho lớp 12 thiên xã hội, kèm câu hỏi cho học sinh yếu. Thầy vẫn sửa ba chỗ, nhưng tiết kiệm được cả buổi tối.
**Liên tưởng:** câu lệnh giống đơn đặt hàng; ghi “mua đồ ăn” thì người bán đưa gì cũng được, ghi rõ món, khẩu phần, dị ứng thì mới đúng bữa.
:::

## Phần 1 · Vì sao câu lệnh ngắn cho kết quả khó dùng

Sổ tay mở đầu bằng một câu lệnh rất ngắn: “Tìm cho tôi 3 nguyên nhân chính gây ô nhiễm không khí ở các thành phố lớn.” Kết quả chung chung vì câu lệnh thiếu vai trò, thiếu người đọc, thiếu bối cảnh sử dụng và thiếu định dạng.

Một câu lệnh chất lượng thường hội đủ năm yếu tố:

| Yếu tố | Câu hỏi định hướng | Ví dụ |
|---|---|---|
| **Nhân vật** (Persona) | Yêu cầu AI nhập vai ai? | “Đóng vai một gia sư giỏi, biết chia nhỏ vấn đề…” |
| **Mục tiêu** (Task) | Bạn muốn AI làm gì? | “…giải thích quá trình quang hợp…” |
| **Đối tượng** (Audience) | Hướng tới ai? | “…cho một học sinh 14 tuổi…” |
| **Bối cảnh** (Context) | Diễn ra trong hoàn cảnh nào? | “…để ôn thi môn Sinh học…” |
| **Giới hạn** (Constraints) | Có ràng buộc gì? | “…khoảng 300 từ, giọng thân thiện.” |

Ghép lại thành một câu hoàn chỉnh:

> “Đóng vai một gia sư giỏi, biết chia nhỏ và giải thích vấn đề phức tạp. Tôi muốn bạn giải thích quá trình quang hợp cho một học sinh 14 tuổi, nhằm hỗ trợ em ôn thi Sinh học. Câu trả lời khoảng 300 từ, giọng thân thiện, giàu tính giáo dục.”

Cùng một mục tiêu, bản tốt hơn chỉ khác ở chỗ nói rõ **ai đọc, đọc để làm gì, dài bao nhiêu, trình bày ra sao**.

:::tip Đối chiếu với prompt 4 thẻ của trang
Bốn thẻ Ngữ cảnh – Dữ liệu – Hướng dẫn – Kết quả và năm thành phần của Sổ tay không xung đột. Ngữ cảnh gộp Đối tượng và Bối cảnh; Hướng dẫn gộp Nhân vật và Mục tiêu; Kết quả chính là Giới hạn về định dạng và độ dài. Dùng cách nào cũng được, miễn không bỏ sót năm câu hỏi trên.
:::

## Phần 2 · Vòng lặp Hỏi – Đọc – Kiểm – Sửa

Không dùng ngay kết quả đầu tiên. Một sản phẩm dùng được thường qua 2–4 lượt:

1. **Hỏi**: gửi câu lệnh đủ năm thành phần.
2. **Đọc**: đọc toàn bộ, đánh dấu phần tốt và phần chưa đạt.
3. **Kiểm**: đối chiếu chương trình, sách giáo khoa, số liệu, độ tuổi, an toàn.
4. **Sửa**: yêu cầu sửa cụ thể hoặc tự sửa trực tiếp.

Câu sửa hiệu quả chỉ vào đúng chỗ, không viết lại từ đầu:

- “Giữ nguyên bố cục; đổi ví dụ thứ hai sang bối cảnh nông thôn Nghệ An.”
- “Hoạt động 3 dài 15 phút, rút còn 8 phút và bỏ bước thảo luận nhóm.”
- “Bỏ từ ngữ người lớn; mỗi câu không quá 12 chữ.”

Hai câu thêm vào cuối prompt giảm phần lớn lỗi: **“Trước khi viết, hãy hỏi tôi tối đa 3 câu để hiểu rõ lớp học.”** và **“Sau khi viết, hãy tự rà: có chỗ nào không an toàn, quá khó hoặc thiếu căn cứ không?”**

## Phần 3 · Ba câu hỏi trước khi cho học sinh dùng AI

Sổ tay dùng một khung ba câu hỏi, chắt lọc từ UNESCO, UNICEF và thang Bloom:

| Câu hỏi | Nếu câu trả lời là… | Việc phải làm |
|---|---|---|
| **Mục đích**: học sinh đang muốn học điều gì? | Mục đích mơ hồ | Chưa cho dùng AI; AI sẽ làm thay phần tư duy |
| **Độ tuổi**: mức tự chủ đến đâu? | Học sinh nhỏ | Người lớn điều khiển, hướng dẫn sát |
| **Giới hạn**: được dùng ở bước nào? | Chưa nói rõ | Nêu rõ bước được dùng, phần phải tự làm, cách ghi chú |

Một kỹ thuật cụ thể là **vòng tự ôn tập bốn bước**: (1) nhờ AI tóm tắt và ra câu hỏi nhưng **chưa đưa đáp án**; (2) học sinh tự làm rồi gửi đáp án; (3) AI chấm và giải thích; (4) AI ra đề mới khó hơn. Học sinh tư duy trước, AI phản hồi sau.

:::case Một lượt sửa thật
Giáo viên hỏi: “Viết 5 câu đố về con vật cho học sinh lớp 2.” AI trả về câu đố dài, nhiều từ Hán Việt. Lượt sửa: “Giữ 5 câu; mỗi câu tối đa 20 chữ; dùng từ thuần Việt; thêm 3 phương án trả lời, trong đó có một phương án nhiễu dựa trên lỗi học sinh hay nhầm.” Kết quả dùng được ngay, không phải viết lại.
:::

## Phần 4 · Tối thiểu hóa dữ liệu

Nguyên tắc nền tảng của Sổ tay: chỉ đưa vào AI những gì **không nhạy cảm, không định danh và không vượt quá mục đích sư phạm**.

- Thay tên bằng mã: HS01, Trẻ A, GV02.
- Bỏ ngày sinh chính xác, địa chỉ, số điện thoại, tên trường và lớp cụ thể.
- Không nhập điểm số, nhận xét hạnh kiểm, thông tin sức khỏe, hoàn cảnh gia đình.
- Không tải ảnh khuôn mặt, ghi âm giọng nói của học sinh lên công cụ công cộng.

:::warn Ảo giác và thiên kiến
AI tạo sinh “đoán” từ tiếp theo nên có thể bịa tên văn bản, số liệu, tác giả. Vùng dễ sai nhất là văn bản mới ban hành và thông tin địa phương. Nó cũng lặp lại định kiến trong dữ liệu huấn luyện. Vì vậy mọi chi tiết cụ thể đều phải kiểm chứng bằng nguồn chính thống, không hỏi lại chính chatbot đó.
:::

## Việc làm ngay

:::checklist
- [ ] Lấy một câu lệnh ngắn đã dùng tuần trước, viết lại đủ năm thành phần.
- [ ] Gửi cả hai bản cho cùng một công cụ, so sánh mức dùng được ngay.
- [ ] Thêm hai câu “hỏi lại” và “tự kiểm tra” vào mẫu prompt của tổ.
- [ ] Rà lại một prompt cũ xem có thông tin định danh học sinh không.
:::

## Tự kiểm tra

:::quiz
? Yếu tố nào trả lời câu hỏi “hướng tới ai”? | Nhân vật | Đối tượng* | Giới hạn | Đối tượng là người đọc hoặc người học mà câu trả lời phục vụ.
? Câu lệnh “Tìm 3 nguyên nhân ô nhiễm không khí” cho kết quả chung chung chủ yếu vì thiếu gì? | Vai trò, đối tượng, bối cảnh và định dạng* | Một con số cụ thể | Tên công cụ AI | Sổ tay dùng đúng ví dụ này để chỉ ra bốn yếu tố bị thiếu.
? Khi kết quả chưa đạt, việc nào đúng nhất? | Viết lại từ đầu bằng công cụ khác | Chỉ rõ 2–3 điểm cần sửa và gửi lại* | Chấp nhận bản đầu cho kịp giờ | Vòng lặp Hỏi – Đọc – Kiểm – Sửa hiệu quả hơn đổi công cụ liên tục.
? Nguyên tắc dữ liệu nào đúng? | Chỉ đưa thông tin tối thiểu, không định danh* | Đưa đủ họ tên để AI hiểu lớp | Đưa điểm số để cá nhân hóa | Tối thiểu hóa dữ liệu là nguyên tắc nền tảng của Sổ tay.
:::

<script type="text/plain" class="lesson-src" data-id="a2-khbd"># Kế hoạch bài dạy và bài giảng với AI: quy trình 4 bước

:::note Mục tiêu
Đi được trọn quy trình bốn bước từ mục tiêu đến bản kiểm duyệt; biết khi nào dùng Gamma, Canva, NotebookLM; neo công nghệ vào phương pháp sư phạm và mô hình TPACK; tránh bốn lỗi thường gặp.
:::

:::story Khung nhà và phần hồn
Cô Hòa dạy Lịch sử ở một trường ven biển. Cô nhờ AI dựng khung bài “Chiến dịch Điện Biên Phủ” trong mười lăm phút, nhưng yêu cầu ghi rõ chỗ nào cần thay bằng tư liệu địa phương. Tiết dạy có thêm câu chuyện người lính quê mình, học sinh nghe không ai ngủ. Cô bảo: AI làm phần khung, mình làm phần hồn. Bộ slide cuối cùng chỉ có sáu trang, nhưng trang nào cũng có chỗ để cô kể.
**Liên tưởng:** kế hoạch bài dạy như ngôi nhà; AI đổ móng, giáo viên chọn đồ đạc và thắp đèn.
:::

## Phần 1 · Bốn bước tạo kế hoạch bài dạy

| Bước | Việc làm | Sản phẩm trung gian |
|---|---|---|
| **1. Xác định mục tiêu và đầu vào** | Tên bài, khối lớp, thời lượng, mục tiêu kiến thức – kỹ năng – thái độ; chuẩn bị sách giáo khoa, khung kế hoạch đang áp dụng | Một đoạn mô tả bài học đủ để AI không phải đoán |
| **2. Viết câu lệnh có cấu trúc** | Vai trò, nhiệm vụ, đối tượng, bối cảnh, định dạng, giới hạn; đính kèm yêu cầu cần đạt | Câu lệnh đầy đủ, có phần trong ngoặc vuông để thay |
| **3. Tương tác và tinh chỉnh** | Yêu cầu sửa từng điểm; thêm phương án thiếu thiết bị; rút thời lượng; đổi ví dụ địa phương | Bản nháp 2–3, có ghi chú chỗ đã sửa |
| **4. Kiểm duyệt chuyên môn** | Đối chiếu sách giáo khoa, chuẩn kiến thức, tính khả thi; chịu trách nhiệm bản cuối | Kế hoạch đã duyệt, sẵn sàng dạy |

Sổ tay nhắc rõ ba văn bản có thể đính kèm để AI bám đúng cấu trúc: Công văn 2345/BGDĐT-GDTH (kế hoạch giáo dục cấp tiểu học), Công văn 5512/BGDĐT-GDTrH (khung kế hoạch bài dạy), Công văn 3456/BGDĐT-GDPT (khung năng lực số). Với giáo dục mầm non, đính kèm Chương trình GDMN hiện hành.

:::warn AI hay bịa căn cứ
AI có thể viết “theo Công văn 5512” nhưng trích sai ngày ban hành, hoặc bịa số hiệu. Luôn mở văn bản gốc đối chiếu. Không lấy câu trả lời của AI làm nguồn trích dẫn.
:::

## Phần 2 · Từ dàn ý đến bộ slide

Ba công cụ, ba thế mạnh khác nhau:

| Công cụ | Cách dùng | Điểm mạnh | Phải kiểm |
|---|---|---|---|
| **Gamma** | Tạo bộ trình chiếu từ dàn ý hoặc đoạn văn; chọn giao diện, tách slide | Nhanh, bố cục đẹp | Nội dung, thứ tự slide, hình ảnh |
| **Canva AI** | Thiết kế slide, poster, infographic từ mẫu | Mẫu phong phú, dễ in | Bản quyền mẫu, hình; chữ tiếng Việt |
| **NotebookLM** | Chỉ dựng dàn ý từ tài liệu đã tải lên, kèm trích dẫn nguồn | Bám nguồn, kiểm chứng được | Chất lượng nguồn tải lên; trích dẫn có đúng trang |

Quy trình Gamma năm bước: chuẩn bị nội dung (dàn ý) → thiết lập mục đích → chọn cách tạo từ ghi chú → kiểm tra cách tách slide và chọn giao diện → tinh chỉnh và xuất bản. Đừng tạo thẳng bộ slide từ một câu lệnh ngắn; hãy **làm dàn ý trước**, duyệt dàn ý, rồi mới dựng slide.

Với nội dung cần trích dẫn, NotebookLM là lựa chọn phù hợp hơn: tải các nguồn chính thống vào notebook, yêu cầu dựng dàn ý 20 slide cho 45 phút và **kèm trích dẫn từng ý**. Sau đó vẫn phải đọc lại, mở nguồn đối chiếu và sửa.

## Phần 3 · Neo vào phương pháp và TPACK

Công nghệ không phải mục tiêu. Mô hình TPACK nhắc ba vòng giao nhau: **nội dung** (Content), **sư phạm** (Pedagogy), **công nghệ** (Technology). Công nghệ chỉ có nghĩa khi phục vụ cách dạy đã chọn cho nội dung cụ thể.

Trình tự đúng:

1. Chọn yêu cầu cần đạt và phương pháp (làm mẫu, trạm, dạy học dự án, đóng vai…).
2. Xác định hoạt động nào cần giáo viên trực tiếp, hoạt động nào cần bạn bè, hoạt động nào công cụ số giúp tốt hơn.
3. Chọn công cụ đơn giản nhất làm được việc.
4. Thiết kế “hai lối”: một lối có thiết bị, một lối không thiết bị vẫn đạt mục tiêu.

Sổ tay cũng hướng dẫn thiết kế bao trùm: cùng một mục tiêu, tạo bản đọc ngắn hơn, câu hỏi diễn đạt lại, phiếu có hình; không hạ chuẩn mà mở nhiều đường đến chuẩn.

:::case Bài 45 phút, công nghệ cơ khí lớp 11
Câu lệnh mẫu của Sổ tay nêu rõ: 45 phút, lớp 11, phương pháp “làm mẫu và hướng dẫn thực hành”, phân bổ 10 phút lý thuyết – 10 phút giáo viên làm mẫu – 20 phút học sinh thực hành nhóm – 5 phút tổng kết, kèm lưu ý an toàn và định dạng bảng tiến trình. Vì đầu vào rõ, bản nháp đầu tiên đã dùng được, giáo viên chỉ sửa ví dụ và thiết bị thật của trường.
:::

## Phần 4 · Bốn lỗi thường gặp

| Lỗi | Biểu hiện | Cách khắc phục |
|---|---|---|
| **Câu lệnh chung chung** | “Soạn giúp tôi bài về môi trường” | Bổ sung môn, lớp, thời lượng, phương pháp, định dạng |
| **Chấp nhận bản nháp đầu** | Sao chép nguyên, không sửa | Xem bản nháp là điểm khởi đầu để đối thoại |
| **Bỏ qua kiểm chứng** | Tin số liệu, công thức, sự kiện | Thẩm định mọi nội dung trước khi lên lớp |
| **Mất dấu ấn cá nhân** | Bài giảng đúng khuôn nhưng xa lớp học | Thêm ví dụ địa phương, câu chuyện, cách nói của chính mình |

## Việc làm ngay

:::checklist
- [ ] Chọn một bài sắp dạy, viết đủ đầu vào theo bước 1.
- [ ] Soạn câu lệnh theo cấu trúc, yêu cầu bảng tiến trình và phương án không thiết bị.
- [ ] Duyệt dàn ý trước khi tạo slide; ghi lại ba chỗ AI viết sai hoặc thiếu.
- [ ] Thêm một ví dụ địa phương và một câu hỏi mở mang dấu ấn của bạn.
:::

? NotebookLM khác Gamma ở điểm nào? | Chỉ dựng nội dung từ nguồn đã tải, kèm trích dẫn* | Không cần kiểm chứng | Chỉ dùng được tiếng Anh | NotebookLM bám nguồn trong notebook và hiện trích dẫn.
? Mô hình TPACK nhấn điều gì? | Công nghệ càng mới càng tốt | Công nghệ phục vụ nội dung và phương pháp* | Thay thế giáo viên | Ba vòng nội dung – sư phạm – công nghệ phải giao nhau.
? Đâu là một trong bốn lỗi của Sổ tay? | Đặt câu lệnh quá dài | Bỏ qua khâu kiểm chứng* | Dùng bảng biểu | Tin tuyệt đối vào AI là rủi ro lớn nhất.

<script type="text/plain" class="lesson-src" data-id="a3-danh-gia"># Kiểm tra, đánh giá với AI: đề, rubric, phản hồi

:::note Mục tiêu
Tạo được đề đúng ma trận nhận thức; viết rubric và phản hồi có ích; hiểu giới hạn của AI khi đánh giá; minh bạch mức độ học sinh dùng AI.
:::

:::story Ba câu hỏi lỗi trong đề mười phút
Thầy Bình nhờ AI ra đề hai mươi câu trắc nghiệm. Một câu hỏi về Hiệp định Paris ghi đúng năm, nhưng phương án nhiễu lại chứa kiến thức sai. Thầy tự làm hết đề, phát hiện ba câu lỗi: một câu sai đáp án, hai câu hỏi mẹo vô nghĩa. Thầy giữ lại hai câu hay, bỏ một, sửa phần còn lại và ghi vào đề dòng “đề có tham khảo AI, giáo viên đã kiểm”. Học sinh không cần biết chuyện đó, nhưng hồ sơ tổ chuyên môn thì cần.
**Liên tưởng:** AI ra đề như người phụ đạo nhanh nhẹn; người ký đề vẫn phải là người đã giải hết đề.
:::

## Phần 1 · Chất lượng đề phụ thuộc dữ liệu đầu vào

Nguyên tắc vàng của chương: **đầu vào tốt cho đầu ra tốt**. Trước khi gõ câu lệnh, phải xác định:

- Môn, lớp, bài học, thời lượng làm bài.
- Số câu, dạng câu (trắc nghiệm, tự luận ngắn, tự luận dài).
- Mức độ nhận thức mong muốn cho từng phần.
- Tài liệu tham chiếu: sách giáo khoa, yêu cầu cần đạt, ma trận của trường.

Nhà trường Việt Nam thường dùng bốn mức: **Nhận biết – Thông hiểu – Vận dụng – Vận dụng cao**. Khi cần phân hóa sâu, có thể dùng thêm các mức bậc cao của thang Bloom (phân tích, đánh giá, sáng tạo) để mô tả yêu cầu, nhưng vẫn quy về bốn mức khi lập ma trận đề.

Ví dụ một yêu cầu đủ rõ: “10 câu trắc nghiệm, gồm 5 Nhận biết, 3 Thông hiểu, 2 Vận dụng; mỗi câu 4 phương án, một đáp án đúng; phương án nhiễu dựa trên lỗi học sinh hay mắc; kèm đáp án và giải thích một dòng.”

:::tip Ma trận trước, câu hỏi sau
Đừng để AI tự quyết độ khó. Nêu số câu cho từng mức, sau đó kiểm tra lại tỉ lệ. Một đề “10 câu” nhưng 9 câu nhận biết là đề dễ hơn bạn tưởng.
:::

## Phần 2 · Trắc nghiệm, tự luận, rubric

| Sản phẩm | Cách làm | Kiểm chứng bắt buộc |
|---|---|---|
| **Đề trắc nghiệm** | Mô tả môn – bài – số câu – mức độ; đính tài liệu; yêu cầu phương án nhiễu có chủ đích | Tự giải lại toàn bộ; kiểm tra chỉ có một đáp án đúng; bỏ câu mơ hồ |
| **Đề tự luận** | Nêu rõ yêu cầu cần đạt, độ dài, tiêu chí lập luận; có 2–3 đề để chọn | Đối chiếu hướng dẫn chấm; tự viết bài mẫu; kiểm tra thời gian làm bài |
| **Rubric** | 3–5 tiêu chí, mỗi tiêu chí 3 mức; mô tả bằng hành vi quan sát được | Thử chấm 2 bài thật; hai người chấm thử xem có lệch lớn |
| **Phản hồi** | Nêu một điều làm tốt, một điều cần sửa, một bước tiếp theo | Đọc lại để chắc phản hồi đúng người, đúng bài, không dán nhãn |

Rubric tốt mô tả **bằng chứng**, không mô tả cảm nhận. Thay vì “trình bày tốt”, viết “nêu được 3 ý, mỗi ý có dẫn chứng từ văn bản”.

## Phần 3 · AI làm gì và không làm gì

AI hỗ trợ tốt: sinh câu hỏi, tạo ngân hàng câu hỏi, gợi ý rubric, soạn đáp án, rút gọn nhận xét, đổi cách diễn đạt phản hồi.

AI không nên làm: chấm điểm cuối cùng, xếp loại học sinh, kết luận về năng lực hay tâm lý, thay giáo viên trong các nhận định định tính. Sổ tay ghi rõ AI còn hạn chế ở câu hỏi vận dụng cao và đánh giá định tính.

:::warn Không đưa dữ liệu định danh vào công cụ tạo đề
Không dán bảng điểm có họ tên, không đưa bài làm nguyên bản có thông tin nhận diện. Nếu cần phân tích, thay bằng mã và chỉ giữ dữ liệu cần cho việc điều chỉnh dạy học.
:::

## Phần 4 · Minh bạch mức độ dùng AI

Thang AIAS năm cấp (Perkins và cộng sự, 2024) tạo ngôn ngữ chung giữa nhà trường, giáo viên và học sinh:

| Cấp | Tên gọi | Vai trò của AI |
|---|---|---|
| 1 | Không dùng AI | Bài làm tự thân, thường là thi có giám sát |
| 2 | Lập kế hoạch với AI | AI gợi ý ý tưởng, dàn ý; sản phẩm cuối do học sinh làm |
| 3 | Hợp tác với AI | AI tạo nháp; học sinh đánh giá, sửa, chịu trách nhiệm |
| 4 | Dùng AI toàn diện | AI tham gia mọi khâu; đánh giá tập trung vào kỹ năng ra câu lệnh và điều phối |
| 5 | Khám phá cùng AI | Học sinh sáng tạo cùng AI để giải quyết vấn đề mới |

Cách dùng thực tế: **dán nhãn cấp AIAS cho từng nhiệm vụ**, thường bắt đầu ở Cấp 2 để rèn tư duy phản biện. Giữ mọi bài kiểm tra ở Cấp 1 không hiệu quả và không công bằng với quyền tiếp cận công nghệ của học sinh.

Thay vì dựa vào điểm số của phần mềm phát hiện AI, thu **ba lớp bằng chứng**: sản phẩm cuối, nhật ký quá trình (bản nháp, lịch sử trò chuyện) và một minh chứng nói hoặc viết ngắn. Với học sinh học bằng ngôn ngữ thứ hai, đừng coi văn bản quá trơn tru là gian lận; cần tách hỗ trợ ngôn ngữ khỏi thay thế tư duy.

:::case Một đề 10 câu, ba mức
Giáo viên Lịch sử và Địa lí 8 đặt yêu cầu: 10 câu về Cách mạng công nghiệp, 5 nhận biết – 3 thông hiểu – 2 vận dụng; phương án nhiễu lấy từ lỗi thật của lớp. Sau khi AI sinh đề, giáo viên tự giải, phát hiện 2 câu có hai đáp án đúng và 1 câu vượt phạm vi bài, sửa lại rồi mới đưa vào ngân hàng. Bước kiểm chứng mất 8 phút nhưng giữ được chất lượng đề.
:::

## Việc làm ngay

:::checklist
- [ ] Lấy một đề cũ, lập ma trận 4 mức và đếm tỉ lệ câu.
- [ ] Dùng AI sinh lại 5 câu theo đúng ma trận, tự giải và sửa.
- [ ] Viết rubric 3 tiêu chí × 3 mức cho một bài viết ngắn.
- [ ] Chọn một nhiệm vụ và gán cấp AIAS, nói rõ với học sinh trước khi giao.
:::

<script type="text/plain" class="lesson-src" data-id="a4-hoc-lieu"># Học liệu số với AI: ảnh, nhạc, truyện, video, mô phỏng

:::note Mục tiêu
Tạo được bộ học liệu số phục vụ một bài dạy; biết ba cách tạo ảnh, năm điểm kiểm ảnh, cách ghi nguồn; tránh lỗi bản quyền, an toàn và thời gian màn hình.
:::

:::story Con rùa sáu chân
Cô Hương cần tranh minh họa cho truyện “Sự tích Hồ Gươm”. AI tạo một bức rất đẹp, nhưng rùa có sáu chân và thanh gươm nằm sai tay. Cô suýt dùng vì “nhìn cũng được”. Rồi cô nhớ năm điểm kiểm: chi tiết, văn hóa, bản quyền, ngôn ngữ, an toàn. Cô tạo lại bức khác, ghi nguồn “ảnh do AI tạo, giáo viên biên tập”. Học sinh chỉ thấy bức tranh đẹp, không thấy mười phút cô ngồi soi từng ngón chân rùa.
**Liên tưởng:** học liệu AI như rau chợ sớm — tươi nhưng phải nhặt, rửa, và biết ai bán.
:::

## Phần 1 · Năm loại học liệu và chỗ dùng

| Loại | Dùng khi | Công cụ gợi ý | Rủi ro chính |
|---|---|---|---|
| **Ảnh** | Minh hoạ khái niệm, tạo bối cảnh, so sánh | Tạo ảnh bằng AI, kho ảnh mở | Sai chi tiết khoa học, thiên lệch hình mẫu |
| **Nhạc và âm thanh** | Chuyển cảnh, tạo không khí, luyện nghe | Tạo nhạc, đọc văn bản | Bản quyền, giọng đọc không tự nhiên |
| **Truyện và kịch bản** | Mầm non, tiểu học; kể chuyện có bài học | Mô hình ngôn ngữ | Nội dung chưa phù hợp lứa tuổi |
| **Video ngắn** | Giới thiệu quy trình, phản hồi bài | Tạo video từ kịch bản | Sai lệch hình ảnh, thời lượng quá dài |
| **Mô phỏng, trò chơi** | Thí nghiệm ảo, luyện tập tương tác | Nền tảng mô phỏng, AI tạo câu đố | Logic sai, khó kiểm chứng |

Nguyên tắc chung: **học liệu để phục vụ mục tiêu học, không phải để trình diễn công nghệ**. Một tấm ảnh đúng chỗ có giá trị hơn mười hiệu ứng.

## Phần 2 · Ba cách tạo ảnh

1. **Mô tả trực tiếp**: viết câu lệnh có chủ thể, bối cảnh, phong cách, tỉ lệ khung, điều cần tránh.
2. **Từ ảnh tham chiếu**: đưa ảnh mẫu, yêu cầu giữ bố cục hoặc phong cách, đổi nội dung.
3. **Từ bản phác**: chụp hình vẽ tay, yêu cầu chuyển thành ảnh hoàn chỉnh giữ đúng bố cục.

Một câu lệnh ảnh cho lớp học nên có: đối tượng, hành động, bối cảnh Việt Nam nếu cần, phong cách (hoạt hình phẳng, màu nước…), tỉ lệ (16:9 cho trình chiếu, 1:1 cho thẻ), và danh sách điều không muốn (chữ viết, chi tiết rối, yếu tố không phù hợp).

:::tip Sáu thành phần của câu lệnh ảnh
Chủ thể – bối cảnh – phong cách – ánh sáng/màu – tỉ lệ khung – điều cần tránh. Thiếu tỉ lệ khung là lỗi hay gặp nhất khi đưa ảnh vào slide.
:::

## Phần 3 · Năm điểm kiểm ảnh trước khi dùng

1. **Đúng khoa học**: số bộ phận, chiều mũi tên, đơn vị, bản đồ có đúng không.
2. **Đúng văn hoá, lứa tuổi**: trang phục, bối cảnh, hành vi có phù hợp không.
3. **Không thiên lệch**: hình mẫu có đa dạng giới, vùng miền, nghề nghiệp không.
4. **Không có chữ méo**: chữ trong ảnh AI thường sai; nếu cần chữ, chèn chữ bằng công cụ trình chiếu.
5. **Không nhận diện được người thật**: không dùng ảnh AI giống người thật khi chưa có sự đồng ý.

:::warn Ảnh đẹp chưa chắc đúng
Ảnh AI có thể vẽ đúng phong cách nhưng sai kiến thức: mạch điện hở, bản đồ lệch, cơ quan sai vị trí. Luôn kiểm bằng mắt chuyên môn trước khi chiếu cho học sinh.
:::

## Phần 4 · Ghi nguồn và bản quyền

Mỗi học liệu số cần **bốn phần ghi nguồn**: tên công cụ hoặc tác giả, ngày tạo, câu lệnh chính (có thể rút gọn), và giấy phép sử dụng. Ghi ngay dưới ảnh hoặc ở trang cuối bộ slide.

Phân biệt ba nhóm:

- **Tài nguyên mở** (CC BY, CC BY-SA, CC0): dùng được, phải giữ ghi công theo giấy phép.
- **Tài nguyên có điều kiện**: dùng trong lớp, không đăng công khai.
- **Tài nguyên đóng**: không sao chép, không đưa lên nền tảng công khai.

Khi dùng AI tạo nội dung, kiểm tra điều khoản của công cụ về quyền sử dụng thương mại và yêu cầu ghi nhãn “tạo bởi AI”. Với học liệu đưa lên website trường, ghi rõ sản phẩm có sự hỗ trợ của AI.

## Phần 5 · Ngôn ngữ, an toàn, thời gian màn hình

- **Ngôn ngữ**: đọc to học liệu trước khi dùng; sửa câu dịch máy, từ địa phương không phù hợp, thuật ngữ sai.
- **An toàn**: không tạo ảnh hoặc video về học sinh thật khi chưa đồng ý; không mô tả bạo lực, sợ hãi quá mức với trẻ nhỏ.
- **Thời gian màn hình**: với mầm non và tiểu học, học liệu số là **một phần** của tiết học, không thay hoạt động vận động, kể chuyện trực tiếp.

:::case Một tiết Khoa học tự nhiên 7
Giáo viên cần minh hoạ vòng tuần hoàn nước. Dùng AI tạo ba ảnh: sơ đồ vòng tuần hoàn, cảnh mưa rơi trên ruộng, cảnh nước ngưng tụ trên lá. Kiểm tra: sơ đồ đúng chiều mũi tên, cảnh ruộng phù hợp đồng bằng Việt Nam, ảnh không có chữ méo. Chèn nhãn bằng PowerPoint, ghi nguồn ở chân trang, tổng thời gian chuẩn bị 25 phút.
:::

## Việc làm ngay

:::checklist
- [ ] Chọn một bài dạy cần minh hoạ và xác định loại học liệu phù hợp nhất.
- [ ] Viết một câu lệnh ảnh đủ sáu thành phần, tạo thử.
- [ ] Chạy năm điểm kiểm trên ảnh vừa tạo.
- [ ] Ghi nguồn bốn phần vào chân trang học liệu.
:::

<script type="text/plain" class="lesson-src" data-id="a5-lop-so"># Lớp học số và phát triển chuyên môn

:::note Mục tiêu
Hiểu khác biệt giữa nền tảng tích hợp và công cụ rời; triển khai được một quy trình dạy học số có kiểm duyệt; đọc được khung năng lực AI của UNESCO và lập kế hoạch tự học.
:::

:::story Thư mục chung của tổ Văn
Tổ Văn của cô Yến có bảy người, người trẻ nhất hai mươi tám, người nhiều tuổi nhất năm mươi tư. Cô lập một thư mục chung, chia ba tầng: kho đọc, kho prompt, kho bài đã dạy. Thầy lớn tuổi nhất góp một prompt soạn câu hỏi đọc hiểu, được cả tổ dùng. Cuối học kỳ, thư mục có sáu mươi tệp, không ai phải soạn lại từ đầu. Thầy ấy nói vui: hóa ra mình cũng là người đóng góp nhiều thứ hai.
**Liên tưởng:** lớp học số không phải căn phòng đầy máy; nó là cái chợ chung, mỗi người góp một món thì cả xóm đủ bữa.
:::

## Phần 1 · Nền tảng tích hợp và công cụ rời

Có hai cách đưa AI vào lớp học:

- **Công cụ rời**: mỗi việc một công cụ (một trang tạo ảnh, một trang tạo đề, một trang ghi chú). Ưu điểm là thử nhanh, không phụ thuộc; nhược điểm là dữ liệu tản mát, khó theo dõi tiến bộ.
- **Nền tảng tích hợp**: một nơi giữ lớp học, học liệu, bài giao, phản hồi. Ưu điểm là dữ liệu liền mạch; nhược điểm là phụ thuộc nhà cung cấp và phải xem kỹ chính sách dữ liệu.

Tiêu chí chọn nền tảng: có phiên bản tiếng Việt chấp nhận được, phân quyền giáo viên – học sinh rõ, xuất được dữ liệu, có cam kết không dùng dữ liệu trẻ để huấn luyện, và có đường hỗ trợ khi lỗi.

## Phần 2 · Chatbot lớp học và kênh hỏi đáp

Chatbot dựng riêng cho một môn hoặc một chương có ích khi học sinh cần hỏi ngoài giờ. Cách dựng:

1. Gom tài liệu chuẩn: sách giáo khoa phần liên quan, phiếu học tập, ghi chú của giáo viên.
2. Đặt giới hạn trả lời: chỉ trong phạm vi tài liệu; nếu không có căn cứ thì nói không biết.
3. Thử bằng câu hỏi đúng, câu hỏi ngoài phạm vi, câu hỏi đánh đố.
4. Ghi rõ trên giao diện: đây là trợ lý hỗ trợ, không thay giáo viên.

:::warn Ba điều cấm với chatbot lớp học
Không đưa dữ liệu cá nhân của học sinh vào; không để chatbot tự chấm điểm; không công khai đường dẫn cho người ngoài lớp khi chưa kiểm duyệt nội dung.
:::

## Phần 3 · Quy trình lớp học số có kiểm duyệt

Một vòng dạy học số gọn gồm: **giáo viên rà trước – học sinh giao bài – giáo viên phản hồi – cả hai ghi lại**.

- **Rà trước**: mọi thứ học sinh sẽ thấy (bài giảng, bài tập, học liệu) đều qua mắt giáo viên.
- **Giao bài**: nêu rõ sản phẩm, thời hạn, tiêu chí và cấp AIAS được phép.
- **Phản hồi**: dùng bảng điều khiển để nhìn tiến độ, nhưng không dán nhãn học sinh bằng điểm số tự động.
- **Ghi lại**: lưu phiên bản, lưu câu lệnh, lưu minh chứng để phục vụ đánh giá và chia sẻ.

Ghi chú của trợ lý AI không thay sổ đầu bài hay nhận xét chính thức. Mọi kết luận về học sinh do giáo viên chịu trách nhiệm.

## Phần 4 · Tìm kiếm sâu và kiểm chứng

Công cụ “nghiên cứu sâu” giúp gom nguồn và tóm tắt, nhưng sản phẩm vẫn là **bản nháp**. Quy trình an toàn:

1. Nêu câu hỏi hẹp, có phạm vi thời gian và lĩnh vực.
2. Yêu cầu liệt kê nguồn kèm đường dẫn.
3. Mở từng nguồn, kiểm tra có thật và có nội dung như tóm tắt không.
4. Chỉ giữ những khẳng định có nguồn kiểm chứng được; ghi rõ phần chưa chắc.

## Phần 5 · Khung năng lực AI của UNESCO

Khung UNESCO cho giáo viên có **15 năng lực, 5 chiều, 3 mức**: tiếp thu (Acquire), đào sâu (Deepen), sáng tạo (Create).

| Chiều | Nội dung cốt lõi |
|---|---|
| Tư duy về AI | Hiểu AI là gì, giới hạn, tác động xã hội |
| Đạo đức AI | Công bằng, riêng tư, trách nhiệm, minh bạch |
| Nền tảng và ứng dụng AI | Chọn và dùng công cụ đúng việc |
| Sư phạm tích hợp AI | Thiết kế hoạt động, đánh giá có AI |
| Phát triển chuyên môn | Tự học, chia sẻ, dẫn dắt đồng nghiệp |

Cách dùng thực tế: tự chấm mình ở từng chiều, chọn **một chiều yếu nhất** để làm kế hoạch 8 tuần, và tìm một đồng nghiệp cùng học.

:::case Kế hoạch 8 tuần của một tổ chuyên môn
Tổ Ngữ văn chọn chiều “Sư phạm tích hợp AI”. Tuần 1–2: mỗi người thử một công cụ với một bài. Tuần 3–4: chia sẻ hai kịch bản dùng được. Tuần 5–6: cùng viết rubric có cột “mức dùng AI”. Tuần 7: dạy thử, quay video ngắn. Tuần 8: tổng kết, cập nhật vào kế hoạch tổ. Cuối kỳ, cả tổ có một bộ học liệu chung thay vì mỗi người một mảnh.
:::

:::tip Chỉ số tiến bộ
Đừng đo bằng số công cụ đã thử. Đo bằng số hoạt động dạy học được cải thiện và số đồng nghiệp dùng lại được sản phẩm của bạn.
:::

## Việc làm ngay

:::checklist
- [ ] Liệt kê các công cụ AI đang dùng và một việc chúng đang làm tốt.
- [ ] Tự chấm 5 chiều UNESCO, chọn một chiều để cải thiện.
- [ ] Viết kế hoạch 8 tuần có sản phẩm cuối rõ ràng.
- [ ] Rà lại chính sách dữ liệu của một nền tảng trước khi dùng với học sinh.
:::

<script type="text/plain" class="lesson-src" data-id="t1-hai-khung"># Hai khung năng lực số: giáo viên và học sinh gặp nhau

:::note Mục tiêu
Đọc được hai khung trong tài liệu tập huấn 2026; phân biệt năng lực của giáo viên và của học sinh; viết được 2–4 yêu cầu cần đạt năng lực số gắn với một bài dạy thật.
:::

:::story Hai cái thước khác đơn vị
Cô Nga dự giờ đồng nghiệp, thấy trong kế hoạch ghi “Bậc 2” cho cả lớp 4 và lớp 5. Cô về mở lại hai khung: khung giáo viên có ba mức Cơ bản – Thành thạo – Nâng cao; khung học sinh tiểu học có Bậc 1 cho lớp 1–2, Bậc 2 cho lớp 3–5. Cô in một tờ A4 dán trong tổ, hai cột rõ ràng, mỗi cột một màu. Lần sau họp tổ, không ai còn hỏi “mã này của ai?”.
**Liên tưởng:** hai khung như hai cái thước khác đơn vị; đo chiều cao bằng cân thì không bao giờ đúng.
:::

## Phần 1 · Hai căn cứ, hai đối tượng

Bộ tài liệu Tiểu học năm 2026 đặt cạnh nhau hai văn bản:

- **Thông tư 18/2026** — khung năng lực số của **giáo viên**, gồm 6 miền và 20 năng lực thành phần, chia 3 mức: Cơ bản, Thành thạo, Nâng cao.
- **Thông tư 02/2025** — khung năng lực số của **học sinh**, gồm 6 miền và 24 năng lực thành phần; tiểu học áp dụng hai bậc: Bậc 1 cho lớp 1–2, Bậc 2 cho lớp 3–5.

| Miền | Giáo viên (TT18) | Học sinh (TT02) |
|---|---|---|
| 1 | Tổ chức dạy học, giáo dục trong môi trường số | Khai thác dữ liệu và thông tin |
| 2 | Kiểm tra, đánh giá | Giao tiếp và hợp tác trong môi trường số |
| 3 | Trao quyền cho người học | Sáng tạo nội dung số |
| 4 | Kĩ năng công nghệ số | An toàn |
| 5 | Phát triển chuyên môn | Giải quyết vấn đề |
| 6 | Trí tuệ nhân tạo | Ứng dụng trí tuệ nhân tạo |

Hai khung không thay thế nhau. Giáo viên dùng năng lực của mình (TT18) để **tạo cơ hội** cho học sinh phát triển năng lực số (TT02). Học sinh chỉ xem trình chiếu thì chưa phải phát triển năng lực số.

## Phần 2 · Ba mức của giáo viên

| Mức | Dấu hiệu | Ví dụ với bài “số chẵn, số lẻ” |
|---|---|---|
| Cơ bản | Dùng được công cụ số có sẵn | Trình chiếu bài tập trong sách điện tử |
| Thành thạo | Thiết kế hoạt động có chủ đích, dùng dữ liệu điều chỉnh | Câu đố 3 mức, xem báo cáo để chia nhóm củng cố |
| Nâng cao | Sáng tạo mô hình mới, hướng dẫn đồng nghiệp | Bộ câu đố dùng chung cho khối, hướng dẫn tổ đọc dữ liệu |

Mục tiêu của khóa không phải đưa mọi người lên Nâng cao ngay, mà **dịch chuyển một bậc** ở 2–3 năng lực ưu tiên trong năm học.

## Phần 3 · Hai bậc của học sinh

- **Bậc 1 (lớp 1–2)**: nhiệm vụ đơn giản, có hướng dẫn trực tiếp; ưu tiên thao tác chọn, chạm, nghe lại, nói được. Động từ: nhận biết, chọn, nói được. Miền 6 chỉ yêu cầu nhận diện công cụ AI đơn giản.
- **Bậc 2 (lớp 3–5)**: tự chủ cao hơn, được hướng dẫn khi cần; thêm tìm kiếm có hướng dẫn, tạo sản phẩm số đơn giản, làm việc nhóm trên công cụ cộng tác. Động từ: tìm được, sắp xếp được, giải thích được, áp dụng được.

## Phần 4 · Viết yêu cầu cần đạt đủ bốn thành phần

Một yêu cầu cần đạt năng lực số tốt có: **động từ đúng bậc – nội dung số – điều kiện – mã năng lực kèm bậc**.

Ví dụ đạt chuẩn: “Tìm được ảnh loài vật trên trang tìm kiếm dành cho trẻ em (TT02 – 1.1, B2).”
Ví dụ chưa đạt: “Học sinh phát triển năng lực số” (chung chung), “Học sinh sử dụng thành thạo AI” (vượt mức tiểu học), “Học sinh xem video bài học” (không có thao tác số).

## Phần 5 · Ba câu hỏi trước khi thiết kế bài

1. **Học sinh cần đạt gì?** Bám yêu cầu cần đạt môn học; mục tiêu chính không đổi vì công nghệ.
2. **Hoạt động nào tích hợp?** Chọn 1–2 hoạt động học sinh dùng công nghệ số tự nhiên, đúng bậc của lớp.
3. **Giáo viên cần gì?** Chọn công cụ, học liệu số hay AI đơn giản nhất làm được việc.

Với một bài 35 phút, hơn 3 điểm tích hợp là quá tải.

:::case Lớp 4, Toán, bài “Số chẵn, số lẻ”
Giáo viên lập bản đồ cơ hội: câu đố trò chơi 6 câu dùng thẻ giấy quét mã (2.1); bảng số tương tác để kéo thả (4.2); phiếu 3 mức cho tiết sau (1.3). Học sinh chọn chẵn/lẻ bằng thẻ (2.1, B2), kéo thả số trên bảng (5.3, B2), chụp số nhà trong trường và nói vì sao không chụp người (4.2, B2). Ba hoạt động, hai miền TT02, có phương án thay thế khi thiếu thiết bị.
:::

## Phần 6 · Năm nguyên tắc an toàn và đạo đức

| Nguyên tắc | Việc cần làm | Việc không làm |
|---|---|---|
| Bảo vệ dữ liệu học sinh | Dùng tên giả định, mã số, mô tả chung | Không nhập họ tên, ảnh, giọng nói, điểm số vào AI công cộng |
| Kiểm chứng trước khi dùng | Đối chiếu sách giáo khoa, sách giáo viên, chương trình | Không đưa nội dung chưa kiểm tra cho học sinh |
| Giáo viên quyết định | Dùng AI gợi ý, tạo bản nháp, nhiều phương án | Không để AI đánh giá, xếp loại học sinh |
| Minh bạch | Cho biết khi học liệu có sự hỗ trợ của AI | Không trình bày sản phẩm AI như của mình |
| Phù hợp lứa tuổi | Chọn hình ảnh, ngôn ngữ, thời gian dùng thiết bị phù hợp | Không cho học sinh tự lập tài khoản, tự trò chuyện với AI |

:::tip Bắt đầu từ phiếu tự đánh giá
Đánh dấu mức hiện tại ở 20 năng lực thành phần, ghi một minh chứng cho mức Thành thạo, khoanh 3 năng lực ưu tiên. Đây là điểm khởi đầu của cả khóa, không phải thủ tục.
:::

## Việc làm ngay

:::checklist
- [ ] Tự chấm 20 năng lực thành phần, chọn 3 ưu tiên.
- [ ] Chọn một bài sẽ dạy trong 1–2 tháng tới.
- [ ] Lập bản đồ cơ hội: tối đa 3 hoạt động, ghi mã TT18 và TT02.
- [ ] Viết 2–4 yêu cầu cần đạt đủ 4 thành phần.
:::

<script type="text/plain" class="lesson-src" data-id="t2-chuyen-de"># Sáu chuyên đề, sáu miền: bản đồ khóa tập huấn

:::note Mục tiêu
Nắm được sản phẩm và mô hình cốt lõi của sáu chuyên đề; chọn được chuyên đề cần học sâu trước; tránh lỗi “làm nhiều nhưng không ra sản phẩm”.
:::

:::story Ngày thứ hai vắng dần
Trường tiểu học của thầy Quang tập huấn ba ngày. Ngày đầu ai cũng hào hứng, ngày thứ hai bắt đầu vắng. Thầy in một tờ bản đồ sáu chuyên đề, mỗi người đánh dấu chuyên đề mình đã dùng được trong tuần. Cuối ngày thứ ba, tờ giấy chi chít dấu, ai cũng thấy mình có ít nhất hai chỗ dùng được ngay. Thầy bảo: học nhiều không bằng nhìn thấy đường về nhà mình.
**Liên tưởng:** sáu chuyên đề như sáu nẻo đường trong làng; có bản đồ thì không sợ lạc, chỉ sợ không chịu bước.
:::

## Phần 1 · Cấu trúc ba ngày

Khóa tập huấn Tiểu học 2026 gồm ba ngày, sáu chuyên đề, mỗi chuyên đề tương ứng một miền của khung TT18. Mỗi chuyên đề đều kết thúc bằng **sản phẩm nộp được**, không phải bằng ghi chép.

| Chuyên đề | Miền | Sản phẩm chính |
|---|---|---|
| CĐ1 | 1 · Tổ chức dạy học | Tiến trình trạm luân phiên, gói học trước, nhiệm vụ 3 mức, bảng cộng tác an toàn |
| CĐ2 | 2 · Kiểm tra, đánh giá | Câu đố 3 mức, quy ước minh chứng số, quy trình đánh giá chéo, báo cáo trực quan |
| CĐ3 | 3 · Trao quyền | Học liệu dễ tiếp cận, hoạt động Dự đoán – Quan sát – Giải thích, trò chơi công bằng |
| CĐ4 | 4 · Kĩ năng công nghệ số | Phiếu tìm kiếm an toàn, học liệu số, quy tắc an toàn |
| CĐ5 | 5 · Phát triển chuyên môn | Kho học liệu, phiếu thẩm định tài nguyên mở, quy tắc ứng xử số, kế hoạch chuyên môn |
| CĐ6 | 6 · Trí tuệ nhân tạo | Bảng phân định việc giao AI, học liệu AI, nội dung cá nhân hoá, sổ câu lệnh |

## Phần 2 · CĐ1: tổ chức dạy học trong môi trường số

Ba mô hình dạy học kết hợp phù hợp tiểu học:

- **Trạm luân phiên**: nhóm luân phiên qua trạm giáo viên, trạm thiết bị, trạm nhóm. Ưu tiên khi lớp ít thiết bị — mỗi lúc chỉ một phần ba lớp cần máy.
- **Lớp học đảo ngược mức nhẹ**: làm quen nội dung trước giờ học cùng cha mẹ; trên lớp thực hành. Chủ yếu lớp 3–5, lớp 1–2 rất nhẹ.
- **Kết nối lớp học – gia đình**: giao hoạt động vận dụng qua kênh số, học sinh gửi sản phẩm.

Năm bước thiết kế: xác định mục tiêu → chia phần việc (cần giáo viên trực tiếp, bạn bè hay công cụ số) → chọn mô hình, công cụ → thiết kế dòng chảy (tín hiệu chuyển trạm, quy tắc dùng thiết bị, phương án khi hỏng) → thu dữ liệu, điều chỉnh.

Phân hoá theo bốn đường: mức độ, cách tiếp cận, tốc độ, hứng thú. AI giúp tạo nhanh nhiều phiên bản nhưng giáo viên vẫn quyết định học sinh nào làm mức nào và kiểm chứng nội dung.

Cộng tác trên công cụ số cần bốn điều kiện: nhóm 2–4 em với vai trò luân phiên; sản phẩm chung; không gian số riêng tư có duyệt bài; quy tắc ứng xử (khen trước, góp ý sau, không đăng ảnh người khác).

## Phần 3 · CĐ2: đánh giá quá trình

Vòng lặp 4 bước: **thu bằng chứng → đọc bằng chứng → phản hồi → điều chỉnh**. Bằng chứng có thể là câu đố, thẻ quét mã, ảnh sản phẩm, ghi âm, hồ sơ học tập số.

Ba mốc đọc báo cáo: dưới 60% đúng thì dạy lại cả lớp bằng cách khác; 60–80% thì chữa nhanh và gom nhóm nhỏ; trên 80% thì chuyển bài và hỗ trợ vài em. Nếu một phương án sai được nhiều em chọn, đó là lỗi cần chữa đúng chỗ.

Minh chứng số phải an toàn: dùng mã ẩn danh (ví dụ 4B-07), đặt tên tệp theo quy tắc `Lớp-Mã_Môn_Bài_Ngày_Lần`, ưu tiên thiết bị của trường, không chụp khuôn mặt hay nhãn vở có tên.

Đánh giá chéo theo 6 bước: chia sẻ tiêu chí → làm sản phẩm → tự đánh giá bằng biểu tượng → đánh giá chéo theo cặp (“2 ngôi sao, 1 điều ước”) → giáo viên phản hồi → sửa và lưu bản mới để thấy tiến bộ.

## Phần 4 · CĐ3: trao quyền cho học sinh

Sáu nguyên tắc học liệu dễ tiếp cận:

1. Chữ rõ, đủ lớn, ít chữ, giãn dòng rộng.
2. Tương phản cao, không đặt chữ lên ảnh nhiều chi tiết.
3. Không chỉ dựa vào một giác quan; không chỉ dùng màu để báo đúng sai.
4. Video có phụ đề, âm thanh có bản chữ.
5. Có chức năng đọc to hoặc giọng giáo viên thu âm gắn mã quét.
6. Hình quan trọng có một câu mô tả thay thế.

Hoạt động Dự đoán – Quan sát – Giải thích gồm 5 bước: nêu vấn đề → dự đoán (chưa nói đúng sai) → quan sát trên mô phỏng → giải thích và chốt kiến thức → nối với thế giới thật. Mô phỏng dùng cho phần không làm thật được; phần an toàn vẫn làm thật.

Trò chơi số công bằng: mỗi câu gắn một yêu cầu cần đạt; chơi theo đội; đọc to câu hỏi; không trừ điểm khi sai; không công bố xếp hạng cá nhân; đội thắng có thể là đội tiến bộ nhiều nhất.

## Phần 5 · CĐ4: kĩ năng công nghệ số

Bốn bước tìm kiếm an toàn: hỏi rõ mình cần gì → chọn 2–3 từ khoá → tìm và chọn trang đáng tin (giáo viên bật chế độ an toàn) → kiểm tra và ghi nguồn.

Năm câu hỏi đánh giá độ tin cậy: ai viết, ai đăng; đăng khi nào, có cập nhật không; để làm gì; có bằng chứng, dẫn nguồn không; nơi khác và sách giáo khoa có nói giống không. Với ảnh AI, thông điệp chính là **hỏi nguồn** và ghi nhãn “Hình minh hoạ do AI tạo”.

## Phần 6 · CĐ5: phát triển chuyên môn

Kho học liệu tổ chuyên môn vận hành với: tối đa 3 cấp thư mục, tách “Đang soạn” khỏi “Đã duyệt”; đặt tên không dấu; sổ danh mục có thẻ; phân quyền tổ trưởng – khối – người xem; sao lưu theo quy tắc 3–2–1 (3 bản, 2 nơi, 1 bản ngoài máy cá nhân); dữ liệu học sinh lưu riêng.

Năm tiêu chí thẩm định học liệu: chính xác, phù hợp chương trình, phù hợp lứa tuổi, pháp lí, sư phạm.

Sinh hoạt chuyên môn trực tuyến theo chu kì nghiên cứu bài học 4 pha: chuẩn bị → dạy minh hoạ, dự giờ → thảo luận gắn với minh chứng về học sinh → áp dụng, chia sẻ. Người dự quan sát việc học, không xếp loại giáo viên.

## Phần 7 · CĐ6: AI trong dạy học

Nội dung chi tiết ở bài sau. Điểm cốt lõi: AI là **trợ lý có kiểm soát**, phân định rõ việc giao AI và việc giáo viên giữ lại, kiểm chứng 4 bước, ghi nhãn minh bạch, và xây sổ câu lệnh cá nhân tối thiểu 8 câu.

:::warn Lỗi phổ biến của người học
Làm đủ sáu sản phẩm nhưng không cái nào gắn với bài dạy thật; nhồi 8–10 hoạt động số vào một tiết; ghi mã năng lực cho cả việc bật máy chiếu. Sản phẩm cuối khóa chỉ nên giữ 3–5 điểm tích hợp có chủ đích.
:::

:::case Tổ khối 3 sau sáu chuyên đề
Mỗi giáo viên chọn một bài, làm bản nháp qua từng chuyên đề, cuối khóa hợp nhất thành một kế hoạch bài dạy. Tổ chọn 3 kế hoạch tốt nhất đưa vào kho chung, đặt tên theo quy tắc, gắn mã TT18/TT02 và phương án dự phòng. Học kì sau, giáo viên mới vào tổ dùng lại được ngay.
:::

## Việc làm ngay

:::checklist
- [ ] Chọn chuyên đề yếu nhất của mình để học sâu trước.
- [ ] Lấy một bài dạy thật, ghi 3 hoạt động số khả thi.
- [ ] Kiểm một học liệu đang dùng theo 6 nguyên tắc dễ tiếp cận.
- [ ] Thử quy tắc đặt tên minh chứng số cho 3 tệp.
:::

<script type="text/plain" class="lesson-src" data-id="t3-ai-lop-hoc"># AI trong lớp tiểu học: giao việc đúng, kiểm chứng đủ

:::note Mục tiêu
Phân định được việc giao AI và việc giáo viên giữ lại; viết câu lệnh 5 thành phần; kiểm chứng học liệu AI theo 4 bước; tổ chức tương tác ba chiều an toàn với học sinh nhỏ.
:::

:::story Bài văn quá trơn
Em My lớp 5 nộp bài văn tả cây phượng, câu nào cũng đẹp. Cô giáo nghi, hỏi thêm: “Vì sao em chọn tả cây phượng?” My im lặng. Cô không mắng, đổi đề: cả lớp dùng AI tả cây, rồi tìm ba chi tiết AI viết sai so với cây thật ở sân trường. My tìm ra bốn chỗ. Bài sau, My viết về cây bàng trước cửa nhà, câu văn lủng củng hơn nhưng có mùi lá thật.
**Liên tưởng:** AI có thể viết hộ một bài văn, nhưng không thể thay em đứng dưới gốc cây.
:::

## Phần 1 · Ba nhóm việc: xanh, vàng, đỏ

| Nhóm việc | Ý nghĩa | Ví dụ ở tiểu học |
|---|---|---|
| **Giao AI làm nháp** (xanh) | AI tạo bản đầu; giáo viên đọc, sửa, chọn | Soạn câu trắc nghiệm; viết bài đọc theo sở thích; tạo hình minh hoạ |
| **Làm cùng AI, giáo viên kiểm** (vàng) | Giáo viên đưa ý chính, AI giúp diễn đạt; kiểm từng chi tiết | Viết lời dẫn hoạt động; tóm tắt văn bản chỉ đạo |
| **Giáo viên giữ lại hoàn toàn** (đỏ) | Cần hiểu học sinh, phán đoán sư phạm, liên quan cảm xúc | Xác định mục tiêu; quyết định ai cần hỗ trợ; nhận xét học sinh |

Ba câu hỏi để xếp việc đúng nhóm:

1. **Cần hiểu từng học sinh?** Nếu có, giáo viên giữ lại; AI chỉ hỗ trợ phần diễn đạt chung.
2. **AI sai thì hậu quả lớn không?** Sai kiến thức, tổn thương cảm xúc, ảnh hưởng đánh giá — càng phải kiểm kĩ hoặc tự làm.
3. **Có cơ hội để học sinh tự nghĩ?** Nếu có, không để AI làm thay. AI tạo bài để học sinh giải, không giải hộ.

:::warn Ba lỗi hay gặp
Giao AI xác định mục tiêu bài học; dùng nguyên văn nhận xét AI viết; để AI quyết định học sinh làm mức nào. Cả ba đều đẩy việc đỏ sang AI.
:::

## Phần 2 · Năm nguyên tắc đạo đức AI trong lớp

| Nguyên tắc | Việc thầy cô làm |
|---|---|
| Kiểm chứng | Đối chiếu sách giáo khoa, sách giáo viên; tự giải lại; phóng to hình |
| Phát hiện thiên kiến | Rà định kiến giới, vùng miền, hoàn cảnh, ngoại hình; sửa cho đa dạng |
| Minh bạch | Ghi nhãn “có hỗ trợ của AI, đã được giáo viên kiểm tra” |
| Bảo vệ dữ liệu cá nhân | Không đưa họ tên, ảnh, giọng nói, điểm số; dùng mã ẩn danh |
| Phù hợp độ tuổi | Học sinh không tự lập tài khoản, không tự trò chuyện với AI |

## Phần 3 · Câu lệnh 5 thành phần

Một câu lệnh dùng được cho lớp tiểu học có: **vai trò – nhiệm vụ – đối tượng – ngữ cảnh – ràng buộc**.

Ví dụ: “Bạn là giáo viên Tiếng Việt lớp 2. Soạn 3 câu hỏi đọc hiểu cho bài ‘Họa mi hót’, dành cho học sinh đọc chậm. Ngữ cảnh: lớp 32 em, không có máy tính bảng. Ràng buộc: câu ngắn dưới 10 chữ, chỉ dùng từ trong bài, kèm đáp án.”

Thêm hai câu bổ trợ rất hiệu quả: “Nếu cần thông tin để làm tốt hơn, hỏi lại tôi tối đa 3 câu” và “sau khi trả lời, tự rà lại xem có chỗ nào chưa chắc chắn”.

## Phần 4 · Kiểm chứng 4 bước trước khi đến tay học sinh

1. **Đọc** như học sinh lớp mình; gạch chân từ khó, câu dài, chi tiết lạ.
2. **Đối chiếu** với sách giáo khoa, sách giáo viên; tự làm lại bài; phóng to kiểm hình.
3. **Sửa** trực tiếp hoặc bằng câu lệnh vòng sửa; rà thiên kiến; ghi lại lỗi đã phát hiện.
4. **Ghi nhãn** minh bạch và lưu bản đã duyệt vào kho học liệu cá nhân.

## Phần 5 · Tương tác ba chiều có kiểm soát

Khi cho cả lớp “hỏi máy”, đi theo 5 bước:

1. Học sinh đề xuất câu hỏi.
2. Giáo viên chọn, kiểm không có thông tin cá nhân rồi mới nhập trên máy chiếu.
3. AI trả lời; cả lớp cùng quan sát.
4. Cả lớp đánh giá: giơ thẻ Đúng – Sai – Chưa chắc, đối chiếu sách, nói lí do.
5. Giáo viên kết luận, chỉ chỗ AI sai, nhắc “máy có thể sai, cần kiểm tra”.

Cách này biến AI thành **đối tượng để học sinh phản biện**, không phải nguồn chân lý. Với lớp 1–2, giáo viên thao tác hoàn toàn; học sinh chỉ chạm chọn trên màn hình lớn.

## Phần 6 · Cá nhân hoá và sổ câu lệnh

Cá nhân hoá an toàn dựa trên **hồ sơ ẩn danh**: 3 mô tả kiểu “em A đọc chậm, cần câu ngắn”, “em B đọc tốt, cần câu mở rộng”. Không tên, không ảnh, không lớp học cụ thể.

Sổ câu lệnh cá nhân tối thiểu 8 câu, chia theo việc: soạn câu hỏi, viết lời dẫn, tạo hình, tóm tắt, rà ngôn ngữ, phản hồi mẫu, tin nhắn phụ huynh, tự học. Mỗi câu lưu: mục đích, câu lệnh, điều cần sửa sau khi chạy.

:::case Lớp 2, Tiếng Việt, bài “Họa mi hót”
Giáo viên dùng AI gợi ý giải nghĩa từ, ô nhiễu và 2 tranh minh hoạ. Trước khi chiếu, cô tự đọc, bỏ 1 từ ngoài bài, chỉnh 1 tranh vì chim không giống họa mi. Trên lớp, cô nói rõ “tranh do máy vẽ, có lúc sai”; học sinh chỉ chi tiết chưa đúng. Bài viết của một em được che tên trước khi chụp, và cô giải thích vì sao che. Ba việc: dùng AI có kiểm chứng, dạy nhận biết AI, dạy bảo vệ dữ liệu — tất cả trong một tiết.
:::

## Phần 7 · Theo cấp lớp

- **Lớp 1–2 (Bậc 1)**: giáo viên thao tác AI; học sinh chạm chọn, nói, chỉ chi tiết sai; động từ “nhận biết, chọn, nói được”; không yêu cầu tìm kiếm Internet.
- **Lớp 3–5 (Bậc 2)**: nhóm phân vai thao tác – quan sát – ghi – báo cáo; so sánh câu trả lời AI với sách; ghi nguồn; tên hiển thị là tên nhóm, số máy.

## Việc làm ngay

:::checklist
- [ ] Xếp 5 việc đang làm với AI vào ba nhóm xanh – vàng – đỏ.
- [ ] Viết lại một câu lệnh đủ 5 thành phần.
- [ ] Chạy kiểm chứng 4 bước trên một học liệu AI đã tạo.
- [ ] Mở sổ câu lệnh, ghi 2 câu đầu tiên.
:::

:::story Bài đẹp nhưng thiếu cửa
Cô Hạnh nộp bài cuối khóa, tự tin vì bài đẹp, slide đủ. Giảng viên trả lại kèm một câu: “Đầu ra của học sinh là gì?” Cô mở rubric tám tiêu chí, thấy bài mình thiếu đúng tiêu chí quan trọng nhất: sản phẩm học sinh. Cô sửa, thêm một phiếu học tập và một tiêu chí đánh giá. Lần nộp sau, bài không đẹp hơn nhưng dùng được ngay ở lớp.
**Liên tưởng:** rubric như bảng chỉ đường; bài đẹp mà thiếu đầu ra thì giống ngôi nhà xây xong không có cửa.
:::

## Phần 1 · Hai yêu cầu bắt buộc

| Yêu cầu | Nội dung | Căn cứ | Thể hiện ở đâu |
|---|---|---|---|
| Bắt buộc 1 | Giáo viên ứng dụng thiết bị số, phần mềm, công cụ tương tác, AI | Khung TT18, ghi mã | Mục II; cột giáo viên ở mục III |
| Bắt buộc 2 | Yêu cầu cần đạt năng lực số học sinh được thực hành, đạt được | Khung TT02, Bậc 1 hoặc 2 | Mục I dòng “Năng lực số”; cột học sinh |

Thiếu một trong hai là chưa đủ điều kiện nộp, dù bài có đẹp đến đâu.

## Phần 2 · Năm điều kiện chất lượng

1. **Bám mục tiêu môn học** — công nghệ số phục vụ yêu cầu cần đạt, không thay thế.
2. **Học sinh thực hành thật** — thao tác, lựa chọn, suy nghĩ; không chỉ xem trình chiếu.
3. **An toàn và đạo đức** — học sinh không tự dùng AI công cộng; không đưa dữ liệu học sinh.
4. **Khả thi** — hợp thiết bị, mạng, sĩ số thật; có phương án dự phòng.
5. **Đủ dải năng lực** — nhiều miền TT18 chứ không chỉ miền AI; ít nhất hai miền TT02.

## Phần 3 · Quy trình 6 bước hợp nhất

1. **Cố định bài, mục tiêu** — chép yêu cầu cần đạt môn học; rà 2–4 yêu cầu năng lực số.
2. **Chọn mô hình, đánh giá** — kết hợp, đảo ngược, phân hoá hay cộng tác; cách đánh giá quá trình.
3. **Thêm trao quyền, kĩ năng** — 1–2 hoạt động học sinh trực tiếp thao tác; điều chỉnh cho học sinh đặc biệt.
4. **Chuẩn hoá học liệu, AI** — kiểm bản quyền, nguồn; phân định việc AI hỗ trợ; kiểm chứng nội dung.
5. **Hợp nhất, hoàn thiện** — viết đủ mục I–IV; ghi dự phòng; AI rà cấu trúc, giáo viên quyết định.
6. **Tự kiểm, đánh giá chéo** — theo bảng tự kiểm; chéo theo rubric; dạy thử nếu có; đóng gói minh chứng.

Ba nguyên tắc khi hợp nhất: **chọn lọc, không cộng dồn** (từ 8–10 hoạt động chỉ giữ 3–5 việc phục vụ mục tiêu tốt nhất); **giữ hoạt động trực tiếp** (thí nghiệm thật, đọc thành tiếng, viết tay, vận động vẫn là trục chính); **mỗi điểm ba thông tin** (việc giáo viên làm kèm mã TT18; việc học sinh làm kèm mã TT02 và bậc; phương án khi gặp sự cố).

## Phần 4 · Cấu trúc bài và cách ghi mã

| Mục | Bổ sung bắt buộc |
|---|---|
| Phần đầu | Một dòng điều kiện lớp: sĩ số, thiết bị số, mạng |
| I. Yêu cầu cần đạt | Dòng “Năng lực số”: 2–4 yêu cầu đủ 4 thành phần, mã TT02, bậc |
| II. Đồ dùng dạy học | Thiết bị, phần mềm, học liệu, AI kèm mã TT18; phương án thay thế |
| III. Các hoạt động | Bảng 4 cột: cột giáo viên ghi mã TT18; cột học sinh ghi mã TT02 |
| IV. Điều chỉnh sau bài | Để trống khi nộp; có dòng gợi ý ghi chép |
| Phần kèm | Câu lệnh AI đã dùng, kết quả kiểm chứng; phiếu học tập |

Quy tắc ghi mã: ghi trong ngoặc ngay sau việc làm, ví dụ “chiếu báo cáo câu đố, chia nhóm củng cố (2.2; 2.3)”; cột học sinh ghi “2.1 (B2)”; hoạt động không tích hợp ghi dấu “–”. **Không ghi mã cho việc chỉ bật máy chiếu hay học sinh chỉ xem.**

## Phần 5 · Tự kiểm bắt buộc

Chỉ nộp khi qua các mục sau:

- Bài thuộc môn, lớp mình đang trực tiếp dạy; yêu cầu cần đạt chép đúng sách giáo viên.
- 2–4 yêu cầu năng lực số đủ 4 thành phần, đúng bậc, gắn với hoạt động ở mục III.
- Thiết bị, phần mềm, AI ghi kèm mã TT18; mỗi điểm có phương án dự phòng.
- Không còn việc học sinh tự dùng AI công cộng; câu lệnh và minh chứng không có thông tin học sinh.
- Trình bày bảng 4 cột; thể hiện 2 miền TT18 ngoài miền AI và 2 miền TT02; ghi nguồn, ghi nhãn minh bạch.

## Phần 6 · Rubric 8 tiêu chí, 3 mức (2–3–4 điểm)

| Tiêu chí | Đạt (2) | Tốt (3) | Xuất sắc (4) |
|---|---|---|---|
| 1. Bám yêu cầu cần đạt môn học | Phần lớn hoạt động phục vụ mục tiêu | Mọi hoạt động phục vụ rõ mục tiêu | Công nghệ giúp đạt mục tiêu tốt hơn, có lập luận |
| 2. Tích hợp công nghệ số, AI (TT18) | Ít nhất 2 điểm, mã đúng | 3–5 điểm ở ít nhất 3 miền | 5–6 miền; dùng dữ liệu điều chỉnh ngay trong tiết |
| 3. Năng lực số học sinh (TT02) | 2 yêu cầu đúng bậc, có mã | 2–4 yêu cầu đủ 4 thành phần, 2 miền | Đo được qua quan sát, có cách ghi nhận mức đạt |
| 4. Học sinh thực hành thật | Ít nhất 1 hoạt động trực tiếp thao tác | Thao tác, lựa chọn, nói suy nghĩ ở 2 hoạt động | Tạo sản phẩm số hoặc tự nhận ra điều cần cải thiện |
| 5. An toàn, đạo đức, dữ liệu | Không vi phạm; nhắc quy tắc chung | Giáo dục an toàn gắn với hoạt động | Học sinh thực hành hành vi an toàn, nói được lí do |
| 6. Khả thi, có dự phòng | Phù hợp thiết bị; dự phòng chung | Mỗi điểm có phương án thay thế | Phương án cho 2 kịch bản; đã dạy thử |
| 7. Kiểm chứng nội dung AI | Có ghi đã kiểm chứng | Có nhật kí: câu lệnh, chỗ đối chiếu, chỗ sửa | Học sinh so sánh nội dung AI với nguồn tin cậy |
| 8. Trình bày và minh chứng | Đủ mục I–IV, minh chứng tối thiểu | Bảng 4 cột chuẩn; 4 thư mục, đã ẩn thông tin | Mẫu mực, chia sẻ được cho tổ chuyên môn |

Quy đổi trên 32 điểm:

- **Chưa hoàn thành**: tiêu chí 2, 3 hoặc 5 ở mức Chưa đạt, hoặc tổng dưới 16.
- **Hoàn thành**: 16–23 điểm; tiêu chí 2, 3, 5 từ Đạt.
- **Hoàn thành tốt**: 24–28 điểm; không tiêu chí nào Chưa đạt.
- **Hoàn thành xuất sắc**: từ 29 điểm; mọi tiêu chí từ Tốt.

:::warn Điểm cao không đến từ số hoạt động
Một bài 32 điểm không phải bài nhồi nhiều công cụ, mà là bài mọi hoạt động đều phục vụ mục tiêu, học sinh thao tác thật, có dự phòng và có nhật kí kiểm chứng AI. Hãy cắt bớt trước khi thêm.
:::

## Phần 7 · Đóng gói minh chứng

Bốn thư mục: kế hoạch bài dạy; câu lệnh AI và kết quả kiểm chứng; học liệu đã duyệt; minh chứng học sinh (đã ẩn thông tin). Đặt tên tệp không dấu, theo quy tắc thống nhất của lớp tập huấn. Ảnh chụp sản phẩm không có khuôn mặt, nhãn vở hay tên học sinh.

:::case Bài Toán 4 “Số chẵn, số lẻ” đạt 30 điểm
Lớp 36 em, 1 máy chiếu, 6 máy tính bảng dùng chung, mạng không ổn định. Bốn hoạt động: câu đố thẻ trả lời, bảng số tương tác, phiếu 3 mức, thám tử số chụp ảnh. Mỗi hoạt động có mã TT18/TT02 và phương án khi mất mạng. Nhật kí AI ghi 3 câu lệnh, 2 chỗ sửa. Tổng: tiêu chí 1–8 đều mức Tốt, riêng tiêu chí 2 và 7 mức Xuất sắc — 30/32.
:::

:::note Mục tiêu
Hiểu AI tạo sinh làm được gì và không làm được gì với trẻ mầm non; nắm năm nguyên tắc đạo đức và năm nguyên tắc sư phạm; đặt việc dùng AI trong Bộ tiêu chí đổi mới 2026–2030.
:::

:::story Mười hoạt động, ba hoạt động
Cô hiệu phó Hòa muốn dùng AI thiết kế góc chơi “chợ quê”. AI trả về mười hoạt động, hoạt động nào cũng hay. Nhưng cô biết lớp có bé Mít nhút nhát, bé Bin hay tranh đồ chơi. Cô giữ ba hoạt động, sửa cách chia nhóm, bỏ phần yêu cầu trẻ đứng thuyết trình. Cô kể: AI nhìn thấy một lớp mầm non chung chung, còn cô nhìn thấy hai mươi tám đứa trẻ cụ thể.
**Liên tưởng:** AI như người bạn vẽ bản đồ từ trên cao; người đi trong làng vẫn phải biết ổ gà ở đâu.
:::

## Phần 1 · AI tạo sinh là gì với người làm mầm non

AI tạo sinh tạo ra văn bản, hình ảnh, âm thanh, video từ câu lệnh. Với trường mầm non, nó là **trợ lý soạn nháp**: gợi ý ý tưởng hoạt động, dựng khung kế hoạch, viết lời dẫn, tạo tranh minh hoạ, tóm tắt văn bản chỉ đạo.

Nó không nhìn thấy trẻ, không biết lớp mình hôm nay có em nào mệt, không quan sát được góc chơi. Vì vậy nguyên tắc vàng của cả khóa: **AI gợi ý – giáo viên quan sát và kết luận**.

| AI làm tốt | AI không nên làm |
|---|---|
| Gợi ý nhiều ý tưởng hoạt động, trò chơi | Chọn mục tiêu phù hợp với trẻ thật của lớp |
| Dự thảo khung kế hoạch, giáo án | Quyết định nội dung, thời lượng, cách chia nhóm |
| Gợi ý câu hỏi mở, lời dẫn, bài thơ, câu đố | Kiểm tra độ chính xác, tính phù hợp độ tuổi |
| Liệt kê đồ dùng, nguyên vật liệu | Đánh giá an toàn, điều kiện thực tế của lớp |
| Viết lại thông báo cho cha mẹ dễ hiểu | Chịu trách nhiệm cuối cùng về kế hoạch |

## Phần 2 · Hai loại sai phải nhận diện

**Ảo giác**: AI tạo thông tin nghe hợp lí nhưng sai hoặc không có thật — bịa tên văn bản, bịa số liệu dinh dưỡng, gán sai tác giả bài hát. Ở mầm non, thông tin sai về dinh dưỡng và sức khỏe có thể ảnh hưởng trực tiếp đến trẻ.

**Thiên kiến**: AI học từ dữ liệu trên mạng, lặp lại định kiến xã hội. “Bác sĩ” thường ra nam, “cô giáo mầm non” thường ra nữ; “trường học” thường mang dáng dấp đô thị; trang phục dân tộc bị vẽ sai hoặc pha trộn tuỳ tiện.

Cách sửa thiên kiến ngay trong câu lệnh: mô tả cụ thể giới, vùng miền, dân tộc. Thay vì “vẽ một bác sĩ”, viết “vẽ một nữ bác sĩ người Việt Nam đang khám cho trẻ tại trạm y tế xã miền núi”.

## Phần 3 · Năm nguyên tắc đạo đức AI

| Nguyên tắc | Biểu hiện ở trường mầm non |
|---|---|
| **Minh bạch** | Ghi chú “có sử dụng AI hỗ trợ” trên học liệu, tin bài; giải thích cho cha mẹ khi được hỏi |
| **Công bằng** | Hình ảnh, câu chuyện đa dạng về giới, vùng miền, dân tộc; trẻ nào cũng thấy mình trong học liệu |
| **Trách nhiệm** | Giáo viên đọc, kiểm, sửa trước khi dùng; không đổ lỗi cho AI |
| **Tôn trọng quyền riêng tư** | Không nhập họ tên, ảnh, sức khỏe, hoàn cảnh của trẻ vào AI công cộng |
| **Con người quyết định** | Đánh giá trẻ, trao đổi với cha mẹ, xử lý tình huống do giáo viên quyết định |

## Phần 4 · Năm nguyên tắc sư phạm không thay đổi

1. **Lấy trẻ làm trung tâm** — xuất phát từ nhu cầu, hứng thú, kinh nghiệm của trẻ thật.
2. **Học qua chơi, trải nghiệm** — trẻ học bằng giác quan, thao tác với vật thật.
3. **Tích hợp** — chủ đề là sợi chỉ gắn kết hoạt động trong ngày, tuần.
4. **Phù hợp văn hóa địa phương** — bài hát, trò chơi gắn với quê hương của trẻ.
5. **An toàn tuyệt đối** — an toàn thể chất, tâm lý và thông tin của trẻ.

Màn hình chỉ là phương tiện hỗ trợ, không thay thế trải nghiệm trực tiếp với đồ vật thật. Một hoạt động AI gợi ý mà kéo trẻ ngồi nhìn 20 phút là hoạt động sai, dù nội dung đẹp.

## Phần 5 · Kiểm chứng 4 bước

1. **Đánh dấu** số liệu, liều lượng, tên văn bản, tác giả, khuyến cáo y tế, mốc phát triển.
2. **Đối chiếu** nguồn chính thống: Bộ GD&ĐT, Chương trình GDMN, Bộ Y tế, Viện Dinh dưỡng.
3. **Đánh giá phù hợp** độ tuổi, điều kiện của trẻ, văn hóa địa phương.
4. **Quyết định** giữ, sửa hoặc loại bỏ; ghi lại nguồn đã đối chiếu.

Không hỏi AI để “chẩn đoán” tình trạng sức khỏe hay phát triển của một trẻ cụ thể. Việc đó thuộc nhân viên y tế và chuyên gia, dựa trên quan sát thật.

## Phần 6 · Đặt AI trong Bộ tiêu chí 2026–2030

Bộ tiêu chí mô hình đổi mới, nâng cao chất lượng giáo dục mầm non giai đoạn 2026–2030 gồm **5 nhóm tiêu chí, 21 tiêu chí, 70 chỉ báo**:

1. Đổi mới, phát triển chương trình giáo dục và tổ chức hoạt động (4 tiêu chí, 12 chỉ báo).
2. Đổi mới quản trị cơ sở giáo dục theo hướng tự chủ, trách nhiệm giải trình (4 tiêu chí, 16 chỉ báo).
3. Phát triển điều kiện bảo đảm chất lượng, môi trường giáo dục toàn diện (5 tiêu chí, 20 chỉ báo).
4. Chuyển đổi số, ứng dụng công nghệ thông tin và AI (4 tiêu chí, 11 chỉ báo).
5. Hợp tác và hội nhập quốc tế (4 tiêu chí, 11 chỉ báo).

Chu trình sử dụng: **tự đánh giá → xác định nội dung ưu tiên → lồng ghép vào kế hoạch → theo dõi, rà soát, điều chỉnh → tiếp tục cải tiến**. Bộ tiêu chí dùng để hỗ trợ đổi mới, không phải để xếp loại trường. Cơ sở chọn nội dung ưu tiên theo nguồn lực, không nhất thiết làm tất cả cùng lúc.

:::case Một trường chọn đúng một ưu tiên
Trường mầm non ở huyện miền núi tự chấm: nhóm 4 (chuyển đổi số) yếu nhất vì kho học liệu nằm rải rác trên tài khoản cá nhân. Năm học này trường chọn hai chỉ báo: kho dùng chung trên tài khoản trường và quy định bảo vệ dữ liệu trẻ. Không chạy theo mọi tiêu chí, nhưng cuối năm đã có kho 6 thư mục, phân quyền và bản sao lưu.
:::

:::tip Nguyên tắc vàng cho cả khóa
AI gợi ý – giáo viên quan sát và kết luận. Mọi câu AI viết về một trẻ chỉ là bản nháp cho đến khi giáo viên đối chiếu với ghi chép thật của mình.
:::

## Việc làm ngay

:::checklist
- [ ] Liệt kê 5 việc giáo viên đang làm và đánh dấu việc nào có thể giao AI làm nháp.
- [ ] Rà một học liệu AI đang dùng: có thiên kiến giới, vùng miền không?
- [ ] Chạy kiểm chứng 4 bước trên một thông tin dinh dưỡng AI đưa ra.
- [ ] Chọn một nhóm tiêu chí trong Bộ tiêu chí để tự chấm thử.
:::

:::note Mục tiêu
Viết được câu lệnh đủ 5 thành phần; dùng 5 kỹ thuật nâng cao; chạy vòng lặp Hỏi – Đọc – Kiểm – Sửa; tạo ảnh đúng 6 yếu tố; lập sổ prompt cá nhân.
:::

:::story Lời dẫn kể chuyện cho trẻ bốn tuổi
Cô Thu cần lời dẫn kể chuyện “Cáo và Gà”. Cô nhắn AI “viết lời dẫn thật hay”, nhận về một đoạn văn người lớn đọc còn mệt. Cô thử lại, ghi rõ: cho trẻ bốn đến năm tuổi, giọng kể, câu ngắn, có chỗ dừng cho trẻ đoán, tránh từ khó. Lần này đoạn dẫn vừa đủ, cô chỉ sửa hai câu cho hợp giọng mình. Sáng hôm sau, trẻ đoán được ba lần, cô kể thêm một đoạn ngoài kịch bản.
**Liên tưởng:** câu lệnh như công thức nấu cháo cho trẻ; không ghi độ tuổi thì người nấu đưa gì cũng được.
:::

## Phần 1 · Vì sao câu lệnh 6 chữ thường thất bại

“Viết bài thơ về mùa thu” — kết quả thường có câu dài, từ ngữ người lớn (“hoa sữa”, “phố nhỏ”), hình ảnh xa lạ với trẻ nông thôn và không có câu hỏi đàm thoại. AI không sai; nó chỉ **đoán** vì thiếu thông tin.

Prompt là lời giao việc cho một trợ lý mới. Giao việc càng rõ, kết quả càng sát.

## Phần 2 · Công thức 5 thành phần

| Thành phần | Câu hỏi | Ví dụ mầm non |
|---|---|---|
| **Vai** | AI đóng vai ai? | Giáo viên mầm non 15 năm kinh nghiệm |
| **Bối cảnh** | Ở đâu, cho ai? | Lớp mẫu giáo nhỡ 4–5 tuổi, 30 trẻ, trường vùng nông thôn, chủ đề “Thế giới thực vật” |
| **Nhiệm vụ** | Cần AI làm gì? | Gợi ý 5 trò chơi; viết câu chuyện; dự thảo kế hoạch |
| **Yêu cầu** | Ràng buộc gì? | Độ dài, mức khó, nguyên liệu sẵn có, an toàn, phù hợp Chương trình GDMN, ngôn ngữ giản dị |
| **Định dạng** | Trình bày thế nào? | Bảng 4 cột; gạch đầu dòng; đoạn dưới 150 chữ; một trang A4 |

Việc đơn giản dùng 2–3 thành phần là đủ. Việc quan trọng — kế hoạch, báo cáo, học liệu cho trẻ — viết đủ cả 5. Mẹo nhớ: **Ai – Ở đâu – Làm gì – Thế nào – Nộp dạng gì**.

Ví dụ nâng cấp câu lệnh làm thơ: vai “giáo viên mầm non giàu kinh nghiệm sáng tác thơ cho trẻ”; bối cảnh “lớp mẫu giáo bé 3–4 tuổi ở xã ven sông, chủ đề Mùa thu của bé”; nhiệm vụ “sáng tác bài thơ ngắn để dạy trẻ đọc”; yêu cầu “3 khổ × 4 câu, mỗi câu 4 chữ, nhịp 2/2, gieo vần chân, từ láy, hình ảnh lá vàng – trăng rằm – lũy tre – bưởi – cốm”; định dạng “tên bài, nội dung, 3 câu hỏi đàm thoại”.

## Phần 3 · Năm kỹ thuật nâng cao

1. **Cho ví dụ mẫu** — “Đây là một câu đố mẫu… Hãy viết 5 câu đố về con vật theo phong cách tương tự.”
2. **Chia nhỏ nhiệm vụ** — “Bước 1: gợi ý mục tiêu. Tôi duyệt xong sẽ yêu cầu bước 2.”
3. **Yêu cầu AI hỏi lại** — “Trước khi viết, hãy hỏi tôi tối đa 5 câu để hiểu rõ lớp học.”
4. **Đóng vai** — “Hãy đóng vai một phụ huynh lo lắng vì con chưa chịu ăn ở trường, để tôi luyện cách trò chuyện.”
5. **Yêu cầu tự kiểm tra** — “Có hoạt động nào không an toàn với trẻ 3–4 tuổi không? Có từ ngữ nào khó với trẻ không?”

Hai câu thêm vào cuối prompt — “hỏi lại” và “tự kiểm tra” — giảm phần lớn lỗi.

## Phần 4 · Vòng lặp Hỏi – Đọc – Kiểm – Sửa

1. **Hỏi** — gửi prompt theo công thức 5 thành phần.
2. **Đọc** — đọc toàn bộ, đánh dấu phần tốt, phần chưa đạt.
3. **Kiểm** — đối chiếu Chương trình GDMN, lứa tuổi, an toàn, độ chính xác.
4. **Sửa** — yêu cầu sửa cụ thể hoặc tự sửa trực tiếp.

Thường cần 2–4 vòng. Con người chịu trách nhiệm cuối cùng. Bản cuối ghi chú “Có sử dụng AI hỗ trợ soạn thảo”.

## Phần 5 · Sáu lỗi thường gặp

| Lỗi | Cách khắc phục |
|---|---|
| Quá ngắn, chung chung | Bổ sung độ tuổi, chủ đề, lĩnh vực, thời lượng |
| Không nói rõ độ tuổi | Ghi nhà trẻ, mẫu giáo bé, nhỡ, lớn và số tuổi |
| Gộp nhiều việc một lúc | Chia nhỏ nhiệm vụ, làm từng bước |
| Không yêu cầu định dạng | Ghi rõ bảng, số cột, độ dài |
| Đưa thông tin cá nhân của trẻ | Ẩn danh: Trẻ A, Trẻ B; chỉ nêu đặc điểm chung |
| Tin ngay kết quả đầu tiên | Thực hiện vòng lặp Hỏi – Đọc – Kiểm – Sửa |

## Phần 6 · Prompt hình ảnh: 6 yếu tố

| Yếu tố | Ví dụ |
|---|---|
| Chủ thể | Một bé trai, một bé gái người Việt 5 tuổi; bé gái tóc buộc hai bên |
| Trang phục, hành động | Áo cộc tay, quần soóc mùa hè; ngắm hoa sen, chỉ chú chuồn chuồn |
| Bối cảnh | Đầm sen làng quê, buổi sáng mùa hè |
| Phong cách, màu sắc | Tranh màu nước sách thiếu nhi; xanh lá, hồng nhạt |
| Bố cục | Hai nhân vật ở giữa, toàn thân, nền đơn giản |
| Tỉ lệ khung | 16:9 cho trình chiếu; 1:1 cho thẻ hình |

Nêu cả điều **không muốn**: chữ trong tranh, chi tiết đáng sợ. Trước khi dùng, kiểm 5 điểm: bàn tay, khuôn mặt có biến dạng; số lượng đồ vật đúng; có chữ méo; trang phục, cảnh vật đúng nét Việt Nam; an toàn, vui tươi.

Lệnh sửa mẫu: “Giữ nguyên bố cục và nhân vật, chỉ sửa: bàn tay bạn gái đúng 5 ngón, bỏ dòng chữ ở góc trái.”

## Phần 7 · Sổ prompt cá nhân

Mỗi dòng trong sổ gồm: mã, tên prompt, công cụ đã thử, nhận xét, trạng thái.

| Mã | Tên prompt | Công cụ | Nhận xét | Trạng thái |
|---|---|---|---|---|
| KH-01 | Kế hoạch hoạt động khám phá | ChatGPT, Gemini | Cần 3 lượt sửa | Đã kiểm chứng |
| HA-01 | Tranh minh hoạ truyện | ChatGPT, Canva | Sửa bàn tay sau 1 lượt | Đã kiểm chứng |
| PH-01 | Tin nhắn mời họp cha mẹ | Gemini | Giọng văn thân thiện | Đang thử |

Mã nhóm: KH kế hoạch, HL học liệu, HA hình ảnh, PH cha mẹ trẻ, DG đánh giá trẻ. Với cán bộ quản lý: QT quản trị, BC báo cáo, KD kiểm định, TT truyền thông.

:::case Từ câu lệnh thiếu đến dùng được
Cô giáo lớp 4–5 tuổi cần tranh minh hoạ “hai bạn nhỏ ngắm hoa sen”. Ảnh đầu tiên bị sai bàn tay và có chữ lạ. Cô viết lại đủ 6 yếu tố, nêu “không có chữ trong tranh”, tạo 2 phiên bản, chọn bản đúng, sửa một bàn tay bằng lệnh sửa cục bộ. Tổng 12 phút; ảnh được ghi nguồn và ghi nhãn AI trong bài giảng.
:::

## Việc làm ngay

:::checklist
- [ ] Nâng cấp một câu lệnh ngắn thành đủ 5 thành phần.
- [ ] Thêm hai câu “hỏi lại” và “tự kiểm tra” vào prompt cuối.
- [ ] Điền bảng 6 yếu tố trước khi tạo một ảnh minh hoạ.
- [ ] Mở sổ prompt, ghi 3 dòng đầu tiên.
:::

## Tự kiểm tra

:::quiz
? Công thức 5 thành phần gồm gì? | Vai, bối cảnh, nhiệm vụ, yêu cầu, định dạng* | Mở bài, thân bài, kết bài | Ai, khi nào, ở đâu, vì sao | Năm phần giúp AI không phải đoán.
? Kỹ thuật nào giảm lỗi hiệu quả nhất? | Viết dài hơn | Hỏi lại và tự kiểm tra* | Dùng nhiều công cụ | Hai câu thêm vào cuối prompt.
? Prompt hình ảnh cần mấy yếu tố? | 3 | 4 | 6* | Chủ thể, trang phục, bối cảnh, phong cách, bố cục, tỉ lệ.
? Vòng lặp tinh chỉnh gồm mấy bước? | 2 | 3 | 4* | Hỏi – Đọc – Kiểm – Sửa.
