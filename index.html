<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sổ tay thực hành chuyển đổi số, năng lực số và sư phạm số thích ứng cho giáo viên Nghệ An, biên soạn từ tài liệu bồi dưỡng NAEM 2026.">
<title>Sổ tay số cho giáo viên Nghệ An · NAEM 2026</title>
<style>:root {
  --ink: #1c2426;
  --ink-soft: #45585c;
  --muted: #6a7c80;
  --paper: #fbf8f1;
  --paper-2: #f3ecdd;
  --card: #ffffff;
  --line: #e2d8c4;
  --teal: #0f4c5c;
  --teal-2: #146b7a;
  --teal-soft: #e3f0f1;
  --amber: #c2670a;
  --amber-soft: #fdf1df;
  --red: #a9342a;
  --red-soft: #fbe8e4;
  --green: #2e6b45;
  --green-soft: #e7f2e9;
  --sidebar: #10333a;
  --sidebar-2: #0b272d;
  --sidebar-ink: #e9f1ef;
  --sidebar-dim: #a9c1c2;
  --radius: 14px;
  --shadow: 0 12px 32px rgba(24, 38, 40, .08);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --read: 17.5px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font); font-size: var(--read); line-height: 1.72;
  color: var(--ink); background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
body.large-text { --read: 20px; }
a { color: var(--teal-2); text-underline-offset: 3px; }
a:hover { color: var(--teal); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: #fff; padding: 10px 16px; border-radius: 8px; transition: top .2s; }
.skip:focus { top: 12px; }

/* ---------- Thanh trên ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: 66px; display: flex; align-items: center; gap: 14px;
  padding: 0 22px; background: rgba(251, 248, 241, .94); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--teal), #1d7a86); color: #fff;
  font-weight: 800; letter-spacing: .5px; font-size: 15px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 16px; }
.brand-text small { color: var(--muted); font-size: 12.5px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.top-link {
  padding: 9px 12px; border-radius: 9px; text-decoration: none; color: var(--ink-soft);
  font-size: 14.5px; font-weight: 600; background: none; border: 0;
}
.top-link:hover { background: var(--paper-2); color: var(--teal); }
.top-link.ghost { border: 1px solid var(--line); background: #fff; }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: 8px; }
.menu-btn { display: none; width: 44px; height: 44px; flex-direction: column; justify-content: center; gap: 5px; align-items: center; }
.menu-btn span { display: block; width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }

/* ---------- Khung ---------- */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 66px); }
.sidebar {
  position: sticky; top: 66px; height: calc(100vh - 66px); overflow-y: auto;
  background: var(--sidebar); color: var(--sidebar-ink); padding: 20px 16px 26px;
  display: flex; flex-direction: column; gap: 14px;
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: #2b5259; border-radius: 4px; }
.side-head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 0; }
.progress-wrap { position: relative; width: 48px; height: 48px; flex: none; }
.progress-wrap svg { width: 48px; height: 48px; transform: rotate(-90deg); }
.ring-bg, .ring-fill { fill: none; stroke-width: 5; }
.ring-bg { stroke: #24505a; }
.ring-fill { stroke: #f0b45c; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset .4s; }
.progress-wrap span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.side-head-text { display: flex; flex-direction: column; line-height: 1.35; }
.side-head-text strong { font-size: 13.5px; }
.side-head-text span { font-size: 11.5px; color: var(--sidebar-dim); }
.side-search input {
  width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #2c555d;
  background: #0c2a30; color: #fff; font-size: 14px;
}
.side-search input::placeholder { color: #88a7aa; }
.side-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-group { margin-top: 8px; }
.nav-group-head {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  background: none; border: 0; color: var(--sidebar-dim); font-size: 11.5px; letter-spacing: .9px;
  text-transform: uppercase; font-weight: 700; padding: 8px 8px 6px;
}
.nav-group-head .chev { margin-left: auto; transition: transform .2s; font-size: 12px; }
.nav-group.closed .chev { transform: rotate(-90deg); }
.nav-group.closed .nav-list { display: none; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-item a {
  display: flex; gap: 9px; align-items: flex-start; padding: 9px 10px; border-radius: 9px;
  color: #dce9e7; text-decoration: none; font-size: 14px; line-height: 1.4;
}
.nav-item a:hover { background: #17424a; }
.nav-item.active a { background: #1e5560; color: #fff; box-shadow: inset 3px 0 #f0b45c; }
.nav-item .tick {
  flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
  border: 1.5px solid #4d767c; display: grid; place-items: center; font-size: 11px; color: transparent;
}
.nav-item.done .tick { background: #f0b45c; border-color: #f0b45c; color: #10333a; }
.nav-item .nav-label { flex: 1; }
.nav-item .nav-min { color: #8fb0b2; font-size: 11px; white-space: nowrap; margin-top: 2px; }
.nav-sub { margin: 8px 0 1px; padding: 0 12px; font-size: 9.5px; line-height: 1.4; letter-spacing: .1em; text-transform: uppercase; color: #7fa1a4; font-weight: 700; }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #26505a; font-size: 12.5px; color: var(--sidebar-dim); }
.side-foot a { color: #f0c987; font-weight: 600; }
.side-foot p { margin: 8px 0 0; line-height: 1.55; }

/* ---------- Nội dung ---------- */
main { min-width: 0; padding: 38px clamp(20px, 5vw, 64px) 90px; }
.wrap { max-width: 900px; margin: 0 auto; }
.wrap.wide { max-width: 1080px; }

/* Trang chủ */
.hero {
  background: radial-gradient(120% 160% at 100% 0%, #14606d 0%, #0f3f4a 55%, #0c333c 100%);
  color: #fff; border-radius: 20px; padding: clamp(26px, 5vw, 46px); position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -80px; bottom: -110px; width: 320px; height: 320px;
  border: 40px solid rgba(240, 180, 92, .16); border-radius: 50%;
}
.hero .eyebrow { text-transform: uppercase; letter-spacing: 1.6px; font-size: 12px; color: #f0c987; font-weight: 700; }
.hero h1 { font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; margin: 10px 0 14px; letter-spacing: -.5px; }
.hero p { max-width: 680px; color: #d8e8e7; font-size: 17px; margin: 0 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 650; font-size: 15px; text-decoration: none; background: #fff; color: var(--teal);
}
.btn.primary { background: #f0b45c; color: #2b1b05; }
.btn.primary:hover { background: #f6c67b; }
.btn.outline-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn.outline-light:hover { background: rgba(255,255,255,.1); }
.btn.small { min-height: 38px; padding: 7px 13px; font-size: 14px; }
.btn.ghost { background: #fff; border-color: var(--line); color: var(--ink-soft); }
.btn.ghost:hover { border-color: var(--teal-2); color: var(--teal); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.home-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 30px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat b { display: block; font-size: 24px; color: var(--teal); line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 34px 0 14px; }
.section-head h2 { margin: 0; font-size: 24px; letter-spacing: -.2px; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
.section-head a { font-size: 14.5px; font-weight: 600; white-space: nowrap; }

.track-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.track-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column;
  gap: 8px; transition: transform .15s, box-shadow .15s, border-color .15s;
}
.track-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #cbbfa8; }
.track-card .kicker { font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: var(--amber); }
.track-card h3 { margin: 0; font-size: 20px; }
.track-card p { margin: 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.6; }
.track-card .meta { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.mini-bar { width: 110px; height: 6px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--amber); }

.tool-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tool-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px;
}
.tool-card:hover { border-color: var(--teal-2); }
.tool-card b { font-size: 15.5px; }
.tool-card span { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.tool-card .num { font-size: 12px; font-weight: 800; color: var(--amber); letter-spacing: 1px; }

.start-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; counter-reset: step; }
.step-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 16px 54px; position: relative; }
.step-card::before {
  counter-increment: step; content: counter(step); position: absolute; left: 16px; top: 16px;
  width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.step-card b { display: block; font-size: 15px; margin-bottom: 4px; }
.step-card span { font-size: 13.5px; color: var(--muted); line-height: 1.55; }

.notice {
  margin: 26px 0; padding: 14px 18px; border-radius: 10px; background: var(--amber-soft);
  border: 1px solid #efd3a3; font-size: 14.5px; color: #5b3c10;
}
.notice b { color: #4a3009; }

/* Bài học */
.lesson-head { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 24px; }
.breadcrumb { font-size: 12.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.breadcrumb a { color: var(--teal-2); text-decoration: none; }
.lesson-head h1 { font-size: clamp(27px, 3.6vw, 39px); line-height: 1.18; margin: 0 0 12px; letter-spacing: -.4px; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--teal-soft); color: #0b4a55; font-size: 12.5px; font-weight: 650;
}
.chip.amber { background: var(--amber-soft); color: #7a4205; }
.chip.gray { background: var(--paper-2); color: var(--ink-soft); }

.prose { font-size: var(--read); }
.prose > *:first-child { margin-top: 0; }
.prose h2 { font-size: 1.45em; line-height: 1.3; margin: 2em 0 .6em; padding-top: .2em; color: #123a42; letter-spacing: -.2px; }
.prose h3 { font-size: 1.16em; margin: 1.7em 0 .5em; color: #1a4b53; }
.prose h4 { font-size: 1.02em; margin: 1.3em 0 .4em; color: var(--ink); }
.prose p { margin: .7em 0; }
.prose ul, .prose ol { padding-left: 1.35em; margin: .7em 0; }
.prose li { margin: .34em 0; }
.prose li::marker { color: var(--amber); font-weight: 700; }
.prose strong { color: #102f36; }
.prose blockquote {
  margin: 1.2em 0; padding: 12px 18px; border-left: 4px solid var(--teal-2);
  background: #fff; border-radius: 0 10px 10px 0; color: var(--ink-soft);
}
.prose blockquote p { margin: .3em 0; }
.prose code {
  background: #efe8da; padding: .1em .38em; border-radius: 5px; font-size: .88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #7c3a00;
}
.prose pre {
  background: #122f35; color: #eaf2ef; padding: 16px 18px; border-radius: 10px;
  overflow-x: auto; font-size: 14px; line-height: 1.55;
}
.prose pre code { background: none; color: inherit; padding: 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.table-wrap { overflow-x: auto; margin: 1.1em 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 560px; }
.prose th, .prose td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { background: #f6efe2; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #4b5c5e; }
.prose tr:last-child td { border-bottom: 0; }
.prose a { font-weight: 500; }

.callout {
  margin: 1.4em 0; padding: 16px 18px 16px 20px; border-radius: 10px; background: #fff;
  border: 1px solid var(--line); border-left: 5px solid var(--teal-2); position: relative;
}
.callout .callout-title {
  display: block; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase;
  font-weight: 800; color: var(--teal-2); margin-bottom: 6px;
}
.callout p:first-of-type { margin-top: 0; }
.callout p:last-child { margin-bottom: 0; }
.callout.warn { border-left-color: var(--red); background: #fffaf8; }
.callout.warn .callout-title { color: var(--red); }
.callout.tip { border-left-color: var(--amber); background: #fffdf8; }
.callout.tip .callout-title { color: var(--amber); }
.callout.case { border-left-color: #6b4fa0; background: #fbf9ff; }
.callout.case .callout-title { color: #5a3e91; }
.callout.do { border-left-color: var(--green); background: #f9fdf9; }
.callout.do .callout-title { color: var(--green); }
.callout.story { border-left-color: #a8641f; background: #fff9ef; }
.callout.story .callout-title { color: #8a5318; }
.callout.story p { font-size: 14.5px; line-height: 1.72; }
.callout.story p + p { margin-top: 8px; }

.course-story { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; padding: 16px 18px; margin: 0 0 12px; background: #fff9ef; border: 1px solid #efd9b8; border-radius: 12px; }
.course-story-tag { font-size: 10.5px; letter-spacing: .13em; font-weight: 800; color: #8a5318; padding-top: 3px; }
.course-story h3 { margin: 0 0 5px; font-size: 16px; color: var(--ink); }
.course-story p { margin: 0; font-size: 13.8px; line-height: 1.68; color: var(--ink-soft); }

.quiz { margin: 1.6em 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.quiz-head b { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber); }
.quiz-head span { font-size: 13px; color: var(--muted); }
.q { padding: 12px 0; border-top: 1px dashed var(--line); }
.q:first-of-type { border-top: 0; }
.q-title { font-weight: 650; margin-bottom: 8px; }
.q-opts { display: grid; gap: 7px; }
.q-opt {
  text-align: left; background: #fbf8f1; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 14.5px; line-height: 1.5;
}
.q-opt:hover:not(:disabled) { border-color: var(--teal-2); background: var(--teal-soft); }
.q-opt.correct { background: var(--green-soft); border-color: #7fb08c; }
.q-opt.wrong { background: var(--red-soft); border-color: #d9a49d; }
.q-explain { display: none; margin-top: 8px; padding: 9px 12px; background: #f7f4ec; border-radius: 8px; font-size: 14px; color: var(--ink-soft); }
.q.answered .q-explain { display: block; }
.q.answered .q-opt { cursor: default; }

.checklist { list-style: none; padding: 0; margin: 1em 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; }
.checklist li:hover { background: #fff; }
.checklist input { width: 19px; height: 19px; margin-top: 3px; accent-color: var(--teal-2); flex: none; }
.checklist label { cursor: pointer; }

.lesson-foot { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
.done-row {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px;
}
.done-row label { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; font-size: 15px; }
.done-row input { width: 20px; height: 20px; accent-color: var(--green); }
.prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pn {
  display: flex; flex-direction: column; gap: 2px; padding: 13px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: #fff; text-decoration: none; color: inherit;
}
.pn span { font-size: 12px; color: var(--muted); }
.pn b { font-size: 14.5px; font-weight: 600; }
.pn.next { text-align: right; }
.pn:hover { border-color: var(--teal-2); }

/* Trang công cụ */
.tool-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 22px; }
.tool-tab {
  padding: 9px 13px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
}
.tool-tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
.tool-panel { display: none; }
.tool-panel.active { display: block; }
.tool-intro { background: var(--teal-soft); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; font-size: 15px; color: #17464e; }
.tool-intro p { margin: 0; }
.tool-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 3vw, 26px); }
.tool-box h2 { margin: 0 0 4px; font-size: 24px; }
.tool-box .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13.5px; font-weight: 650; color: var(--ink-soft); }
.field .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid #cfc4ae; border-radius: 9px; padding: 10px 12px;
  background: #fffdf9; font-size: 15px;
}
.field textarea { resize: vertical; min-height: 86px; line-height: 1.55; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--teal-2); outline: 2px solid #bfe0e3; }
.tool-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.tool-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.score-bank { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.score-bank b { font-size: 28px; color: var(--teal); }
.badge-big { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--amber); color: #2b1b05; font-weight: 800; font-size: 14px; }
.domain-row { margin: 10px 0; }
.domain-row .dr-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; margin-bottom: 4px; }
.domain-row .bar { height: 8px; background: var(--paper-2); border-radius: 5px; overflow: hidden; }
.domain-row .bar i { display: block; height: 100%; background: var(--teal-2); }
.q-item { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.q-item:last-child { border-bottom: 0; }
.q-item .qt { font-size: 15px; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 13.5px; cursor: pointer; background: #fbf8f1;
}
.seg label:has(input:checked) { background: var(--teal-soft); border-color: var(--teal-2); font-weight: 650; color: #0d4952; }
.seg input { accent-color: var(--teal-2); }

.scenario { background: #fdf7ec; border: 1px solid #eed8b6; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.scenario .tag { font-size: 11.5px; letter-spacing: 1.2px; font-weight: 800; color: var(--amber); text-transform: uppercase; }
.scenario p { margin: 6px 0; }
.chat { background: #fff; border-radius: 10px; padding: 10px 14px; border: 1px solid #eadfca; margin: 8px 0; font-size: 14.5px; }
.chat b { color: var(--teal); }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; margin: 9px 0; background: #fff; }
.step.ok { border-color: #9bc4a5; background: #f8fdf9; }
.step.no { border-color: #dbb0aa; background: #fff9f8; }
.step h4 { margin: 0 0 6px; font-size: 15px; }
.opt-list { display: grid; gap: 7px; margin-top: 8px; }
.opt-btn {
  text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: #fbf8f1; font-size: 14px;
}
.opt-btn:hover { border-color: var(--teal-2); }
.opt-btn.correct { background: var(--green-soft); border-color: #8ab696; }
.opt-btn.wrong { background: var(--red-soft); border-color: #d6a09a; }
.opt-btn:disabled { cursor: default; }
.feedback { margin-top: 8px; font-size: 14px; padding: 9px 12px; border-radius: 8px; background: #f5f1e8; color: var(--ink-soft); display: none; }
.feedback.show { display: block; }

.order-list { display: grid; gap: 8px; margin: 12px 0; }
.order-slot {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed #cdbfa6;
  border-radius: 9px; background: #fffdf8; min-height: 48px; font-size: 14.5px;
}
.order-slot .idx { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pool button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 11px; font-size: 13.5px; }
.pool button:disabled { opacity: .35; }
.mark { font-weight: 800; }
.mark.ok { color: var(--green); }
.mark.no { color: var(--red); }

.output {
  margin-top: 18px; background: #fcfaf5; border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  white-space: pre-wrap; font-size: 14px; line-height: 1.6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.output.rich { font-family: var(--font); white-space: normal; font-size: 14.5px; }
.output h3 { margin: 0 0 6px; font-size: 18px; }
.output h4 { margin: 14px 0 4px; font-size: 15px; }
.output table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.output th, .output td { border: 1px solid #ddd2bd; padding: 7px 9px; text-align: left; vertical-align: top; }
.output ul { margin: .3em 0; padding-left: 1.2em; }
.hidden { display: none !important; }

.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0; }
.checks label { display: flex; gap: 7px; align-items: flex-start; font-size: 13.5px; padding: 3px 0; }
.checks input { margin-top: 3px; accent-color: var(--teal-2); }
.rule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rule { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13.5px; }
.rule b { display: block; color: var(--teal); margin-bottom: 4px; }

/* Trang in */
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.sheet {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  break-inside: avoid;
}
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet .sheet-kicker { font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.sheet p, .sheet li { font-size: 13px; line-height: 1.55; }
.sheet ol, .sheet ul { padding-left: 18px; margin: 8px 0; }
.sheet .line { border-bottom: 1px solid #c9bda8; height: 22px; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sheet th, .sheet td { border: 1px solid #c9bda8; padding: 6px; text-align: left; vertical-align: top; }
.sheet .big-rule { font-size: 15px; font-weight: 800; color: var(--teal); }
.print-tip { background: var(--amber-soft); border: 1px solid #efd3a3; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 18px; }

.footer-note { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.6; }

.scrim { position: fixed; inset: 0; background: rgba(8, 28, 32, .45); z-index: 35; }

/* ---------- Màn hình nhỏ ---------- */
@media (max-width: 980px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; width: min(330px, 88vw);
    z-index: 50; transform: translateX(-100%); transition: transform .22s ease;
    padding-top: 20px;
  }
  body.nav-open .sidebar { transform: none; }
  .menu-btn { display: flex; }
  .top-actions .top-link { display: none; }
  .top-actions .top-link.ghost { display: inline-flex; }
  main { padding: 26px 18px 80px; }
  .home-stats { grid-template-columns: repeat(2, 1fr); }
  .tool-strip { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .sheet-grid { grid-template-columns: 1fr; }
  .start-steps { grid-template-columns: 1fr; }
  .rule-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .topbar { height: 60px; padding: 0 12px; gap: 8px; }
  .brand-text small { display: none; }
  .top-link { padding: 8px 9px; font-size: 13.5px; }
  .track-grid, .tool-strip { grid-template-columns: 1fr; }
  .prevnext { grid-template-columns: 1fr; }
  .checks { grid-template-columns: 1fr; }
  .quiz { padding: 14px; }
  .prose table { font-size: 13.5px; }
  .hero { border-radius: 14px; }
  .lesson-head h1 { font-size: 27px; }
  .tool-tabs { gap: 6px; }
  .tool-tab { padding: 8px 11px; font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

/* ---------- Kho học liệu & phòng luyện ---------- */
.lib-feature {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, .8fr); gap: 22px; align-items: center;
  margin: 18px 0 26px; padding: 22px 24px; border-radius: 16px; color: #fff;
  background: radial-gradient(120% 160% at 100% 0%, #14606d 0%, #0f3f4a 55%, #0c333c 100%);
}
.lib-feature .kicker { font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #f0c987; font-weight: 800; }
.lib-feature h2 { margin: 6px 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -.3px; }
.lib-feature p { margin: 0 0 10px; color: #d8e8e7; font-size: 14.5px; line-height: 1.6; }
.lib-feature ul { margin: 0 0 14px; padding-left: 20px; color: #e6f0ef; font-size: 13.5px; line-height: 1.6; }
.lib-big { border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); border-radius: 14px; padding: 18px; text-align: center; }
.lib-big b { display: block; font-size: 52px; line-height: 1; color: #f0b45c; }
.lib-big span { display: block; margin-top: 4px; font-size: 13px; color: #d8e8e7; }
.lib-big em { display: block; margin-top: 10px; font-style: normal; font-size: 12.5px; color: #bcd6d4; }
.lib-big strong { color: #fff; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }
.lib-card {
  display: flex; flex-direction: column; gap: 7px; padding: 15px 16px; background: #fff;
  border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.lib-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #c9bba1; color: inherit; }
.lib-num { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.lib-num > span { white-space: nowrap; }
.lib-track-top .chip { white-space: nowrap; }
.lib-card h3 { margin: 2px 0 0; font-size: 16.5px; color: var(--teal); line-height: 1.3; }
.lib-card p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; flex: 1; }
.lib-foot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12px; color: var(--muted); }
.lib-foot b { color: var(--teal); white-space: nowrap; }
.lib-track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 12px; }
.lib-track { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
.lib-track h3 { margin: 2px 0 0; font-size: 17px; }
.lib-track p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; flex: 1; }
.lib-track-foot { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.lib-track-note { font-size: 12px !important; color: var(--muted); padding-top: 2px; }
.lib-track-out { font-size: 12.5px !important; color: var(--ink-soft) !important; border-left: 3px solid var(--amber); padding-left: 9px; }
.lib-track-out b { color: var(--teal); }
.track-card > .mini-bar { width: 100%; margin-top: 8px; }

.course-head .kicker { display: inline-block; margin-bottom: 4px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.course-lead { max-width: 78ch; margin: 6px 0 10px; font-size: 16px; color: var(--ink-soft); line-height: 1.65; }
.course-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
.course-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.course-facts div { padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.course-facts span { display: block; margin-bottom: 5px; font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.course-facts p { margin: 0; font-size: 13.5px; line-height: 1.58; color: var(--ink-soft); }
.course-rule { padding: 13px 16px; margin: 0 0 8px; border-left: 4px solid var(--teal); background: var(--teal-soft, #eef6f5); border-radius: 0 10px 10px 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); }
.course-rule b { color: var(--teal); }
.module-block { margin: 0 0 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); overflow: hidden; }
.module-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 16px 18px; border-bottom: 1px solid var(--line); background: #fff; }
.module-num { display: inline-flex; align-items: center; justify-content: center; min-width: 72px; padding: 6px 9px; border-radius: 999px; background: var(--teal); color: #fff; font-size: 10.5px; letter-spacing: .1em; font-weight: 800; }
.module-head h3 { margin: 0; font-size: 19px; }
.module-head p { margin: 3px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
.session-card { margin: 12px 14px; padding: 15px 16px; background: #fff; border: 1px solid var(--line); border-radius: 13px; }
.session-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.session-tag { flex: none; padding: 5px 9px; border-radius: 6px; background: #fff4e2; color: #8a5a12; font-size: 10.5px; letter-spacing: .1em; font-weight: 800; }
.session-title { min-width: 0; }
.session-title h4 { margin: 0; font-size: 16.5px; line-height: 1.35; }
.session-title span { font-size: 12px; color: var(--muted); }
.io-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px; }
.io-box { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); }
.io-box span { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .13em; font-weight: 800; }
.io-box p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.io-box.in { border-left: 3px solid #6d8fb3; }
.io-box.in span { color: #476b90; }
.io-box.out { border-left: 3px solid var(--green); background: var(--green-soft); }
.io-box.out span { color: #24623a; }
.mat-panel { padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; }
.mat-title { margin-bottom: 5px; font-size: 10px; letter-spacing: .13em; font-weight: 800; color: var(--muted); }
.mat-row { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 7px; align-items: start; margin: 4px 0; }
.mat-row > span { padding-top: 3px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.mat-row > div { display: flex; flex-wrap: wrap; gap: 5px; }
.mat-chip { display: inline-block; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--teal); font-size: 12px; line-height: 1.4; text-decoration: none; }
.mat-chip:hover { border-color: var(--teal); background: #fff; }
.session-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sched-io { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 10px 0 12px; }
.sched-io div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.sched-io b { display: block; margin-bottom: 3px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.sched-io span { font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.lib-principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 8px 0 18px; }
.lib-principles div { padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.lib-principles b { display: block; margin-bottom: 4px; color: var(--teal); font-size: 14.5px; }
.lib-principles span { font-size: 13px; color: var(--ink-soft); line-height: 1.55; }

.prac-progress {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px;
  padding: 16px 18px; margin: 16px 0; background: #fff; border: 1px solid var(--line); border-radius: 14px;
}
.prac-meter b { display: block; font-size: 15px; color: var(--teal); }
.prac-meter span { font-size: 12.5px; color: var(--muted); }
.prac-meter .prac-bar { margin: 8px 0 6px; }
.badge-row { display: flex; flex-wrap: wrap; gap: 7px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); font-size: 12px; }
.badge.on { border-color: var(--green); background: var(--green-soft); color: #1f4d31; font-weight: 600; }
.prac-best { margin-top: 10px; }
.prac-best > b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.prac-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 12px; }
.prac-back { font-size: 13.5px; font-weight: 600; text-decoration: none; }
.prac-bar { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.prac-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-2), var(--amber)); transition: width .25s; }
.game-shell > .prac-bar { margin-bottom: 14px; }
.prac-fb { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--paper-2); font-size: 14px; line-height: 1.55; }
.prac-fb.ok { background: var(--green-soft); }
.prac-fb.bad { background: var(--red-soft); }
.prac-fb p { margin: 5px 0; }
.prac-fb .btn { margin-top: 6px; }
.prac-src { font-size: 12.5px; color: var(--muted); }
.prac-score { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; justify-content: space-between; }
.prac-score > div:first-child b { display: block; font-size: 46px; color: var(--teal); line-height: 1; }
.prac-score > div:first-child span { display: block; margin-top: 4px; font-size: 13.5px; color: var(--muted); }
.prac-score-meta { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.game-shell > p { max-width: 78ch; color: var(--ink-soft); font-size: 14px; }
.prac-wrong { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 20px; }
.prac-wrong article { padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.prac-wrong p { margin: 4px 0; font-size: 14px; line-height: 1.55; }
.prac-wq { font-weight: 600; }
.prac-pick span { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--red); font-weight: 700; margin-right: 4px; }
.prac-ok span { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-right: 4px; }

@media (max-width: 980px) {
  .lib-feature, .prac-progress, .course-facts { grid-template-columns: 1fr; }
  .course-story { grid-template-columns: 1fr; gap: 6px; }
  .lib-principles { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .lib-grid, .lib-track-grid { grid-template-columns: 1fr; }
  .prac-score > div:first-child b { font-size: 36px; }
  .prac-score-meta { justify-content: flex-start; }
  .io-grid, .sched-io { grid-template-columns: 1fr; }
  .module-head { grid-template-columns: auto minmax(0, 1fr); }
  .module-head .chip { grid-column: 1 / -1; justify-self: start; }
  .session-card { margin: 10px; padding: 13px; }
  .mat-row { grid-template-columns: 1fr; gap: 2px; }
  .mat-row > span { padding-top: 0; }
}

/* ---------- In ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; font-size: 11.5pt; }
  .topbar, .sidebar, .scrim, .skip, .no-print, .tool-tabs, .hero-actions, .btn { display: none !important; }
  .shell { display: block; }
  main { padding: 0; }
  .wrap { max-width: none; }
  a { color: inherit; text-decoration: none; }
  .callout, .quiz, .sheet { break-inside: avoid; }
  .sheet { border: 1px solid #999; padding: 14px 16px; }
  .sheet-grid { display: block; }
  .sheet-grid .sheet { margin-bottom: 8mm; }
  .print-tip { display: none; }
  .lesson-head { border: 0; }
  .lesson-foot { display: none; }
}
#printSurface { display: none; }
@media print {
  body.printing-tool .topbar, body.printing-tool .sidebar, body.printing-tool .shell,
  body.printing-tool .scrim, body.printing-tool .skip { display: none !important; }
  body.printing-tool #printSurface { display: block !important; }
  #printSurface .sheet { border: 1px solid #999; margin-bottom: 10mm; }
  #printSurface .sheet-grid { grid-template-columns: 1fr 1fr; }
  #printSurface .sheet.print-flow { break-inside: auto; }
  #printSurface .pack-sheet { padding: 10px 12px; }
  #printSurface .pack-sheet p { line-height: 1.42; }
  #printSurface .pack-sheet table { font-size: 11px; }
  #printSurface .pack-sheet th, #printSurface .pack-sheet td { padding: 4px 5px; }
  #printSurface .pack-sheet h4 { margin: 6px 0 1px; }
  #printSurface .pack-sheet .pack-q { margin: 2px 0 0; font-size: 11.5px; }
  #printSurface .pack-sheet .pack-opts { margin: 0 0 3px; font-size: 10.5px; }
  #printSurface .pack-sheet .pack-mats { margin: 1px 0; font-size: 10.5px; line-height: 1.42; }
  #printSurface .pack-sheet .pack-plan { font-size: 10px; }
  #printSurface .pack-sheet .pack-plan td { vertical-align: top; }
  #printSurface .pack-sheet .pack-small { font-size: 9.5px; color: #555; }
  .sheet h4 { margin: 9px 0 2px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: #0f4c5c; }
  .pack-meta { margin: 2px 0 8px; font-size: 11.5px; color: #555; }
  .pack-q { margin: 4px 0 0; }
  .pack-opts { margin: 0 0 5px; font-size: 11.5px; color: #444; }
  .pack-key { margin: 6px 0 2px; }
}

/* ---------- Giảng viên: lịch, slide, đề, mẫu biểu ---------- */
.sched-note { max-width: 74ch; color: var(--muted); font-size: 15px; line-height: 1.6; }
.print-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
.sched-day { margin: 26px 0 10px; }
.sched-day-head h2 { margin: 0; font-size: 24px; }
.sched-day-head p { margin: 2px 0 14px; color: var(--muted); }
.sched-session { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; break-inside: avoid; }
.sched-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sched-head h3 { margin: 4px 0 0; font-size: 18px; }
.sched-head .kicker { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.sched-head .btn { flex: none; white-space: nowrap; }
.sched-goal { margin: 8px 0 10px; font-size: 14.5px; color: #3b4a48; }
.sched-blocks { display: grid; gap: 6px; }
.sched-block { display: grid; grid-template-columns: 118px 1fr; gap: 10px; padding: 7px 10px; background: #faf7f1; border-radius: 8px; font-size: 14px; }
.sched-block b { font-weight: 600; color: #263b39; }
.sched-block em { display: block; font-style: normal; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.sched-time { font-weight: 700; color: var(--teal); font-size: 13px; }
.sched-links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 12.5px; }
.sched-links > span { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .8px; }
.chip-link { display: inline-block; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 12.5px; }

.trainer-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 26px; }
.trainer-card { display: flex; flex-direction: column; gap: 6px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.trainer-card:hover { border-color: var(--teal); }
.trainer-card .kicker { font-size: 10px; letter-spacing: 1.1px; color: var(--amber); font-weight: 800; }
.trainer-card b { font-size: 15px; color: var(--ink); }
.trainer-card span:last-child { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

.deck-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.deck-card { display: block; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.deck-card:hover { border-color: var(--teal); }
.deck-card .kicker { font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.deck-card h3 { margin: 6px 0 4px; font-size: 18px; }
.deck-card p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.deck-card .meta { font-size: 12.5px; color: var(--teal); font-weight: 700; }

/* Chế độ chiếu */
body.deck-mode { background: #0c2124; }
body.deck-mode .topbar, body.deck-mode .sidebar, body.deck-mode .scrim { display: none !important; }
body.deck-mode .shell { display: block; }
body.deck-mode main { padding: 0; min-height: 100vh; }
.deck { min-height: 100vh; display: flex; flex-direction: column; padding: 18px clamp(16px, 4vw, 64px) 16px; background: radial-gradient(1100px 620px at 18% -10%, #16464c 0%, #0c2124 55%, #08181a 100%); color: #f7f3ea; }
.deck-top { display: flex; justify-content: space-between; gap: 14px; align-items: center; font-size: 12.5px; color: #9db7b3; }
.deck-count { font-variant-numeric: tabular-nums; font-weight: 700; color: #e8b15c; }
.deck-stage { flex: 1; display: flex; align-items: center; padding: 18px 0; cursor: pointer; }
.slide { width: 100%; max-width: 1060px; margin: 0 auto; }
.slide-kicker { display: inline-block; color: #e8b15c; letter-spacing: 2px; font-weight: 800; font-size: 12.5px; text-transform: uppercase; }
.slide h2 { font-size: clamp(28px, 4.2vw, 52px); line-height: 1.14; margin: 10px 0 20px; color: #fffdf7; }
.slide ul { margin: 0; padding-left: 1.15em; display: grid; gap: 12px; }
.slide li { font-size: clamp(16px, 1.65vw, 23px); line-height: 1.45; }
.slide li::marker { color: #e8b15c; }
.slide.cover h2 { font-size: clamp(34px, 5.2vw, 62px); }
.deck-note { min-height: 22px; color: #a9bfbb; font-size: 13.5px; font-style: italic; padding: 6px 0 10px; }
.deck-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,.14); padding-top: 12px; }
.deck-hint { flex: 1; text-align: center; color: rgba(255,255,255,.5); font-size: 12.5px; min-width: 160px; }
.deck .btn { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.22); }
.deck .btn:hover { background: rgba(255,255,255,.16); }
.deck .btn:disabled { opacity: .35; }
.deck .btn.primary { background: #e8b15c; border-color: #e8b15c; color: #1b2a28; }

/* Đáp án */
.ans-body { max-width: 78ch; }
.ans-track-title { margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); font-size: 21px; }
.ans-lesson { margin: 18px 0 6px; font-size: 16.5px; }
.ans { padding: 8px 0 10px; border-bottom: 1px dashed #e8e0d2; }
.ans p { margin: 0 0 4px; font-size: 14.5px; }
.ans-correct { color: #0d7a5f; font-weight: 700; }
.ans-explain { color: var(--muted); font-size: 13.5px !important; }
.muted { color: var(--muted); font-weight: 400; font-size: 13px; }

/* Đề kiểm tra */
.test-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 6px; }
.test-bar label { font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.test-bar select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.saved-line { font-size: 13.5px; color: var(--teal); font-weight: 600; margin: 4px 0 10px; }
.test-list { display: grid; gap: 12px; margin: 10px 0 18px; }
.tq { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tq-title { font-weight: 600; line-height: 1.5; }
.tq-title span { color: var(--amber); font-weight: 800; margin-right: 4px; }
.tq-opts { display: grid; gap: 8px; margin: 10px 0 4px; }
.tq-opt { text-align: left; font: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fbf9f4; cursor: pointer; }
.tq-opt:hover:not(:disabled) { border-color: var(--teal); }
.tq-opt.correct { border-color: #16a34a; background: #ecfdf3; }
.tq-opt.wrong { border-color: #dc2626; background: #fef2f2; }
.tq-explain { display: none; font-size: 13.5px; color: #3b4a48; padding-top: 8px; border-top: 1px dashed #e8e0d2; margin-top: 8px; }
.tq.answered .tq-explain { display: block; }

/* Mẫu biểu */
.form-grid-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
.form-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.form-card .kicker { font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.form-card h3 { margin: 0; font-size: 17px; }
.form-card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.form-card .btn { align-self: flex-start; }
.sign-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; text-align: center; font-size: 13.5px; }
.sign-row em { font-size: 11.5px; color: var(--muted); }
.hotline-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.hotline-row div { border: 1px solid #c9bda8; border-radius: 10px; padding: 10px 12px; text-align: center; }
.hotline-row b { display: block; font-size: 26px; color: var(--teal); }
.hotline-row span { font-size: 12px; color: var(--muted); }
.plain-check { list-style: none; padding-left: 0; margin: 4px 0 12px; }
.plain-check li { font-size: 13.5px; padding: 3px 0; }
.cert-body { border: 3px double #b98b3e; border-radius: 10px; padding: 18px 22px; }
.cert .sign-row { margin-top: 22px; }

/* In slide */
@media print {
  @page deckPage { size: A4 landscape; margin: 10mm; }
  @page certPage { size: A4 landscape; margin: 10mm; }
  .sheet.cert { page: certPage; }
  .sheet.cert .cert-body { min-height: 150mm; display: flex; flex-direction: column; justify-content: center; }
  body.printing-deck { background: #fff !important; }
  body.printing-deck .topbar, body.printing-deck .sidebar, body.printing-deck .shell, body.printing-deck .scrim, body.printing-deck .skip { display: none !important; }
  body.printing-deck #printSurface { display: block !important; color: #111; }
  .print-slide, .print-slide h2, .print-slide li, .print-slide .ps-note { color: #111; }
  .print-slide { page: deckPage; break-after: page; min-height: 168mm; }
  .print-slide:last-child { break-after: auto; }
  .ps-head { display: flex; justify-content: space-between; font-size: 9pt; color: #666; border-bottom: 1px solid #bbb; padding-bottom: 2mm; }
  .print-slide h2 { font-size: 22pt; margin: 4mm 0 3mm; }
  .print-slide ul { margin: 0; padding-left: 6mm; }
  .print-slide li { font-size: 13.5pt; line-height: 1.45; margin-bottom: 2mm; }
  .ps-note { font-size: 10pt; font-style: italic; color: #555; margin-top: 4mm; }
  .print-actions, .deck-controls { display: none !important; }
}
@media (max-width: 980px) {
  .trainer-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .deck-grid, .form-grid-cards { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .trainer-strip { grid-template-columns: 1fr; }
  .sched-head { flex-direction: column; }
  .sched-block { grid-template-columns: 1fr; gap: 2px; }
  .deck-hint { display: none; }
  .deck-controls .btn { flex: 1; white-space: nowrap; padding: 8px 8px; font-size: 13px; }
}

/* Thư viện prompt & kho trò chơi */
.prompt-filters, .game-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 18px; }
.fchip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-soft); }
.fchip:hover { border-color: var(--teal-2); color: var(--teal); }
.fchip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
.prompt-filters select, .game-filters select { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; font-size: 13.5px; }
.prompt-grid, .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.prompt-card, .game-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.prompt-card h3, .game-card h3 { margin: 2px 0 0; font-size: 17px; line-height: 1.35; }
.pc-tags, .gm-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pc-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pc-card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
.pc-card b { display: block; font-size: 10px; letter-spacing: .9px; color: var(--amber); margin-bottom: 3px; }
.pc-out { font-size: 13px; margin: 0; color: var(--ink-soft); }
.pc-out b, .gm-offline b, .gm-priv b { color: var(--ink); }
.pc-warn, .gm-priv { font-size: 12.5px; margin: 0; padding: 7px 10px; border-radius: 8px; background: var(--amber-soft); color: #7a4205; }
.pc-actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.gm-how { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.55; }
.gm-ex { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-soft); }
.gm-ex p { margin: 0; }
.gm-ex b { color: var(--teal-2); }
.gm-offline { font-size: 12.5px; margin: 0; color: var(--ink-soft); }
.tool-tip-note { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px; background: #fff; font-size: 14px; }
.wheel-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 20px; align-items: start; margin: 10px 0 18px; }
.wheel-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.wheel-holder { position: relative; width: min(480px, 88vw); }
.wheel-holder canvas { display: block; width: 100%; height: auto; border-radius: 50%; box-shadow: var(--shadow); transition: transform 4s cubic-bezier(.17, .67, .22, 1); }
.wheel-pin { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid var(--amber); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25)); z-index: 2; }
.wheel-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: center; }
.wheel-controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.wheel-controls select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
.wheel-names { width: min(480px, 92vw); display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.wheel-names textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; resize: vertical; }
.wheel-result { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-height: 220px; }
.wheel-result h3 { margin: 0 0 8px; font-size: 16px; }
.wheel-empty { color: var(--muted); margin: 0; }
.wq { font-size: 16px; line-height: 1.5; margin: 0 0 10px; }
.wq-opts { margin: 0 0 10px; padding-left: 20px; font-size: 14.5px; }
.wq-opts li { margin-bottom: 4px; }
.wq-ans { color: var(--green); font-weight: 700; margin: 6px 0 2px; }
.wq-exp { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.wheel-name { font-size: clamp(24px, 4vw, 38px); font-weight: 800; color: var(--teal); margin: 10px 0; }
@media (max-width: 980px) {
  .prompt-grid, .game-grid { grid-template-columns: 1fr; }
  .wheel-layout { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .pc-cards { grid-template-columns: 1fr; }
}
@media print {
  .ps-block { break-inside: avoid; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px dashed #d8cfba; }
  .ps-block:last-child { border-bottom: 0; margin-bottom: 0; }
  .ps-block p { margin: 2px 0; font-size: 9.5pt; line-height: 1.4; }
  .ps-b-head { font-size: 10.5pt !important; color: #0f4c5c; }
  .ps-b-out { color: #555; }
}

/* ---------- Sân chơi tương tác ---------- */
.arcade-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 4px; }
.arcade-head h2 { margin: 0; font-size: 22px; }
.arcade-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.arcade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 14px; margin: 12px 0 28px; }
.arcade-card {
  display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 14px;
  background: #fff; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s, border-color .15s;
}
.arcade-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #c9bba1; color: inherit; }
.ac-genre { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.ac-name { font-size: 17.5px; font-weight: 800; color: var(--teal); line-height: 1.3; }
.ac-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; flex: 1; }
.ac-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.ac-foot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 12.5px; color: var(--muted); }
.ac-foot b { color: var(--teal); white-space: nowrap; }

.game-lead { color: var(--ink-soft); max-width: 70ch; margin: 14px 0 0; font-size: 15.5px; }
.game-shell { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 18px 0 12px; min-height: 260px; }
.game-note { font-size: 13px; color: var(--ink-soft); background: var(--paper-2); border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; }
.game-note .muted { color: var(--muted); }
.game-setup h3 { margin: 4px 0 12px; font-size: 19px; }
.setup-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.setup-row label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.setup-row select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; min-width: 220px; }
.game-hint { color: var(--muted); font-size: 13.5px; margin: 10px 0 0; }
.game-hud { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
.hud-item { background: var(--paper-2); border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; min-width: 84px; }
.hud-item span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hud-item b { font-size: 18px; color: var(--teal); line-height: 1.2; }
.timerbar { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; margin: 0 0 14px; }
.timerbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal-2), var(--amber)); transition: width 1s linear; }
.sprint-meta { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.sprint-qtext { font-size: 18px; font-weight: 600; margin: 0 0 14px; line-height: 1.45; }
.sprint-opts, .spot-opts { display: flex; flex-direction: column; gap: 8px; }
.opt-btn { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font-size: 15px; line-height: 1.45; }
.opt-btn:hover:not(:disabled) { border-color: var(--teal-2); background: var(--teal-soft); }
.opt-btn.ok { border-color: var(--green); background: var(--green-soft); }
.opt-btn.bad { border-color: var(--red); background: var(--red-soft); }
.opt-btn:disabled { cursor: default; }

.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mem-card {
  min-height: 98px; border: 1px solid var(--line); border-radius: 12px; color: #fff; font-weight: 600;
  font-size: 13.5px; line-height: 1.35; padding: 8px; display: grid; place-items: center; text-align: center;
  background: linear-gradient(150deg, var(--teal), #1d7a86);
}
.mem-card .mem-back { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.mem-card.open { background: #fff; color: var(--ink); border-color: #c9bba1; }
.mem-card.done { background: var(--green-soft); color: #1f4d31; border-color: var(--green); }

.sort-card { max-width: 660px; }
.sort-progress { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sort-text { font-size: 18px; font-weight: 600; margin: 6px 0 16px; line-height: 1.45; }
.bucket-row { display: flex; flex-wrap: wrap; gap: 8px; }
.bucket-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 16px; font-size: 14.5px; }
.bucket-btn:hover:not(:disabled) { border-color: var(--teal-2); background: var(--teal-soft); }
.bucket-btn.right { border-color: var(--green); background: var(--green-soft); }
.bucket-btn.wrong { border-color: var(--red); background: var(--red-soft); }
.sort-feed { margin-top: 14px; border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--paper-2); }
.sort-feed.ok { background: var(--green-soft); }
.sort-feed.bad { background: var(--red-soft); }

.order-title { font-weight: 700; margin: 0 0 10px; }
.seq-line { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
.seq-slot { display: flex; align-items: center; gap: 10px; border: 1px dashed #cbbc9f; background: var(--paper); border-radius: 10px; padding: 9px 12px; text-align: left; }
.seq-slot.filled { border-style: solid; background: #fff; }
.seq-slot.ok { border-color: var(--green); background: var(--green-soft); }
.seq-slot.bad { border-color: var(--red); background: var(--red-soft); }
.seq-num { width: 24px; height: 24px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; }
.seq-empty { color: var(--muted); font-size: 13.5px; }
.pool-label { font-size: 13px; color: var(--muted); margin: 6px 0 8px; }
.seq-pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
.seq-item { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; text-align: left; }
.seq-item:hover { border-color: var(--teal-2); background: var(--teal-soft); }

.spot-text { font-size: 16.5px; background: var(--paper); border-left: 4px solid var(--amber); border-radius: 8px; padding: 12px 14px; margin: 8px 0 14px; line-height: 1.55; }
.spot-ask { font-weight: 600; margin: 0 0 10px; }
.fill-sentence { font-size: 17px; line-height: 2.05; margin: 0 0 16px; }
.blank { border: 0; border-bottom: 2px dashed var(--amber); background: var(--amber-soft); border-radius: 6px; padding: 1px 8px; margin: 0 2px; font-weight: 700; color: #7a4205; font-size: 14.5px; }
.blank.filled { border-bottom-style: solid; }
.wordbank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.word { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.word:hover { border-color: var(--teal-2); background: var(--teal-soft); }

.game-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.game-result { text-align: center; padding: 10px 6px; }
.game-result.small { text-align: left; }
.res-kicker { display: block; font-size: 11px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.res-score { font-size: 52px; line-height: 1.05; color: var(--teal); display: inline-block; margin-top: 4px; }
.res-unit { color: var(--muted); margin-left: 6px; }
.game-result p { color: var(--ink-soft); font-size: 14.5px; }
.miss-list { text-align: left; max-width: 720px; margin: 12px auto 0; font-size: 13.5px; }
.miss-list li { margin-bottom: 6px; }

@media (max-width: 640px) {
  .mem-grid { grid-template-columns: repeat(3, 1fr); }
  .mem-card { min-height: 88px; font-size: 12px; }
  .res-score { font-size: 42px; }
  .game-shell { padding: 14px; }
}

n và khung bài giảng 4 bước","length":"120 phút","input":"Một bài sắp dạy và tài khoản AI hợp pháp; đọc trước bài 1–2.","output":"Một prompt đủ 5 thành phần và khung bài giảng 4 bước đã thử trên lớp.","lessons":["a1-prompt","a2-khbd"],"tools":["prompt","khbd"],"prompts":["p01","p32","p26"],"arcade":["san-loi-prompt"],"forms":["dieu-hanh"],"decks":["b3","b4"]}]},{"id":"ai-th-m2","title":"Đánh giá, học liệu và lớp số","desc":"Kiểm chứng đầu ra AI và chuyển thành học liệu dùng được.","sessions":[{"id":"ai-th-b2","title":"Rubric, học liệu số và kế hoạch lớp số","length":"120 phút","input":"Một đề kiểm tra hoặc rubric hiện có; một học liệu số định dùng.","output":"Rubric 3 tiêu chí, một học liệu số ghi đủ nguồn và kế hoạch lớp số 8 tuần.","lessons":["a3-danh-gia","a4-hoc-lieu","a5-lop-so"],"tools":["khbd","plan"],"prompts":["p03","p31","p32"],"arcade":["dua-trac-nghiem","dien-tu-con-thieu"],"forms":["de-12","phan-hoi"],"decks":[]}]}],"story":{"title":"Chiếc USB bốn mươi giáo án","text":"Một cô giáo trẻ mang USB đến tập huấn, trong đó có bốn mươi giáo án tự soạn. Cô nói: “Em không thiếu ý tưởng, em thiếu thời gian.” Ba ngày sau, cô mang về một quy trình: giao việc cho AI, đọc, kiểm, sửa. Cô vẫn dạy bốn mươi giáo án ấy, nhưng mỗi tối bớt được một giờ để soạn câu hỏi cho học sinh yếu."}},{"id":"tieu-hoc","audience":"Giáo viên tiểu học và tổ trưởng chuyên môn cấp tiểu học.","prerequisite":"Có chương trình môn học và một bài sắp dạy ở tiểu học.","outcome":"Mã hóa bài học theo hai khung, tổ chức một chuyên đề và hoàn thành kế hoạch bài dạy đạt rubric 8 tiêu chí.","modules":[{"id":"tieu-hoc-m1","title":"Hai khung và chuyên đề","desc":"Chọn đúng chỗ tích hợp trong chương trình tiểu học.","sessions":[{"id":"tieu-hoc-b1","title":"Hai khung tích hợp và chuyên đề dạy học","length":"90 phút","input":"Chương trình môn học và một bài sắp dạy ở tiểu học; đọc trước bài 1–2.","output":"Bảng mã hóa một bài theo hai khung và một chuyên đề chọn triển khai.","lessons":["t1-hai-khung","t2-chuy ông hỏi vì sao","text":"Một cô dạy Sử THCS kể: học sinh thuộc bài rất nhanh, nhưng hỏi “vì sao” thì im. Cô thử cho các em kiểm chứng một bài đăng mạng về lịch sử. Cả lớp tranh nhau nói. Khóa KHXH THCS bắt đầu từ khoảnh khắc ấy: kiến thức chỉ sống khi học sinh được chất vấn."}},{"id":"thcs-tn","audience":"Giáo viên Toán, KHTN, Tin học và Công nghệ cấp THCS.","prerequisite":"Có một bài sắp dạy thuộc các môn tự nhiên.","outcome":"Dạy một bài 4C có mô phỏng hoặc bảng tính, rubric 3 mức và lập kế hoạch chuẩn hóa học liệu số.","modules":[{"id":"thcs-tn-m1","title":"Bài dạy 4C cho môn tự nhiên","desc":"Mô hình hóa, thí nghiệm và dữ liệu không cần thiết bị đắt tiền.","sessions":[{"id":"thcs-tn-b1","title":"Bài dạy 4C, mô phỏng và bảng tính","length":"120 phút","input":"Một bài Toán, KHTN, Tin học hoặc Công nghệ sắp dạy; số liệu hay mô phỏng dự kiến.","output":"Kế hoạch bài dạy 4C có mô phỏng hoặc bảng tính, rubric 3 mức.","lessons":["tn1-dac-thu","tn2-khbd"],"tools":["khbd","prompt"],"prompts":["p16","p18","p20","p21"],"arcade":["dien-tu-con-thieu"],"forms":["dieu-hanh"],"decks":["b4"]}]},{"id":"thcs-tn-m2","title":"Kế hoạch tổ 4 tuần","desc":"Chuẩn hóa kho học liệu số và đo được tiến bộ.","sessions":[{"id":"thcs-tn-b2","title":"Kế hoạch tổ và kho học liệu số","length":"90 phút","input":"Mục tiêu tổ và kho học liệu số hiện có.","output":"Kế hoạch 4 tuần chuẩn hóa kho học liệu số, kèm bộ chỉ số.","lessons":["tn3-ke-hoach"],"tools":["plan"],"prompts":["p17","p18"],"arcade":["phan-loai-vao-gio"],"forms":["bien-ban"],"decks":["b5"]}]}],"story":{"title":"Một bộ thí nghiệm, tám lớp học","text":"Thầy dạy Lý ở trường chỉ có một bộ thí nghiệm. Thầy nói: “Tôi dạy tám lớp, mỗi lớp bốn mươi lăm phút, không kịp.” Khóa KHTN THCS không hứa có thêm thiết bị; khóa giúp thầy chọn đúng chỗ dùng mô phỏng, đúng chỗ phải chạm vật thật, để bốn mươi lăm phút không trôi."}},{"id":"thpt-xh","audience":"Giáo viên Ngữ văn, Lịch sử, Địa lí, GDKT&PL, HĐTN – HN cấp THPT.","prerequisite":"Có một bài sắp d
