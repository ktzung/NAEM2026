:"QUY TRÌNH 60 PHÚT","t":"Làm theo năm bước","b":["1. Chốt yêu cầu cần đạt bằng một câu","2. Viết Context và Challenge trước","3. Viết Concept và Conclusion sau","4. Gắn mã năng lực, ATM, rubric","5. Kiểm tra phương án không thiết bị"]},{"k":"CÔNG CỤ","t":"Dùng KHBD 4C để chuẩn hóa","b":["Chọn môn, lớp, bài, thời lượng","Chọn mã năng lực và chủ đề ATM từ danh sách","Điền bốn ô; xuất và in bản nộp"],"n":"Công cụ chỉ tạo khung. Nội dung chuyên môn vẫn do giáo viên viết."},{"k":"RUBRIC","t":"Ba mức, ba tiêu chí","b":["Kiểm chứng thông tin: chưa – đúng quy trình – biết phản biện","Ứng xử số và dữ liệu: chưa – an toàn – chủ động bảo vệ","Sản phẩm và bản quyền: chưa – có ghi nguồn – sáng tạo có trách nhiệm"]},{"k":"SÁU LỖI","t":"Lỗi thường gặp khi soạn","b":["Nhồi ba công cụ vào một tiết","Ghi mã cho đủ chỗ nhưng không gắn hoạt động","Hoạt động 2 chiếm quá 25 phút","Không có phương án khi mất mạng","Rubric chung chung, không quan sát được","Dùng dữ liệu học sinh thật trong ví dụ"]},{"k":"CHẤM CHÉO","t":"Năm tiêu chí, thang 2 điểm","b":["Đúng yêu cầu cần đạt","Bốn hoạt động khớp 4C và đủ phút","Mã năng lực và ATM đúng địa chỉ","Rubric quan sát được","Phương án không thiết bị giữ được mục tiêu"]},{"k":"TRÌNH BÀY","t":"Hai phút mỗi nhóm","b":["Một câu yêu cầu cần đạt","Một hoạt động đáng kể nhất","Một chỗ đã sửa sau khi chấm chéo"]},{"k":"NỘP BÀI","t":"Sản phẩm cuối buổi","b":["Bản in kế hoạch bài dạy","Rubric đã điền thử cho một sản phẩm học sinh","Ghi chú phương án không thiết bị"]},{"k":"BUỔI TIẾP","t":"Buổi 5: từ một tiết đến cả tổ","b":["PDCA bốn tuần, RACI, năm vùng KPI","Thư mục minh chứng","Mang theo kế hoạch bài dạy vừa hoàn thành"]}]},{"id":"b5","label":"Buổi 5","day":"Ngày 3 · Sáng","title":"Kế hoạch tổ chuyên môn 4 tuần","subtitle":"PDCA – RACI – KPI – minh chứng","slides":[{"k":"BUỔI 5 · NGÀY 3 · SÁNG","t":"Kế hoạch tổ chuyên môn 4 tuần","b":["120 phút","Sản phẩm: kế hoạch tổ bốn tuần, bản in"]},{"k":"NĂM BƯỚC","t":"Từ một tiết đến cả tổ","b":["Chọn một tiết làm mẫu, không chọn mười bài","Dạy thử, ghi ba điểm vướng","Điều chỉnh học liệu","Chia sẻ cho tổ, cùng dạy lại","Đo bằng sản phẩm học sinh"]},{"k":"PDCA","t":"Bốn tuần, bốn việc","b":["Tuần 1 – Plan: chọn một bài, chốt mục tiêu SMART","Tuần 2 – Do: dạy thử, ghi lỗi kỹ thuật và lỗi học tập","Tuần 3 – Check: so sánh dự đoán với kết quả, thu minh chứng","Tuần 4 – Act: chuẩn hóa thành quy trình của tổ"]},{"k":"SMART","t":"Mục tiêu viết được, đo được","b":["Ví dụ: “Đến 30/4, 100% giáo viên tổ Văn có một kế hoạch bài dạy 4C được duyệt”","Có mốc thời gian, số lượng, bằng chứng","Không viết: “đẩy mạnh chuyển đổi số trong tổ”"]},{"k":"RACI","t":"Ai làm, ai chịu trách nhiệm","b":["R – người thực hiện","A – người chịu trách nhiệm cuối","C – người được hỏi ý kiến","I – người được thông báo"],"n":"Mỗi việc chỉ có một chữ A. Nhiều chữ A là không ai chịu trách nhiệm."},{"k":"NĂM VÙNG KPI","t":"Không quá ba chỉ số mỗi vùng trong 30 ngày","b":["Hồ sơ dạy học: số bài có kế hoạch 4C được duyệt","Giờ dạy: số tiết có ít nhất một hoạt động số","Học sinh: tỉ lệ nộp sản phẩm đúng hạn","An toàn dữ liệu: số tệp dữ liệu cá nhân ngoài nơi cho phép (mục tiêu 0)","Chia sẻ chuyên môn: số lượt chia sẻ trong sinh hoạt tổ"]},{"k":"MINH CHỨNG","t":"Thư mục bằng chứng","b":["01-kế hoạch: kế hoạch tổ, phân công","02-bài dạy: kế hoạch bài dạy, học liệu, ảnh tiết dạy","03-sản phẩm học sinh: ảnh, tệp, phiếu chấm","04-biên bản: sinh hoạt tổ, góp ý, điều chỉnh","05-tự đánh giá: phiếu 12 câu đầu vào – đầu ra"]},{"k":"THỰC HÀNH 30 PHÚT","t":"Điền mẫu kế hoạch in","b":["Điền PDCA bốn tuần cho tổ của bạn","Phân công RACI cho năm việc chính","Chọn ba chỉ số đo được ngay trong 30 ngày"]},{"k":"CHẤM CHÉO","t":"Bốn câu hỏi","b":["Mục tiêu có số và mốc thời gian chưa?","Mỗi việc có đúng một chữ A chưa?","Chỉ số có dữ liệu sẵn để đo chưa?","Minh chứng nằm ở đâu, ai giữ?"]},{"k":"BUỔI TIẾP","t":"Buổi 6: đo tiến bộ và duy trì","b":["Kiểm tra đầu ra 12 câu","Trình bày sản phẩm tổ","Cam kết 30 ngày"]}]},{"id":"b6","label":"Buổi 6","day":"Ngày 3 · Chiều","title":"Tổng kết: trình bày, đo tiến bộ và duy trì","subtitle":"Đo trước – sau bằng cùng một đề, chốt cam kết 30 ngày","slides":[{"k":"BUỔI 6 · NGÀY 3 · CHIỀU","t":"Tổng kết và duy trì","b":["150 phút","Sản phẩm: điểm đầu ra, sản phẩm tổ, cam kết 30 ngày"]},{"k":"CHƯƠNG TRÌNH BUỔI","t":"Năm phần","b":["Kiểm tra đầu ra 12 câu","Trình bày sản phẩm tổ","Đánh giá theo rubric tổng hợp","Cam kết 30 ngày và cộng đồng thực hành","Hỏi đáp, phiếu phản hồi, chứng nhận"]},{"k":"ĐO TIẾN BỘ","t":"Cùng một đề, hai thời điểm","b":["Làm lại đúng 12 câu của buổi 1","So sánh điểm đầu vào – đầu ra","Mục tiêu thực tế: tăng ít nhất 2 câu"]},{"k":"TRÌNH BÀY","t":"Năm phút mỗi tổ","b":["Một sản phẩm học sinh","Một kế hoạch bài dạy đã dạy thử","Một bài học: điều gì hiệu quả, điều gì bỏ"]},{"k":"RUBRIC TỔNG HỢP","t":"Bốn tiêu chí","b":["Đúng căn cứ: mã năng lực, ATM, khung 5512","Khả thi: làm được với hạ tầng hiện có","An toàn: dữ liệu, tâm lý, bản quyền","Lan tỏa: tổ khác dùng lại được"]},{"k":"CAM KẾT 30 NGÀY","t":"Ba việc, một mốc","b":["Dạy lại một bài 4C có ghi mã và ATM","Đưa một hoạt động vào sinh hoạt tổ","Lưu minh chứng vào thư mục chung"],"n":"Mỗi học viên ghi ba việc và mốc ngày cụ thể; tổ trưởng giữ bản tổng hợp."},{"k":"DUY TRÌ","t":"Cộng đồng thực hành","b":["Kho học liệu chung của tổ, một nơi duy nhất","Lịch sinh hoạt: mỗi tháng một sản phẩm mới","Người phụ trách luân phiên, có biên bản"]},{"k":"HỖ TRỢ","t":"Đầu mối khi cần","b":["An toàn số của trường: hiệu phó hoặc tổ tư vấn tâm lý","111 – bảo vệ trẻ em, miễn phí 24/7","113 – công an khẩn cấp","Điền số đầu mối của Sở và nhà trường vào thẻ in"]},{"k":"PHẢN HỒI","t":"Phiếu cuối khóa","b":["Tám tiêu chí thang 1–5","Ba câu mở: giữ gì, bỏ gì, cần thêm gì","Dùng dữ liệu tổng hợp để điều chỉnh khóa sau"]},{"k":"KẾT","t":"Ba câu chốt","b":["Dạy để dùng được, không chỉ để biết.","Một tiết làm mẫu, một tổ cùng làm, một thư mục minh chứng.","Công nghệ là phương tiện; an toàn và trách nhiệm là điều kiện."]}]}]},"prompts":{"title":"Thư viện prompt mẫu","note":"Mỗi prompt viết theo cấu trúc 4 thẻ của bài AI có trách nhiệm: Ngữ cảnh – Dữ liệu – Hướng dẫn – Kiểm chứng. Chép nguyên văn rồi thay phần trong ngoặc vuông bằng thông tin thật của bạn. Tuyệt đối không dán họ tên, số định danh, điểm số, ảnh riêng tư của học sinh vào công cụ AI công cộng.","purposes":[{"id":"soan","label":"Soạn & thiết kế"},{"id":"day","label":"Tổ chức dạy học"},{"id":"danh-gia","label":"Kiểm tra – đánh giá"},{"id":"an-toan","label":"An toàn & phản hồi"}],"subjects":[{"id":"chung","label":"Dùng chung"},{"id":"van","label":"Ngữ văn"},{"id":"sudia","label":"Lịch sử & Địa lí"},{"id":"gdcd","label":"GDCD · HĐTN"},{"id":"toan","label":"Toán"},{"id":"khtn","label":"Vật lí · Hóa · Sinh"},{"id":"tin","label":"Tin học"},{"id":"ta","label":"Tiếng Anh"},{"id":"tieu-hoc","label":"Tiểu học"},{"id":"mam-non","label":"Mầm non"}],"prompts":[{"id":"p01","purpose":"soan","subject":"chung","level":"THCS · THPT","title":"Khung kế hoạch bài dạy 45 phút theo 4C","context":"Bạn là giáo viên [môn] dạy lớp [lớp] tại một trường [THCS/THPT] ở Nghệ An. Tiết học 45 phút, sĩ số [số] học sinh, [có/không có] thiết bị số cho học sinh.","data":"Bài [tên bài] trong SGK hiện hành. Yêu cầu cần đạt: [chép nguyên văn 1–2 yêu cầu]. Mã năng lực số dự kiến: [mã, ví dụ 1.2.TC2a]. Chủ đề an toàn mạng liên quan: [ATM, nếu có].","guide":"Lập khung kế hoạch theo bốn hoạt động của CV 5512: Mở đầu – Hình thành kiến thức – Luyện tập – Vận dụng. Mỗi hoạt động ghi rõ mục tiêu, sản phẩm học tập, cách tổ chức và thời lượng cộng lại đúng 45 phút. Dùng mô hình 4C (Context – Challenge – Concept – Conclusion) để dẫn dắt phần hình thành kiến thức. Thêm một phương án thay thế cho lớp không có thiết bị.","check":"Sau khi viết, chỉ ra: (1) chỗ nào chưa khớp với yêu cầu cần đạt đã chép; (2) chỗ nào bạn tự suy diễn ngoài SGK; (3) ba việc giáo viên phải kiểm tra lại trước khi dạy thật.","out":"Bảng kế hoạch một trang, cột thời lượng khớp 45 phút, kèm danh sách thiết bị và phương án không thiết bị.","warn":"Không đưa tên học sinh hoặc điểm số vào prompt. Đối chiếu lại mã năng lực với bảng ma trận của bộ tài liệu NAEM trước khi nộp hồ sơ."},{"id":"p02","purpose":"soan","subject":"chung","level":"THCS · THPT","title":"Ngân hàng 12 câu hỏi phân hóa ba mức","context":"Bạn là giáo viên [môn] lớp [lớp]. Cần bộ câu hỏi dùng cho phần luyện tập trong tiết [tên bài], thời lượng 10 phút.","data":"Nội dung cốt lõi đã dạy: [3–5 gạch đầu dòng]. Các lỗi học sinh hay mắc: [liệt kê nếu biết]. Trình độ lớp: [đại đa số ở mức nào].","guide":"Viết 12 câu trắc nghiệm một đáp án đúng: 4 câu nhận biết, 4 câu thông hiểu, 4 câu vận dụng. Phương án nhiễu phải lấy từ lỗi sai thường gặp, không phải phương án vô nghĩa. Mỗi câu có đáp án và một dòng giải thích ngắn.","check":"Đánh dấu rõ câu nào bạn chưa chắc chắn về nội dung, câu nào có thể gây tranh cãi, và câu nào cần giáo viên đối chiếu SGK trước khi dùng.","out":"Bảng 12 câu: nội dung, 3 phương án, đáp án, giải thích, mức độ.","warn":"AI thường viết câu hỏi đúng ngữ pháp nhưng sai kiến thức. Giáo viên tự làm lại toàn bộ 12 câu trước khi phát."},{"id":"p03","purpose":"danh-gia","subject":"chung","level":"THCS · THPT","title":"Rubric ba mức cho sản phẩm học sinh","context":"Bạn là giáo viên [môn] lớp [lớp]. Học sinh nộp sản phẩm [bài viết / sơ đồ / video ngắn / bài trình bày] cho bài [tên bài].","data":"Yêu cầu của sản phẩm: [3–4 yêu cầu]. Trọng tâm đánh giá: [nội dung, quy trình, an toàn dữ liệu, bản quyền, hợp tác].","guide":"Lập rubric 4 tiêu chí, mỗi tiêu chí ba mức: Mức 1 – Khởi đầu, Mức 2 – Đạt, Mức 3 – Tốt. Mô tả mỗi mức bằng hành vi quan sát được, không dùng từ chung chung như “tốt”, “hay”. Thêm cột ghi chú bằng chứng giáo viên cần thu.","check":"Chỉ ra tiêu chí nào dễ chấm cảm tính, tiêu chí nào có thể bị hiểu khác nhau giữa hai giáo viên, và đề xuất cách làm rõ.","out":"Bảng rubric 4 × 3 ô + hướng dẫn chấm 5 dòng.","warn":"Không đưa bài làm thật kèm tên học sinh vào công cụ công cộng; nếu cần phân tích, xóa tên và chi tiết nhận dạng trước."},{"id":"p04","purpose":"danh-gia","subject":"chung","level":"THCS · THPT","title":"Nhận xét bài làm theo mẫu 2 khen – 1 góp ý","context":"Bạn là giáo viên [môn] lớp [lớp]. Cần viết nhận xét ngắn cho một bài làm đã ẩn danh, đủ cụ thể để học sinh biết sửa gì.","data":"Trích đoạn bài làm: [dán đoạn đã xóa tên và chi tiết nhận dạng]. Tiêu chí chấm: [2–3 tiêu chí]. Điểm hiện tại: [mức].","guide":"Viết nhận xét theo cấu trúc: hai điều làm tốt (trích dẫn câu cụ thể), một điều cần sửa (chỉ đúng vị trí), một câu hỏi gợi mở để học sinh tự sửa. Giọng khích lệ, không so sánh với học sinh khác, không viết lại hộ đoạn văn.","check":"Đánh dấu câu nào là suy đoán của bạn về ý học sinh, câu nào dựa trên bằng chứng trong bài; ghi rõ chỗ nào cần đọc cả bài mới kết luận được.","out":"Đoạn nhận xét 4–5 câu, kèm một câu hỏi gợi mở cho học sinh.","warn":"Nhận xét của AI chỉ là bản nháp. Giáo viên đọc lại và chịu trách nhiệm về từng câu trước khi gửi phụ huynh hoặc ghi học bạ."},{"id":"p05","purpose":"an-toan","subject":"chung","level":"Mọi cấp","title":"Kiểm chứng một tin đang lan trong nhóm lớp","context":"Bạn là giáo viên chủ nhiệm. Một thông tin [về lịch nghỉ học / về an toàn / về sức khỏe] đang lan trong nhóm Zalo của lớp và phụ huynh hoang mang.","data":"Nội dung tin: [chép nguyên văn phần đáng ngờ, không kèm số điện thoại hay tên người]. Nguồn xuất hiện: [nhóm chat / mạng xã hội / ảnh chụp màn hình]. Thời điểm: [ngày].","guide":"Áp dụng quy trình SIFT: Dừng lại – Điều tra nguồn – Tìm nguồn tốt hơn – Truy vết. Với mỗi bước, nêu việc cần làm và bằng chứng cần thu. Đề xuất ba nguồn chính thống để đối chiếu (cổng thông tin của trường, cơ quan chức năng, báo chí chính thống).","check":"Phân biệt rõ đâu là sự kiện có bằng chứng, đâu là giả định của bạn; nêu những điểm chưa thể kết luận và cách xác nhận với người có trách nhiệm.","out":"Phiếu bốn ô SIFT đã điền + một tin nhắn ngắn gửi phụ huynh (3–4 câu, bình tĩnh, có đầu mối hỏi).","warn":"Không chuyển tiếp tin gốc khi chưa kiểm chứng; không nêu tên học sinh hay phụ huynh liên quan."},{"id":"p06","purpose":"an-toan","subject":"chung","level":"THCS · THPT","title":"Thông báo phụ huynh về một sự cố an toàn mạng","context":"Bạn là giáo viên chủ nhiệm lớp [lớp], cần thông báo cho phụ huynh về một sự cố an toàn mạng vừa xảy ra trong lớp ở mức [1/2/3].","data":"Mô tả sự cố ở dạng ẩn danh: [loại sự cố, không tên, không ảnh]. Việc nhà trường đã làm: [các bước]. Đầu mối hỗ trợ: [giáo viên, tổ tư vấn, số 111/113].","guide":"Soạn thông báo 6–8 câu: chuyện gì đã xảy ra – nhà trường đã xử lý thế nào – phụ huynh cần làm gì – liên hệ ai. Giọng bình tĩnh, không đổ lỗi, không mô tả chi tiết gây hoang mang, không tiết lộ thông tin của học sinh.","check":"Bỏ mọi câu khẳng định chưa có căn cứ; đánh dấu chỗ cần ban giám hiệu duyệt trước khi gửi; kiểm tra lại số điện thoại và đầu mối.","out":"Bản tin nhắn dưới 200 chữ, gửi được qua Zalo/SMS, kèm bản dài hơn để đọc trong cuộc họp phụ huynh.","warn":"Với mức 3 (dụ dỗ, tống tiền, ảnh nhạy cảm), không tự xử lý và không thông báo đại trà: báo ban giám hiệu, gọi 111 hoặc 113 theo quy trình."},{"id":"p07","purpose":"day","subject":"chung","level":"THCS · THPT","title":"Ba tình huống mở đầu tạo nhu cầu học","context":"Bạn là giáo viên [môn] lớp [lớp], cần 5–7 phút mở đầu cho bài [tên bài] mà không dùng bài giảng điện tử cầu kỳ.","data":"Nội dung cốt lõi của bài: [3 gạch đầu dòng]. Đặc điểm học sinh: [vùng miền, hứng thú, khó khăn].","guide":"Viết ba tình huống rất gần đời sống học sinh Nghệ An, mỗi tình huống kèm một câu hỏi dẫn dắt và dự đoán hai câu trả lời sai phổ biến. Không dùng tên người thật. Chỉ ra tình huống nào dẫn tự nhiên nhất vào bài.","check":"Chỉ rõ dự đoán nào của bạn là suy đoán; đề xuất cách giáo viên thử nhanh với một nhóm học sinh trước khi dạy đại trà.","out":"Ba tình huống 2–3 câu + câu hỏi dẫn dắt + cách chuyển vào bài.","warn":"Tình huống nhạy cảm (bạo lực, gia đình, tiền bạc) phải trung tính và không nhắm vào học sinh cụ thể."},{"id":"p08","purpose":"day","subject":"van","level":"THCS · THPT","title":"Dàn ý đọc hiểu ba tầng cho một văn bản","context":"Bạn là giáo viên Ngữ văn lớp [lớp]. Chuẩn bị dạy đọc hiểu văn bản [tên văn bản] trong SGK hiện hành, thời lượng [số] phút.","data":"Yêu cầu cần đạt: [chép nguyên văn]. Đặc điểm học sinh: [mức đọc hiểu chung]. Ngữ liệu ngoài SGK được phép dùng: [có/không].","guide":"Lập dàn ý đọc hiểu ba tầng: phát hiện (dữ kiện trong văn bản) – suy luận (ý nghĩa, mạch cảm xúc) – đánh giá (thái độ, liên hệ). Mỗi tầng 3 câu hỏi, câu nào cũng phải chỉ ra chỗ cần dẫn chứng từ ngữ liệu. Thêm một hoạt động viết 5 phút.","check":"Đánh dấu câu hỏi nào có thể hiểu sai nếu không đọc kỹ ngữ liệu; kiểm tra lại mọi trích dẫn thơ văn bạn đưa ra có đúng nguyên văn không.","out":"Dàn ý một trang: ba tầng câu hỏi, dẫn chứng dự kiến, hoạt động viết ngắn.","warn":"AI hay trích sai thơ và nhầm tác giả – giáo viên đối chiếu SGK từng câu trích."},{"id":"p09","purpose":"danh-gia","subject":"van","level":"THCS · THPT","title":"Nhận xét bài văn nghị luận theo ba tiêu chí","context":"Bạn là giáo viên Ngữ văn lớp [lớp], chấm bài nghị luận [xã hội / văn học] của học sinh theo yêu cầu: [tóm tắt yêu cầu].","data":"Bài làm đã ẩn danh: [dán bài hoặc đoạn]. Rubric của trường: [nội dung – lập luận – diễn đạt, nếu có].","guide":"Nhận xét theo ba tiêu chí, mỗi tiêu chí tối đa hai câu, kèm trích dẫn câu trong bài làm. Chỉ ra lỗi lập luận (luận điểm không được chứng minh, dẫn chứng lạc đề) thay vì sửa câu chữ. Đề xuất một việc học sinh làm để bài sau tốt hơn.","check":"Ghi rõ chỗ nào cần đọc cả bài mới kết luận; không viết hộ đoạn văn; không đưa ra điểm số cuối cùng.","out":"Phiếu nhận xét 3 tiêu chí + 1 việc cần làm + 1 câu hỏi cho học sinh.","warn":"Không dán bài làm có tên, lớp, trường của học sinh lên công cụ AI công cộng."},{"id":"p10","purpose":"day","subject":"van","level":"THCS · THPT","title":"Hoạt động nói – nghe: tranh luận 15 phút","context":"Bạn là giáo viên Ngữ văn lớp [lớp], cần hoạt động nói – nghe 15 phút gắn với bài [tên bài], lớp [có/không có] thiết bị.","data":"Chủ đề tranh luận: [chủ đề]. Số học sinh: [số]. Tiêu chí đánh giá nói – nghe của chương trình: [2–3 ý].","guide":"Thiết kế tranh luận hai phe với ba luận điểm mỗi bên, phiếu quan sát cho người nghe (bắt buộc ghi một ý tán thành, một ý phản biện), và câu hỏi chốt của giáo viên. Thời gian chia rõ: chuẩn bị 3 phút – tranh luận 8 phút – phản hồi 4 phút.","check":"Chỉ ra chỗ nào kịch bản có thể thiên vị một phe; đề xuất cách giữ cân bằng; kiểm tra chủ đề có phù hợp lứa tuổi không.","out":"Kịch bản 15 phút + phiếu quan sát in được + tiêu chí chấm nhanh.","warn":"Không đưa chủ đề nhạy cảm cá nhân (gia đình, giới tính, tôn giáo) vào tranh luận đại trà."},{"id":"p11","purpose":"soan","subject":"sudia","level":"THCS · THPT","title":"Khai thác một bản đồ hoặc tư liệu số thành hoạt động học","context":"Bạn là giáo viên Lịch sử và Địa lí lớp [lớp], có một [bản đồ / bảng số liệu / ảnh tư liệu] muốn dùng cho bài [tên bài].","data":"Mô tả tư liệu: [loại, nội dung chính, nguồn, năm]. Yêu cầu cần đạt: [chép]. Thời lượng dành cho hoạt động: [số] phút.","guide":"Thiết kế hoạt động đọc tư liệu theo ba mức: đọc thông tin trực tiếp – so sánh, giải thích – nhận xét, liên hệ. Mỗi mức 2 câu hỏi, câu nào cũng yêu cầu học sinh chỉ vị trí hoặc số liệu trên tư liệu. Thêm một câu hỏi về giới hạn của tư liệu.","check":"Chỉ ra thông tin nào bạn suy ra ngoài tư liệu; nhắc rõ giáo viên phải kiểm tra nguồn, năm và đơn vị trước khi dạy.","out":"Phiếu học tập 6 câu theo ba mức + đáp án dự kiến.","warn":"AI có thể bịa số liệu và mốc thời gian. Mọi con số phải lấy từ tư liệu gốc hoặc atlat, không lấy từ câu trả lời AI."},{"id":"p12","purpose":"day","subject":"sudia","level":"THCS · THPT","title":"Tranh luận lịch sử có kiểm chứng nguồn","context":"Bạn là giáo viên Lịch sử lớp [lớp], chuẩn bị hoạt động tranh luận về [sự kiện / nhân vật / chính sách] trong bài [tên bài].","data":"Hai luận điểm đối lập dự kiến: [A] và [B]. Nguồn học sinh được dùng: SGK, tư liệu trong bài, [nguồn khác nếu có].","guide":"Xây dựng hai phe với bằng chứng lấy từ nguồn được phép, mỗi bằng chứng ghi rõ nguồn và năm. Thêm bảng phân biệt sự kiện – ý kiến – suy đoán. Tiêu chí chấm: bằng chứng, logic, tôn trọng người nghe.","check":"Đánh dấu luận điểm nào dễ bị hiểu thành áp đặt chính trị; kiểm tra mọi mốc thời gian; chỉ rõ chỗ cần giáo viên cung cấp thêm tư liệu.","out":"Kịch bản tranh luận + bảng bằng chứng + rubric chấm nói.","warn":"Không để học sinh tra cứu tự do trên mạng trong lớp mà không có danh sách nguồn; không đưa nội dung chưa kiểm chứng vào kết luận."},{"id":"p13","purpose":"danh-gia","subject":"sudia","level":"THPT","title":"Câu hỏi địa lí địa phương Nghệ An có số liệu","context":"Bạn là giáo viên Địa lí lớp [lớp], cần bộ câu hỏi vận dụng về địa lí tỉnh Nghệ An gắn với bài [tên bài].","data":"Số liệu địa phương giáo viên đang có: [dân số, diện tích, cơ cấu kinh tế… kèm năm và nguồn]. Nội dung đã học: [2–3 ý].","guide":"Viết 6 câu hỏi: 2 câu đọc số liệu, 2 câu so sánh – giải thích, 2 câu vận dụng (đề xuất, đánh giá). Câu nào cũng phải dùng đúng số liệu đã cung cấp, không tự thêm số mới. Kèm đáp án và thang điểm.","check":"Liệt kê mọi số liệu bạn đã dùng và nguồn tương ứng; cảnh báo số liệu nào cần giáo viên cập nhật theo niên giám mới nhất.","out":"Đề 6 câu + đáp án + ghi chú nguồn số liệu.","warn":"Không dùng số liệu AI tự sinh. Sai một con số địa phương là sai cả bài dạy."},{"id":"p14","purpose":"day","subject":"gdcd","level":"THCS · THPT","title":"Tình huống đạo đức – pháp luật ba lựa chọn","context":"Bạn là giáo viên GDCD lớp [lớp], dạy bài [tên bài] về [quyền / nghĩa vụ / chuẩn mực].","data":"Nội dung cốt lõi: [2–3 ý]. Văn bản liên quan: [Luật Trẻ em 102/2016, Luật 91/2025… nếu có]. Đặc điểm học sinh: [bối cảnh].","guide":"Viết ba tình huống gần gũi, mỗi tình huống có ba phương án xử lý, phân tích hệ quả từng phương án, và chỉ ra căn cứ pháp lý hoặc chuẩn mực đạo đức. Không có phương án nào được trình bày như lời kết tội cá nhân.","check":"Chỉ rõ điều luật nào cần đối chiếu nguyên văn; đánh dấu chỗ AI có thể hiểu sai quy định; nêu cách xử lý khi học sinh chọn phương án sai.","out":"Ba tình huống + bảng phương án – hệ quả – căn cứ + câu hỏi chốt.","warn":"Không dùng tình huống thật của học sinh trong lớp làm ngữ liệu công khai."},{"id":"p15","purpose":"soan","subject":"gdcd","level":"THCS · THPT","title":"Kịch bản hoạt động trải nghiệm 45 phút","context":"Bạn là giáo viên phụ trách Hoạt động trải nghiệm lớp [lớp], chủ đề [chủ đề], 45 phút, [trong lớp / sân trường], lớp [có/không có] thiết bị.","data":"Mục tiêu hoạt động: [2–3 ý]. Số học sinh: [số]. Điều kiện thực tế: [không gian, thời tiết, thiết bị].","guide":"Thiết kế theo chu trình trải nghiệm: trải nghiệm cụ thể – phản hồi – khái quát – vận dụng. Chia rõ thời gian, vai trò học sinh, sản phẩm từng bước (phiếu, sơ đồ, cam kết), cách xử lý khi nhóm không tham gia. Thêm phương án không thiết bị.","check":"Chỉ ra bước nào có thể gây áp lực cảm xúc hoặc buộc học sinh chia sẻ chuyện riêng; đề xuất cách để học sinh được quyền không chia sẻ.","out":"Kịch bản 4 bước + danh sách vật tư + sản phẩm mẫu.","warn":"Không tổ chức hoạt động yêu cầu học sinh kể chuyện gia đình hoặc trải nghiệm tổn thương trước lớp."},{"id":"p16","purpose":"soan","subject":"toan","level":"THCS · THPT","title":"Dạy một khái niệm mới bằng tình huống thực","context":"Bạn là giáo viên Toán lớp [lớp], chuẩn bị dạy khái niệm [khái niệm] trong bài [tên bài], 45 phút.","data":"Yêu cầu cần đạt: [chép]. Kiến thức học sinh đã có: [2–3 ý]. Lỗi thường gặp: [nếu biết].","guide":"Thiết kế chuỗi: tình huống thực → dự đoán của học sinh → mô hình toán → phát biểu khái niệm → phản ví dụ. Sinh ba câu hỏi chẩn đoán để phát hiện hiểu sai, kèm cách phản hồi khi học sinh chọn sai.","check":"Tự giải lại mọi ví dụ và phản ví dụ; chỉ ra chỗ nào dễ sai dấu, đơn vị hoặc điều kiện; ghi rõ phần nào giáo viên phải kiểm tra bằng máy tính.","out":"Giáo án 45 phút theo chuỗi 5 bước + 3 câu hỏi chẩn đoán + đáp án.","warn":"AI tính toán thường sai ở bước biến đổi. Không đưa kết quả AI cho học sinh khi chưa tự kiểm tra."},{"id":"p17","purpose":"danh-gia","subject":"toan","level":"THCS · THPT","title":"Sinh đề biến thể từ một bài tập gốc","context":"Bạn là giáo viên Toán lớp [lớp], có một bài tập gốc đã dùng, cần 6 bài biến thể cho luyện tập tại lớp.","data":"Bài tập gốc: [chép đề và đáp án]. Dạng toán: [tên dạng]. Mức độ mong muốn: [2 dễ – 3 tương đương – 1 khó hơn].","guide":"Sinh 6 biến thể giữ nguyên cấu trúc: thay số, thay ngữ cảnh, đổi chiều hỏi, thêm điều kiện. Mỗi bài có đáp án và lời giải 3–4 dòng. Không tạo bài có nghiệm xấu ngoài chương trình.","check":"Tự giải lại cả 6 bài; đánh dấu bài nào có đáp án đáng ngờ; nêu rõ bài nào phù hợp học sinh yếu, bài nào cho học sinh khá.","out":"Phiếu 6 bài + đáp án + ghi chú phân loại độ khó.","warn":"Không dùng đề AI khi chưa kiểm tra nghiệm; sai đề làm học sinh mất niềm tin vào bài luyện."},{"id":"p18","purpose":"day","subject":"toan","level":"THCS · THPT","title":"Phân tích lỗi sai phổ biến trong một bài kiểm tra","context":"Bạn là giáo viên Toán lớp [lớp], vừa chấm bài kiểm tra [chương / chủ đề], muốn dạy lại phần học sinh sai nhiều.","data":"Thống kê ẩn danh: [tỷ lệ đúng từng câu]. Ba bài làm sai điển hình đã xóa tên: [dán]. Thời lượng dạy lại: [số] phút.","guide":"Nhóm lỗi theo nguyên nhân (hiểu sai khái niệm, sai kỹ năng tính, đọc sai đề, trình bày). Với mỗi nhóm, đề xuất một câu hỏi chẩn đoán và một bài tập sửa sai 3 phút. Ưu tiên nhóm lỗi ảnh hưởng nhiều học sinh nhất.","check":"Chỉ rõ nhận định nào là suy đoán từ mẫu nhỏ; không kết luận về năng lực của một học sinh cụ thể từ một bài.","out":"Bảng nhóm lỗi – nguyên nhân – cách sửa + 3 bài tập sửa sai.","warn":"Không đưa bài làm có tên học sinh vào AI; thống kê phải ẩn danh."},{"id":"p19","purpose":"soan","subject":"khtn","level":"THCS · THPT","title":"Thí nghiệm an toàn trong 20 phút","context":"Bạn là giáo viên [Vật lí / Hóa học / Sinh học] lớp [lớp], chuẩn bị thí nghiệm [tên thí nghiệm] cho bài [tên bài], 20 phút, thiết bị hiện có: [liệt kê].","data":"Mục tiêu thí nghiệm: [1–2 ý]. Hóa chất / dụng cụ dự kiến: [liệt kê]. Điều kiện phòng học: [diện tích, thông gió, số nhóm].","guide":"Lập phiếu thí nghiệm: mục tiêu – dụng cụ – 5 bước thao tác – bảng ghi kết quả – câu hỏi thảo luận. Đề xuất dụng cụ thay thế nếu thiếu. Liệt kê rủi ro và cách xử lý sự cố từng rủi ro.","check":"Kiểm tra lại tính khả thi với thiết bị thật của trường; chỉ ra phản ứng hoặc thao tác nào cần giáo viên làm mẫu; nêu rõ thí nghiệm nào không nên cho học sinh tự làm.","out":"Phiếu thí nghiệm một trang + bảng rủi ro – cách xử lý + phương án không hóa chất.","warn":"Không tin hướng dẫn an toàn do AI viết. Giáo viên đối chiếu quy định phòng thí nghiệm của trường trước khi tổ chức."},{"id":"p20","purpose":"day","subject":"khtn","level":"THCS · THPT","title":"Mô hình hóa một hiện tượng bằng sơ đồ","context":"Bạn là giáo viên [Vật lí / Hóa / Sinh] lớp [lớp], cần hoạt động 10 phút giúp học sinh mô hình hóa hiện tượng [hiện tượng].","data":"Hiện tượng và các yếu tố liên quan: [mô tả]. Kiến thức học sinh đã có: [2 ý]. Công cụ: [giấy A3 / bảng / phần mềm vẽ sơ đồ].","guide":"Đề xuất sơ đồ nguyên nhân – kết quả với tối đa 6 nút, chỉ rõ biến nào thay đổi, biến nào giữ nguyên. Thêm một giả thuyết kiểm chứng được và cách thu dữ liệu đơn giản. Nêu điểm khác giữa mô hình và hiện tượng thật.","check":"Chỉ ra chỗ mô hình đơn giản hóa quá mức; kiểm tra lại quan hệ nhân quả nào là suy đoán; đề xuất câu hỏi để học sinh tự phát hiện giới hạn của mô hình.","out":"Sơ đồ mẫu + 5 câu hỏi dẫn dắt + tiêu chí nhận xét sơ đồ của học sinh.","warn":"Không dùng mô hình AI thay cho thí nghiệm thật khi bài yêu cầu quan sát trực tiếp."},{"id":"p21","purpose":"danh-gia","subject":"khtn","level":"THCS · THPT","title":"Câu hỏi PISA ngắn từ một bảng số liệu","context":"Bạn là giáo viên [Vật lí / Hóa / Sinh] lớp [lớp], cần bộ câu hỏi đánh giá năng lực vận dụng từ bảng số liệu [tên bảng / thí nghiệm].","data":"Bảng số liệu thật (đã kiểm tra): [dán bảng, kèm đơn vị và nguồn]. Nội dung đã học: [2 ý]. Trình độ lớp: [mức].","guide":"Viết 4 câu theo ba mức: đọc dữ liệu – giải thích, suy luận – đánh giá, vận dụng. Câu nào cũng phải chỉ rõ dùng dòng, cột nào của bảng. Kèm đáp án và thang điểm 10.","check":"Kiểm tra lại toàn bộ phép tính từ bảng; nêu câu nào có thể có nhiều đáp án hợp lý; cảnh báo nếu số liệu thiếu để kết luận.","out":"Đề 4 câu + đáp án + thang điểm + ghi chú nguồn số liệu.","warn":"Không để AI tự tạo số liệu; bảng số liệu phải do giáo viên cung cấp hoặc kiểm chứng."},{"id":"p22","purpose":"soan","subject":"tin","level":"THCS · THPT","title":"Dạy thuật toán không cần máy tính","context":"Bạn là giáo viên Tin học lớp [lớp], phòng máy [không đủ / hỏng mạng], cần dạy thuật toán [tên thuật toán] trong 20 phút.","data":"Yêu cầu cần đạt: [chép]. Đồ dùng có sẵn: [thẻ giấy, bảng phụ, bút màu]. Học sinh đã biết: [2 ý].","guide":"Thiết kế hoạt động unplugged: học sinh đóng vai các bước thuật toán, dùng thẻ lệnh để mô phỏng một dãy [số / từ / hình]. Có 3 vòng: làm theo lệnh – tìm lỗi trong lệnh – tự viết lệnh. Kèm bảng kiểm quan sát.","check":"Chỉ ra chỗ hoạt động có thể hiểu nhầm thành trò chơi vô nghĩa; nêu tiêu chí biết học sinh đã hiểu thuật toán; kiểm tra không phụ thuộc phần mềm trả phí.","out":"Kịch bản 20 phút + bộ thẻ lệnh in được + bảng kiểm quan sát.","warn":"Không yêu cầu học sinh dùng tài khoản cá nhân hay cài phần mềm ngoài danh mục của trường."},{"id":"p23","purpose":"danh-gia","subject":"tin","level":"THCS · THPT","title":"Đánh giá sản phẩm số của học sinh","context":"Bạn là giáo viên Tin học lớp [lớp], học sinh nộp sản phẩm số [bài trình chiếu / trang web đơn giản / video ngắn / bảng tính] cho bài [tên bài].","data":"Yêu cầu sản phẩm: [3 yêu cầu]. Công cụ học sinh được phép dùng: [liệt kê]. Quy định của trường về dữ liệu và bản quyền: [tóm tắt].","guide":"Lập rubric 4 tiêu chí: chức năng đúng – an toàn dữ liệu – bản quyền và ghi nguồn – trình bày. Mỗi tiêu chí ba mức quan sát được. Thêm mẫu nhận xét 3 câu giáo viên dùng khi trả bài.","check":"Chỉ ra tiêu chí nào khó quan sát qua sản phẩm; nêu cách kiểm tra sản phẩm không chứa dữ liệu cá nhân của người khác; đề xuất cách chấm công bằng giữa các công cụ khác nhau.","out":"Rubric 4 × 3 + mẫu nhận xét + 3 câu hỏi vấn đáp nhanh.","warn":"Không chấm điểm dựa trên độ đẹp của công cụ đắt tiền; tiêu chí phải công khai trước khi làm."},{"id":"p24","purpose":"day","subject":"ta","level":"THPT","title":"Hoạt động nói theo cặp 10 phút","context":"Bạn là giáo viên Tiếng Anh lớp [lớp], cần hoạt động nói theo cặp 10 phút cho chủ đề [chủ đề] trong bài [tên bài].","data":"Ngôn ngữ mục tiêu: [cấu trúc, từ vựng]. Trình độ lớp: [A2/B1…]. Sĩ số: [số].","guide":"Tạo hai thẻ vai (A và B) có thông tin khác nhau để học sinh phải hỏi nhau, kèm 6 câu mẫu (useful language). Thêm tiêu chí quan sát cho giáo viên: dùng cấu trúc mục tiêu, lượt nói cân bằng, phát âm từ khóa.","check":"Kiểm tra lại toàn bộ từ vựng và cấu trúc bạn gợi ý; đánh dấu câu nào quá khó so với trình độ lớp; đề xuất bản đơn giản hóa.","out":"Hai thẻ vai in được + câu mẫu + bảng quan sát 3 tiêu chí.","warn":"AI có thể dùng từ không phù hợp trình độ; giáo viên duyệt lại từng câu mẫu."},{"id":"p25","purpose":"danh-gia","subject":"ta","level":"THCS · THPT","title":"Sửa lỗi viết theo ba tầng","context":"Bạn là giáo viên Tiếng Anh lớp [lớp], nhận bài viết [đoạn văn 80–120 từ] của học sinh về chủ đề [chủ đề].","data":"Bài viết đã ẩn danh: [dán bài]. Tiêu chí: [nội dung, ngữ pháp, từ vựng, liên kết]. Trình độ lớp: [mức].","guide":"Chỉ ra lỗi theo ba tầng: toàn bài (bố cục, lạc đề) – câu (ngữ pháp, liên kết) – từ (dùng sai, chính tả). Không viết lại hộ; mỗi lỗi chỉ đánh dấu và gợi ý loại lỗi. Kèm bản viết lại mẫu cho một đoạn duy nhất để minh họa.","check":"Kiểm tra lại từng nhận xét ngữ pháp; chỉ rõ chỗ nào là lựa chọn phong cách chứ không phải lỗi; đảm bảo nhận xét phù hợp trình độ.","out":"Bảng lỗi ba tầng + nhận xét 3 câu + một đoạn viết lại mẫu.","warn":"Không dán bài viết có họ tên học sinh lên công cụ công cộng."},{"id":"p26","purpose":"an-toan","subject":"chung","level":"Mọi cấp","title":"Tự kiểm tra một prompt trước khi dùng","context":"Bạn là trợ lý kiểm duyệt prompt cho giáo viên. Nhiệm vụ là đánh giá một prompt đã soạn, không phải trả lời nội dung prompt đó.","data":"Prompt cần kiểm tra: [dán toàn bộ prompt]. Bối cảnh dùng: [môn, lớp, mục đích].","guide":"Chấm prompt theo bốn thẻ: Ngữ cảnh (đủ môn, lớp, thời lượng?) – Dữ liệu (có dữ liệu cá nhân nào không? có nguồn không?) – Hướng dẫn (nhiệm vụ rõ, định dạng rõ, có phân hóa?) – Kiểm chứng (có yêu cầu tự kiểm tra, chỉ ra điểm chưa chắc?). Đề xuất bản sửa ngắn gọn.","check":"Liệt kê mọi dữ liệu nhạy cảm cần xóa trước khi gửi; nêu phần nào prompt còn mơ hồ; cảnh báo rằng chính bạn cũng có thể bỏ sót.","out":"Bảng chấm 4 thẻ + danh sách dữ liệu cần xóa + bản prompt đã sửa.","warn":"Kết quả kiểm duyệt của AI không thay thế trách nhiệm của giáo viên; luôn đọc lại bằng mắt trước khi gửi."},{"id":"p27","purpose":"soan","subject":"mam-non","level":"Mầm non","title":"Soạn kế hoạch hoạt động học cho trẻ 4–5 tuổi","context":"Bạn là giáo viên mầm non giàu kinh nghiệm, soạn kế hoạch hoạt động theo Chương trình GDMN (Thông tư 17/2009/TT-BGDĐT, sửa đổi bởi Thông tư 28/2016 và 51/2020), tiếp cận lấy trẻ làm trung tâm.","data":"Nhóm trẻ: [4–5 tuổi]; chủ đề: [gia đình/nghề nghiệp/giao thông]; thời lượng: [25–30 phút]; không gian: [lớp/sân]; đồ dùng sẵn có: [liệt kê]. Không đưa tên trẻ, ảnh và thông tin sức khỏe cá nhân.","guide":"Đề xuất một hoạt động học có chủ đích gồm: mục tiêu bám 5 lĩnh vực phát triển; chuẩn bị; tiến hành 3 phần mở – thân – kết kèm 3 lời dẫn mẫu; một hoạt động chơi tích hợp; 2 phương án phân hóa cho nhóm trẻ nhanh và chậm; cách quan sát – đánh giá trẻ trong lúc chơi.","check":"Soi lại xem mục tiêu có quan sát được không; thời gian ngồi một chỗ có quá 15 phút; hoạt động có vừa sức lứa tuổi; nêu rõ chỗ nào bạn phải giả định do thiếu dữ liệu.","out":"Kế hoạch 1 trang + phiếu quan sát 5 dòng + 1 câu hỏi mở để đánh giá trẻ.","warn":"AI chỉ gợi ý; giáo viên chỉnh theo trẻ thật. Không dán tên, ảnh, hồ sơ sức khỏe trẻ vào công cụ AI công cộng."},{"id":"p28","purpose":"an-toan","subject":"mam-non","level":"Mầm non","title":"Rà soát dữ liệu trẻ trước khi gửi AI","context":"Bạn là chuyên viên bảo vệ dữ liệu của trường mầm non, giúp giáo viên rà soát nội dung trước khi gửi lên công cụ AI.","data":"Nội dung dự kiến gửi: [dán nguyên văn]. Bối cảnh: [soạn kế hoạch/bài truyền thông/phản hồi phụ huynh].","guide":"Phân loại từng thông tin theo 4 mức: công khai – nội bộ – nhạy cảm – tuyệt đối không gửi (dữ liệu định danh trẻ, sức khỏe, hoàn cảnh gia đình, ảnh mặt trẻ). Chỉ ra từng câu chứa dữ liệu cần xóa hoặc ẩn danh; đề xuất bản thay thế bằng mã như 'Trẻ A, 4 tuổi'.","check":"Tự rà lại xem có bỏ sót số điện thoại, địa chỉ, ngày sinh hoặc biệt danh dễ nhận diện; nêu rõ chỗ nào bạn không chắc.","out":"Bảng phân loại 4 mức + danh sách câu cần sửa + bản đã ẩn danh hóa.","warn":"Không dán bản chưa ẩn danh lên AI công cộng để 'nhờ kiểm'; hãy thay bằng tình huống giả định hoặc dữ liệu đã bỏ định danh."},{"id":"p29","purpose":"soan","subject":"tieu-hoc","level":"Tiểu học","title":"Viết yêu cầu cần đạt bốn thành phần cho bài tiểu học","context":"Bạn là chuyên gia phát triển chương trình tiểu học, quen Thông tư 18/2026/TT-BGDĐT (khung năng lực số giáo viên) và Thông tư 02/2025/TT-BGDĐT (khung năng lực số người học).","data":"Môn: [Tiếng Việt/Tin học/Khoa học]; lớp: [3/4/5]; bài: [tên bài]; năng lực số muốn gắn: [mã NL]; thiết bị có thể dùng: [máy tính/bảng/máy chiếu].","guide":"Viết 3 yêu cầu cần đạt, mỗi yêu cầu đủ 4 thành phần: hành động (động từ đo được) – nội dung – điều kiện thực hiện – mức chất lượng. Gắn mỗi yêu cầu với một mã năng lực số và một bậc (Bậc 1/Bậc 2 theo Thông tư 02/2025). Gợi ý một nhiệm vụ học tập thể hiện yêu cầu đó.","check":"Với từng yêu cầu, kiểm tra: quan sát/đánh giá bằng sản phẩm nào; có quá sức lứa tuổi; mã năng lực gán đúng miền không.","out":"Bảng 3 yêu cầu × 4 thành phần + mã năng lực + nhiệm vụ minh họa.","warn":"Không tự bịa mã năng lực hoặc bậc; đối chiếu bảng ma trận trong bộ tài liệu Tiểu học 2026 trước khi đưa vào hồ sơ."},{"id":"p30","purpose":"danh-gia","subject":"tieu-hoc","level":"Tiểu học","title":"Chấm kế hoạch bài dạy theo rubric 8 tiêu chí","context":"Bạn là trợ lý chấm sản phẩm cuối khóa tập huấn năng lực số tiểu học theo rubric 8 tiêu chí × 3 mức, thang 32 điểm; người chấm cuối cùng vẫn là giảng viên.","data":"Bản kế hoạch bài dạy của học viên: [dán]. Hai yêu cầu bắt buộc: [tóm tắt]. Tám tiêu chí và mô tả 3 mức: [dán bảng rubric].","guide":"Với mỗi tiêu chí: nêu mức đề xuất (1–4 điểm), trích câu hoặc bằng chứng trong bài làm, và một gợi ý cải thiện cụ thể. Trình bày dạng bảng 8 dòng. Không cộng điểm thay người chấm.","check":"Kiểm tra không bịa bằng chứng; chỉ rõ chỗ bạn suy đoán; nêu 3 câu hỏi để giảng viên xác minh trước khi chốt điểm.","out":"Bảng 8 tiêu chí × (mức đề xuất, bằng chứng, gợi ý) + danh sách bằng chứng còn thiếu.","warn":"Điểm cuối cùng do giảng viên quyết định; AI dễ ưu ái bài viết dài, nhiều chữ, trình bày đẹp."},{"id":"p31","purpose":"danh-gia","subject":"chung","level":"THCS · THPT","title":"Đo mức AIAS của một nhiệm vụ học tập","context":"Bạn là chuyên gia đánh giá học thuật, dùng thang AIAS 5 mức (Perkins và cộng sự, 2024) để xem một nhiệm vụ cho phép AI tham gia ở mức nào.","data":"Nhiệm vụ: [mô tả]. Yêu cầu sản phẩm: [bài luận/bài trình bày/mã/bản vẽ]. Quy định của lớp: [cho phép/cấm/chưa nói rõ].","guide":"Xác định mức AIAS phù hợp (1 Không dùng AI; 2 AI hỗ trợ lập kế hoạch; 3 AI hợp tác từng phần; 4 AI tích hợp toàn bài; 5 Khám phá cùng AI) và giải thích vì sao. Nêu hai rủi ro gian lận và hai cách thiết kế lại nhiệm vụ để vẫn quan sát được bằng chứng học tập (nháp, nhật ký, vấn đáp).","check":"Kiểm tra mức đề xuất có khớp yêu cầu sản phẩm; chỉ rõ chỗ nào cần giáo viên quyết định chính sách; cảnh báo nếu mức cao mà không có biện pháp kiểm chứng.","out":"Kết luận mức AIAS + 2 rủi ro + 2 đề xuất thiết kế lại + 2 câu hỏi cho tổ chuyên môn.","warn":"AIAS là khung tham chiếu, không phải thang điểm; không dùng để kết luận một học sinh gian lận."},{"id":"p32","purpose":"day","subject":"chung","level":"THCS · THPT","title":"Thiết kế một tiết có chatbot theo 4 bước và 3 lớp bằng chứng","context":"Bạn là giáo viên thiết kế hoạt động có chatbot hỗ trợ trong tiết 45 phút, ưu tiên kiểm chứng thay vì tin ngay câu trả lời.","data":"Môn/lớp: [...]; mục tiêu: [...]; chatbot: [tên công cụ]; thiết bị: [máy chiếu/điện thoại nhóm]; 3 câu hỏi mẫu dự kiến: [...].","guide":"Lên 4 bước: rà soát câu trả lời mẫu trước giờ học – giao nhiệm vụ kèm câu hỏi kiểm chứng – phản hồi theo nhóm – ghi nhật ký. Với mỗi bước chỉ rõ 3 lớp bằng chứng: sản phẩm (học sinh làm gì), quá trình (nháp, ảnh bảng, log), vấn đáp (2 câu kiểm tra hiểu). Nêu 3 điều cấm khi dùng chatbot trong lớp.","check":"Rà xem bằng chứng quá trình có thu được trong 45 phút; câu hỏi có kiểm tra được hiểu thật hay chỉ chép; nêu phương án khi mất mạng.","out":"Kế hoạch tiết 4 bước + bảng 3 lớp bằng chứng + 3 điều cấm + phương án không mạng.","warn":"Không để học sinh dán dữ liệu cá nhân vào chatbot; giáo viên đọc lại mọi câu trả lời trước khi chiếu lên màn hình chung."}]},"games":{"title":"Kho trò chơi học tập","note":"Bộ trò chơi xếp theo ba hình thức: trực tuyến, trình chiếu và không cần thiết bị. Mỗi trò có cách tổ chức trong 10–20 phút, ví dụ câu hỏi cho từng môn và phương án dự phòng khi mất mạng. Quy tắc chung: không dùng họ tên đầy đủ của học sinh, không bắt học sinh tạo tài khoản, kiểm tra chính sách độ tuổi của nền tảng trước khi dùng.","formats":[{"id":"online","label":"Trực tuyến"},{"id":"slide","label":"Trình chiếu"},{"id":"offline","label":"Không thiết bị"}],"games":[{"id":"g01","name":"Kahoot!","kicker":"TRẮC NGHIỆM TÍNH GIỜ","format":"online","time":"10–15 phút","group":"Cả lớp · cá nhân","cost":"Miễn phí có giới hạn","how":["Giáo viên tạo bộ 10 câu trên máy, chiếu màn hình mã PIN.","Học sinh vào bằng trình duyệt điện thoại, nhập biệt danh ngắn (không dùng họ tên đầy đủ).","Mỗi câu 20 giây; sau khi chốt đáp án, gọi một học sinh giải thích vì sao."],"examples":[{"s":"van","ex":"Chọn biện pháp tu từ trong câu thơ đã học tuần trước."},{"s":"toan","ex":"25% của 480 bằng bao nhiêu?"},{"s":"sudia","ex":"Sự kiện nào diễn ra ngày 2/9/1945?"}],"offline":"In 10 câu ra giấy, học sinh giơ thẻ A/B/C; giáo viên đếm nhanh bằng cách giơ tay.","privacy":"Chơi ở chế độ khách, không bắt học sinh đăng ký email; dùng biệt danh thay họ tên."},{"id":"g02","name":"Quizizz","kicker":"LUYỆN TẬP TỰ NHỊP","format":"online","time":"10–20 phút","group":"Cả lớp · giao về nhà","cost":"Miễn phí có giới hạn","how":["Tạo bộ câu hỏi có giải thích sau mỗi câu.","Chạy chế độ cả lớp hoặc giao bài về nhà bằng một mã tham gia.","Xem báo cáo câu sai nhiều nhất, dạy lại đúng phần đó ở buổi sau."],"examples":[{"s":"tin","ex":"Sắp xếp đúng thứ tự các bước tìm kiếm nhị phân."},{"s":"khtn","ex":"Đơn vị của công suất là gì?"},{"s":"ta","ex":"Chọn dạng đúng: She ___ to school every day."}],"offline":"In đề 10 câu, học sinh làm theo cặp, đổi bài chấm chéo bằng đáp án phát sau 8 phút.","privacy":"Giao bài bằng mã, không thu email học sinh; báo cáo chỉ dùng để dạy lại, không công khai xếp hạng."},{"id":"g03","name":"Blooket","kicker":"GAME HÓA ÔN TẬP","format":"online","time":"10–15 phút","group":"Cá nhân · đội","cost":"Miễn phí","how":["Nhập bộ câu hỏi (tự soạn hoặc nhập từ bộ có sẵn).","Chọn chế độ chơi ngắn 5–7 phút: trả lời đúng để nhận lượt chơi.","Chạy ba vòng khác chế độ để lớp không nhàm; chốt bằng 3 câu hỏi miệng."],"examples":[{"s":"sudia","ex":"Ghép mốc thời gian với sự kiện tương ứng."},{"s":"toan","ex":"Chọn kết quả đúng của phép tính nhanh."},{"s":"khtn","ex":"Chọn bào quan thực hiện chức năng được mô tả."}],"offline":"Chuyển bộ câu thành phiếu 10 câu, chơi theo đội trên bảng phụ.","privacy":"Không bật chế độ công khai ngoài lớp; không dùng họ tên học sinh làm tên người chơi."},{"id":"g04","name":"Wordwall","kicker":"MẪU TRÒ CHƠI CÓ SẴN","format":"online","time":"5–10 phút","group":"Nhóm nhỏ · cả lớp","cost":"Miễn phí có giới hạn","how":["Chọn mẫu phù hợp: ghép cặp, sắp xếp nhóm, xáo chữ, mở hộp.","Nhập 8–10 mục nội dung, chọn chế độ chiếu toàn màn hình.","Cả lớp cùng quan sát, gọi học sinh chỉ vị trí ghép; chốt bằng bảng tóm tắt."],"examples":[{"s":"van","ex":"Ghép từ ngữ với nghĩa phù hợp trong văn bản."},{"s":"gdcd","ex":"Phân nhóm hành vi vi phạm và hành vi tôn trọng quyền trẻ em."},{"s":"tin","ex":"Ghép thuật ngữ với chức năng: CPU, RAM, ổ cứng."}],"offline":"In các cặp thẻ ra giấy, học sinh ghép theo nhóm 4 trong 3 phút.","privacy":"Không lưu tên lớp và tên học sinh trong tên bộ trò chơi."},{"id":"g05","name":"QuizWhizzer","kicker":"ĐUA TRÊN BẢN ĐỒ","format":"online","time":"10 phút","group":"Cá nhân · đội","cost":"Miễn phí có giới hạn","how":["Tạo bản đồ có 8–12 điểm dừng, mỗi điểm gắn một câu hỏi.","Học sinh trả lời đúng để tiến trên bản đồ; sai thì đứng lại một lượt.","Chiếu bảng tiến độ, dừng lại hỏi cả lớp ở hai câu khó nhất."],"examples":[{"s":"sudia","ex":"Mỗi điểm dừng là một vùng địa lí, trả lời đặc điểm vùng."},{"s":"sudia","ex":"Mỗi điểm dừng là một mốc lịch sử, chọn sự kiện đúng."},{"s":"ta","ex":"Mỗi điểm dừng là một câu hỏi từ vựng theo chủ đề."}],"offline":"Vẽ bản đồ lớn trên bảng, mỗi đội là một quân cờ giấy; giáo viên đọc câu hỏi.","privacy":"Dùng tên đội thay tên học sinh; không chia sẻ mã phòng ra ngoài lớp."},{"id":"g06","name":"Quizlet Live","kicker":"ĐỘI ĐỒNG BỘ","format":"online","time":"10 phút","group":"Đội 3–4 người","cost":"Cần tài khoản giáo viên","how":["Tạo bộ 12–16 thuật ngữ – định nghĩa từ chính bài học.","Chia đội tự động; cả đội chỉ thắng khi mọi thành viên chọn đúng cùng đáp án.","Chơi 2 lượt, lượt hai đổi đội để học sinh hợp tác với bạn khác."],"examples":[{"s":"ta","ex":"Ghép từ vựng với nghĩa tiếng Việt."},{"s":"khtn","ex":"Ghép khái niệm với định nghĩa: công suất, hiệu suất, động năng."},{"s":"tin","ex":"Ghép câu lệnh với kết quả hiển thị."}],"offline":"In 2 bộ thẻ thuật ngữ – định nghĩa, chơi ghép cặp trong 5 phút.","privacy":"Học sinh chỉ nhập biệt danh; giáo viên xóa bộ thẻ sau khi dùng nếu có tên riêng."},{"id":"g07","name":"Baamboozle","kicker":"CƯỚP ĐIỂM","format":"online","time":"10 phút","group":"Đội","cost":"Miễn phí có giới hạn","how":["Chuẩn bị 12 ô câu hỏi có điểm 1–5, trong đó có ô may mắn và ô mất điểm.","Đội chọn ô, trả lời đúng nhận điểm; đội khác được cướp nếu sai.","Chốt bằng một câu hỏi tổng hợp cho cả lớp cùng trả lời."],"examples":[{"s":"toan","ex":"Ô 1 điểm: tính nhẩm; ô 5 điểm: bài toán có lời văn."},{"s":"van","ex":"Ô 2 điểm: tên tác giả; ô 5 điểm: phân tích một hình ảnh thơ."},{"s":"khtn","ex":"Ô 1 điểm: đơn vị đo; ô 5 điểm: giải thích hiện tượng."}],"offline":"Vẽ 12 ô trên bảng, ghi điểm vào ô; giữ nguyên luật chơi.","privacy":"Tên đội theo môn học hoặc con vật, không theo tên học sinh."},{"id":"g08","name":"Plickers","kicker":"THẺ MÃ – MỘT ĐIỆN THOẠI","format":"offline","time":"5–10 phút","group":"Cả lớp","cost":"Miễn phí in thẻ","how":["In bộ thẻ mã A–D cho từng học sinh (dùng lại nhiều lần).","Giáo viên chiếu câu hỏi, học sinh giơ thẻ quay hướng đáp án.","Giáo viên quét cả lớp bằng một điện thoại, xem biểu đồ phân bố ngay trên màn hình."],"examples":[{"s":"chung","ex":"Nhận định nào đúng về quy trình SIFT?"},{"s":"van","ex":"Câu thơ thuộc thể thơ nào?"},{"s":"toan","ex":"Kết quả nào đúng trong ba phương án?"}],"offline":"Nếu không quét được, giáo viên đếm thẻ giơ tay theo từng phương án.","privacy":"Thẻ mã không chứa tên; giáo viên ghi nhớ vị trí thẻ nếu cần theo dõi tiến bộ."},{"id":"g09","name":"Vòng xoay may mắn","kicker":"QUAY SỐ – CHỌN CÂU HỎI","format":"slide","time":"5–10 phút","group":"Cả lớp · đội","cost":"Miễn phí · chơi ngay trên trang này","how":["Mở vòng xoay trên trang, chọn chế độ câu ạm toán: giải 3 phép tính, kết quả là số của ổ khóa."},{"s":"van","ex":"Trạm đọc hiểu: tìm từ khóa trong đoạn văn, lấy chữ cái đầu."}],"offline":"Đây là trò chơi không thiết bị; có thể in phiếu trạm từ trước.","privacy":"Mật mã không chứa thông tin cá nhân; không dùng tên học sinh trong nội dung trạm."},{"id":"g15","name":"Bingo thuật ngữ","kicker":"NGHE ĐỊNH NGHĨA – ĐÁNH DẤU","format":"offline","time":"10–15 phút","group":"Cả lớp","cost":"In bảng 5 × 5","how":["Phát bảng 5 × 5 ghi thuật ngữ theo thứ tự xáo trộn khác nhau cho mỗi học sinh.","Giáo viên đọc định nghĩa hoặc câu hỏi gợi ý; học sinh đánh dấu ô tương ứng.","Ai có 5 ô liền hàng, cột hoặc chéo thì hô “Bingo” và đọc lại 5 thuật ngữ kèm nghĩa."],"examples":[{"s":"khtn","ex":"Bảng gồm các bào quan và hiện tượng: quang hợp, hô hấp, nguyên phân…"},{"s":"sudia","ex":"Bảng gồm mốc thời gian và địa danh gắn với bài đang học."},{"s":"ta","ex":"Bảng gồm từ vựng chủ đề; giáo viên đọc nghĩa tiếng Việt."}],"offline":"Đây là trò chơi không thiết bị; chỉ cần một bản in mẫu và photo đủ lớp.","privacy":"Không ghi tên học sinh lên bảng; thu lại bảng để dùng cho lớp sau."},{"id":"g16","name":"Taboo – nói vòng","kicker":"MÔ TẢ KHÔNG DÙNG TỪ CẤM","format":"offline","time":"10 phút","group":"Nhóm 4","cost":"Thẻ giấy","how":["Mỗi thẻ có một từ khóa và ba từ cấm không được nói.","Một học sinh mô tả trong 60 giây, đồng đội đoán; đội khác bấm giờ.","Đổi vai sau mỗi lượt; đội đoán đúng nhiều nhất thắng."],"examples":[{"s":"van","ex":"Từ khóa: “ẩn dụ”; cấm dùng: so sánh, ví von, hình ảnh."},{"s":"khtn","ex":"Từ khóa: “quang hợp”; cấm: lá, ánh sáng, diệp lục."},{"s":"tin","ex":"Từ khóa: “thuật toán”; cấm: bước, máy tính, chương trình."}],"offline":"Đây là trò chơi không thiết bị; thẻ có thể viết tay trong 5 phút.","privacy":"Không dùng tên bạn học làm từ khóa."},{"id":"g17","name":"Tiếp sức bảng phụ","kicker":"MỖI NGƯỜI MỘT BƯỚC","format":"offline","time":"10 phút","group":"Đội 4–6","cost":"Bảng phụ, phấn","how":["Mỗi đội một bảng phụ đặt cuối lớp, mỗi học sinh một lượt viết.","Giáo viên ra đề; học sinh lần lượt viết một bước giải rồi chuyền phấn.","Đội xong trước và đúng toàn bộ thắng; giáo viên chữa lỗi chung trên bảng lớn."],"examples":[{"s":"toan","ex":"Giải phương trình bậc nhất, mỗi bạn một bước biến đổi."},{"s":"khtn","ex":"Cân bằng một phương trình hóa học đơn giản."},{"s":"van","ex":"Mỗi bạn viết một dẫn chứng cho luận điểm chung."}],"offline":"Đây là trò chơi không thiết bị; nếu thiếu bảng phụ, dùng giấy A3.","privacy":"Không ghi tên cá nhân lên bảng đội; chỉ ghi tên đội."},{"id":"g18","name":"Trạm 4 góc","kicker":"CHỌN GÓC – BẢO VỆ Ý KIẾN","format":"offline","time":"15 phút","group":"Cả lớp di chuyển","cost":"4 tờ A3","how":["Dán 4 tờ A3 ở 4 góc lớp, mỗi góc một phương án hoặc quan điểm.","Học sinh đọc tình huống, chọn góc đứng, thảo luận 2 phút.","Mỗi góc cử đại diện trình bày 30 giây; giáo viên chốt bằng tiêu chí, không bằng số đông."],"examples":[{"s":"gdcd","ex":"Tình huống về quyền riêng tư: bốn cách xử lý, chọn và bảo vệ."},{"s":"sudia","ex":"Bốn nhận định về một nhân vật lịch sử; chọn nhận định có bằng chứng."},{"s":"van","ex":"Bốn cách hiểu một hình ảnh thơ; chọn và dẫn chứng."}],"offline":"Đây là trò chơi không thiết bị; cần không gian đủ rộng để di chuyển.","privacy":"Không yêu cầu học sinh giải thích lựa chọn gắn với chuyện cá nhân."},{"id":"g19","name":"Đóng vai tình huống","kicker":"THẺ VAI – DIỄN 3 PHÚT","format":"offline","time":"15–20 phút","group":"Nhóm 3–4","cost":"Thẻ vai in sẵn","how":["Phát thẻ vai cho từng nhóm, 5 phút chuẩn bị.","Mỗi nhóm diễn 3 phút; lớp ghi phiếu quan sát theo hai tiêu chí.","Giáo viên phản hồi bằng cách hỏi: “Nhóm em chọn cách này vì…?”"],"examples":[{"s":"gdcd","ex":"Tình huống bạn bị bắt nạt trên mạng: vai người chứng kiến, nạn nhân, giáo viên."},{"s":"ta","ex":"Role-play hỏi đường, đặt món, phỏng vấn việc làm."},{"s":"gdcd","ex":"Hoạt động trải nghiệm: xử lý mâu thuẫn trong nhóm làm việc."}],"offline":"Đây là trò chơi không thiết bị; thẻ vai có thể viết tay.","privacy":"Kịch bản hư cấu, không lấy chuyện thật của học sinh; cho phép đổi vai nếu thấy không thoải mái."},{"id":"g20","name":"Thẻ đúng – sai giơ nhanh","kicker":"PHẢN XẠ TOÀN LỚP","format":"offline","time":"5–8 phút","group":"Cả lớp","cost":"2 thẻ Đ/S","how":["Mỗi học sinh có hai thẻ Đúng và Sai (hoặc giơ ngón tay).","Giáo viên đọc 10 nhận định, học sinh giơ thẻ sau 3 giây.","Với mỗi câu sai, gọi một học sinh nói cách sửa lại cho đúng."],"examples":[{"s":"chung","ex":"“Được đăng ảnh học sinh lên nhóm chat công khai” – đúng hay sai?"},{"s":"khtn","ex":"“Công suất đo bằng jun” – đúng hay sai?"},{"s":"ta","ex":"“She go to school” – đúng hay sai?"}],"offline":"Đây là trò chơi không thiết bị; dùng ngón tay cái lên/xuống nếu không có thẻ.","privacy":"Không gắn nhận định với tên hay hoàn cảnh của học sinh cụ thể."},{"id":"g21","name":"Ba thẻ xanh – vàng – đỏ","kicker":"PHÂN LOẠI DÙNG AI","format":"offline","time":"8–10 phút","group":"Nhóm 4","cost":"3 thẻ màu mỗi người","how":["Mỗi học sinh có 3 thẻ: xanh (được phép), vàng (được phép có điều kiện), đỏ (không được).","Giáo viên đọc 8 tình huống dùng AI trong lớp; sau 5 giây cả nhóm giơ thẻ.","Nhóm giơ khác nhau thì giải thích trong 20 giây; giáo viên chốt bằng ba câu hỏi phân loại: có dữ liệu cá nhân không, có kiểm chứng được không, có thay việc học không."],"examples":[{"s":"tieu-hoc","ex":"“Nhờ AI gợi ý 5 câu hỏi ôn bài cho cả lớp” – thẻ nào?"},{"s":"chung","ex":"“Dán ảnh có mặt học sinh vào AI để tạo tranh minh họa” – thẻ nào?"},{"s":"toan","ex":"“Nhờ AI giải thích một bước chứng minh rồi tự làm lại toàn bài” – thẻ nào?"}],"offline":"Không có thẻ màu thì giơ 1, 2, 3 ngón tay thay cho xanh, vàng, đỏ.","privacy":"Tình huống là giả định, không gắn với học sinh thật trong lớp."},{"id":"g22","name":"Săn chỉ báo","kicker":"GDMN · BỘ TIÊU CHÍ","format":"slide","time":"10–12 phút","group":"Đội 4–6","cost":"Máy chiếu + bảng phụ","how":["Chiếu một tình huống hoạt động ở lớp mầm non, không nêu tên trẻ.","Mỗi đội tìm chỉ báo tương ứng trong Bộ tiêu chí (5 nhóm – 21 tiêu chí – 70 chỉ báo) và ghi số chỉ báo.","Đội trình bày chỉ báo đã chọn kèm một minh chứng quan sát được trong 30 giây."],"examples":[{"s":"mam-non","ex":"“Trẻ 4–5 tuổi tự chia đồ chơi ở góc phân vai” – chỉ báo nào về kỹ năng xã hội?"},{"s":"mam-non","ex":"“Cô dùng bài hát để chuyển hoạt động, trẻ hát theo” – chỉ báo nào về phát triển thẩm mĩ?"},{"s":"chung","ex":"“Trẻ kể lại câu chuyện theo tranh cho bạn nghe” – chỉ báo nào về ngôn ngữ?"}],"offline":"In 70 chỉ báo ra phiếu A3, đội khoanh trực tiếp bằng bút màu.","privacy":"Mô tả tình huống khái quát, không dùng tên hay ảnh trẻ."},{"id":"g23","name":"Ghép năm thành phần prompt","kicker":"PROMPT · KÉO THẢ","format":"online","time":"10 phút","group":"Cá nhân hoặc đội","cost":"Wordwall / Quizizz","how":["Chia một prompt mầm non hoặc tiểu học thành 5 mảnh: vai – bối cảnh – nhiệm vụ – yêu cầu – định dạng.","Học viên kéo thả ghép các mảnh thành câu lệnh hoàn chỉnh trong thời gian quy định.","Đội thắng nêu mảnh còn thiếu trong một prompt khác và viết lại cho đủ."],"examples":[{"s":"mam-non","ex":"“Bạn là cô giáo mầm non… soạn 3 trò chơi…” – mảnh nào còn thiếu?"},{"s":"tieu-hoc","ex":"Ghép “mỗi câu dưới 10 từ” vào đúng thành phần nào?"},{"s":"chung","ex":"Sửa một prompt thiếu định dạng đầu ra trong 60 giây."}],"offline":"In 5 mảnh trên giấy, nhóm xếp thành câu lệnh và dán lên bảng.","privacy":"Ví dụ là giả định; không đưa nội dung thật của trẻ vào prompt mẫu."},{"id":"g24","name":"Xếp bốn mức dữ liệu","kicker":"DỮ LIỆU TRẺ · THẺ BÀI","format":"offline","time":"8–10 phút","group":"Nhóm 4","cost":"Bộ 12 thẻ giấy","how":["Phát 12 thẻ thông tin: tên trẻ, ảnh có mặt trẻ, bảng điểm danh, thực đơn tuần, ảnh hoạt động không rõ mặt…","Nhóm xếp thẻ vào 4 mức: công khai – nội bộ – nhạy cảm – tuyệt đối không gửi AI.","Đối chiếu đáp án; cả lớp thảo luận 2 thẻ gây tranh cãi nhất và chốt nguyên tắc."],"examples":[{"s":"mam-non","ex":"“Ảnh có mặt trẻ trong buổi sinh nhật lớp” – mức nào?"},{"s":"mam-non","ex":"“Thực đơn tuần của trường” – mức nào?"},{"s":"chung","ex":"“Số điện thoại phụ huynh trong nhóm chat lớp” – mức nào?"}],"offline":"Toàn bộ là thẻ giấy; không cần thiết bị nào.","privacy":"Thẻ chỉ mô tả loại dữ liệu, không dùng hồ sơ thật của trẻ."}]},"arcade":{"title":"Sân chơi chạy ngay trên trang","note":"Sáu trò chơi tương tác dựng từ nội dung 31 bài và vòng xoay may mắn. Chơi trực tiếp trên máy, không cần đăng nhập, không gửi dữ liệu lên mạng. Điểm cao nhất của mỗi trò được lưu trong trình duyệt của máy đang dùng.","games":[{"id":"dua-trac-nghiem","type":"sprint","name":"Đua trắc nghiệm 60 giây","genre":"Trắc nghiệm tính giờ","desc":"Chọn khóa rồi trả lời liên tiếp câu hỏi lấy từ 125 câu tự kiểm tra; đúng nhanh, chuỗi dài thì điểm cao.","time":"1 phút mỗi lượt","group":"Cá nhân hoặc đội","tag":"Ôn tập","rule":"Mỗi câu đúng 10 điểm; chuỗi đúng liên tiếp cộng thêm 2 điểm mỗi câu, tối đa 20 điểm cộng. Sai thì chuỗi về 0. Hết 60 giây là dừng."},{"id":"lat-the-ghep-cap","type":"match","name":"Lật thẻ ghép cặp","genre":"Trí nhớ · ghép khái niệm","desc":"Lật 12 thẻ úp, ghép thuật ngữ với nghĩa tương ứng: SIFT, ATM, mã TC1/TC2/NC1, cấp AIAS và các bộ quy tắc.","time":"2–4 phút","group":"Cá nhân hoặc cặp","tag":"Khái niệm","rule":"Mỗi lượt lật 2 thẻ; ghép đúng thì giữ mở, sai thì úp lại. Mở hết 6 cặp là thắng; xếp theo số lượt lật ít nhất."},{"id":"phan-loai-vao-gio","type":"sort","name":"Phân loại vào giỏ","genre":"Phân loại nhanh","desc":"Ba bộ thẻ: mức dữ liệu của trẻ, việc nào giao AI, hành vi thuộc cấp TC1/TC2/NC1. Mỗi thẻ chỉ một lần bấm.","time":"2–3 phút","group":"Cá nhân hoặc nhóm","tag":"Phân loại","rule":"Mỗi thẻ chọn một giỏ; đúng 10 điểm, sai hiện giải thích ngắn và chuyển thẻ tiếp theo."},{"id":"sap-xep-quy-trinh","type":"order","name":"Sắp xếp quy trình","genre":"Tư duy thứ tự","desc":"Xếp lại bốn bước SIFT, bảy bước ứng phó sự cố, năm thành phần prompt, vòng kiểm chứng và vòng cải thiện câu lệnh.","time":"2–4 phút","group":"Nhóm đôi","tag":"Quy trình","rule":"Bấm các bước để xếp đúng thứ tự, bấm lại để trả về. Xếp đủ thì kiểm tra một lượt; mỗi vị trí đúng 10 điểm."},{"id":"san-loi-prompt","type":"spot","name":"Săn lỗi prompt","genre":"Phát hiện lỗi","desc":"Sáu câu lệnh mẫu, mỗi câu mắc một lỗi: lộ dữ liệu, thiếu vai trò, thiếu định dạng hoặc không có bước tự kiểm chứng.","time":"2–3 phút","group":"Cá nhân","tag":"Prompt","rule":"Chọn một trong bốn loại lỗi; đúng 10 điểm, sai hiện đáp án và cách sửa ngắn gọn."},{"id":"dien-tu-con-thieu","type":"fill","name":"Điền từ còn thiếu","genre":"Điền khuyết","desc":"Năm câu về SIFT, thang AIAS, bộ 4 KHÔNG, mã TC/NC và ba lớp bằng chứng; chọn từ trong kho có cả từ gây nhiễu.","time":"2–3 phút","group":"Cá nhân hoặc nhóm","tag":"Ghi nhớ","rule":"Bấm từ trong kho để điền vào chỗ trống, bấm lại chỗ trống để trả từ về. Kiểm tra cả câu một lượt; mỗi chỗ đúng 10 điểm."},{"id":"vong-xoay","type":"link","href":"#/tro-choi/vong-xoay","name":"Vòng xoay may mắn","genre":"Chọn câu hỏi · chia nhóm","desc":"Quay để chọn câu hỏi ôn tập hoặc chia nhóm; dùng khi chiếu cả lớp, kết quả hiện kèm đáp án.","time":"5–10 phút","group":"Cả lớp","tag":"Máy chiếu","rule":"Chọn chế độ câu hỏi hoặc nhóm, bấm Quay; kết quả hiện kèm đáp án để chiếu."}],"match":{"pairs":[{"term":"SIFT","def":"Dừng lại – Điều tra – Tìm nguồn – Truy vết"},{"term":"ATM1","def":"Tin giả, tin nửa sự thật, bóp méo ngữ cảnh"},{"term":"ATM3","def":"Bảo vệ dữ liệu cá nhân"},{"term":"ATM7","def":"Sử dụng AI an toàn, trung thực"},{"term":"TC1","def":"Lớp 6–7: việc quen thuộc, có hướng dẫn"},{"term":"TC2","def":"Lớp 8–9: tự tổ chức, biết phản biện"},{"term":"NC1","def":"Lớp 10–12: tự chủ, dẫn dắt nhóm"},{"term":"AIAS Cấp 2","def":"AI gợi ý ý tưởng; sản phẩm cuối do học sinh làm"},{"term":"AIAS Cấp 3","def":"AI tạo nháp; học sinh đánh giá, sửa, chịu trách nhiệm"},{"term":"Thẻ vàng","def":"Làm cùng AI, giáo viên kiểm từng chi tiết"},{"term":"4 KHÔNG","def":"Không định danh, không làm hộ, không tin tuyệt đối, không chia sẻ OTP"},{"term":"3 CÓ","def":"Có kiểm chứng, có minh bạch, có kết nối trợ giúp"}]},"sort":{"sets":[{"id":"du-lieu","title":"Dữ liệu của trẻ thuộc mức nào?","instruction":"Chọn mức đúng cho từng thông tin trước khi định gửi lên công cụ AI.","buckets":[{"id":"public","label":"Công khai"},{"id":"internal","label":"Nội bộ"},{"id":"sensitive","label":"Nhạy cảm"},{"id":"never","label":"Không gửi AI"}],"items":[{"text":"Tên trường và địa chỉ trường","bucket":"public","note":"Thông tin đã công bố trên cổng trường."},{"text":"Thực đơn tuần của trường","bucket":"public","note":"Thường được công bố cho phụ huynh."},{"text":"Bảng phân công trực nhật theo tổ","bucket":"internal","note":"Dùng trong lớp, không cần đưa ra ngoài."},{"text":"Kế hoạch họp phụ huynh chưa duyệt","bucket":"internal","note":"Dự thảo nội bộ của nhà trường."},{"text":"Danh sách lớp kèm họ tên đầy đủ","bucket":"sensitive","note":"Dữ liệu định danh: chỉ dùng nội bộ có phân quyền."},{"text":"Số điện thoại phụ huynh trong nhóm chat lớp","bucket":"sensitive","note":"Thông tin liên hệ cá nhân, không dán lên AI."},{"text":"Ảnh chụp rõ mặt trẻ","bucket":"never","note":"Không đưa ảnh mặt trẻ vào công cụ AI công cộng."},{"text":"Thông tin dị ứng, sức khỏe của một trẻ","bucket":"never","note":"Dữ liệu sức khỏe là nhạy cảm nhất, tuyệt đối không gửi."},{"text":"Ảnh CCCD của phụ huynh","bucket":"never","note":"Giấy tờ tùy thân: không chụp, không lưu, không gửi."},{"text":"Báo cáo tổng hợp ẩn danh số trẻ tham gia","bucket":"internal","note":"Đã bỏ định danh nhưng vẫn là số liệu nội bộ của trường."}]},{"id":"giao-ai","title":"Việc nào giao AI, việc nào giáo viên giữ?","instruction":"Chọn nhóm đúng theo nguyên tắc thẻ xanh – thẻ vàng – thẻ đỏ.","buckets":[{"id":"green","label":"Xanh: giao AI làm nháp"},{"id":"yellow","label":"Vàng: làm cùng AI, kiểm kỹ"},{"id":"red","label":"Đỏ: giáo viên giữ lại"}],"items":[{"text":"Soạn 10 câu trắc nghiệm nháp cho bài ôn","bucket":"green","note":"AI tạo bản đầu, giáo viên đọc và chọn câu dùng được."},{"text":"Tạo hình minh họa cho bài đọc","bucket":"green","note":"Dễ kiểm bằng mắt: sai thì đổi hình khác."},{"text":"Gợi ý 5 trò chơi vận động cho tiết học","bucket":"green","note":"Danh sách gợi ý, giáo viên tự chọn trò phù hợp."},{"text":"Viết lời dẫn hoạt động khởi động","bucket":"yellow","note":"Giáo viên đưa ý chính, AI diễn đạt, đọc và sửa từng câu."},{"text":"Tóm tắt văn bản chỉ đạo của Sở","bucket":"yellow","note":"Bản tóm tắt phải đối chiếu lại số hiệu, mốc thời gian."},{"text":"Xác định mục tiêu bài học","bucket":"red","note":"Cần hiểu học sinh và chương trình; AI không quyết thay."},{"text":"Quyết định học sinh nào cần hỗ trợ","bucket":"red","note":"Phán đoán sư phạm và dữ liệu học tập của từng em."},{"text":"Nhận xét quá trình học của một em","bucket":"red","note":"Liên quan cảm xúc và quan hệ thầy trò."}]},{"id":"ma-nang-luc","title":"Hành vi thuộc cấp năng lực nào?","instruction":"Chọn cấp đúng: TC1 cho lớp 6–7, TC2 cho lớp 8–9, NC1 cho lớp 10–12.","buckets":[{"id":"TC1","label":"TC1 · lớp 6–7"},{"id":"TC2","label":"TC2 · lớp 8–9"},{"id":"NC1","label":"NC1 · lớp 10–12"}],"items":[{"text":"Làm theo phiếu hướng dẫn để vẽ biểu đồ","bucket":"TC1","note":"Việc quen thuộc, có hướng dẫn từng bước."},{"text":"Dùng mẫu có sẵn để ghép ảnh vào bài trình chiếu","bucket":"TC1","note":"Thao tác quen thuộc theo mẫu."},{"text":"Chỉnh sửa bài theo góp ý của cô","bucket":"TC1","note":"Làm lại việc đã được chỉ dẫn."},{"text":"Tự lập kế hoạch khảo sát cho nhóm","bucket":"TC2","note":"Tự tổ chức việc học ở mức trung cấp."},{"text":"Phản biện số liệu của bạn cùng nhóm","bucket":"TC2","note":"Biết phản biện ở mức phù hợp lứa tuổi."},{"text":"Dẫn dắt nhóm tổng hợp và đánh giá chéo nguồn","bucket":"NC1","note":"Tự chủ, dẫn dắt nhóm và đánh giá nguồn."},{"text":"Thiết kế sản phẩm số mới cho dự án","bucket":"NC1","note":"Tự chủ tạo sản phẩm cho vấn đề mới."},{"text":"Tự chọn công cụ và phân công việc cho nhóm","bucket":"NC1","note":"Tổ chức và điều phối nhóm học tập."}]}]},"order":{"sets":[{"id":"sift","title":"SIFT – bốn bước kiểm chứng một tin","steps":["Dừng lại, không chia sẻ vội","Điều tra nguồn đăng","Tìm nguồn tốt hơn","Truy vết bản gốc"]},{"id":"su-co","title":"Bảy bước ứng phó sự cố an toàn mạng","steps":["Tiếp nhận bình tĩnh, không phán xét","Không hứa giữ bí mật tuyệt đối","Lưu bằng chứng đúng cách","Phân loại ba mức độ","Báo đầu mối an toàn số của trường","Phối hợp gia đình và cơ quan chức năng","Theo dõi, phục hồi và phòng ngừa"]},{"id":"prompt","title":"Năm thành phần của một câu lệnh","steps":["Vai – AI đóng vai ai","Bối cảnh – ở đâu, cho ai","Nhiệm vụ – cần làm gì","Yêu cầu – ràng buộc nào","Định dạng – nộp dạng gì"]},{"id":"kiem-chung","title":"Kiểm chứng 4 bước trước khi đến tay học sinh","steps":["Đọc như học sinh lớp mình","Đối chiếu sách giáo khoa, tự làm lại","Sửa và rà thiên kiến","Ghi nhãn và lưu bản đã duyệt"]},{"id":"vong-lap","title":"Vòng lặp cải thiện câu lệnh","steps":["Hỏi – gửi prompt đủ thành phần","Đọc toàn bộ, đánh dấu chỗ chưa đạt","Kiểm – đối chiếu nguồn, thử lại","Sửa – viết lại câu lệnh"]}]},"spot":{"flaws":["Lộ dữ liệu cá nhân","Thiếu vai trò hoặc bối cảnh","Thiếu định dạng đầu ra","Không có bước tự kiểm chứng"],"rounds":[{"text":"Bạn là giáo viên Ngữ văn 8. Dựa trên bài kiểm tra của bạn Nguyễn Văn A, lớp 8B, điểm 6,5, hãy viết nhận xét để gửi phụ huynh.","correct":0,"explain":"Tên riêng, lớp và điểm số là dữ liệu định danh. Thay bằng mã ẩn danh như “học sinh X, lớp 8” trước khi gửi."},{"text":"Viết cho tôi 5 câu hỏi ôn tập về quang hợp.","correct":1,"explain":"Không nói AI đóng vai ai, cho lớp nào, trình độ ra sao — kết quả sẽ chung chung hoặc quá khó."},{"text":"Bạn là giáo viên Tin học lớp 5. Soạn nội dung ôn tập về an toàn mạng để chiếu cho cả lớp.","correct":2,"explain":"Thiếu định dạng: bao nhiêu câu, dạng trắc nghiệm hay hỏi đáp, có đáp án không, mỗi câu dài bao nhiêu."},{"text":"Bạn là giáo viên Toán 8. Soạn đề kiểm tra 15 phút về phương trình bậc nhất cho lớp 8A, in A4, có đáp án.","correct":3,"explain":"Câu lệnh tốt nhưng thiếu yêu cầu AI tự rà lại: kiểm tra số liệu, mức độ phù hợp và chỉ ra chỗ chưa chắc."},{"text":"Soạn kế hoạch bài dạy Tiếng Việt lớp 2 cho bài “Họa mi hót”.","correct":1,"explain":"Có môn và lớp nhưng thiếu vai trò cụ thể, số học sinh, thiết bị và thời lượng — AI phải tự đoán."},{"text":"Bạn là giáo viên mầm non. Viết bài thơ về mùa thu cho trẻ 4 tuổi, đính kèm ảnh của bé Minh lớp tôi để minh họa.","correct":0,"explain":"Tên và ảnh của một đứa trẻ là dữ liệu định danh, không được đưa vào công cụ AI công cộng."}]},"fill":{"rounds":[{"sentence":"SIFT gồm bốn bước: Dừng lại – Điều tra nguồn – ___ – ___.","answers":["Tìm nguồn tốt hơn","Truy vết"],"bank":["Chia sẻ ngay","Xóa bằng chứng"],"explain":"SIFT là Dừng lại – Điều tra – Tìm nguồn – Truy vết."},{"sentence":"Thang AIAS có năm cấp, từ Cấp 1 là ___ đến Cấp 5 là ___.","answers":["Không dùng AI","Khám phá cùng AI"],"bank":["Hợp tác với AI","Dùng AI toàn diện"],"explain":"Cấp 1 là làm bài tự thân; Cấp 5 là học sinh sáng tạo cùng AI để giải vấn đề mới."},{"sentence":"4 KHÔNG nhắc: không nhập thông tin định danh, không dùng AI làm hộ bài kiểm tra, không tin tuyệt đối kết quả AI, không chia sẻ ___ và không bấm ___.","answers":["mật khẩu, mã OTP","link lạ"],"bank":["ảnh lớp","mã văn bản"],"explain":"Mật khẩu, mã OTP và link lạ là ba cửa ngõ bị chiếm tài khoản thường gặp."},{"sentence":"Mã năng lực của học sinh: khối 6–7 dùng ___, khối 8–9 dùng ___, khối 10–12 dùng ___.","answers":["TC1","TC2","NC1"],"bank":["TC3","NC2"],"explain":"TC1 và TC2 là hai bậc của THCS; NC1 là bậc dành cho THPT."},{"sentence":"Một tiết học có AI nên có ba lớp bằng chứng: sản phẩm, ___ và ___.","answers":["quá trình","vấn đáp"],"bank":["điểm số","chuyên cần"],"explain":"Sản phẩm cho biết kết quả; quá trình và vấn đáp cho biết học sinh thật sự hiểu và tự làm."}]}}}</script>

Đầu năm, một phụ huynh hỏi cô Hạnh: “Sao cô cho con học an toàn mạng mà không dạy Toán?” Cô không trả lời bằng cảm tính. Cô mở sổ, chỉ dòng ghi Công văn 6206 và Quyết định 2422: an toàn mạng là nội dung phải tích hợp, không phải tiết học thêm. Phụ huynh gật đầu. Cô Hạnh kể, từ đó cô dán một tờ giấy nhớ sáu số hiệu văn bản trong ví, không để học thuộc, chỉ để trả lời đúng khi bị hỏi.
**Liên tưởng:** căn cứ pháp lý giống chiếc la bàn trong ba lô — không cần mở mỗi ngày, nhưng lạc đường thì phải có.
:::

## Vì sao giáo viên cần biết?

Ba ngày tập huấn không yêu cầu bạn đọc hết hàng trăm trang. Nhưng khi tổ trưởng hỏi “mã này lấy ở đâu?”, khi phụ huynh hỏi “vì sao con tôi phải học an toàn mạng?”, bạn cần trả lời được bằng **một câu có căn cứ**. Sáu văn bản dưới đây là đủ cho phần lớn tình huống ở trường.

## Sáu văn bản, sáu việc phải làm

| Văn bản | Quy định điều gì | Việc cụ thể của bạn |

| Quyết định 2422/QĐ-BGDĐT | Khung nội dung giáo dục AI: 4 mạch NLa – NLb – NLc – NLd | Chọn một mạch phù hợp với bài, không biến tiết Văn thành tiết lập trình |

## Ba mức và ba nhóm

Thông tư 18/2026 chia năng lực giáo viên thành ba mức:

- **Cơ bản:** sử dụng được công cụ ở mức cần thiết.
- **Thành thạo:** thiết kế được hoạt động sư phạm có tích hợp công nghệ.
- **Nâng cao:** sáng tạo, đổi mới và dẫn dắt đồng nghiệp.

Chương trình Nghệ An dùng cách gọi **Nhóm A – Cơ bản, Nhóm B – Thành thạo, Nhóm C – Nâng cao** để xếp lộ trình bồi dưỡng. Đây là cách phân nhóm để hỗ trợ nhau, không phải nhãn đánh giá con người. Trong [Phòng thực hành](#/cong-cu/self) có 12 câu giúp bạn tự xếp nhóm tham khảo.

## Hai phương án song hành

Nghệ An có trường ở đồng bằng, ven biển và miền núi. Vì vậy mọi hoạt động trong tài liệu đều phải trả lời được câu hỏi: **nếu lớp không có thiết bị hoặc không có mạng thì làm thế nào?**

| Có thiết bị | Không có thiết bị |
|---|---|
| Học sinh tra cứu trên điện thoại của giáo viên theo nhóm | Phiếu in sẵn nội dung và câu hỏi |
| Bài kiểm tra ngắn trên Quizizz hoặc Google Forms | Thẻ giấy, giơ tay, bảng con |
| Video, mô phỏng trên máy chiếu | Tranh in, vật thật, kịch bản đóng vai |
| Kho học liệu trên Drive của tổ | Kẹp hồ sơ in, mã QR dán ở lớp do trường phát hành |

:::warn Đừng bắt học sinh đăng ký tài khoản
Không yêu cầu học sinh đăng ký tài khoản cá nhân hoặc nhập thông tin định danh lên nền tảng công cộng để “cho đủ công nghệ”. Nếu nền tảng bắt buộc, giáo viên dùng tài khoản lớp do trường cấp và ẩn danh dữ liệu.
:::

## Bốn tấm bản đồ chồng lên nhau

Một kế hoạch bài dạy tốt có thể chạm vào bốn hệ thống khác nhau. Đừng nhầm chúng:

1. **Năng lực số của giáo viên** – Thông tư 18/2026: 6 miền, 20 năng lực thành phần, 3 mức.
2. **Năng lực số của học sinh** – Thông tư 02/2025: 6 miền, 24 năng lực; THCS dùng TC1/TC2, THPT dùng NC1.
3. **Giáo dục AI** – Quyết định 2422: 4 mạch NLa, NLb, NLc, NLd.
4. **An toàn mạng** – Công văn 6206: 8 chủ đề ATM1–ATM8.

Giáo viên thường chỉ cần ghi hai hệ thống sau vào kế hoạch bài dạy: **mã năng lực của học sinh** và **chủ đề ATM**. Hai hệ thống đầu dùng để tự đánh giá và thiết kế hoạt động.

## Sáu miền năng lực của giáo viên

| Miền | Tên miền | Việc quen thuộc | Mức cơ bản có thể bắt đầu bằng |
|---|---|---|---|
| 1 | Tổ chức dạy học trong môi trường số | Lớp học kết hợp, học liệu số, quản lý hoạt động | Tạo một lớp trên Google Classroom hoặc Teams, đăng một học liệu |
| 2 | Kiểm tra, đánh giá | Kiểm tra thường xuyên, phản hồi, portfolio | Tạo bài kiểm tra 5 câu trên Google Forms hoặc Quizizz |
| 3 | Trao quyền cho người học | Học sinh tự tạo sản phẩm, tự chọn cách thể hiện | Giao một sản phẩm số thay cho bài chép |
| 4 | Kỹ năng công nghệ số | Chọn, dùng, bảo vệ dữ liệu, xử lý sự cố | Biết ẩn danh dữ liệu trước khi đưa vào công cụ |
| 5 | Phát triển chuyên môn | Sinh hoạt tổ, chia sẻ học liệu, học liệu mở | Chia sẻ một học liệu có ghi nguồn cho đồng nghiệp |
| 6 | Trí tuệ nhân tạo | Dùng AI có trách nhiệm, kiểm chứng đầu ra | Dùng AI gợi ý ý tưởng rồi tự sửa |

Mỗi miền có các năng lực đánh số, ví dụ miền 1 có 1.1 đến 1.4; miền 6 có 6.1 đến 6.4. Tổng cộng 20 năng lực thành phần.

:::tip Cách tự đánh giá nhanh
Chọn **một việc** trong mỗi miền mà bạn đã làm được mà không cần ai giúp. Đó là mức Cơ bản. Việc bạn làm được nhưng còn lúng túng khi học sinh hỏi lại là mức Thành thạo đang hình thành. Việc bạn có thể hướng dẫn đồng nghiệp làm là mức Nâng cao.
:::

## Mã năng lực của học sinh: TC1, TC2, NC1

Cách đọc một mã:

**`1.2.TC2a`**

- `1` – miền thứ nhất (khai thác dữ liệu và thông tin).
- `2` – năng lực thành phần thứ hai trong miền.
- `TC2` – trình độ Trung cấp 2, dành cho lớp 8–9.
- `a` – chỉ báo cụ thể trong nhóm năng lực đó.

| Cấp | Lớp | Ký hiệu | Cách hiểu đơn giản |
|---|---|---|---|
| THCS | 6–7 | TC1 – Bậc 3 | Học sinh làm được việc quen thuộc với sự hướng dẫn |
| THCS | 8–9 | TC2 – Bậc 4 | Học sinh tự tổ chức việc học, biết phản biện ở mức phù hợp |
| THPT | 10–12 | NC1 – Bậc 5 | Học sinh tự chủ, biết dẫn dắt nhóm và đánh giá nguồn |

Một số mã hay dùng:

| Việc học | Mã THCS | Mã THPT |
|---|---|---|
| Tìm kiếm có chiến lược, đánh giá nguồn tin | 1.1.TC2b; 1.2.TC2a | 1.1.NC1b; 1.2.NC1a |
| Hợp tác trực tuyến, trích dẫn nguồn | 2.5.TC2a; 2.2.TC2c | 2.5.NC1a; 2.2.NC1c |
| Tạo sản phẩm số, bản quyền | 3.1.TC2b; 3.3.TC2a | 3.1.NC1a; 3.3.NC1a |
| Bảo vệ dữ liệu, nhận diện lừa đảo | 4.1.TC2b; 4.2.TC2c | 4.1.NC1b; 4.2.NC1a |
| Giải quyết vấn đề bằng công cụ số | 5.2.TC2b; 5.4.TC2b | 5.2.NC1b |
| Dùng AI có trách nhiệm | 6.2.TC2c; 6.3.TC2a | 6.2.NC1c; 6.3.NC1a |

## Bốn mạch giáo dục AI

| Mạch | Nội dung | Ví dụ trong môn học |
|---|---|---|
| **NLa** – Tư duy lấy con người làm trung tâm | AI phục vụ con người, không thay thế phán đoán | Thảo luận: máy chấm điểm có công bằng với học sinh vùng khó? |
| **NLb** – Đạo đức AI | Thiên lệch, quyền riêng tư, trách nhiệm | Phân tích vì sao không được đưa ảnh học sinh vào AI tạo ảnh |
| **NLc** – Kỹ thuật và ứng dụng AI | Cách AI hoạt động, dùng đúng việc | Dùng AI tóm tắt tư liệu rồi kiểm chứng lại |
| **NLd** – Thiết kế hệ thống AI | Hiểu hệ thống, quy trình, giới hạn | Vẽ sơ đồ luồng: dữ liệu vào – xử lý – đầu ra – người kiểm tra |

Không cần dạy cả bốn mạch trong một tiết. Chọn **một mạch** gắn tự nhiên với nội dung bài.

## Tám chủ đề an toàn mạng

| Mã | Chủ đề | Tình huống lớp học |
|---|---|---|
| ATM1 | Tin giả, tin nửa sự thật, bóp méo ngữ cảnh | Ảnh chụp thông báo nghỉ học lan trong nhóm Zalo |
| ATM2 | Bắt nạt mạng, quấy rối trực tuyến | Nhóm chat lớp dùng biệt danh chế giễu một bạn |
| ATM3 | Bảo vệ dữ liệu cá nhân | Ảnh CCCD, số điện thoại bị đăng công khai |
| ATM4 | Lừa đảo trực tuyến, dụ dỗ | Tài khoản lạ rủ chơi game, đòi ảnh riêng tư |
| ATM5 | Sức khỏe số và môi trường | Thức khuya vì video ngắn; pin cũ vứt bừa |
| ATM6 | Bản quyền, tôn trọng môi trường số | Dùng nhạc, ảnh không ghi nguồn trong video |
| ATM7 | Sử dụng AI an toàn, trung thực | AI bịa nguồn; học sinh nộp bài AI nguyên văn |
| ATM8 | Tìm trợ giúp, phục hồi sau sự cố | Tài khoản bị chiếm; biết gọi ai, báo ở đâu |

## Ghi mã đúng chỗ: ba ví dụ

**Ví dụ 1 – Ngữ văn 8, bài văn bản thông tin.** Học sinh kiểm chứng một tin lan truyền bằng SIFT. Ghi: `1.2.TC2a` (đánh giá độ tin cậy nguồn tin) và `ATM1`. Mạch AI phù hợp: NLb (trách nhiệm khi chia sẻ) hoặc NLc (giới hạn của công cụ tìm kiếm).

**Ví dụ 2 – Toán 8, thu thập dữ liệu.** Học sinh khảo sát ẩn danh rồi vẽ biểu đồ. Ghi: `1.3.TC2b` (quản lý dữ liệu có cấu trúc) hoặc `2.5.TC2a` (thảo luận, trình bày), kèm `ATM3`. Không ghi ATM1 nếu bài không có nội dung kiểm chứng tin.

**Ví dụ 3 – Vật lí 11, dao động.** Học sinh dự đoán rồi kiểm chứng bằng mô phỏng. Ghi: `1.1.NC1b` (tìm kiếm chuyên sâu) và `5.2.NC1b` (dùng công cụ giải quyết vấn đề), có thể thêm `ATM7` nếu học sinh dùng AI để giải thích.

:::warn Ba lỗi thường gặp
1. **Ghi mã ở đầu bài nhưng hoạt động không dạy mã đó.** Hãy ghi mã ngay cạnh hoạt động tương ứng.
2. **Ghi càng nhiều mã càng tốt.** Một bài nên có 1–2 mã năng lực và 1 chủ đề ATM.
3. **Dùng mã của giáo viên cho học sinh.** Mã 6.2.TC2c là của học sinh; mã miền 6 của giáo viên dùng để tự đánh giá, không chép vào cột học sinh.
:::

- [ ] Tra bảng ma trận của khối mình để chọn đúng mã TC1/TC2 hoặc NC1.
- [ ] Chọn một chủ đề ATM1–ATM8, không chọn quá hai.

:::

? Ghi mã thế nào là đúng? | Ghi càng nhiều mã càng tốt | Ghi 1–2 mã gắn với hoạt động thật* | Chỉ ghi ở tiêu đề bài | Mã phải gắn với hoạt động học cụ thể.
:::

<script type="text/plain" class="lesson-src" data-id="c3-an-toan"># An toàn số: SIFT, 4 KHÔNG – 3 CÓ và 7 bước ứng phó

:::note Mục tiêu
Có trong tay ba thứ dùng được ngay: quy trình kiểm chứng tin trong 4 bước, bộ quy tắc dán ở lớp, và quy trình 7 bước khi một học sinh gặp sự cố trên mạng.
:::

:::story Tin nhắn trong đêm lũ
Trận lũ tháng 10, một tin nhắn “hồ chứa xả lũ lúc 9 giờ tối” lan khắp nhóm phụ huynh. Cô Mai định chuyển tiếp thì dừng lại, làm theo SIFT: tra nguồn, mở ảnh gốc, tìm tin tương tự. Hóa ra tấm ảnh là của năm trước, giờ xả lũ cũng khác. Cô gửi ảnh chụp nguồn chính thức vào nhóm kèm một câu: “Mình kiểm rồi, mọi người đọc bản này.” Nhóm lặng đi một lúc, rồi có người cảm ơn.
**Liên tưởng:** tin giả lan nhanh như nước lũ; SIFT là con đê nhỏ chặn ngay từ cửa nhà.
:::

## Phần 1 · SIFT: bốn bước trước khi tin hoặc chia sẻ

SIFT là viết tắt của **Stop – Investigate – Find – Trace**, tiếng Việt là **Dừng lại – Điều tra – Tìm nguồn – Truy vết**.

| Bước | Việc làm | Câu hỏi tự đặt |
|---|---|---|
| **Dừng lại** | Không bấm chia sẻ, không bình luận vội | “Mình đang cảm thấy thế nào? Có đang bị cuốn theo cảm xúc không?” |
| **Điều tra nguồn** | Xem ai đăng, đăng khi nào, có phải kênh chính thức không, ảnh có dấu hiệu chỉnh sửa không | “Người đăng có trách nhiệm về thông tin này không?” |
| **Tìm nguồn tốt hơn** | Tìm báo chí chính thống, cổng thông tin của trường, cơ quan chức năng | “Có nguồn nào đáng tin hơn đang nói về việc này?” |
| **Truy vết** | Đối chiếu bản gốc, mã văn bản, ngày ban hành, gọi người có trách nhiệm xác nhận | “Thông tin này bắt đầu từ đâu, có bị cắt khỏi ngữ cảnh không?” |

:::case Tình huống thật trong trường
Nhóm Zalo lớp lan truyền ảnh chụp thông báo “toàn tỉnh nghỉ học ngày mai vì bão”. Ảnh mờ, không có mã văn bản, người gửi là tài khoản lạ.

- **Dừng:** không chuyển tiếp.
- **Điều tra:** tài khoản đăng không phải cổng trường; ảnh không có ngày, không có số văn bản.
- **Tìm nguồn tốt hơn:** mở cổng thông tin của trường và Sở GD&ĐT; không thấy thông báo.
- **Truy vết:** gọi văn phòng trường xác nhận; kết luận: tin sai, có thể là ảnh cũ bị chỉnh ngày.
:::

:::tip Dạy SIFT trong 15 phút
Phát cho mỗi nhóm một tin thật đang lan ở địa phương và phiếu bốn ô. Nhóm ghi bằng chứng cho từng ô, không ghi cảm xúc. Sau đó mỗi nhóm trình bày trong 1 phút: “Chúng em kết luận tin này vì…”. Giáo viên chỉ hỏi thêm: “Nguồn thứ hai độc lập với nguồn thứ nhất ở chỗ nào?”
:::

## Phần 2 · 4 KHÔNG – 3 CÓ

Bộ quy tắc này được niêm yết ở lớp và phòng Tin học. Có thể in thành thẻ A4 ở [Bộ phiếu in](#/in).

### 4 KHÔNG

1. **Không nhập thông tin định danh cá nhân** – họ tên đầy đủ, số định danh, địa chỉ, số điện thoại, bảng điểm, ảnh riêng tư của mình hoặc của người khác – lên công cụ AI công cộng và nền tảng không rõ nguồn gốc.
2. **Không dùng AI để đạo văn, làm hộ bài kiểm tra**, hoặc tạo ảnh, âm thanh cắt ghép (deepfake) nhằm bôi nhọ, bắt nạt người khác.
3. **Không tin tuyệt đối kết quả AI** khi chưa đối chiếu sách giáo khoa hoặc nguồn khoa học chính thống.
4. **Không chia sẻ mật khẩu, mã OTP, không bấm link lạ**, và không im lặng khi mình hoặc bạn bị đe dọa trên mạng.

### 3 CÓ

1. **Có kiểm chứng** bằng quy trình 4 bước SIFT trước khi tin và chia sẻ.
2. **Có minh bạch và tôn trọng bản quyền:** ghi nguồn tài liệu, hình ảnh; chú thích rõ phần có sử dụng AI hỗ trợ.
3. **Có kết nối trợ giúp:** báo ngay giáo viên chủ nhiệm, tổ tư vấn học đường, cha mẹ hoặc Tổng đài 111 khi phát hiện nguy cơ mất an toàn.

:::warn Điều giáo viên hay quên
“Không tin tuyệt đối AI” không chỉ là lời nhắc học sinh. Chính giáo viên cũng phải kiểm tra lại mọi nội dung AI gợi ý trước khi đưa vào bài giảng, đặc biệt là số liệu, mốc lịch sử, địa danh và trích dẫn.
:::

## Phần 3 · Quy trình 7 bước ứng phó sự cố

Quy trình dành cho cán bộ quản lý và giáo viên chủ nhiệm, theo tài liệu NAEM 2026.

1. **Tiếp nhận bình tĩnh, không phán xét.** Lắng nghe, khẳng định học sinh đã làm đúng khi tìm sự hỗ trợ. Không trách mắng, không tịch thu thiết bị vội vàng, không đổ lỗi cho nạn nhân – kể cả khi tài khoản của em bị chiếm quyền và dùng để nhắn tin xấu.
2. **Không hứa giữ bí mật tuyệt đối.** Giải thích nhẹ nhàng rằng thầy cô cần phối hợp với người có trách nhiệm để bảo vệ em, và thông tin chỉ chia sẻ cho đúng người có thẩm quyền.
3. **Lưu bằng chứng đúng cách.** Chụp màn hình hiển thị rõ nội dung vi phạm, tên hoặc ID tài khoản, đường dẫn và thời gian; lưu vào thư mục bảo mật, phân quyền riêng.
4. **Phân loại ba mức độ** (xem bảng bên dưới).
5. **Báo ngay đầu mối an toàn số của trường:** Phó Hiệu trưởng phụ trách hoặc Tổ tư vấn tâm lý học đường.
6. **Phối hợp gia đình và cơ quan chức năng.** Với Mức 3, gọi Tổng đài Quốc gia Bảo vệ Trẻ em **111** (miễn phí, 24/7) hoặc công an địa phương.
7. **Theo dõi, phục hồi tâm lý và phòng ngừa tái diễn.** Hỗ trợ học sinh ổn định, khóa hoặc khôi phục tài khoản an toàn, rút kinh nghiệm kín trong sinh hoạt lớp.

### Ba mức sự cố

| Mức | Dấu hiệu | Ai xử lý |
|---|---|---|
| **Mức 1 – Nhẹ** | Trêu chọc, hiểu lầm trong nhóm chat | Giáo viên chủ nhiệm xử lý sư phạm |
| **Mức 2 – Trung bình** | Bắt nạt lặp lại, mạo danh, lộ thông tin cá nhân | Báo ban giám hiệu, phối hợp phụ huynh |
| **Mức 3 – Nghiêm trọng** | Dụ dỗ tình dục (grooming), tống tiền, phát tán ảnh nhạy cảm, đe dọa tự hại | Can thiệp khẩn cấp; gọi 111, 113; báo cơ quan chức năng |

:::do Câu nói mẫu khi học sinh vừa kể sự cố
“Cảm ơn em đã nói với thầy/cô. Em làm đúng khi tìm người lớn. Việc này không phải lỗi của em. Thầy/cô sẽ cùng em xử lý từng bước, nhưng thầy/cô cần báo cho người có trách nhiệm để bảo vệ em an toàn. Mình sẽ không công khai câu chuyện của em.”
:::

:::warn Ba việc không làm
- Không yêu cầu học sinh kể lại trước lớp hoặc lấy câu chuyện thật làm ví dụ công khai.
- Không xóa bằng chứng trước khi chụp lại.
- Không tự liên hệ với người gây hại để “nói chuyện cho rõ”.
:::

## Phần 4 · Phòng ngừa trong lớp học

- Dạy SIFT bằng tin thật, không dùng tin gây sốc.
- Có hộp thư kín hoặc kênh báo riêng để học sinh không phải nói trước lớp.
- Niêm yết đầu mối an toàn số và số 111 ở nơi học sinh dễ thấy.
- Nhắc lại 4 KHÔNG – 3 CÓ mỗi đầu học kỳ, không chỉ một lần.
- Với lớp không có thiết bị: dùng thẻ tình huống in sẵn, đóng vai “người quan sát tích cực”.
