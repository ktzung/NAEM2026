:::story Tấm ảnh trong nhóm lớp
Phụ huynh gửi vào nhóm lớp một ảnh bé đang ngủ, kèm số điện thoại để “tiện liên lạc”. Cô giáo định đưa ảnh lên công cụ AI làm thiệp. Cô dừng lại, tự hỏi: ảnh này có được phép đưa ra ngoài không? Cô dùng ảnh minh họa thay thế, xóa số điện thoại khỏi nhóm, rồi nhắc cả lớp bốn nguyên tắc dữ liệu trẻ. Phụ huynh gửi ảnh hôm ấy là người cảm ơn trước tiên.
**Liên tưởng:** dữ liệu của trẻ như chìa khóa nhà; tiện đến đâu cũng không được đưa cho người lạ.
:::

## Phần 1 · Nhiệm vụ quyết định công cụ

Không có công cụ AI nào tốt nhất cho mọi việc. Một video kể chuyện cần cả chuỗi: chatbot viết kịch bản → công cụ hình ảnh vẽ tranh → CapCut hoặc Canva ghép video, lồng giọng đọc.

Tám nhóm công cụ thường dùng:

| Nhóm | Ví dụ | Việc chính |
|---|---|---|
| Văn bản | ChatGPT, Gemini, Copilot, Claude | Kế hoạch, truyện, thơ, thông báo, tóm tắt |
| Trình chiếu | Gamma, Canva | Tạo bộ trình chiếu từ dàn ý |
| Hình ảnh | Gemini, ChatGPT, Canva | Tranh minh hoạ, lô tô, poster |
| Video | CapCut, Canva | Dựng video, phụ đề, hiệu ứng |
| Âm thanh | Giọng đọc AI, tạo nhạc | Giọng kể chuyện, lời hướng dẫn, nhạc nền |
| Học liệu số | Canva, Napkin, Wordwall, Padlet | Thẻ hình, sơ đồ, trò chơi tương tác |
| Phân tích tài liệu | NotebookLM, Gemini | Tóm tắt, hỏi đáp theo tài liệu |
| Quản lý lớp | Google Forms, Sheets, nhóm Zalo, LMS | Khảo sát, tổng hợp số liệu, thông báo |

Lưu ý riêng: ảnh AI hay sai số ngón tay, chữ viết, tỉ lệ con vật; NotebookLM trả lời dựa trên tài liệu tải lên và chỉ ra đoạn nguồn, phù hợp tra cứu văn bản chỉ đạo.

## Phần 2 · Bảy tiêu chí chọn công cụ

1. **Mục đích** — có làm ra đúng loại sản phẩm mình cần không?
2. **Tiếng Việt** — hiểu, viết tự nhiên; giọng đọc đúng dấu, đúng ngữ điệu?
3. **Chi phí** — bản miễn phí có đủ dùng; giới hạn lượt có ảnh hưởng công việc?
4. **An toàn dữ liệu** — chính sách bảo mật rõ; có tùy chọn không dùng dữ liệu để huấn luyện?
5. **Độ tuổi** — sản phẩm phù hợp trẻ mầm non; điều khoản có giới hạn tuổi người dùng?
6. **Thiết bị** — dùng được trên máy trường đang có?
7. **Mạng** — cần đường truyền mạnh không; dùng được khi mạng yếu ở điểm trường?

Quy trình 5 bước: xác định nhóm công cụ → lọc theo 7 tiêu chí → thử 2–3 công cụ với cùng một prompt → chọn kết quả tốt nhất → ghi vào “Bản đồ công cụ AI”. Mỗi nhiệm vụ nên có một công cụ chính và một công cụ dự phòng.

:::warn Lưu ý an toàn khi chọn và dùng
Không tải văn bản mật, hồ sơ có thông tin trẻ lên công cụ phân tích tài liệu. Không ghi tình trạng sức khỏe riêng của trẻ trong nhóm Zalo chung. Chỉ đưa vào AI thông tin thật sự cần thiết, đã ẩn danh.
:::

## Phần 3 · Dữ liệu trẻ: bốn nguyên tắc

Theo tinh thần Luật Bảo vệ dữ liệu cá nhân 2025 và Luật Trí tuệ nhân tạo 2025:

1. **Trẻ em được bảo vệ đặc biệt** — xử lý dữ liệu trẻ cần sự đồng ý của cha mẹ hoặc người giám hộ.
2. **Đúng mục đích, tối thiểu hoá** — chỉ thu thập, sử dụng thông tin thật sự cần thiết.
3. **An toàn** — người giữ dữ liệu phải có biện pháp bảo vệ, không để lộ, mất, dùng sai.
4. **Lấy con người làm trung tâm, minh bạch** — AI không thay thế trách nhiệm của con người.

Dữ liệu cá nhân của trẻ gồm: họ tên, ngày sinh, ảnh, video, giọng nói, địa chỉ, thông tin cha mẹ, cân nặng, kết quả đánh giá. Đặc biệt nhạy cảm: sức khỏe và hoàn cảnh gia đình.

| Được đưa vào AI | Không được đưa vào AI |
|---|---|
| Mô tả chung: “lớp 4–5 tuổi, 30 trẻ, nhiều trẻ còn nói ngọng” | Danh sách họ tên, ngày sinh |
| Mã: Trẻ A, Trẻ B, Trẻ 01 | Tên thật kèm nhận xét hành vi, sức khỏe |
| Số liệu tổng hợp đã bỏ định danh | Hồ sơ, sổ theo dõi sức khỏe nguyên bản |
| Hình minh hoạ AI hoặc có giấy phép | Ảnh khuôn mặt trẻ vào công cụ tạo ảnh, video công cộng |

## Phần 4 · Bốn mức bảo mật

| Mức | Ví dụ | Ai được truy cập |
|---|---|---|
| 1 · Công khai | Tin bài đã duyệt; thực đơn tuần; thông báo tuyển sinh | Mọi người |
| 2 · Nội bộ | Học liệu số; kế hoạch giáo dục; biên bản chuyên môn | Cán bộ, giáo viên, nhân viên |
| 3 · Hạn chế | Hồ sơ nhân sự; tài chính; đánh giá viên chức | Ban giám hiệu, kế toán, người được giao |
| 4 · Bảo mật cao | Hồ sơ trẻ; sức khỏe, tăng trưởng; hoàn cảnh gia đình; ảnh, video có mặt trẻ | Giáo viên lớp phụ trách, nhân viên y tế, ban giám hiệu theo nhiệm vụ |

Quy tắc: dữ liệu trẻ chỉ lưu trên tài khoản của trường hoặc phần mềm của ngành, không đưa vào AI công cộng.

## Phần 5 · Ẩn danh hoá 4 bước

1. **Lập bảng mã** — L01–L30 (5–6 tuổi), N01–N28 (4–5 tuổi), B01–B25 (3–4 tuổi), NT01–NT20 (nhà trẻ).
2. **Thay thế** — tên trẻ thành mã; tên bạn chơi cùng thành “một bạn”; ngày cụ thể thành “tuần 1”, “tuần 2”.
3. **Lược bỏ** — xóa chi tiết sức khỏe, hoàn cảnh gia đình; chỉ giữ hành vi quan sát được.
4. **Đọc lại** — “Người ngoài đọc đoạn này có đoán ra trẻ là ai không?” Nếu có, tiếp tục lược bỏ.

Bảng đối chiếu mã – họ tên chỉ lưu ở nhà trường, có mật khẩu, không đưa lên AI.

## Phần 6 · Kho học liệu dùng chung

Kho phải thuộc tài khoản do nhà trường quản lý, không tạo bằng Gmail cá nhân rồi “chia sẻ cho trường” — khi giáo viên chuyển công tác, dữ liệu đi theo người đó.

Năm quy tắc vận hành:

1. Chủ sở hữu kho là tài khoản trường.
2. Tối đa 4 tầng thư mục; có thư mục hướng dẫn, chờ duyệt, lưu trữ năm học cũ.
3. Tên không dấu, không khoảng trắng, ngăn cách bằng gạch dưới, ngày theo năm-tháng-ngày.
4. Phân quyền theo nguyên tắc quyền tối thiểu: Quản lý · Chỉnh sửa · Nhận xét · Xem · Không.
5. Sao lưu 3–2–1: ba bản, hai nơi, một bản ngoài máy cá nhân; thử khôi phục mỗi học kỳ.

Sáu kho vận hành thống nhất: kho học liệu số, video, hình ảnh, bài giảng, biểu mẫu quản lý (kèm bộ prompt chuẩn), và kho chung của trường.

## Phần 7 · Sự cố và thu hồi quyền

Khi phát hiện ảnh trẻ bị đưa sai chỗ hoặc tài khoản lộ: gỡ nội dung, xóa khỏi ứng dụng nếu có thể, báo nhà trường, ghi sổ sự cố, rà lại quyền truy cập. Khi nhân sự thay đổi, thu hồi quyền trong ngày và chuyển quyền sở hữu tệp về tài khoản trường.

:::case Trường Hoa Sen chuyển dữ liệu về tài khoản trường
Trước đây sổ cân đo ghi tay, ảnh hoạt động nằm trong điện thoại giáo viên. Nhà trường tạo kho 6 thư mục trên tài khoản trường; nhân viên y tế nhập bảng tính trong thư mục Y tế (Mức 4); giáo viên chỉ xem phần lớp mình; ban giám hiệu xem tổng hợp. Ảnh có mặt trẻ không đưa lên nhóm chung. Sau một tháng, mọi dữ liệu trẻ nằm đúng nơi, đúng quyền.
:::

## Việc làm ngay

:::checklist
- [ ] Lập bản đồ công cụ: 8 nhiệm vụ, mỗi việc có công cụ chính và dự phòng.
- [ ] Phân loại 10 loại hồ sơ của lớp theo 4 mức bảo mật.
- [ ] Ẩn danh hoá một đoạn ghi chép về trẻ theo 4 bước.
- [ ] Kiểm kho học liệu: chủ sở hữu là ai, có sao lưu chưa.
:::

<script type="text/plain" class="lesson-src" data-id="m4-hoat-dong"># Thiết kế hoạt động, học liệu và đánh giá trẻ

:::note Mục tiêu
Dùng AI gợi ý hoạt động rồi kiểm bằng 7 tiêu chí; làm học liệu số phù hợp lứa tuổi; đánh giá trẻ để điều chỉnh, không xếp loại; viết nhận xét có ghi chép làm căn cứ.
:::

:::story Chợ rau thay chậu cây
Cô Dung thấy AI gợi ý hoạt động “trồng cây trong chậu” rất đẹp. Nhưng sân trường không có đất, lớp lại đang học về rau. Cô đổi thành “chợ rau của bé”, dùng rau thật, lá thật, cân đồ chơi. Trẻ chơi quên giờ, có bé còn mang rau ra mời cô mua. Cô ghi vào sổ: hoạt động hay không phải ở chỗ mới lạ, mà ở chỗ trẻ chạm được bằng tay.
**Liên tưởng:** hoạt động mầm non như đôi giày; đẹp mà không vừa chân trẻ thì không bước được.
:::

## Phần 1 · AI gợi ý, giáo viên quyết định

Trong thiết kế hoạt động, AI có thể: gợi ý nhiều ý tưởng trò chơi, dự thảo khung bảng kế hoạch, gợi ý câu hỏi mở – lời dẫn – bài thơ – câu đố, liệt kê đồ dùng, gợi ý từ khoá tìm học liệu, viết lại thông báo cho cha mẹ dễ hiểu.

Giáo viên phải tự quyết: mục tiêu phù hợp trẻ thật; nội dung, thời lượng, cách chia nhóm; kiểm tra độ chính xác và độ tuổi; đánh giá an toàn; thẩm định nguồn và bản quyền; chịu trách nhiệm cuối cùng.

## Phần 2 · Bảy tiêu chí kiểm hoạt động AI gợi ý

1. **An toàn** — có vật sắc, nhọn, nóng, nhỏ dễ nuốt, độc hại; nguy cơ trơn trượt, ngã?
2. **Vừa sức** — mục tiêu, thao tác có phù hợp độ tuổi và trình độ thực tế?
3. **Đúng chương trình** — có nằm trong Chương trình GDMN của độ tuổi?
4. **Đủ đồ dùng** — có sẵn ở trường, ở địa phương, chi phí thấp?
5. **Phù hợp văn hóa** — ngôn ngữ, hình ảnh, phong tục có phù hợp trẻ và cộng đồng?
6. **Thời lượng màn hình** — có ngắn, có người lớn đồng hành, xen kẽ vận động?
7. **Bảo vệ dữ liệu** — câu lệnh có chứa họ tên, ảnh, sức khỏe, hoàn cảnh gia đình?

Ví dụ điều chỉnh: AI gợi ý trẻ 24–36 tháng xâu hạt nhỏ → đổi hạt to, khối lớn. AI gợi ý trẻ khuấy mật đường đang đun → cô làm sẵn, trẻ chỉ kẹp bánh. AI đặt mục tiêu trẻ 3 tuổi đếm đến 20 → đối chiếu chương trình, sửa.

## Phần 3 · Bố cục kế hoạch

Bảng kế hoạch chủ đề: **Lĩnh vực | Mục tiêu | Nội dung | Hoạt động | Môi trường | Đánh giá**. Mục tiêu viết bằng hành vi quan sát được: “nói được”, “thực hiện được”.

Kế hoạch hoạt động học: **I. Mục đích – yêu cầu; II. Chuẩn bị; III. Tiến hành (bảng 3 cột: hoạt động của cô – hoạt động của trẻ – ghi chú); IV. Đánh giá**. Với nhà trẻ, chuỗi thường là “quan sát – thử – nói”, ví dụ hoạt động “Thuyền lá sen”: cái gì nổi, cái gì chìm.

Trẻ 5–6 tuổi đối chiếu thêm Bộ chuẩn phát triển trẻ em 5 tuổi (Thông tư 23/2010) khi xác định mục tiêu, chỉ số.

## Phần 4 · Học liệu số

Với ảnh AI: dùng công thức 6 yếu tố (chủ thể, trang phục – hành động, bối cảnh, phong cách, bố cục, tỉ lệ khung) và kiểm 5 điểm (bàn tay – khuôn mặt, số lượng đồ vật, chữ méo, nét Việt Nam, an toàn – vui tươi).

Với video, âm thanh, trò chơi tương tác: ưu tiên đoạn ngắn có phụ đề, giọng đọc rõ dấu; trò chơi mỗi câu gắn một mục tiêu, chơi theo đội, không công bố xếp hạng cá nhân; trẻ mầm non dùng có người lớn đồng hành, thời gian màn hình ngắn.

Quy trình làm học liệu: chọn nội dung theo chủ đề → viết prompt đủ thành phần → tạo bản nháp → kiểm 5 điểm và 7 tiêu chí → sửa → ghi nguồn, ghi nhãn “Ảnh minh hoạ tạo bởi AI” → lưu vào kho đã duyệt.

## Phần 5 · Đánh giá trẻ: để điều chỉnh, không xếp loại

Năm phương pháp phối hợp: quan sát trẻ trong hoạt động tự nhiên; trò chuyện với trẻ; phân tích sản phẩm hoạt động; bài tập, tình huống chơi; trao đổi với cha mẹ.

Ba điều bắt buộc:

- Không cho điểm, không xếp loại.
- Không so sánh trẻ này với trẻ khác — chỉ so với chính trẻ trước đó và với mục tiêu.
- Đánh giá ở nhiều thời điểm, bằng nhiều phương pháp.

Hai hình thức: hằng ngày (ghi chép ngắn, điều chỉnh kế hoạch ngày, trao đổi với cha mẹ khi cần) và theo giai đoạn (mức đạt mục tiêu cuối chủ đề, tháng, độ tuổi; điều chỉnh kế hoạch giai đoạn sau).

## Phần 6 · AI hỗ trợ phần nào

| AI có thể hỗ trợ | Giáo viên bắt buộc tự làm |
|---|---|
| Gợi ý diễn đạt tiêu chí, cấu trúc phiếu quan sát | Chọn mục tiêu, chỉ số phù hợp lớp mình |
| Sắp xếp ghi chép thô thành đoạn văn theo lĩnh vực | Trực tiếp quan sát, ghi lại sự việc thật |
| Tìm xu hướng trong dữ liệu tổng hợp ẩn danh | Giải thích nguyên nhân, quyết định điều chỉnh |
| Gợi ý ngôn ngữ tích cực, hoạt động hỗ trợ, hoạt động tại nhà | Kết luận về sự phát triển của từng trẻ |
| Soạn nháp phiếu, tin nhắn gửi cha mẹ | Duyệt, sửa và chịu trách nhiệm nội dung gửi đi |

AI không nhìn thấy trẻ. Chưa có ghi chép thật của giáo viên thì không nhờ AI viết nhận xét. Mỗi câu AI viết phải có ghi chép làm căn cứ; nếu không có, bỏ câu đó.

## Phần 7 · Ghi chép giai thoại 4 thành phần

| Thành phần | Ví dụ |
|---|---|
| Khi nào | Thứ Ba tuần 2, hoạt động góc |
| Ở đâu | Góc xây dựng |
| Trẻ làm gì, nói gì | Trẻ N09 xếp 8 khối gỗ thành “cầu qua sông”, nói: “Cầu phải dài để ô tô qua được”; khi cầu đổ, trẻ đặt thêm khối ở giữa làm trụ |
| Nhận định | Trẻ có ý tưởng xây dựng rõ ràng, biết thử cách khác khi gặp khó khăn |

Ba dòng đầu chỉ ghi sự việc; dòng “Nhận định” mới ghi suy nghĩ của giáo viên. Tách bạch như vậy giúp AI không trộn sự việc với suy đoán.

Trước khi đưa ghi chép vào AI, ẩn danh 4 bước: lập bảng mã, thay thế tên và ngày, lược bỏ chi tiết sức khỏe – hoàn cảnh, đọc lại xem người ngoài có đoán ra trẻ không.

:::case Từ ghi chép đến nhận xét
Cô có 6 ghi chép về trẻ N14 trong hai tuần. Sau khi ẩn danh, cô nhờ AI sắp xếp thành đoạn văn theo lĩnh vực. AI thêm câu “trẻ thích chơi với con mèo ở nhà” — không có trong ghi chép nào. Cô xóa câu đó. Bản cuối ngắn hơn nhưng mọi câu đều có căn cứ; lĩnh vực chưa có ghi chép ghi rõ “Chưa có ghi chép trong giai đoạn này”.
:::

:::warn Từ ngữ cần tránh
Không dùng “lười, nhát, hư, nghịch, kém, yếu, chậm, không bằng bạn”. Mô tả hành vi và tiến bộ: “trẻ đang mở rộng vốn từ”, “trẻ tự cất đồ chơi sau giờ chơi”.
:::

- [ ] Viết 2 giai thoại đủ 4 thành phần cho một trẻ.
- [ ] Ẩn danh một đoạn ghi chép theo 4 bước.
- [ ] Rà một nhận xét cũ, bỏ mọi từ dán nhãn.

<script type="text/plain" class="lesson-src" data-id="m5-quan-tri"># Quản trị nhà trường và truyền thông với AI

:::note Mục tiêu
Dùng AI đúng chỗ trong văn bản, kế hoạch, báo cáo; dẫn dắt thay đổi theo lộ trình 4 giai đoạn; vận hành kho 6 thư mục; sản xuất ấn phẩm truyền thông an toàn.
:::

:::story Bản thông báo lạnh như giấy tờ
Cô hiệu trưởng nhờ AI viết thông báo tuyển sinh. Bản nháp đúng thể thức nhưng lạnh như giấy tờ. Cô thêm lời chào của trường, tên gọi thân quen của các cô, giờ đón trẻ. Cô cũng bỏ một câu AI viết quá hoa mỹ về “môi trường giáo dục chuẩn quốc tế” vì trường mình chưa có. Bản cuối dài hơn một trang, nhưng phụ huynh đọc xong hỏi ngay: “Cô ơi, năm nay có nhận bé sinh tháng Chín không?”
**Liên tưởng:** văn bản của trường như bữa cơm nhà; đúng khẩu phần là cần, nhưng phải có mùi bếp mình.
:::

## Phần 1 · AI soạn – CBQL quyết

| Nhóm việc | AI làm tốt | CBQL phải tự làm |
|---|---|---|
| Văn bản chỉ đạo | Soạn khung, diễn đạt mạch lạc; gợi ý điều khoản; rút gọn hoặc mở rộng | Quyết định chủ trương; xác định thẩm quyền; kiểm tra căn cứ pháp lý; ghi số, ký, đóng dấu |
| Kế hoạch | Lập khung mục; gợi ý mục tiêu, chỉ tiêu, giải pháp; chuyển thành bảng phân công | Chọn chỉ tiêu sát thực tế; phân bổ nguồn lực; thống nhất với tập thể, cấp uỷ, công đoàn |
| Số liệu, khảo sát | Tính toán sơ bộ; phân loại ý kiến mở; gợi ý biểu đồ; nhận xét xu hướng | Thu thập số liệu gốc; kiểm tra từng con số; giải thích nguyên nhân từ thực tế |
| Báo cáo | Ghép báo cáo các tổ; chuẩn hoá văn phong; lập bảng so sánh với năm trước | Đánh giá ưu điểm, hạn chế trung thực; xác nhận số liệu; chịu trách nhiệm trước cấp trên |
| Kiểm định | Lập bảng mã minh chứng; đối chiếu thiếu, đủ; gợi ý nguồn | Tự đánh giá mức đạt; bảo đảm minh chứng có thật, hợp lệ; ký xác nhận |
| Đánh giá con người | Gợi ý tiêu chí, mẫu phiếu | Đánh giá, xếp loại viên chức; khen thưởng, kỷ luật; giải quyết khiếu nại |

Văn bản về nhân sự, kỷ luật, khiếu nại, sức khỏe trẻ, hoàn cảnh gia đình **không đưa vào AI công cộng**, kể cả khi đã xóa tên.

## Phần 2 · Quy trình 5 bước với văn bản hành chính

1. **Chuẩn bị dữ liệu ẩn danh** — xóa họ tên, ngày sinh, số điện thoại, địa chỉ; thay bằng mã Trẻ A, GV01, PH05.
2. **Ra lệnh** — prompt Vai – Bối cảnh – Nhiệm vụ – Yêu cầu – Định dạng; dán dữ liệu đã ẩn danh.
3. **Kiểm tra** — đọc toàn bộ; đối chiếu căn cứ với văn bản gốc; tính lại số liệu; bỏ nội dung sai thực tế.
4. **Hoàn thiện đúng thể thức** — chuyển sang Word/Google Docs; trình bày đúng thể thức; biên tập; xin ý kiến tập thể.
5. **Lưu bản mẫu tái sử dụng** — lưu prompt và văn bản mẫu vào “Bộ biểu mẫu AI”; ghi ngày cập nhật, người kiểm duyệt.

Bước 2–3 dùng vòng lặp Hỏi – Đọc – Kiểm – Sửa; một văn bản tốt thường cần 2–4 lượt. Mẹo: dán kèm văn bản năm trước của chính trường (đã ẩn danh) và yêu cầu “giữ cấu trúc, cập nhật nội dung theo năm học mới”.

Năm câu tự kiểm trước khi sang bước tiếp: nếu tài liệu bị lộ có nhận ra ai không; prompt đã nói rõ trường nào, ai đọc, độ dài, cấu trúc chưa; có căn cứ nào AI tự nghĩ ra không; văn bản đủ thể thức, đúng thẩm quyền chưa; năm sau đồng nghiệp có dùng lại được ngay không.

## Phần 3 · Lộ trình 4 giai đoạn

| Giai đoạn | Thời gian gợi ý | Việc của người quản lý | Dấu hiệu hoàn thành |
|---|---|---|---|
| Làm quen | Tháng 10–11 | Bồi dưỡng toàn trường; ban hành hướng dẫn tạm thời về dữ liệu; giới thiệu 2–3 công cụ an toàn | Mọi giáo viên biết ẩn danh hoá; mỗi người có ít nhất 1 sản phẩm thử |
| Thí điểm | Tháng 12 – tháng 2 | Chọn nhóm giáo viên cốt cán; giao nhiệm vụ cụ thể | Có báo cáo thí điểm; biết việc nào AI giúp thật, việc nào không |
| Nhân rộng | Tháng 3–4 | Ban hành quy chế chính thức; chia sẻ bộ prompt chung; cốt cán hướng dẫn đồng nghiệp | Đa số giáo viên dùng thường xuyên, đúng quy chế |
| Đánh giá | Tháng 5 | Khảo sát giáo viên, cha mẹ; rà soát sự cố, chỉ tiêu | Có báo cáo; quy chế, danh mục công cụ được cập nhật |

Ba nguyên tắc dẫn dắt: **làm gương** (người quản lý dùng trước, công khai cả lỗi), **trao quyền có khung** (cốt cán được đề xuất, thử nghiệm trong quy chế chung), **cải tiến liên tục** (mỗi giai đoạn có điểm dừng nhìn lại).

## Phần 4 · Kho 6 thư mục và phân quyền

Môi trường giáo dục số gồm 5 thành phần: hạ tầng, dữ liệu, học liệu, con người, quy chế. Kho dùng chung là nơi giữ học liệu tốt, dữ liệu trẻ được bảo vệ.

Sáu kho: học liệu số, video, hình ảnh, bài giảng, biểu mẫu quản lý (kèm bộ prompt chuẩn), kho chung của trường. Kho tối đa 4 tầng; có thư mục hướng dẫn, chờ duyệt, lưu trữ năm học cũ; tên không dấu, ngày theo năm-tháng-ngày.

Phân quyền theo quyền tối thiểu: Quản lý · Chỉnh sửa · Nhận xét · Xem · Không. Dữ liệu trẻ ở Mức 4 chỉ trên tài khoản trường hoặc phần mềm ngành. Sao lưu 3–2–1; thử khôi phục mỗi học kỳ. Khi nhân sự thay đổi, thu hồi quyền trong ngày, chuyển quyền sở hữu tệp về tài khoản trường.

## Phần 5 · Truyền thông: 6 nguyên tắc nội dung

1. **Chính xác** — đúng thời gian, địa điểm, số liệu; AI có thể bịa chi tiết nên phải đối chiếu hồ sơ thực tế.
2. **Tích cực** — lan toả giá trị giáo dục; không phô trương, không so sánh hạ thấp trường khác.
3. **Đúng định hướng** — phù hợp chủ trương của ngành và quy chế phát ngôn.
4. **Tôn trọng trẻ** — không đăng ảnh trẻ khóc, ngã, thay đồ hoặc gây chú ý tiêu cực.
5. **Ngắn gọn** — viết cho cha mẹ đọc trên điện thoại; một ấn phẩm, một thông điệp chính.
6. **Minh bạch về AI** — ghi “Nội dung có sử dụng AI hỗ trợ” khi phù hợp.

## Phần 6 · Năm quy tắc bảo vệ hình ảnh trẻ

1. Có đồng ý của cha mẹ: phiếu đầu năm, ghi rõ phạm vi; lập danh sách trẻ không được đăng ảnh.
2. Không lộ thông tin cá nhân: không ghi họ tên, ngày sinh, địa chỉ, sức khỏe kèm ảnh; ưu tiên ảnh nhóm, góc nghiêng, bàn tay, sản phẩm.
3. Không dùng AI chỉnh sửa, ghép mặt trẻ thật; không hoạt hình hoá, tạo video “biết nói”.
4. Ảnh minh hoạ AI phải ghi “Ảnh minh hoạ tạo bởi AI”, không trình bày như ảnh thật của trường.
5. Mọi ảnh, video có trẻ phải qua người được phân công duyệt trước khi đăng.

Soi cả phần nền ảnh: bảng tên lớp, sổ điểm danh, biển số xe, số nhà đều có thể làm lộ thông tin.

## Phần 7 · Quy trình 6 bước sản xuất ấn phẩm

Kế hoạch (mục tiêu, đối tượng, thông điệp, kênh, thời điểm) → soạn nội dung với AI (5 thành phần, vòng lặp) → thiết kế (Canva, Napkin, CapCut) → duyệt (chính xác, chính tả, hình ảnh trẻ, bản quyền) → đăng → đo lường (lượt xem, phản hồi, câu hỏi của cha mẹ).

Khi có bình luận tiêu cực: ghi nhận, xác minh thông tin, phản hồi trong khung giờ hành chính, chuyển việc riêng sang kênh riêng. Không tranh luận công khai về một trẻ.

## Phần 8 · Sự cố và phê duyệt công cụ

Quy trình xử lý sự cố 5 bước: phát hiện và khoanh vùng → gỡ hoặc tạm dừng → báo cáo người phụ trách → khắc phục và xin lỗi đúng đối tượng → ghi sổ sự cố, điều chỉnh quy định.

Phê duyệt công cụ AI mới 5 bước: đề xuất theo nhiệm vụ → kiểm tiêu chí an toàn dữ liệu và độ tuổi → thử nghiệm nhóm nhỏ → đánh giá kết quả → đưa vào danh mục chính thức kèm người phụ trách.

:::case Một trường đưa AI vào quy chế trong 8 tháng
Tháng 10: bồi dưỡng, hướng dẫn ẩn danh. Tháng 12: 6 giáo viên cốt cán thí điểm soạn học liệu và nhận xét. Tháng 3: ban hành quy chế, phát bộ prompt chuẩn, lập kho 6 thư mục trên tài khoản trường. Tháng 5: khảo sát, rà sự cố, cập nhật danh mục công cụ. Kết quả: không có sự cố dữ liệu trẻ, giáo viên dùng đúng quy chế, kho có học liệu dùng chung thay vì tệp rải rác.
:::

## Học sinh 11–14 tuổi đang ở đâu?

Học sinh THCS bắt đầu hình thành ý thức cá nhân, dùng điện thoại và mạng xã hội nhiều hơn, nhưng chưa đủ kinh nghiệm để nhận ra rủi ro. Ba đặc điểm ảnh hưởng trực tiếp đến cách dạy:

- **Tin vào cảm xúc trước, kiểm chứng sau.** Một tiêu đề giật gân dễ được chia sẻ hơn một văn bản khô khan.
- **Sợ bị tách khỏi nhóm.** Bắt nạt mạng thường diễn ra trong nhóm chat lớp, nơi học sinh không muốn “làm lớn chuyện”.
- **Học tốt nhất qua tình huống và vai.** Đóng vai, tranh biện, làm sản phẩm hiệu quả hơn nghe quy tắc.

Vì vậy, khối KHXH có lợi thế lớn: môn học vốn đã có văn bản, tư liệu, tình huống và tranh luận. Không cần thêm công nghệ mới, chỉ cần đổi **cách học sinh làm việc với tư liệu**.

## Ma trận tích hợp rút gọn

Bảng dưới lấy từ ma trận của bộ tài liệu THCS – KHXH; cột cuối là ví dụ đặc thù để bạn hình dung.

| I. Khai thác dữ liệu, thông tin | 1.1.TC1b; 1.2.TC1a; 1.2.TC1b | 1.1.TC2b; 1.2.TC2a; 1.3.TC2b | ATM1; NLa, NLb | Kiểm chứng ảnh chụp thông báo, đoạn tư liệu lịch sử bị cắt |
| II. Giao tiếp, hợp tác số | 2.4.TC1a; 2.5.TC1a; 2.6.TC1b | 2.2.TC2c; 2.5.TC2a; 2.6.TC2c | ATM2; NLb | Phân biệt mâu thuẫn thường với bắt nạt; quy ước nhóm chat lớp |
| III. Sáng tạo nội dung số | 3.1.TC1a; 3.2.TC1a; 3.3.TC1a | 3.1.TC2b; 3.3.TC2a; 3.4.TC2a | ATM6; NLb | Tạp chí văn học số, video giới thiệu di sản địa phương có ghi nguồn |
| IV. An toàn, an sinh số | 4.1.TC1b; 4.2.TC1a; 4.3.TC1a | 4.1.TC2b; 4.2.TC2c; 4.3.TC2b | ATM3, ATM4, ATM5 | Bảo vệ dữ liệu khi làm khảo sát; nhận diện tin nhắn trúng thưởng |
| V. Giải quyết vấn đề | 5.1.TC1b; 5.3.TC1b | 5.2.TC2b; 5.4.TC2b | ATM8; NLc | Dự án nhóm trên Trello; quy trình báo sự cố |
| VI. Ứng dụng AI | 6.1.TC1a; 6.2.TC1c; 6.3.TC1b | 6.1.TC2a; 6.2.TC2c; 6.3.TC2a | ATM7; NLa–NLd | Đối chiếu câu trả lời AI với sách giáo khoa; phát hiện ảo giác |

:::warn Không chép cả bảng vào một bài
Mỗi bài chỉ nên có **1–2 mã năng lực** và **1 chủ đề ATM**. Bảng dùng để tra, không dùng để trang trí kế hoạch.
:::

## Ba địa chỉ tích hợp tự nhiên

### 1. Ngữ văn 8 – văn bản thông tin và tin giả

Bài “Văn bản thông tin – cách tiếp nhận tin tức” có sẵn yêu cầu đánh giá tính khách quan của thông tin. Địa chỉ tích hợp:

- Hoạt động luyện tập: học sinh kiểm chứng một tin đang lan trong trường bằng SIFT.
- Mã: `1.2.TC2a` (đánh giá độ tin cậy nguồn tin), `ATM1`.
- Sản phẩm: phiếu SIFT bốn ô, kết luận có căn cứ.
- Phương án không thiết bị: phát bản in của một bài báo và một ảnh chụp màn hình; học sinh đối chiếu trên giấy.

### 2. Lịch sử và Địa lí 8 – tư liệu và chủ quyền

Khi dạy một sự kiện lịch sử, cho học sinh so sánh hai đoạn tư liệu: một đoạn trong sách giáo khoa, một đoạn lan truyền trên mạng. Địa chỉ:

- Mã: `1.2.TC2a` (so sánh, phản biện nguồn tin), `ATM1`.
- Mạch AI: NLb – trách nhiệm khi chia sẻ thông tin lịch sử sai lệch.
- Lưu ý: dùng tư liệu về địa danh theo Thông tư 17/2025/TT-BGDĐT khi dạy Địa lí.

### 3. GDCD và Hoạt động trải nghiệm – ứng xử trên mạng

Bài về tình bạn, tôn trọng, pháp luật có thể gắn với bắt nạt mạng:

- Mã: `2.5.TC2a` (chuẩn mực ứng xử trên mạng) và `2.6.TC2c` (quản lý dấu vết số), `ATM2`.
- Hoạt động: ba tiêu chí phân biệt “mâu thuẫn thông thường” và “bắt nạt” – **cố ý, lặp lại, mất cân bằng quyền lực**; học sinh đóng vai người quan sát tích cực.
- Sản phẩm: bộ quy ước nhóm chat của lớp, không nêu tên cá nhân.

## Hai điều nên tránh

1. **Biến tiết Văn thành tiết dạy công cụ.** Học sinh không cần học cách tạo tài khoản Canva trong giờ Văn; các em cần học cách đọc, đánh giá và tạo sản phẩm văn học.
2. **Dùng vụ việc thật của học sinh làm ví dụ.** Kể cả khi đã ẩn tên, câu chuyện có thể bị nhận ra. Hãy hư cấu tình huống dựa trên nhiều vụ việc.

:::do Bài tập 10 phút
Chọn một bài sắp dạy. Viết ba dòng:

1. Hoạt động nào học sinh phải **đọc, đối chiếu hoặc tranh luận**?
2. Trong hoạt động đó, học sinh dùng **nguồn nào**, kiểm chứng bằng cách nào?
3. Ghi mã năng lực và ATM tương ứng.

Nếu dòng 3 không khớp với hoạt động, quay lại chọn địa chỉ khác – đừng gắn mã cho đủ.
:::

## Bài mẫu: “Đọc văn bản thông tin và kiểm chứng tin tức”

**Thông tin chung**

- Môn: Ngữ văn 8. Thời lượng: 45 phút.
- Chủ đề: văn bản thông tin; kỹ năng đánh giá độ tin cậy.
- Mã tích hợp: `1.2.TC2a`, `ATM1`; mạch NLb.
- Thiết bị: máy chiếu (nếu có), phiếu SIFT in sẵn, 4 bộ ảnh/tin in trên giấy.

**Yêu cầu cần đạt**

1. Chỉ ra được đặc điểm của văn bản thông tin: nhan đề, sapo, nguồn, dữ liệu, ảnh minh họa.
2. Đánh giá được độ tin cậy của một thông tin bằng bốn bước SIFT.
3. Viết được đoạn kết luận 5–7 câu, nêu căn cứ và đề xuất cách xử lý.

### Hoạt động 1 – Mở đầu (6 phút)

- Giáo viên chiếu một ảnh chụp “thông báo nghỉ học” không rõ nguồn (do giáo viên hư cấu).
- Câu hỏi: *“Nếu nhận được ảnh này trong nhóm lớp, em làm gì trong 30 giây đầu?”*
- Học sinh trả lời miệng; giáo viên ghi ba hành vi lên bảng, chưa kết luận đúng sai.
- Chốt: hôm nay học cách **dừng lại trước khi chia sẻ**.

### Hoạt động 2 – Hình thành kiến thức (15 phút)

- Chia nhóm 4. Mỗi nhóm nhận một bộ tư liệu: một bài báo có nguồn rõ và một ảnh chụp màn hình không rõ nguồn.
- Nhiệm vụ theo phiếu SIFT: **Dừng lại – Điều tra – Tìm nguồn – Truy vết**.
- Giáo viên đi từng nhóm, hỏi đúng một câu: *“Căn cứ nào cho câu trả lời này?”*
- Nhóm ghi kết quả vào bốn ô; đại diện 2 nhóm trình bày 60 giây.
- Giáo viên hệ thống: ba dấu hiệu của nguồn đáng tin (tác giả, cơ quan, ngày, dữ liệu kiểm chứng được).

### Hoạt động 3 – Luyện tập (14 phút)

- Cá nhân viết đoạn 5–7 câu: thông tin đó đáng tin ở mức nào, vì sao, nên làm gì.
- Đổi bài theo cặp, dùng rubric ba tiêu chí bên dưới để góp ý.
- Giáo viên chọn một bài tốt và một bài còn mơ hồ, đọc trước lớp (ẩn tên), cả lớp chỉ ra chỗ cần thêm căn cứ.

### Hoạt động 4 – Vận dụng (10 phút)

- Nhiệm vụ về nhà: theo dõi một tin trong tuần, ghi phiếu SIFT, nộp vào đầu giờ tuần sau.
- Học sinh nêu một việc sẽ **không** làm nữa (ví dụ: không chuyển tiếp khi chưa xem nguồn).
- Giáo viên chốt ba câu: *dừng lại; kiểm tra nguồn; chỉ chia sẻ khi có căn cứ.*

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Xác định nguồn | Chưa nêu tác giả/cơ quan | Nêu được nguồn nhưng thiếu ngày | Nêu tác giả, cơ quan, ngày, dữ liệu |
| Lập luận | Kết luận không có căn cứ | Có 1–2 căn cứ | Căn cứ gắn với từng bước SIFT |
| Đề xuất hành động | Chung chung | Có hành động cụ thể | Có hành động và cách phòng ngừa |

:::warn Rubric không phải điểm số
Ba mức dùng để góp ý trong giờ. Nếu chuyển thành điểm, phải quy đổi theo quy định của nhà trường và thông báo trước cho học sinh.
:::

## Chỗ nào dùng AI, chỗ nào không

**Nên dùng AI**

- Sinh thêm 3 tình huống hư cấu cùng dạng để học sinh luyện.
- Rút gọn một văn bản dài thành 5 ý, sau đó giáo viên đối chiếu lại với bản gốc.

**Không nên dùng AI**

- Chấm đoạn văn thay giáo viên.
- Tạo “dẫn chứng” lịch sử. AI có thể bịa số liệu và tên riêng.
- Đưa bài làm thật của học sinh lên công cụ công khai.

Nếu dùng AI để soạn ngữ liệu, ghi một dòng trong kế hoạch: *“Ngữ liệu do giáo viên biên soạn với hỗ trợ của AI và đã đối chiếu nguồn.”*

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | In ảnh và bài báo khổ A4, phát mỗi nhóm một bộ |
| Không có Internet | Dùng bản in; bước “Tìm nguồn” chuyển thành đối chiếu với sách giáo khoa và báo giấy |
| Học sinh không có điện thoại | Toàn bộ phiếu làm trên giấy; không yêu cầu chụp ảnh |
| Mất điện | Chuyển sang đóng vai: một học sinh là người đăng tin, ba học sinh phản biện |

## Dạy phân hóa trong cùng một lớp

- **Nhóm cần hỗ trợ:** phiếu SIFT có câu hỏi gợi ý ở từng ô.
- **Nhóm trung bình:** phiếu trống, chỉ có bốn tiêu đề.
- **Nhóm khá – giỏi:** thêm nhiệm vụ so sánh hai nguồn trái chiều và giải thích vì sao cùng một sự việc lại được đưa tin khác nhau.

## Prompt mẫu để soạn ngữ liệu

```text
Vai trò: giáo viên Ngữ văn THCS.
Nhiệm vụ: tạo 2 tình huống hư cấu về một thông báo lan truyền trong nhóm lớp.
Ràng buộc: không dùng tên người thật, không dùng tên trường thật, không mô tả hành vi nguy hiểm.
Đầu ra: mỗi tình huống 120 từ, kèm 3 dấu hiệu để học sinh kiểm chứng.
```

- [ ] Đã in phiếu SIFT đủ số nhóm.
- [ ] Ảnh/tin mẫu là hư cấu hoặc đã được phép sử dụng.
- [ ] Rubric đã chiếu hoặc phát cho học sinh.
- [ ] Có phương án không thiết bị.
- [ ] Đã xóa tên học sinh khỏi mọi tệp mẫu.
:::

<script type="text/plain" class="lesson-src" data-id="tx3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHXH

:::note Mục tiêu
Chuyển từ “ai cũng thấy cần chuyển đổi số” sang **một kế hoạch 30 ngày làm được**, có người chịu trách nhiệm, có bằng chứng và có vòng cải tiến.
:::

:::story Bốn tuần gieo mạ
Tổ KHXH họp đầu tháng, ai cũng kể đã làm bao nhiêu việc. Tổ trưởng đặt một tờ kế hoạch bốn tuần lên bàn: tuần này làm gì, ai làm, bằng chứng ở đâu. Cả tổ im lặng. Rồi từng người nhận một dòng. Bốn tuần sau, họp lại, lần đầu tiên không ai phải kể lại việc cũ, chỉ mang sản phẩm ra đặt lên bàn.
**Liên tưởng:** kế hoạch như lịch gieo mạ; không ghi ngày thì chỉ thấy người ta tất bật mà không biết mùa nào gặt.
:::

## Năm bước lập kế hoạch

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Tổ đang ở đâu? Bao nhiêu giáo viên dùng công cụ gì, tuần mấy tiết? | Bảng kiểm 10 dòng |
| 2. Mục tiêu SMART | 30 ngày tới thay đổi điều gì, đo bằng gì? | 1–2 mục tiêu |
| 3. Hoạt động trọng tâm | Việc nhỏ nhất tạo khác biệt là gì? | 3 hoạt động |
| 4. Nguồn lực, thời gian | Ai làm, khi nào, cần gì? | Bảng phân công |
| 5. KPI, giám sát | Biết thành công nhờ đâu? | 5 chỉ số + lịch kiểm |

:::tip Mục tiêu SMART viết trong một câu
“Đến ngày 20/12, **6/8 giáo viên** của tổ có **ít nhất một bài dạy** dùng khung 4C, mỗi bài có **một học liệu số** và **một phiếu đánh giá học sinh** được lưu trong thư mục chung.”
:::

## Kế hoạch 4 tuần PDCA

### Tuần 1 – Plan: chọn một bài, không chọn mười bài

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Kiểm tra hạ tầng: mạng ở 3 phòng, máy chiếu, thiết bị học sinh | Tổ trưởng + phụ trách thiết bị | Ảnh chụp/phiếu kiểm |
| Chọn 1 bài có địa chỉ tích hợp rõ (ví dụ văn bản thông tin lớp 8) | Nhóm Văn | Biên bản chọn bài |
| Thống nhất rubric 3 tiêu chí | Cả tổ | Tệp rubric |
| Đăng ký dạy thử 1 tiết | 1 giáo viên tình nguyện | Lịch dạy |

**Kết thúc tuần 1:** có một bài, một người dạy thử, một thời điểm.

### Tuần 2 – Do: dạy thử, ghi lại

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Dạy thử theo 4 hoạt động | Giáo viên đăng ký | Kế hoạch bài dạy |
| 2 đồng nghiệp dự, ghi phiếu quan sát 4 mục | Nhóm quan sát | Phiếu quan sát |
| Chụp 3 sản phẩm học sinh (đã ẩn tên) | Giáo viên | 3 ảnh/tệp |
| Ghi 3 điều hiệu quả, 3 điều cần sửa | Giáo viên | Ghi chú 1 trang |

**Không làm trong tuần này:** không tổ chức hội thảo, không mời chuyên gia, không đổi phần mềm.

### Tuần 3 – Check: nhìn dữ liệu, không nhìn cảm giác

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Đối chiếu sản phẩm học sinh với rubric | Giáo viên + nhóm | Bảng tổng hợp mức |
| Hỏi 5 học sinh: “việc nào giúp em hiểu bài nhất?” | Giáo viên | 5 câu trả lời ẩn danh |
| Kiểm tra dữ liệu: tệp có tên học sinh không, có nằm trên dịch vụ công khai không | Tổ trưởng | Danh sách kiểm |
| So sánh thời gian chuẩn bị thực tế với dự kiến | Giáo viên | 1 dòng ghi chú |

### Tuần 4 – Act: chuẩn hóa và nhân ra

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Sửa bài dạy thành phiên bản 2 | Giáo viên | Tệp v2 |
| Chia sẻ 10 phút trong sinh hoạt tổ | Giáo viên + tổ trưởng | Biên bản |
| Đưa mẫu vào thư mục chung của tổ | Tổ trưởng | Đường dẫn thư mục |
| Chọn bài tiếp theo cho chu kỳ sau | Cả tổ | Danh sách 2 bài |

:::warn Đừng bỏ tuần 4
Nếu dừng sau tuần 2, sáng kiến sẽ chết khi giáo viên bận. Tuần 4 là lúc biến một lần làm thử thành **tài sản của tổ**.
:::

## Phân công RACI

R = người làm, A = người chịu trách nhiệm cuối, C = người được hỏi ý, I = người được thông báo.

| Việc | Hiệu trưởng | Phó hiệu trưởng | Tổ trưởng | GV nòng cốt | GV bộ môn | GVCN |
|---|---|---|---|---|---|---|
| Phê duyệt kế hoạch 30 ngày | A | C | R | C | I | I |
| Chọn bài dạy thử | I | I | A | R | C | I |
| Dạy thử | I | I | C | C | R/A | I |
| Kiểm tra dữ liệu học sinh | A | R | C | I | C | I |
| Chia sẻ trong tổ | I | I | A | R | C | I |
| Báo cáo kết quả | A | R | R | C | I | I |

:::tip Nguyên tắc một chữ A
Mỗi việc chỉ có **một** người chịu trách nhiệm cuối. Nếu hai người cùng A, việc sẽ dừng khi cả hai bận.
:::

:::note Mục tiêu
Chọn đúng một địa chỉ tích hợp cho Toán, KHTN, Tin học, Công nghệ; phân biệt học liệu mô phỏng với “ảo giác” của AI; biết mã năng lực và chủ đề ATM đi kèm.
:::

:::story Tiết học không có bộ thí nghiệm
Trường của thầy Nam thiếu bộ thí nghiệm áp suất. Thầy định bỏ bài thực hành. Rồi thầy mở PhET ngoại tuyến trên chiếc máy tính cũ, cho học sinh dự đoán trước khi chạy mô phỏng. Một em đoán “nước không lên”, mô phỏng cho thấy ngược lại, cả lớp ồ lên. Thầy dùng chính cái ồ đó để dạy cách ghi dữ liệu: ghi điều mình đoán trước, ghi điều mình thấy sau.
**Liên tưởng:** mô phỏng như sân tập; không thay được trận đấu thật, nhưng giúp học sinh không bỡ ngỡ khi ra sân.
:::

## Học sinh 11–14 tuổi với môn tự nhiên

Khối KHTN có lợi thế về **thí nghiệm, mô hình và dữ liệu**, nhưng cũng dễ rơi vào hai cái bẫy:

- **Mô phỏng thay cho quan sát thật.** Học sinh bấm thí nghiệm ảo nhưng không hiểu vì sao kết quả đổi.
- **Tin vào con số.** Một biểu đồ đẹp, một lời giải AI trôi chảy được coi là đúng.

Ba nguyên tắc thực hành:

1. **Luôn có dự đoán trước khi bấm.** Học sinh ghi dự đoán vào phiếu, sau đó mới chạy mô phỏng.
2. **Luôn có nguồn thứ hai.** Kết quả AI phải đối chiếu sách giáo khoa hoặc số liệu đo được.
3. **Luôn có bản không thiết bị.** Một thí nghiệm thật nhỏ vẫn học được khi mất mạng.

## Ba địa chỉ tích hợp tự nhiên

### 1. Toán 8 – biểu đồ và trục tung bị “cắt”

Khi dạy biểu đồ cột, đưa hai biểu đồ cùng số liệu nhưng một biểu đồ bắt đầu trục tung từ 90 thay vì 0.

- Mã: `1.2.TC2b` (phân tích, đánh giá dữ liệu), `ATM1`.
- Hoạt động: học sinh đo chiều cao cột, tính chênh lệch thật, viết một câu cảnh báo cho người đọc.
- Sản phẩm: phiếu “hai biểu đồ – một sự thật”.
- Mở rộng: bài xác suất thực nghiệm gắn với trò “quay số trúng thưởng 100%” (`4.1.TC2b`, `ATM4`).

### 2. KHTN – thí nghiệm ảo và kiểm chứng

Dùng PhET hoặc một mô phỏng đơn giản khi không có thiết bị thật.

- Trước khi chạy: học sinh ghi dự đoán vào phiếu.
- Trong khi chạy: đổi **một** biến, ghi kết quả.
- Sau khi chạy: so sánh với dự đoán; giải thích chỗ lệch.
- Mã: `1.2.TC1a` / `1.2.TC2a` (đánh giá độ tin cậy), `ATM1`.
- Lưu ý an toàn: mô phỏng không thay thế quy tắc an toàn phòng thí nghiệm.

### 3. Tin học 9 và Công nghệ – sự cố tài khoản, thiết bị IoT

- Tin học 9: vẽ **sơ đồ luồng** xử lý khi tài khoản mạng xã hội bị chiếm quyền điều khiển. Mã `4.1.TC2b` (kịch bản ứng phó), `ATM8`.
- Công nghệ: đặt mật khẩu mạnh cho thiết bị IoT trong gia đình/trường; giải mã cơ chế “vòng lặp phần thưởng” gây nghiện màn hình. Mã `4.2.TC1a`, `ATM3`; `4.3.TC1a`, `ATM5`.
- Sản phẩm: một tờ hướng dẫn A4 dán ở phòng máy.

## Dùng AI trong môn tự nhiên: ba kiểm tra

| Kiểm tra | Câu hỏi | Ví dụ lỗi thường gặp |
|---|---|---|
| Đơn vị | Kết quả có đúng đơn vị? | AI đổi km/h sang m/s sai hệ số |
| Dữ kiện | Số liệu có trong đề không? | AI tự thêm “khối lượng Trái Đất” |
| Logic | Bước nào nhảy cóc? | Bỏ qua điều kiện cân bằng |

Mã gắn với hoạt động này: `6.3.TC2a` (đánh giá, so sánh hiệu quả công cụ AI) và `ATM7`.

:::warn Ba điều không nhập vào AI
Không nhập: dữ liệu học sinh thật, ảnh chụp sổ điểm, mã OTP hoặc mật khẩu. Ba loại này không bao giờ cần thiết để giải một bài KHTN.
:::

<script type="text/plain" class="lesson-src" data-id="tn2-khbd"># Kế hoạch bài dạy 4C – Toán 8

:::note Mục tiêu
Có một bài mẫu thu thập – phân loại – biểu diễn dữ liệu, chạy được cả trên bảng tính và trên giấy, kèm rubric và cách dùng AI đúng chỗ.
:::

:::story Sạn trong bảng số liệu
Bài “Thu thập và phân loại dữ liệu”, thầy Nam cho học sinh đo chiều cao các bạn trong mười phút. Dữ liệu lệch vì có em đo bằng gang tay. Thầy không sửa, để cả lớp cùng tìm lỗi. Nhóm phát hiện ba chỗ ghi sai đơn vị, một chỗ bỏ sót bạn vắng. Tiết sau, cả lớp đo lại, biểu đồ thẳng tắp. Thầy ghi vào kế hoạch: sai dữ liệu là bài học, không phải tai nạn.
**Liên tưởng:** dữ liệu như gạo trước khi nấu; sạn nhỏ không nhặt, cả nồi cơm đều khó ăn.
:::

## Bài mẫu: “Thu thập và phân loại dữ liệu”

**Thông tin chung**

- Môn: Toán 8. Thời lượng: 45 phút.
- Chủ đề: thu thập, phân loại, biểu diễn dữ liệu.
- Mã tích hợp: `1.2.TC2b` (phân tích, đánh giá dữ liệu), `ATM1`; mạch NLc.
- Thiết bị: 1 máy tính + máy chiếu; phiếu khảo sát in; bảng tính có sẵn trên máy giáo viên (nếu có).

**Yêu cầu cần đạt**

1. Phân biệt được dữ liệu định tính và định lượng.
2. Lập được bảng tần số đơn giản từ dữ liệu thu thập.
3. Chọn được loại biểu đồ phù hợp và nêu một nhận xét có căn cứ.
4. Nêu được một rủi ro khi thu thập dữ liệu cá nhân.

:::warn Dữ liệu trong bài phải là dữ liệu hư cấu hoặc ẩn danh
Không thu tên, số điện thoại, địa chỉ. Chỉ thu một con số hoặc một lựa chọn. Nếu học sinh tự nguyện ghi tên, giáo viên cắt bỏ trước khi tổng hợp.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (6 phút)

- Chiếu hai biểu đồ về “thời gian dùng điện thoại của học sinh khối 8”. Một biểu đồ có trục tung bắt đầu từ 0, một biểu đồ bắt đầu từ 5.
- Hỏi: *“Hai biểu đồ này nói cùng một điều không? Vì sao nhìn khác nhau?”*
- Học sinh phát biểu 30 giây; giáo viên chưa chốt.
- Dẫn vào bài: muốn biểu đồ không nói dối, phải làm đúng từ bước thu thập.

### Hoạt động 2 – Hình thành kiến thức (17 phút)

Chia lớp thành 6 nhóm, mỗi nhóm nhận một phiếu khảo sát 3 câu:

1. Bạn dùng điện thoại cho việc học bao nhiêu phút mỗi ngày? (số phút)
2. Bạn thường dùng điện thoại vào lúc nào? (sáng/trưa/tối)
3. Bạn có kiểm tra nguồn tin trước khi chia sẻ không? (luôn luôn/thỉnh thoảng/không)

Nhiệm vụ:

- Nhóm thu kết quả của **các nhóm khác** (không thu của cả trường).
- Phân loại từng câu: định tính hay định lượng.
- Lập bảng tần số cho câu 2 và câu 3.
- Chọn biểu đồ: cột cho câu 2, tròn hoặc cột cho câu 3.

Giáo viên hỏi từng nhóm một câu: *“Mẫu của nhóm em có đại diện cho cả khối không? Vì sao?”* – để học sinh thấy vấn đề chọn mẫu.

### Hoạt động 3 – Luyện tập (14 phút)

- Nhóm dựng bảng tính: nhập 20–30 dòng dữ liệu, tạo bảng tần số, vẽ biểu đồ cột.
- Nếu không có máy: kẻ bảng trên giấy, đếm bằng gạch, vẽ cột bằng thước.
- Mỗi nhóm viết **một nhận xét** theo mẫu: *“Trong mẫu của nhóm em, … chiếm nhiều nhất; tuy nhiên mẫu chỉ gồm … học sinh nên chưa thể kết luận cho cả khối.”*
- Giáo viên chiếu một bảng tính có lỗi (nhập chữ vào cột số) và hỏi cách sửa.

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: thiết kế một phiếu khảo sát 3 câu cho vấn đề thật của lớp (ví dụ: thời gian tự học, thói quen đọc sách), trong đó **không có câu nào hỏi thông tin định danh**.
- Hai nhóm đổi phiếu, chỉ ra một câu có thể gây khó chịu hoặc thu thập quá mức.
- Chốt ba câu: dữ liệu phải đủ; mẫu phải nói rõ; biểu đồ phải trung thực.

## Rubric ba tiêu chí

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Thu thập | Phiếu thiếu câu, khó trả lời | Phiếu đủ 3 câu, trả lời được | Câu hỏi rõ, không thu thông tin định danh |
| Phân loại – biểu diễn | Lẫn định tính/định lượng | Phân loại đúng, biểu đồ phù hợp | Bảng tần số đúng, biểu đồ có tiêu đề và đơn vị |
| Nhận xét | Nhận xét cảm tính | Nhận xét có số liệu | Nêu số liệu, giới hạn mẫu và đề xuất |

## Phân hóa

- **Cần hỗ trợ:** phiếu có sẵn bảng tần số khung; chỉ cần điền số.
- **Trung bình:** tự lập bảng tần số từ dữ liệu thô.
- **Khá – giỏi:** thêm nhiệm vụ phát hiện một biểu đồ sai trong một bài báo và giải thích chỗ sai.

## Dùng AI ở đâu

**Được dùng**

- Sinh một bộ dữ liệu hư cấu 30 dòng để học sinh luyện vẽ biểu đồ.
- Gợi ý ba loại biểu đồ phù hợp với một câu hỏi, sau đó giáo viên chọn.

**Không dùng**

- Nhập dữ liệu khảo sát thật của học sinh.
- Để AI “nhận xét thay” vì AI không biết giới hạn mẫu của lớp.

Câu nhắc học sinh: *“Số liệu do AI tạo là số liệu giả để luyện tập; không trích dẫn như số liệu thật.”*

## Prompt mẫu

```text
Vai trò: giáo viên Toán 8.
Nhiệm vụ: tạo bảng 30 dòng dữ liệu hư cấu gồm 3 cột: số phút dùng điện thoại mỗi ngày, thời điểm dùng, có kiểm tra nguồn tin hay không.
Ràng buộc: không có tên người, không có địa chỉ, số phút trong khoảng 0–300.
Đầu ra: bảng văn bản dễ sao chép vào bảng tính, kèm 3 câu hỏi phân tích.
```

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | Vẽ hai biểu đồ lên bảng hoặc bảng phụ |
| Không có máy tính | Khảo sát bằng phiếu giấy, đếm gạch, vẽ cột bằng thước |
| Mất mạng | Bỏ bước bảng tính, giữ nguyên bước phân loại và nhận xét |
| Lớp quá đông | Mỗi nhóm 6–8 học sinh, thu mẫu chéo giữa các nhóm |

:::checklist Trước khi dạy
- [ ] Phiếu khảo sát không có câu hỏi định danh.
- [ ] Có hai biểu đồ mẫu (một trung thực, một cắt trục).
- [ ] Có bảng tính mẫu hoặc bảng giấy khung.
- [ ] Đã thử nhập dữ liệu vào bảng tính trước giờ học.
- [ ] Có phương án không thiết bị.
:::

## Tự kiểm tra

? “Thời điểm dùng điện thoại” là dữ liệu gì? | Định tính* | Định lượng | Không phải dữ liệu | Đây là dữ liệu phân loại.
? Biểu đồ cột phù hợp nhất với dữ liệu nào? | Số phút trung bình theo nhóm* | Tên học sinh | Địa chỉ nhà | Cột so sánh số liệu giữa các nhóm.
? Vì sao không thu tên học sinh trong phiếu? | Để chấm nhanh hơn | Giảm rủi ro dữ liệu cá nhân* | Vì không cần thiết cho mọi bài | Nguyên tắc tối thiểu dữ liệu.
? Câu nào nên có trong nhận xét? | “Lớp em ai cũng nghiện điện thoại” | “Trong mẫu 30 bạn, nhóm dùng buổi tối chiếm nhiều nhất”* | “Theo em là vậy” | Nhận xét cần số liệu và phạm vi mẫu.

<script type="text/plain" class="lesson-src" data-id="tn3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHTN

:::note Mục tiêu
Một kế hoạch 30 ngày cho tổ Toán – KHTN – Tin – Công nghệ, tập trung vào **một bài mô phỏng hoặc một dự án STEM nhỏ**, có phân công, bằng chứng và chỉ số an toàn thiết bị.
:::

:::story Bể nước của xóm
Tổ Toán – KHTN có bốn thầy cô, mỗi người một môn. Một thầy đề nghị chia nhau soạn học liệu số cho bốn tuần tới: mỗi tuần một người làm, cả tổ dùng. Tháng đầu, kho có mười sáu tệp. Tháng sau, thầy ấy nghỉ ốm hai tuần, bài giảng vẫn chạy đều vì người khác đã có sẵn tư liệu.
**Liên tưởng:** kho học liệu chung như bể nước của xóm; mỗi nhà góp một gàu, cả xóm có nước dùng.

| 3. Hoạt động trọng tâm | Chọn mô phỏng hay dự án nào? | 3 hoạt động |

<script type="text/plain" class="lesson-src" data-id="px1-dac-thu"># Đặc thù khối KHXH THPT và ma trận tích hợp

:::note Mục tiêu
Chọn đúng một địa chỉ tích hợp cho Ngữ văn, Lịch sử, Địa lí, Giáo dục kinh tế và pháp luật, Hoạt động trải nghiệm – hướng nghiệp ở bậc NC1; xử lý được ba vấn đề đặc thù: dấu vết số, buồng vang và lừa đảo việc làm.
:::

:::story Cuộc tranh biện chậm lại
Lớp 11 của cô Hà tranh biện “mạng xã hội làm người trẻ cô đơn hơn”. Một nửa lớp dẫn số liệu, nửa kia kể chuyện. Cô yêu cầu mỗi bên nêu một nguồn và một điểm yếu của chính nguồn đó. Cuộc tranh biện chậm lại nhưng sâu hơn; có nhóm phải rút lại một luận điểm vì nguồn không đủ tin. Cô chấm bằng rubric NC1, không chấm ai nói to hơn.
**Liên tưởng:** học sinh 15–18 tuổi như người sắp ra biển; dạy đọc sóng quan trọng hơn đưa thuyền.
:::

## Học sinh 15–18 tuổi khác gì?

- **Đã có lập luận, nhưng dễ bị dẫn dắt bởi nguồn quen thuộc.** Các em không còn tin mọi thứ, nhưng tin vào nhóm mình theo dõi.
- **Dấu vết số bắt đầu có hậu quả thật.** Hồ sơ xét tuyển, học bổng, việc làm làm part-time đều có thể bị ảnh hưởng.
- **AI đã nằm trong quy trình học.** Các em dùng để tóm tắt, dịch, viết dàn ý – vấn đề không phải “có dùng hay không” mà là **dùng có khai báo và kiểm chứng hay không**.

Ba trọng tâm thực hành của khối XH THPT:

1. **Kiểm chứng chéo** một nguồn bằng văn khố, số liệu và bản đồ số.
2. **Quản trị dấu vết số** như một phần của hướng nghiệp.
3. **Phản biện đầu ra của AI** thay vì chép lại.

## Ma trận tích hợp rút gọn

| Miền | Mã NC1 (Bậc 5) | ATM và mạch AI | Ví dụ đặc thù |
|---|---|---|---|
| I. Khai thác dữ liệu | 1.1.NC1b; 1.2.NC1a; 1.2.NC1b; 1.3.NC1b | ATM1; NLa, NLb | SIFT nâng cao; đối chiếu Niên giám thống kê, bản đồ GIS; bác bỏ tin xuyên tạc lịch sử |
| II. Giao tiếp, hợp tác | 2.2.NC1c; 2.3.NC1b; 2.5.NC1a; 2.6.NC1b | ATM2; NLb | Tranh biện văn minh; quản trị dấu vết số khi xét tuyển |
| III. Sáng tạo nội dung | 3.1.NC1a; 3.2.NC1a; 3.3.NC1a | ATM6; NLb | Tạp chí số; ArcGIS StoryMaps; podcast; gắn giấy phép CC |
| IV. An toàn, an sinh | 4.1.NC1b; 4.2.NC1a; 4.2.NC1c; 4.3.NC1a; 4.4.NC1a | ATM3, ATM4, ATM5 | Luật 91/2025; lừa đảo tuyển dụng; echo chamber; rác thải điện tử |
| V. Giải quyết vấn đề | 5.2.NC1b; 5.3.NC1b; 5.4.NC1b | ATM8; NLc | Dự án nghiên cứu xã hội trên Trello/Notion; khảo sát ẩn danh |
| VI. Ứng dụng AI | 6.1.NC1a; 6.1.NC1b; 6.2.NC1c; 6.3.NC1a | ATM7; NLa–NLd | Gems ôn tập; phát hiện AI Bias, deepfake; khai báo AI |

## Ba địa chỉ tích hợp tự nhiên

### 1. Lịch sử – tư liệu, chủ quyền và bản đồ số

Khi dạy một nội dung về chủ quyền lãnh thổ hoặc quan hệ quốc tế:

- Học sinh nhận hai đoạn trích: một từ sách giáo khoa, một từ một trang không rõ nguồn.
- Nhiệm vụ: kiểm chứng bằng **ít nhất hai nguồn độc lập**, đối chiếu bản đồ số và đơn vị hành chính hiện hành.
- Mã: `1.1.NC1b`, `1.2.NC1a`, `ATM1`.
- Sản phẩm: bảng đối chiếu ba cột *nhận định – nguồn – căn cứ*.
- Lưu ý: dùng địa danh theo Thông tư 17/2025/TT-BGDĐT; không đưa ảnh hay bản đồ không rõ nguồn gốc.

### 2. GDKT&PL – dữ liệu thương mại và lừa đảo tuyển dụng

- Phân tích cơ chế nền tảng số thu thập dữ liệu theo Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15.
- Bóc trần một kịch bản “tuyển cộng tác viên online” yêu cầu đóng phí, chụp CCCD hoặc chuyển khoản.
- Mã: `4.1.NC1b`, `4.2.NC1a`, `ATM3`, `ATM4`; gắn `2.3.NC1b` khi bàn về trách nhiệm công dân.
- Sản phẩm: tờ cảnh báo A4 với ba dấu hiệu và ba việc cần làm.

### 3. HĐTN – hướng nghiệp và dấu vết số

- Học sinh tự tra tên mình trên công cụ tìm kiếm (không đăng nhập), ghi lại những gì công khai.
- Phân loại: thông tin do mình đăng, do người khác đăng, do nền tảng suy ra.
- Lập kế hoạch 30 ngày: gỡ, chỉnh quyền riêng tư, bổ sung nội dung tích cực.
- Mã: `2.6.NC1b`, `2.3.NC1b`; `ATM2`.
- **Không** yêu cầu học sinh nộp ảnh chụp kết quả tìm kiếm có thông tin cá nhân.

:::warn Buồng vang (echo chamber)
Khi dạy về thuật toán đề xuất, đừng chỉ nói “thuật toán gây nghiện”. Cho học sinh so sánh kết quả tìm kiếm của hai tài khoản khác nhau về cùng một chủ đề, rồi giải thích vì sao cùng một từ khóa lại ra hai thế giới thông tin. Mã gợi ý: `4.2.NC1c`, `ATM5`.
:::

## AI trong khối XH: ba ranh giới

| Ranh giới | Được làm | Không được làm |
|---|---|---|
| Học thuật | Dùng AI gợi ý dàn ý, phản biện lập luận | Nộp bài do AI viết, không khai báo |
| Nguồn | Dùng NotebookLM trên tư liệu đã tải lên hợp pháp | Trích dẫn câu AI trả lời như nguồn gốc |
| Hình ảnh, giọng nói | Tạo minh họa có ghi chú “do AI tạo” | Tạo deepfake của người thật |

Mã gắn với phần này: `6.1.NC1b`, `6.2.NC1c`, `6.3.NC1a`, `ATM7`.

<script type="text/plain" class="lesson-src" data-id="px2-khbd"># Kế hoạch bài dạy 4C – Lịch sử 11

:::note Mục tiêu
Một tiết 45 phút dạy học sinh **kiểm chứng chéo tư liệu lịch sử** bằng ba nguồn, dùng AI như công cụ tra cứu có trích dẫn chứ không phải nguồn chân lý.
:::

:::story Ba phút podcast
Bài “Một sự kiện – ba nguồn”, cô Hà cho học sinh làm podcast ba phút thay vì bài luận. Nhóm đầu tiên mải chọn nhạc nền, quên mất phần đối chiếu nguồn. Cô đưa rubric ba mức: nội dung, bằng chứng, giọng kể. Lần thu thứ hai, một nhóm mở đầu bằng tiếng trống trường, rồi dẫn ba nguồn khác nhau về cùng một sự kiện. Cả lớp lặng người nghe hết, không ai nhìn điện thoại.
**Liên tưởng:** sản phẩm số như cái loa; loa to đến đâu cũng không cứu được nếu người nói không có gì để nói.
:::

## Bài mẫu: “Một sự kiện – ba nguồn”

**Thông tin chung**

- Môn: Lịch sử 11. Thời lượng: 45 phút.
- Chủ đề: tư liệu lịch sử và chủ quyền lãnh thổ (giáo viên chọn sự kiện phù hợp chương trình).
- Mã tích hợp: `1.1.NC1b` (tìm kiếm chuyên sâu), `1.2.NC1a` (đánh giá độ tin cậy), `ATM1`; `6.1.NC1b`, `ATM7`.
- Thiết bị: máy chiếu; 3 bộ tư liệu in; máy tính có NotebookLM (nếu được phép dùng).

**Yêu cầu cần đạt**

1. Phân biệt được tư liệu gốc, tư liệu phái sinh và nội dung do AI tạo.
2. Đối chiếu được ít nhất ba nguồn và chỉ ra điểm thống nhất, điểm khác biệt.
3. Viết được một lập luận 150 từ có trích dẫn nguồn.
4. Nêu được một giới hạn của AI khi tra cứu sử liệu.

:::warn Chọn sự kiện cẩn thận
Không dùng sự kiện còn tranh cãi chưa có kết luận chính thức trong nhà trường. Mục tiêu là dạy **phương pháp kiểm chứng**, không phải khơi tranh luận chính trị.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (5 phút)

- Chiếu hai đoạn mô tả cùng một sự kiện: một đoạn 80 từ từ sách giáo khoa, một đoạn 80 từ do AI viết.
- Hỏi: *“Đoạn nào đáng tin hơn? Căn cứ vào đâu?”*
- Ghi ba câu trả lời lên bảng, chưa chốt. Dẫn vào bài: hôm nay không học “tin ai”, mà học **cách kiểm tra**.

### Hoạt động 2 – Hình thành kiến thức (18 phút)

Chia 6 nhóm, mỗi nhóm nhận một bộ ba tư liệu:

1. Một trích đoạn sách giáo khoa.
2. Một trích đoạn từ văn bản, bài báo học thuật có nguồn rõ.
3. Một đoạn văn bản hoặc ảnh không rõ nguồn (giáo viên hư cấu, ghi rõ “mẫu giả định”).

Nhiệm vụ theo phiếu ba cột:

| Nhận định trong tư liệu | Nguồn | Căn cứ kiểm chứng |
|---|---|---|
| | | |

- Nhóm xác định: tư liệu nào là gốc, tư liệu nào phái sinh; chỗ nào ba nguồn khớp nhau; chỗ nào lệch.
- Giáo viên hỏi mỗi nhóm đúng một câu: *“Nếu chỉ có nguồn số 3, em có kết luận được không? Vì sao?”*
- Hướng dẫn dùng NotebookLM: chỉ tải tư liệu **đã được phép**, hỏi câu hỏi hẹp, yêu cầu trích dẫn vị trí; sau đó mở tài liệu gốc để đối chiếu.
- Chốt: **AI trả lời không phải là nguồn; trích dẫn của AI phải được mở lại và kiểm tra.**

### Hoạt động 3 – Luyện tập (14 phút)

- Cá nhân viết 150 từ: *“Sự kiện được mô tả thống nhất ở điểm nào, khác ở điểm nào, và em tin nguồn nào hơn? Vì sao?”*
- Yêu cầu: ít nhất hai trích dẫn; ghi rõ nguồn nào do AI hỗ trợ tìm.
- Đổi bài theo cặp, dùng rubric bên dưới.
- Giáo viên đọc một bài tốt và một bài còn thiếu căn cứ (ẩn tên).

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: chọn một bài đăng mạng về lịch sử/địa lí, ghi ba dấu hiệu cần kiểm chứng và một nguồn chính thống để đối chiếu.
- Học sinh nêu một câu: *“Lần sau gặp ảnh tư liệu, em sẽ …”*
- Chốt ba bước: **mở nguồn – đối chiếu – ghi lại căn cứ**.

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Chọn nguồn | Dùng một nguồn duy nhất | Có hai nguồn độc lập | Ba nguồn, phân biệt gốc/phái sinh |
| Đối chiếu | Chỉ tóm tắt | Chỉ ra điểm khớp | Chỉ ra cả điểm khớp và điểm lệch, giải thích |
| Lập luận | Khẳng định không căn cứ | Có căn cứ cho từng ý | Có căn cứ, có giới hạn của kết luận |

## Dùng NotebookLM và AI đúng cách

**Quy trình bốn bước**

1. Tải lên **chỉ** tư liệu đã được phép sử dụng (văn bản của cơ quan nhà nước, tài liệu mở, bài do giáo viên biên soạn).
2. Hỏi câu hẹp: *“Đoạn nào trong tài liệu nói về mốc thời gian X?”*
3. Mở đúng vị trí trích dẫn trong tài liệu gốc.
4. Ghi lại: câu hỏi, câu trả lời, vị trí kiểm chứng.

**Ba điều không làm**

- Không tải học bạ, bài làm của học sinh lên công cụ.
- Không trích dẫn câu trả lời của AI như thể là tư liệu gốc.
- Không dùng ảnh do AI tạo làm “tư liệu lịch sử”.

Câu nhắc học sinh: *“AI có thể bịa một câu trích dẫn rất giống thật. Mở tài liệu gốc là bước bắt buộc.”*

## Prompt mẫu cho giáo viên

```text
Vai trò: giáo viên Lịch sử THPT.
Nhiệm vụ: tạo 1 đoạn văn 100 từ mô tả sự kiện [tên sự kiện] theo hướng trung lập, dùng làm mẫu để học sinh phản biện.
Ràng buộc: không bịa số liệu; nếu không chắc thì ghi “cần kiểm chứng”; không nêu quan điểm chính trị.
Đầu ra: đoạn văn + 3 điểm học sinh cần kiểm chứng.
```

## Phân hóa

- **Cần hỗ trợ:** phiếu ba cột có câu hỏi gợi ý và một nguồn đã đánh dấu sẵn.
- **Trung bình:** phiếu trống, ba nguồn.
- **Khá – giỏi:** thêm nhiệm vụ tìm một chi tiết bị **cắt ngữ cảnh** trong nguồn thứ ba và giải thích hậu quả.

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | In ba bộ tư liệu, phát cho nhóm |
| Không có NotebookLM | Bỏ bước AI, giữ nguyên bước đối chiếu ba nguồn |
| Mất mạng | Dùng tư liệu in và sách giáo khoa |
| Lớp đông | Nhóm 6 học sinh, mỗi nhóm một bộ tư liệu khác nhau |

:::checklist Trước khi dạy
- [ ] Ba bộ tư liệu đã in, ghi rõ nguồn.
- [ ] Nguồn thứ ba là mẫu hư cấu, có nhãn “giả định”.
- [ ] Tư liệu tải lên NotebookLM đã được phép sử dụng.
- [ ] Rubric đã phát cho học sinh.
- [ ] Có phương án không thiết bị.
:::

## Tự kiểm tra

:::quiz
? AI trả lời có được coi là một nguồn không? | Có | Không, phải mở tài liệu gốc* | Chỉ khi trả lời dài | AI không phải nguồn tư liệu.
? Bước nào bắt buộc sau khi AI trích dẫn? | Đổi câu hỏi | Mở tài liệu gốc kiểm tra* | Chụp ảnh màn hình | Trích dẫn phải được kiểm chứng.
? Tiêu chí “phân biệt gốc/phái sinh” thuộc mức nào? | Mức 1 | Mức 2 | Mức 3* | Đây là tiêu chí mức tốt.
:::

<script type="text/plain" class="lesson-src" data-id="pn1-dac-thu"># Đặc thù khối KHTN THPT và ma trận tích hợp

:::note Mục tiêu
Chọn một địa chỉ tích hợp cho Toán, Vật lí, Hóa học, Sinh học, Tin học, Công nghệ ở bậc NC1; dùng được mô phỏng và dữ liệu thực nghiệm mà vẫn giữ an toàn và liêm chính khoa học.
:::

:::story Câu trả lời quá trơn
Thầy Hùng dạy Vật lí 10, cho học sinh dùng AI giải thích hiện tượng “vì sao bầu trời xanh”. AI trả lời trơn tru nhưng lẫn một khái niệm sai về tán xạ. Thầy không bác bỏ ngay, yêu cầu học sinh đối chiếu sách giáo khoa và tìm chỗ sai. Lớp chia ba nhóm, hai nhóm tìm ra. Nhóm còn lại không tìm được cũng học được một điều: câu trả lời càng trơn càng phải chậm lại.
**Liên tưởng:** AI như học sinh giỏi nói nhanh; người thầy giỏi là người bắt được chỗ nói nhanh mà sai.
:::

## Học sinh 15–18 tuổi với khoa học tự nhiên

- **Tư duy trừu tượng đã phát triển**, nhưng nhiều em vẫn học công thức tách rời hiện tượng.
- **Mô phỏng rất hấp dẫn**, dễ khiến học sinh bấm chơi mà không ghi dự đoán, không rút kết luận.
- **AI trả lời trôi chảy**, kể cả khi sai đơn vị, bỏ điều kiện hoặc bịa số liệu thực nghiệm.
- **Dữ liệu khảo sát, điểm số, ảnh thí nghiệm** là dữ liệu cá nhân cần bảo vệ.

Ba trọng tâm:

1. **Dự đoán trước – quan sát sau – giải thích chỗ lệch.**
2. **Kiểm chứng đầu ra của AI bằng đơn vị, dữ kiện và logic.**
3. **Ẩn danh hóa dữ liệu** trong mọi khảo sát và báo cáo.

## Ma trận tích hợp rút gọn

| Miền | Mã NC1 (Bậc 5) | ATM và mạch AI | Ví dụ đặc thù KHTN |
|---|---|---|---|
| I. Khai thác dữ liệu | 1.1.NC1b; 1.2.NC1a; 1.2.NC1b; 1.3.NC1b | ATM1; NLa, NLb | Đọc số liệu thống kê; SIFT tin giả khoa học; kiểm chứng đồ thị |
| II. Giao tiếp, hợp tác | 2.2.NC1c; 2.3.NC1b; 2.5.NC1a; 2.6.NC1b | ATM2; NLb | Báo cáo nhóm; trích dẫn nguồn; tách tài khoản học tập |
| III. Sáng tạo nội dung | 3.1.NC1a; 3.2.NC1a; 3.3.NC1a | ATM6; NLb | Tệp GeoGebra/Desmos; poster khoa học; giấy phép ảnh |
| IV. An toàn, an sinh | 4.1.NC1b; 4.2.NC1a; 4.2.NC1c; 4.3.NC1a; 4.4.NC1a | ATM3, ATM4, ATM5 | Bảo vệ dữ liệu khảo sát; lừa đảo OTP; an toàn điện, hóa chất; rác thải pin |
| V. Giải quyết vấn đề | 5.2.NC1b; 5.3.NC1b; 5.4.NC1b | ATM8; NLc | Dự án STEM trên Trello/Notion; quy trình xử lý sự cố phòng lab |
| VI. Ứng dụng AI | 6.1.NC1a; 6.1.NC1b; 6.2.NC1c; 6.3.NC1a | ATM7; NLa–NLd | Đối chiếu lời giải AI; phát hiện ảo giác; khai báo AI trong báo cáo |

## Ba địa chỉ tích hợp tự nhiên

### 1. Toán – khảo sát hàm số và hình học không gian

- Dùng GeoGebra hoặc Desmos để học sinh **tự dựng** đồ thị, kéo thanh trượt tham số, ghi nhận sự thay đổi.
- Mã: `3.1.NC1a` (tạo, chỉnh sửa nội dung đa định dạng), `3.2.NC1a`; `1.2.NC1a` khi đánh giá một đồ thị có sẵn.
- Sản phẩm: tệp `.ggb` hoặc ảnh đồ thị kèm 5 dòng giải thích.
- Cảnh báo: đồ thị đẹp không chứng minh kết luận; phải có lập luận.

### 2. Vật lí – dao động và sóng với PhET

- Học sinh ghi dự đoán chu kì theo chiều dài con lắc, sau đó chạy mô phỏng, đổi **một** biến.
- Mã: `1.2.NC1a` (đánh giá độ tin cậy dữ liệu), `6.3.NC1a` (phê phán kỹ thuật), `ATM1`, `ATM7`.
- Sản phẩm: bảng dự đoán – kết quả – giải thích.
- An toàn: mô phỏng không thay thế quy tắc an toàn khi làm thí nghiệm thật.

### 3. Hóa học và Sinh học – mô hình phân tử, dữ liệu sống

- Hóa: dùng MolView/ChemCollective xem cấu trúc, mô phỏng phản ứng; đối chiếu với sách giáo khoa.
- Sinh: phân tích một bộ dữ liệu ẩn danh (ví dụ nhịp tim, chiều cao) bằng bảng tính; nêu giới hạn mẫu.
- Mã: `1.2.NC1b`, `1.3.NC1b`, `ATM1`; `4.2.NC1a`, `ATM3` khi xử lý dữ liệu.
- Sản phẩm: báo cáo 1 trang có biểu đồ, nguồn và phần “giới hạn của dữ liệu”.

## Ba kiểm tra với đầu ra của AI

| Kiểm tra | Câu hỏi | Lỗi thường gặp |
|---|---|---|
| Đơn vị | Kết quả đúng thứ nguyên? | Đổi đơn vị sai, thiếu bình phương |
| Điều kiện | Có bỏ qua điều kiện không? | Bỏ qua ma sát, bỏ qua giới hạn miền |
| Nguồn | Số liệu lấy từ đâu? | Bịa hằng số, bịa thí nghiệm |

Mã: `6.1.NC1b`, `6.3.NC1a`, `ATM7`.

:::warn Không nhập dữ liệu thực nghiệm chưa công bố
Đề tài nghiên cứu khoa học kỹ thuật của học sinh có thể chứa dữ liệu chưa công bố. Không tải lên công cụ AI công cộng nếu chưa được giáo viên hướng dẫn và chưa ẩn danh.
:::

## Tự kiểm tra

:::quiz
? Việc đầu tiên khi dùng mô phỏng là gì? | Ghi dự đoán* | Chụp ảnh | Đổi tham số liên tục | Dự đoán tạo mục đích cho quan sát.
? Mã nào gắn với phê phán khía cạnh kỹ thuật của AI? | 6.1.NC1a | 6.3.NC1a* | 5.2.NC1b | 6.3.NC1a là phê phán kỹ thuật và đạo đức AI.
? Dữ liệu khảo sát học sinh cần xử lý thế nào? | Công khai để minh bạch | Ẩn danh hóa* | Gửi qua nhóm chat | Bảo vệ dữ liệu cá nhân.
? “Ba kiểm tra” gồm những gì? | Đơn vị, điều kiện, nguồn* | Màu sắc, cỡ chữ, tốc độ | Tên, lớp, trường | Đây là ba kiểm tra khoa học.
:::

<script type="text/plain" class="lesson-src" data-id="pn2-khbd"># Kế hoạch bài dạy 4C – Vật lí 11

:::note Mục tiêu
Một tiết 45 phút về dao động điều hòa, học sinh **dự đoán – chạy mô phỏng – giải thích**, dùng PhET và một phương án thí nghiệm thật tối giản.
:::

:::story Dự đoán ngược
Thầy Hùng dạy bài con lắc ở một trường miền núi. Học sinh dự đoán “chu kì phụ thuộc khối lượng”. Thầy không nói đúng sai, cho chạy PhET trước, thí nghiệm thật sau. Khi kết quả ngược dự đoán, một em hỏi: “Vậy hồi nãy em sai ở đâu?” Thầy bảo đó là câu hỏi hay nhất của tiết, rồi để cả lớp cùng truy nguyên chỗ nhầm.
**Liên tưởng:** dạy khoa học như dạy bơi; không ai bơi giỏi bằng cách đứng trên bờ nghe thầy giảng.
:::

## Bài mẫu: “Dao động điều hòa – chu kì phụ thuộc vào gì?”

**Thông tin chung**

- Môn: Vật lí 11. Thời lượng: 45 phút.
- Chủ đề: dao động điều hòa; chu kì của con lắc lò xo và con lắc đơn.
- Mã tích hợp: `1.2.NC1a` (đánh giá độ tin cậy dữ liệu), `6.3.NC1a` (phê phán kỹ thuật), `ATM1`, `ATM7`.
- Thiết bị: máy chiếu; PhET “Masses and Springs” hoặc “Pendulum Lab” (bản trực tuyến hoặc ngoại tuyến); 2–3 bộ con lắc đơn đơn giản.

**Yêu cầu cần đạt**

1. Nêu được các đại lượng đặc trưng của dao động điều hòa: biên độ, chu kì, tần số, pha.
2. Viết được phương trình x = A·cos(ωt + φ) từ đồ thị hoặc dữ liệu.
3. Dự đoán và kiểm tra được sự phụ thuộc của chu kì vào khối lượng (lò xo) và chiều dài (con lắc đơn).
4. Nêu được một giới hạn của mô phỏng hoặc của phép đo.

:::warn Giới hạn của mô hình
Với con lắc đơn, “chu kì không phụ thuộc biên độ” chỉ đúng gần đúng khi biên độ nhỏ. Nếu học sinh thử biên độ lớn, kết quả sẽ lệch – hãy dùng chính chỗ lệch đó để dạy về giới hạn mô hình.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (5 phút)

- Chiếu một video ngắn hoặc hình ảnh chiếc xích đu, con lắc đồng hồ.
- Hỏi: *“Nếu kéo xích đu lên cao hơn, nó có đung đưa chậm hơn không?”*
- Lấy 3 dự đoán, ghi lên bảng, chưa chốt.
- Dẫn vào bài: hôm nay kiểm tra bằng mô phỏng và thí nghiệm.

### Hoạt động 2 – Hình thành kiến thức (18 phút)

Chia nhóm 4–6. Mỗi nhóm nhận phiếu ba cột:

| Dự đoán | Kết quả mô phỏng | Giải thích |
|---|---|---|
| | | |

Nhiệm vụ 1 – con lắc lò xo:

- Giữ biên độ, tăng khối lượng. Dự đoán chu kì tăng, giảm hay không đổi?
- Chạy PhET, đo thời gian 10 dao động, tính chu kì.
- So sánh với công thức T = 2π√(m/k).

Nhiệm vụ 2 – con lắc đơn:

- Giữ chiều dài, đổi biên độ nhỏ; sau đó đổi chiều dài.
- Dự đoán và kiểm tra; so sánh với T = 2π√(l/g).
- Thử một biên độ lớn để thấy mô hình bắt đầu lệch.

Giáo viên hỏi mỗi nhóm: *“Sai số nào lớn nhất trong phép đo của em?”* – dẫn đến khái niệm sai số và giới hạn mô hình.

### Hoạt động 3 – Luyện tập (14 phút)

- Mỗi nhóm nhận một đồ thị x(t) (in sẵn hoặc xuất từ PhET).
- Xác định biên độ, chu kì, tần số góc; viết phương trình.
- Đổi bài giữa hai nhóm, kiểm tra chéo bằng cách thay t = 0 và t = T/4.
- Giáo viên chiếu một lời giải AI có lỗi đơn vị (ví dụ chu kì tính bằng giây nhưng ghi cm) và hỏi cách phát hiện.

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: thiết kế một thí nghiệm 3 bước để kiểm tra chu kì con lắc đơn phụ thuộc chiều dài, dùng dụng cụ sẵn có.
- Hai nhóm trình bày 60 giây; cả lớp chỉ ra biến nào được giữ nguyên.
- Chốt: **dự đoán – một biến – đo – giải thích chỗ lệch**.

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Dự đoán | Không ghi dự đoán | Ghi dự đoán có lý do | Dự đoán kèm công thức hoặc lập luận |
| Đo và ghi dữ liệu | Ghi rời rạc, thiếu đơn vị | Đủ số liệu, có đơn vị | Có sai số, có số lần lặp |
| Giải thích | Mô tả lại kết quả | Giải thích bằng công thức | Nêu giới hạn mô hình và sai số |

## Dùng AI đúng chỗ

**Được dùng**

- Sinh 3 bài tập cùng dạng để luyện, sau đó giáo viên kiểm tra đáp án.
- Gợi ý cách trình bày đồ thị.

**Không dùng**

- Nhập dữ liệu thí nghiệm thật của học sinh lên công cụ công khai.
- Tin lời giải AI khi chưa kiểm tra đơn vị và điều kiện.

Câu nhắc học sinh: *“AI có thể giải đúng phương trình nhưng sai đơn vị. Kiểm tra thứ nguyên trước khi tin.”*

## Prompt mẫu

```text
Vai trò: giáo viên Vật lí 11.
Nhiệm vụ: tạo 3 bài tập ngắn về con lắc lò xo, mỗi bài yêu cầu tính chu kì và tần số.
Ràng buộc: ghi rõ đơn vị; không dùng số liệu thí nghiệm thật; kèm đáp án và một lỗi sai thường gặp.
Đầu ra: đề – đáp án – lỗi sai.
```

## Phân hóa

- **Cần hỗ trợ:** phiếu có sẵn công thức và một ví dụ mẫu.
- **Trung bình:** phiếu trống, đồ thị cho sẵn.
- **Khá – giỏi:** tự chọn biến, thiết kế bảng đo, đánh giá sai số.

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có PhET | Dùng con lắc thật: dây, quả nặng, thước, đồng hồ bấm giây |
| Không có điện thoại | Đếm 10 dao động bằng đồng hồ treo tường |
| Không có máy chiếu | Vẽ đồ thị mẫu lên bảng phụ |
| Phòng chật | Chia trạm: trạm đo, trạm tính, trạm vẽ đồ thị |

:::checklist Trước khi dạy
- [ ] PhET chạy được trên máy sẽ dùng (thử trước giờ).
- [ ] Phiếu dự đoán đã in đủ nhóm.
- [ ] Đồ thị mẫu có đơn vị rõ ràng.
- [ ] Có phương án con lắc thật.
- [ ] Không có dữ liệu định danh học sinh trong tệp mẫu.
:::

## Tự kiểm tra

:::quiz
? Chu kì con lắc lò xo phụ thuộc vào gì? | Khối lượng và độ cứng lò xo* | Biên độ | Màu lò xo | T = 2π√(m/k).
? Vì sao thử biên độ lớn lại hữu ích? | Để thấy giới hạn mô hình* | Để làm đẹp đồ thị | Để tăng điểm | Mô hình chỉ gần đúng với biên độ nhỏ.
? Việc nào KHÔNG nên làm với AI? | Kiểm tra đơn vị | Nhập dữ liệu thí nghiệm thật* | Sinh bài tập luyện | Dữ liệu thật có thể lộ thông tin.
? “Một biến” trong thiết kế thí nghiệm nghĩa là gì? | Chỉ đổi một yếu tố, giữ nguyên các yếu tố khác* | Chỉ làm một lần đo | Chỉ dùng một dụng cụ | Để quy kết quả cho biến đó.
:::

<script type="text/plain" class="lesson-src" data-id="pn3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHTN THPT

:::note Mục tiêu
Một kế hoạch 30 ngày cho tổ Toán – Vật lí – Hóa – Sinh – Tin – Công nghệ, đi từ **một mô phỏng dạy thử** đến **một quy trình lab an toàn và một kho học liệu dùng chung**.
:::

:::story Mỗi người một cánh
Tổ Toán – Lý – Hóa – Sinh của thầy Hùng có mười hai người. Họ lập một kho chung, chia theo tuần. Tuần đầu, một cô Hóa đóng góp bộ mô phỏng; tuần sau, thầy Toán dùng lại cho bài xác suất. Thầy Hùng nói: trước đây mỗi người một ổ, giờ mỗi người một cánh, nhưng cùng một con chim.
**Liên tưởng:** chuyên môn không nằm trong đầu một người; nó nằm trong cách tổ giữ và trao nhau.
:::

## Năm bước

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Phòng lab, máy tính, phần mềm nào chạy được? | Bảng kiểm 12 dòng |

**Ví dụ mục tiêu:** *“Đến 20/12, 4/8 giáo viên của tổ dạy một tiết có mô phỏng hoặc thí nghiệm, mỗi tiết có phiếu dự đoán và một sản phẩm số; tổ có một quy trình lab an toàn được niêm yết.”*

## Bốn tuần PDCA

### Tuần 1 – Plan: hạ tầng, an toàn, chọn bài

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Kiểm tra phòng lab: điện, vòi khí, tủ hút, bình chữa cháy | Tổ trưởng + phụ trách lab | Phiếu kiểm có ảnh |
| Kiểm tra máy tính: PhET, GeoGebra, Desmos, bảng tính, LaTeX | GV Tin học | Danh sách phiên bản |
| Chọn một bài có mô phỏng hoặc thí nghiệm nhỏ | Nhóm chuyên môn | Biên bản |
| Thống nhất phiếu dự đoán và quy tắc “một biến” | Cả tổ | Mẫu phiếu |

### Tuần 2 – Do: dạy thử, ghi lỗi và sự cố

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Dạy thử theo 4 hoạt động | Giáo viên đăng ký | KHBD |
| Ghi nhật ký lỗi: phần mềm, thiết bị, thao tác học sinh | GV + phụ trách lab | Nhật ký 1 trang |
| Chụp 3 phiếu dự đoán đã ẩn tên | Giáo viên | 3 ảnh |
| Hai đồng nghiệp dự giờ | Nhóm quan sát | Phiếu quan sát |

:::warn An toàn trước tiên
Với thí nghiệm có điện, nhiệt hoặc hóa chất, giáo viên phải kiểm tra thiết bị và thử trước. Không dùng mô phỏng để thay thế hướng dẫn an toàn. Sự cố dù nhỏ cũng ghi vào sổ để rút kinh nghiệm.
:::

### Tuần 3 – Check: dữ liệu, an toàn, tính liêm chính

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Đếm tỷ lệ phiếu có dự đoán và lý do | Giáo viên | Bảng tổng hợp |
| So sánh kết quả mô phỏng với công thức hoặc số liệu chuẩn | Nhóm chuyên môn | Bảng đối chiếu |
| Kiểm tra 5 bài báo cáo: có ghi nguồn, có khai báo AI không | Tổ trưởng | Bảng kiểm |
| Rà soát dữ liệu: ảnh, tệp, bảng điểm có nằm ngoài nơi được phép | Tổ trưởng | Danh sách kiểm |

### Tuần 4 – Act: chuẩn hóa kho học liệu

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Sửa bài thành phiên bản 2, thêm “phương án không thiết bị” | Giáo viên | Tệp v2 |
| Đưa tệp GeoGebra/Desmos/LaTeX vào thư mục chung, đặt tên theo quy ước | GV nòng cốt | Thư mục |
| Niêm yết quy trình lab an toàn và quy tắc báo sự cố | Tổ trưởng + phụ trách lab | Ảnh niêm yết |
| Chọn bài tiếp theo | Cả tổ | Danh sách 2 bài |

```text
kho-khtn/

  vat-li/        (tệp mô phỏng, video ngắn)
  hoa-hoc/       (mô hình phân tử, phiếu lab)

Quy ước tên: `mon_khoi_bai_phien-ban`. Không đặt tên học sinh trong tên tệp. Ghi rõ giấy phép của ảnh và mô hình tải về.

- “Cặp đôi số”: một giáo viên thành thạo GeoGebra/LaTeX kèm một giáo viên mới.

  function siftHTML() {
    return '<div class="tool-box"><h2>Mô phỏng SIFT</h2>' +
      '<p class="sub">SIFT: Dừng lại – Điều tra nguồn – Tìm nguồn tốt hơn – Truy vết. Chọn cách làm đúng ở từng bước; công cụ sẽ giải thích ngay.</p>' +
      '<div class="tool-actions"><button class="btn ghost small" data-sc="0">Tình huống 1</button><button class="btn ghost small" data-sc="1">Tình huống 2</button><button class="btn ghost small" id="siftReset">Làm lại</button></div>' +
      '<div id="siftBody" style="margin-top:14px"></div></div>';
  }
  function mountSift(host) {
    let sc = 0;
    const answers = [{}, {}];
    function draw() {
      const s = SIFT[sc];
      let html = '<div class="scenario"><span class="tag">' + esc(s.title) + '</span><p>' + esc(s.lead) + '</p></div>';
      s.steps.forEach((step, si) => {
        const chosen = answers[sc][si];
        const done = chosen != null;
        html += '<div class="step' + (done ? (step.opts[chosen][1] ? " ok" : " no") : "") + '"><h4>Bước ' + (si + 1) + '</h4><p style="margin:.2em 0 .5em">' + esc(step.q) + '</p><div class="opt-list">' +
          step.opts.map((o, oi) =>
            '<button class="opt-btn' + (done ? (oi === chosen ? (o[1] ? " correct" : " wrong") : (o[1] && done ? " correct" : "")) : "") + '" data-step="' + si + '" data-opt="' + oi + '"' + (done ? " disabled" : "") + '>' + esc(o[0]) + '</button>').join("") +
          '</div>' + (done ? '<div class="feedback show"><strong>' + (step.opts[chosen][1] ? "Chính xác. " : "Chưa đúng. ") + '</strong>' + esc(step.opts[chosen][2]) + '</div>' : "") + '</div>';
      });
      const answered = Object.keys(answers[sc]).length;
      const correct = Object.keys(answers[sc]).filter((k) => s.steps[k].opts[answers[sc][k]][1]).length;
      html += '<div class="score-bank"><b>' + correct + '/4</b><span>bước đúng · đã trả lời ' + answered + '/4</span></div>';
      html += '<div class="callout do"><span class="callout-title">Dùng trong lớp</span><p>Phát phiếu SIFT in sẵn cho nhóm 4 học sinh; mỗi nhóm kiểm chứng một tin thật đang lan truyền ở địa phương, ghi đủ bốn bước và nguồn đối chiếu.</p></div>';
      $("#siftBody", host).innerHTML = html;
      $$("#siftBody .opt-btn", host).forEach((btn) => btn.addEventListener("click", () => {
        const si = Number(btn.dataset.step), oi = Number(btn.dataset.opt);
        if (answers[sc][si] != null) return;
        answers[sc][si] = oi;
        draw();
      }));
    }
    $$("[data-sc]", host).forEach((b) => b.onclick = () => { sc = Number(b.dataset.sc); draw(); });
    $("#siftReset", host).onclick = () => { answers[0] = {}; answers[1] = {}; draw(); };
    draw();
  }

  const ATM_STEPS = [

    ["s4", "Phân loại mức độ: Mức 1 nhẹ, Mức 2 trung bình, Mức 3 nghiêm trọng."],
    ["s5", "Báo ngay đầu mối an toàn số của trường: Phó Hiệu trưởng phụ trách hoặc Tổ tư vấn tâm lý học đường."],

  const POOL_ORDER = ["s3", "s1", "s6", "s2", "s7", "s4", "s5"];

  function atmHTML() {
    return '<div class="tool-box"><h2>Ứng phó sự cố an toàn mạng</h2>' +
      '<p class="sub">Bảy bước dành cho giáo viên chủ nhiệm và cán bộ quản lý, theo bộ tài liệu NAEM 2026.</p>' +
      '<div class="scenario"><span class="tag">Tình huống</span><p>Một học sinh lớp 7 kể với giáo viên chủ nhiệm: “Có tài khoản lạ nhắn tin đòi con gửi ảnh nhạy cảm, nếu không sẽ phát tán ảnh con đã gửi trước đó. Con sợ lắm.”</p></div>' +
      '<h3 style="font-size:17px;margin:14px 0 6px">A. Phân loại mức độ</h3><div class="opt-list" id="atmLevel">' +
      '<button class="opt-btn" data-lv="1">Mức 1 · Nhẹ: trêu chọc, hiểu lầm trong nhóm chat – xử lý sư phạm</button>' +
      '<button class="opt-btn" data-lv="2">Mức 2 · Trung bình: bắt nạt lặp lại, mạo danh – báo ban giám hiệu và phụ huynh</button>' +
      '<button class="opt-btn" data-lv="3">Mức 3 · Nghiêm trọng: dụ dỗ, tống tiền, ảnh nhạy cảm – can thiệp khẩn cấp</button>' +
      '</div><div class="feedback" id="atmLevelFb"></div>' +
      '<h3 style="font-size:17px;margin:20px 0 6px">B. Sắp xếp đúng thứ tự 7 bước</h3>' +
      '<p style="font-size:14px;color:var(--muted);margin:0">Bấm vào từng thẻ để xếp vào ô. Bấm vào ô đã xếp để trả thẻ về.</p>' +
      '<div class="pool" id="atmPool"></div><div class="order-list" id="atmSlots"></div>' +
      '<div class="tool-actions"><button class="btn primary" id="atmCheck">Kiểm tra</button><button class="btn ghost" id="atmReset">Xếp lại</button><button class="btn ghost" id="atmPrint">In thẻ 7 bước</button></div>' +
      '<div id="atmResult"></div></div>';
  }
  function mountAtm(host) {
    let level = null;
    let order = [];
    const byId = Object.fromEntries(ATM_STEPS);
    function drawPool() {
      $("#atmPool", host).innerHTML = POOL_ORDER.map((id) =>
        '<button data-id="' + id + '"' + (order.includes(id) ? " disabled" : "") + '>' + esc(byId[id].slice(0, 62)) + '…</button>').join("");
      $$("#atmPool button", host).forEach((b) => b.onclick = () => { order.push(b.dataset.id); drawPool(); drawSlots(); });
      $("#atmSlots", host).innerHTML = Array.from({ length: 7 }, (_, i) => {
        const id = order[i];
        return '<div class="order-slot" data-i="' + i + '"><span class="idx">' + (i + 1) + '</span><span>' + (id ? esc(byId[id]) : "<em style=\"color:#9a8b73\">Bấm thẻ bên trên để xếp vào đây</em>") + '</span></div>';
      }).join("");
      $$("#atmSlots .order-slot", host).forEach((s) => s.onclick = () => {
        const i = Number(s.dataset.i);
        if (order[i]) { order.splice(i, 1); drawPool(); drawSlots(); }
      });
    }
    function drawSlots() {
      $("#atmSlots", host).innerHTML = Array.from({ length: 7 }, (_, i) => {
        const id = order[i];
        return '<div class="order-slot" data-i="' + i + '"><span class="idx">' + (i + 1) + '</span><span>' + (id ? esc(byId[id]) : "<em style=\"color:#9a8b73\">Bấm thẻ bên trên để xếp vào đây</em>") + '</span></div>';
      }).join("");
      $$("#atmSlots .order-slot", host).forEach((s) => s.onclick = () => {
        const i = Number(s.dataset.i);
        if (order[i]) { order.splice(i, 1); drawPool(); drawSlots(); }
      });
    }
    $$("#atmLevel .opt-btn", host).forEach((b) => b.onclick = () => {
      level = Number(b.dataset.lv);
      $$("#atmLevel .opt-btn", host).forEach((x) => { x.disabled = true; if (Number(x.dataset.lv) === 3) x.classList.add("correct"); });
      if (level !== 3) b.classList.add("wrong");
      const fb = $("#atmLevelFb", host);
      fb.classList.add("show");
      fb.innerHTML = "<strong>" + (level === 3 ? "Đúng. " : "Chưa đúng. ") + "</strong>Đây là Mức 3: hành vi dụ dỗ, tống tiền và phát tán ảnh nhạy cảm cần can thiệp khẩn cấp, báo ban giám hiệu, gia đình và gọi 111 khi cần.";
    });
    $("#atmCheck", host).onclick = () => {
      const correct = ATM_STEPS.map((s) => s[0]);
      const ok = order.length === 7 && order.every((id, i) => id === correct[i]);
      const marks = Array.from({ length: 7 }, (_, i) => order[i] === correct[i] ? '<span class="mark ok">Đúng</span>' : '<span class="mark no">Sai</span>');
      $("#atmResult", host).innerHTML = '<div class="tool-intro" style="margin-top:16px"><strong>' + (ok ? "Chính xác! Bạn đã nắm đúng thứ tự 7 bước." : "Chưa đúng hoàn toàn. Đối chiếu các vị trí được đánh dấu.") + '</strong><ol style="margin:10px 0 0;padding-left:20px">' +
        ATM_STEPS.map((s, i) => '<li>' + esc(s[1]) + ' ' + (marks[i] || "") + '</li>').join("") + '</ol>' +
        '<p style="margin:12px 0 0"><strong>Đường dây hỗ trợ:</strong> Tổng đài Bảo vệ trẻ em 111 (miễn phí, 24/7) · Công an khẩn cấp 113 · Đầu mối an toàn số của trường.</p></div>';
    };
    $("#atmReset", host).onclick = () => { order = []; drawPool(); $("#atmResult", host).innerHTML = ""; };
    $("#atmPrint", host).onclick = () => {
      const body = ATM_STEPS.map((s, i) => '<li style="margin:6px 0">' + esc(s[1]) + '</li>').join("");
      printHTML("Thẻ 7 bước ứng phó", '<div class="sheet-kicker">THẺ DÁN TỔ CHUYÊN MÔN · AN TOÀN MẠNG</div><h3>7 bước tiếp nhận và xử lý sự cố an toàn mạng học đường</h3>' +
        '<p><em>Dành cho cán bộ quản lý và giáo viên chủ nhiệm. Không phán xét, không hứa giữ bí mật tuyệt đối, lưu bằng chứng đúng cách.</em></p><ol>' + body + '</ol>' +

        '<p>Đầu mối an toàn số của trường: ................................................ Số điện thoại: ................</p>');

  function mountKhbd(host) {
    const state = read(KHBD_KEY, {});
    $$("[data-k]", host).forEach((i) => {
      i.value = state[i.dataset.k] || "";
      i.addEventListener("input", () => { state[i.dataset.k] = i.value; });
    });
    $$("input[type=checkbox]", host).forEach((c) => {
      const key = c.dataset.code ? "code:" + c.dataset.code : "atm:" + c.dataset.atm;
      c.checked = !!state[key];
      c.addEventListener("change", () => { state[key] = c.checked; });
    });
    function vals() {
      const v = (k) => (state[k] || "").trim();
      const codes = Object.keys(state).filter((k) => k.startsWith("code:") && state[k]).map((k) => k.slice(5));
      const atms = Object.keys(state).filter((k) => k.startsWith("atm:") && state[k]).map((k) => k.slice(4));
      return { v, codes, atms };
    }

      const { v, codes, atms } = vals();
      const mon = v("mon") || "…", lop = v("lop") || "…", bai = v("bai") || "…";
