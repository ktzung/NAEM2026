<script type="text/plain" class="lesson-src" data-id="px1-dac-thu"># Đặc thù khối KHXH THPT và ma trận tích hợp

:::note Mục tiêu
Chọn đúng một địa chỉ tích hợp cho Ngữ văn, Lịch sử, Địa lí, Giáo dục kinh tế và pháp luật, Hoạt động trải nghiệm – hướng nghiệp ở bậc NC1; xử lý được ba vấn đề đặc thù: dấu vết số, buồng vang và lừa đảo việc làm.
:::

## Học sinh 15–18 tuổi khác gì?

- **Đã có lập luận, nhưng dễ bị dẫn dắt bởi nguồn quen thuộc.** Các em không còn tin mọi thứ, nhưng tin vào nhóm mình theo dõi.
- **Dấu vết số bắt đầu có hậu quả thật.** Hồ sơ xét tuyển, học bổng, việc làm làm part-time đều có thể bị ảnh hưởng.
- **AI đã nằm trong quy trình học.** Các em dùng để tóm tắt, dịch, viết dàn ý – vấn đề không phải “có dùng hay không” mà là **dùng có khai báo và kiểm chứng hay không**.

Ba trọng tâm thực hành của khối XH THPT:

1. **Kiểm chứng chéo** một nguồn bằng văn khố, số liệu và bản đồ số.
2. **Quản trị dấu vết số** như một phần của hướng nghiệp.
3. **Phản biện đầu ra của AI** thay vì chép lại.

## Ma trận tích hợp rút gọn

| Miền | Mã NC1 (Bậc 5) | ATM và mạch AI | Ví dụ đặc thù |
|---|---|---|---|
| I. Khai thác dữ liệu | 1.1.NC1b; 1.2.NC1a; 1.2.NC1b; 1.3.NC1b | ATM1; NLa, NLb | SIFT nâng cao; đối chiếu Niên giám thống kê, bản đồ GIS; bác bỏ tin xuyên tạc lịch sử |
| II. Giao tiếp, hợp tác | 2.2.NC1c; 2.3.NC1b; 2.5.NC1a; 2.6.NC1b | ATM2; NLb | Tranh biện văn minh; quản trị dấu vết số khi xét tuyển |
| III. Sáng tạo nội dung | 3.1.NC1a; 3.2.NC1a; 3.3.NC1a | ATM6; NLb | Tạp chí số; ArcGIS StoryMaps; podcast; gắn giấy phép CC |
| IV. An toàn, an sinh | 4.1.NC1b; 4.2.NC1a; 4.2.NC1c; 4.3.NC1a; 4.4.NC1a | ATM3, ATM4, ATM5 | Luật 91/2025; lừa đảo tuyển dụng; echo chamber; rác thải điện tử |
| V. Giải quyết vấn đề | 5.2.NC1b; 5.3.NC1b; 5.4.NC1b | ATM8; NLc | Dự án nghiên cứu xã hội trên Trello/Notion; khảo sát ẩn danh |
| VI. Ứng dụng AI | 6.1.NC1a; 6.1.NC1b; 6.2.NC1c; 6.3.NC1a | ATM7; NLa–NLd | Gems ôn tập; phát hiện AI Bias, deepfake; khai báo AI |

## Ba địa chỉ tích hợp tự nhiên

### 1. Lịch sử – tư liệu, chủ quyền và bản đồ số

Khi dạy một nội dung về chủ quyền lãnh thổ hoặc quan hệ quốc tế:

- Học sinh nhận hai đoạn trích: một từ sách giáo khoa, một từ một trang không rõ nguồn.
- Nhiệm vụ: kiểm chứng bằng **ít nhất hai nguồn độc lập**, đối chiếu bản đồ số và đơn vị hành chính hiện hành.
- Mã: `1.1.NC1b`, `1.2.NC1a`, `ATM1`.
- Sản phẩm: bảng đối chiếu ba cột *nhận định – nguồn – căn cứ*.
- Lưu ý: dùng địa danh theo Thông tư 17/2025/TT-BGDĐT; không đưa ảnh hay bản đồ không rõ nguồn gốc.

### 2. GDKT&PL – dữ liệu thương mại và lừa đảo tuyển dụng

- Phân tích cơ chế nền tảng số thu thập dữ liệu theo Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15.
- Bóc trần một kịch bản “tuyển cộng tác viên online” yêu cầu đóng phí, chụp CCCD hoặc chuyển khoản.
- Mã: `4.1.NC1b`, `4.2.NC1a`, `ATM3`, `ATM4`; gắn `2.3.NC1b` khi bàn về trách nhiệm công dân.
- Sản phẩm: tờ cảnh báo A4 với ba dấu hiệu và ba việc cần làm.

### 3. HĐTN – hướng nghiệp và dấu vết số

- Học sinh tự tra tên mình trên công cụ tìm kiếm (không đăng nhập), ghi lại những gì công khai.
- Phân loại: thông tin do mình đăng, do người khác đăng, do nền tảng suy ra.
- Lập kế hoạch 30 ngày: gỡ, chỉnh quyền riêng tư, bổ sung nội dung tích cực.
- Mã: `2.6.NC1b`, `2.3.NC1b`; `ATM2`.
- **Không** yêu cầu học sinh nộp ảnh chụp kết quả tìm kiếm có thông tin cá nhân.

:::warn Buồng vang (echo chamber)
Khi dạy về thuật toán đề xuất, đừng chỉ nói “thuật toán gây nghiện”. Cho học sinh so sánh kết quả tìm kiếm của hai tài khoản khác nhau về cùng một chủ đề, rồi giải thích vì sao cùng một từ khóa lại ra hai thế giới thông tin. Mã gợi ý: `4.2.NC1c`, `ATM5`.
:::

## AI trong khối XH: ba ranh giới

| Ranh giới | Được làm | Không được làm |
|---|---|---|
| Học thuật | Dùng AI gợi ý dàn ý, phản biện lập luận | Nộp bài do AI viết, không khai báo |
| Nguồn | Dùng NotebookLM trên tư liệu đã tải lên hợp pháp | Trích dẫn câu AI trả lời như nguồn gốc |
| Hình ảnh, giọng nói | Tạo minh họa có ghi chú “do AI tạo” | Tạo deepfake của người thật |

Mã gắn với phần này: `6.1.NC1b`, `6.2.NC1c`, `6.3.NC1a`, `ATM7`.

## Tự kiểm tra

:::quiz
? Bậc năng lực của học sinh THPT theo khung là gì? | Bậc 3 | Bậc 4 | Bậc 5 (NC1)* | THPT là NC1 – Bậc 5.
? Mã nào gắn với quản trị dấu vết số? | 2.6.NC1b* | 3.1.NC1a | 5.2.NC1b | 2.6 là bảo vệ danh tính số.
? Echo chamber thường được giải thích bằng cơ chế nào? | Thuật toán đề xuất cá nhân hóa* | Tốc độ mạng chậm | Giới hạn dung lượng | Thuật toán lặp lại nội dung hợp gu.
? Khi dùng AI gợi ý dàn ý, học sinh phải làm gì? | Khai báo và kiểm chứng* | Xóa lịch sử chat | Đổi tài khoản | Minh bạch là yêu cầu bắt buộc.
:::
</script>
<script type="text/plain" class="lesson-src" data-id="px2-khbd"># Kế hoạch bài dạy 4C – Lịch sử 11

:::note Mục tiêu
Một tiết 45 phút dạy học sinh **kiểm chứng chéo tư liệu lịch sử** bằng ba nguồn, dùng AI như công cụ tra cứu có trích dẫn chứ không phải nguồn chân lý.
:::

## Bài mẫu: “Một sự kiện – ba nguồn”

**Thông tin chung**

- Môn: Lịch sử 11. Thời lượng: 45 phút.
- Chủ đề: tư liệu lịch sử và chủ quyền lãnh thổ (giáo viên chọn sự kiện phù hợp chương trình).
- Mã tích hợp: `1.1.NC1b` (tìm kiếm chuyên sâu), `1.2.NC1a` (đánh giá độ tin cậy), `ATM1`; `6.1.NC1b`, `ATM7`.
- Thiết bị: máy chiếu; 3 bộ tư liệu in; máy tính có NotebookLM (nếu được phép dùng).

**Yêu cầu cần đạt**

1. Phân biệt được tư liệu gốc, tư liệu phái sinh và nội dung do AI tạo.
2. Đối chiếu được ít nhất ba nguồn và chỉ ra điểm thống nhất, điểm khác biệt.
3. Viết được một lập luận 150 từ có trích dẫn nguồn.
4. Nêu được một giới hạn của AI khi tra cứu sử liệu.

:::warn Chọn sự kiện cẩn thận
Không dùng sự kiện còn tranh cãi chưa có kết luận chính thức trong nhà trường. Mục tiêu là dạy **phương pháp kiểm chứng**, không phải khơi tranh luận chính trị.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (5 phút)

- Chiếu hai đoạn mô tả cùng một sự kiện: một đoạn 80 từ từ sách giáo khoa, một đoạn 80 từ do AI viết.
- Hỏi: *“Đoạn nào đáng tin hơn? Căn cứ vào đâu?”*
- Ghi ba câu trả lời lên bảng, chưa chốt. Dẫn vào bài: hôm nay không học “tin ai”, mà học **cách kiểm tra**.

### Hoạt động 2 – Hình thành kiến thức (18 phút)

Chia 6 nhóm, mỗi nhóm nhận một bộ ba tư liệu:

1. Một trích đoạn sách giáo khoa.
2. Một trích đoạn từ văn bản, bài báo học thuật có nguồn rõ.
3. Một đoạn văn bản hoặc ảnh không rõ nguồn (giáo viên hư cấu, ghi rõ “mẫu giả định”).

Nhiệm vụ theo phiếu ba cột:

| Nhận định trong tư liệu | Nguồn | Căn cứ kiểm chứng |
|---|---|---|
| | | |

- Nhóm xác định: tư liệu nào là gốc, tư liệu nào phái sinh; chỗ nào ba nguồn khớp nhau; chỗ nào lệch.
- Giáo viên hỏi mỗi nhóm đúng một câu: *“Nếu chỉ có nguồn số 3, em có kết luận được không? Vì sao?”*
- Hướng dẫn dùng NotebookLM: chỉ tải tư liệu **đã được phép**, hỏi câu hỏi hẹp, yêu cầu trích dẫn vị trí; sau đó mở tài liệu gốc để đối chiếu.
- Chốt: **AI trả lời không phải là nguồn; trích dẫn của AI phải được mở lại và kiểm tra.**

### Hoạt động 3 – Luyện tập (14 phút)

- Cá nhân viết 150 từ: *“Sự kiện được mô tả thống nhất ở điểm nào, khác ở điểm nào, và em tin nguồn nào hơn? Vì sao?”*
- Yêu cầu: ít nhất hai trích dẫn; ghi rõ nguồn nào do AI hỗ trợ tìm.
- Đổi bài theo cặp, dùng rubric bên dưới.
- Giáo viên đọc một bài tốt và một bài còn thiếu căn cứ (ẩn tên).

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: chọn một bài đăng mạng về lịch sử/địa lí, ghi ba dấu hiệu cần kiểm chứng và một nguồn chính thống để đối chiếu.
- Học sinh nêu một câu: *“Lần sau gặp ảnh tư liệu, em sẽ …”*
- Chốt ba bước: **mở nguồn – đối chiếu – ghi lại căn cứ**.

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Chọn nguồn | Dùng một nguồn duy nhất | Có hai nguồn độc lập | Ba nguồn, phân biệt gốc/phái sinh |
| Đối chiếu | Chỉ tóm tắt | Chỉ ra điểm khớp | Chỉ ra cả điểm khớp và điểm lệch, giải thích |
| Lập luận | Khẳng định không căn cứ | Có căn cứ cho từng ý | Có căn cứ, có giới hạn của kết luận |

## Dùng NotebookLM và AI đúng cách

**Quy trình bốn bước**

1. Tải lên **chỉ** tư liệu đã được phép sử dụng (văn bản của cơ quan nhà nước, tài liệu mở, bài do giáo viên biên soạn).
2. Hỏi câu hẹp: *“Đoạn nào trong tài liệu nói về mốc thời gian X?”*
3. Mở đúng vị trí trích dẫn trong tài liệu gốc.
4. Ghi lại: câu hỏi, câu trả lời, vị trí kiểm chứng.

**Ba điều không làm**

- Không tải học bạ, bài làm của học sinh lên công cụ.
- Không trích dẫn câu trả lời của AI như thể là tư liệu gốc.
- Không dùng ảnh do AI tạo làm “tư liệu lịch sử”.

Câu nhắc học sinh: *“AI có thể bịa một câu trích dẫn rất giống thật. Mở tài liệu gốc là bước bắt buộc.”*

## Prompt mẫu cho giáo viên

```text
Vai trò: giáo viên Lịch sử THPT.
Nhiệm vụ: tạo 1 đoạn văn 100 từ mô tả sự kiện [tên sự kiện] theo hướng trung lập, dùng làm mẫu để học sinh phản biện.
Ràng buộc: không bịa số liệu; nếu không chắc thì ghi “cần kiểm chứng”; không nêu quan điểm chính trị.
Đầu ra: đoạn văn + 3 điểm học sinh cần kiểm chứng.
```

## Phân hóa

- **Cần hỗ trợ:** phiếu ba cột có câu hỏi gợi ý và một nguồn đã đánh dấu sẵn.
- **Trung bình:** phiếu trống, ba nguồn.
- **Khá – giỏi:** thêm nhiệm vụ tìm một chi tiết bị **cắt ngữ cảnh** trong nguồn thứ ba và giải thích hậu quả.

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | In ba bộ tư liệu, phát cho nhóm |
| Không có NotebookLM | Bỏ bước AI, giữ nguyên bước đối chiếu ba nguồn |
| Mất mạng | Dùng tư liệu in và sách giáo khoa |
| Lớp đông | Nhóm 6 học sinh, mỗi nhóm một bộ tư liệu khác nhau |

:::checklist Trước khi dạy
- [ ] Ba bộ tư liệu đã in, ghi rõ nguồn.
- [ ] Nguồn thứ ba là mẫu hư cấu, có nhãn “giả định”.
- [ ] Tư liệu tải lên NotebookLM đã được phép sử dụng.
- [ ] Rubric đã phát cho học sinh.
- [ ] Có phương án không thiết bị.
:::

## Tự kiểm tra

:::quiz
? AI trả lời có được coi là một nguồn không? | Có | Không, phải mở tài liệu gốc* | Chỉ khi trả lời dài | AI không phải nguồn tư liệu.
? Bước nào bắt buộc sau khi AI trích dẫn? | Đổi câu hỏi | Mở tài liệu gốc kiểm tra* | Chụp ảnh màn hình | Trích dẫn phải được kiểm chứng.
? Tiêu chí “phân biệt gốc/phái sinh” thuộc mức nào? | Mức 1 | Mức 2 | Mức 3* | Đây là tiêu chí mức tốt.
:::
</script>
<script type="text/plain" class="lesson-src" data-id="px3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHXH THPT

:::note Mục tiêu
Một kế hoạch 30 ngày cho tổ Ngữ văn – Lịch sử – Địa lí – GDKT&PL – HĐTN, gắn với bậc NC1: kiểm chứng nguồn, liêm chính học thuật và dấu vết số.
:::

## Năm bước

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Tổ đã dùng AI ở đâu, có khai báo không? | Bảng khảo sát 8 dòng |
| 2. Mục tiêu SMART | 30 ngày tới thay đổi gì? | 1–2 mục tiêu |
| 3. Hoạt động trọng tâm | Chọn một bài, một quy ước | 3 hoạt động |
| 4. Nguồn lực | Ai làm, khi nào, cần gì? | Bảng phân công |
| 5. KPI | Đo bằng gì? | 5 chỉ số |

**Ví dụ mục tiêu:** *“Đến 20/12, 5/7 giáo viên của tổ có một bài dạy trong đó học sinh phải đối chiếu ít nhất hai nguồn và khai báo việc dùng AI; tổ ban hành một quy ước khai báo AI dùng chung.”*

:::tip Đừng bắt đầu bằng “cấm AI”
Quy định chỉ cấm sẽ bị lách. Bắt đầu bằng **mẫu khai báo ngắn** – ba dòng: dùng công cụ nào, cho phần nào, đã kiểm chứng bằng gì – rồi mới bàn đến hình thức xử lý.
:::

<script type="text/plain" class="lesson-src" data-id="pn1-dac-thu"># Đặc thù khối KHTN THPT và ma trận tích hợp

:::note Mục tiêu
Chọn một địa chỉ tích hợp cho Toán, Vật lí, Hóa học, Sinh học, Tin học, Công nghệ ở bậc NC1; dùng được mô phỏng và dữ liệu thực nghiệm mà vẫn giữ an toàn và liêm chính khoa học.
:::

## Học sinh 15–18 tuổi với khoa học tự nhiên

- **Tư duy trừu tượng đã phát triển**, nhưng nhiều em vẫn học công thức tách rời hiện tượng.
- **Mô phỏng rất hấp dẫn**, dễ khiến học sinh bấm chơi mà không ghi dự đoán, không rút kết luận.
- **AI trả lời trôi chảy**, kể cả khi sai đơn vị, bỏ điều kiện hoặc bịa số liệu thực nghiệm.
- **Dữ liệu khảo sát, điểm số, ảnh thí nghiệm** là dữ liệu cá nhân cần bảo vệ.

Ba trọng tâm:

1. **Dự đoán trước – quan sát sau – giải thích chỗ lệch.**
2. **Kiểm chứng đầu ra của AI bằng đơn vị, dữ kiện và logic.**
3. **Ẩn danh hóa dữ liệu** trong mọi khảo sát và báo cáo.

## Ba địa chỉ tích hợp tự nhiên

### 1. Toán – khảo sát hàm số và hình học không gian

- Dùng GeoGebra hoặc Desmos để học sinh **tự dựng** đồ thị, kéo thanh trượt tham số, ghi nhận sự thay đổi.
- Mã: `3.1.NC1a` (tạo, chỉnh sửa nội dung đa định dạng), `3.2.NC1a`; `1.2.NC1a` khi đánh giá một đồ thị có sẵn.
- Sản phẩm: tệp `.ggb` hoặc ảnh đồ thị kèm 5 dòng giải thích.
- Cảnh báo: đồ thị đẹp không chứng minh kết luận; phải có lập luận.

### 2. Vật lí – dao động và sóng với PhET

- Học sinh ghi dự đoán chu kì theo chiều dài con lắc, sau đó chạy mô phỏng, đổi **một** biến.
- Mã: `1.2.NC1a` (đánh giá độ tin cậy dữ liệu), `6.3.NC1a` (phê phán kỹ thuật), `ATM1`, `ATM7`.
- Sản phẩm: bảng dự đoán – kết quả – giải thích.
- An toàn: mô phỏng không thay thế quy tắc an toàn khi làm thí nghiệm thật.

### 3. Hóa học và Sinh học – mô hình phân tử, dữ liệu sống

- Hóa: dùng MolView/ChemCollective xem cấu trúc, mô phỏng phản ứng; đối chiếu với sách giáo khoa.
- Sinh: phân tích một bộ dữ liệu ẩn danh (ví dụ nhịp tim, chiều cao) bằng bảng tính; nêu giới hạn mẫu.
- Mã: `1.2.NC1b`, `1.3.NC1b`, `ATM1`; `4.2.NC1a`, `ATM3` khi xử lý dữ liệu.
- Sản phẩm: báo cáo 1 trang có biểu đồ, nguồn và phần “giới hạn của dữ liệu”.

## Ba kiểm tra với đầu ra của AI

| Kiểm tra | Câu hỏi | Lỗi thường gặp |
|---|---|---|
| Đơn vị | Kết quả đúng thứ nguyên? | Đổi đơn vị sai, thiếu bình phương |
| Điều kiện | Có bỏ qua điều kiện không? | Bỏ qua ma sát, bỏ qua giới hạn miền |
| Nguồn | Số liệu lấy từ đâu? | Bịa hằng số, bịa thí nghiệm |

Mã: `6.1.NC1b`, `6.3.NC1a`, `ATM7`.

:::warn Không nhập dữ liệu thực nghiệm chưa công bố
Đề tài nghiên cứu khoa học kỹ thuật của học sinh có thể chứa dữ liệu chưa công bố. Không tải lên công cụ AI công cộng nếu chưa được giáo viên hướng dẫn và chưa ẩn danh.
:::

<script type="text/plain" class="lesson-src" data-id="pn2-khbd"># Kế hoạch bài dạy 4C – Vật lí 11

:::note Mục tiêu
Một tiết 45 phút về dao động điều hòa, học sinh **dự đoán – chạy mô phỏng – giải thích**, dùng PhET và một phương án thí nghiệm thật tối giản.
:::

## Bài mẫu: “Dao động điều hòa – chu kì phụ thuộc vào gì?”

**Thông tin chung**

- Môn: Vật lí 11. Thời lượng: 45 phút.
- Chủ đề: dao động điều hòa; chu kì của con lắc lò xo và con lắc đơn.
- Mã tích hợp: `1.2.NC1a` (đánh giá độ tin cậy dữ liệu), `6.3.NC1a` (phê phán kỹ thuật), `ATM1`, `ATM7`.
- Thiết bị: máy chiếu; PhET “Masses and Springs” hoặc “Pendulum Lab” (bản trực tuyến hoặc ngoại tuyến); 2–3 bộ con lắc đơn đơn giản.

**Yêu cầu cần đạt**

1. Nêu được các đại lượng đặc trưng của dao động điều hòa: biên độ, chu kì, tần số, pha.
2. Viết được phương trình x = A·cos(ωt + φ) từ đồ thị hoặc dữ liệu.
3. Dự đoán và kiểm tra được sự phụ thuộc của chu kì vào khối lượng (lò xo) và chiều dài (con lắc đơn).
4. Nêu được một giới hạn của mô phỏng hoặc của phép đo.

:::warn Giới hạn của mô hình
Với con lắc đơn, “chu kì không phụ thuộc biên độ” chỉ đúng gần đúng khi biên độ nhỏ. Nếu học sinh thử biên độ lớn, kết quả sẽ lệch – hãy dùng chính chỗ lệch đó để dạy về giới hạn mô hình.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (5 phút)

- Chiếu một video ngắn hoặc hình ảnh chiếc xích đu, con lắc đồng hồ.
- Hỏi: *“Nếu kéo xích đu lên cao hơn, nó có đung đưa chậm hơn không?”*
- Lấy 3 dự đoán, ghi lên bảng, chưa chốt.
- Dẫn vào bài: hôm nay kiểm tra bằng mô phỏng và thí nghiệm.

### Hoạt động 2 – Hình thành kiến thức (18 phút)

Chia nhóm 4–6. Mỗi nhóm nhận phiếu ba cột:

| Dự đoán | Kết quả mô phỏng | Giải thích |
|---|---|---|
| | | |

Nhiệm vụ 1 – con lắc lò xo:

- Giữ biên độ, tăng khối lượng. Dự đoán chu kì tăng, giảm hay không đổi?
- Chạy PhET, đo thời gian 10 dao động, tính chu kì.
- So sánh với công thức T = 2π√(m/k).

Nhiệm vụ 2 – con lắc đơn:

- Giữ chiều dài, đổi biên độ nhỏ; sau đó đổi chiều dài.
- Dự đoán và kiểm tra; so sánh với T = 2π√(l/g).
- Thử một biên độ lớn để thấy mô hình bắt đầu lệch.

Giáo viên hỏi mỗi nhóm: *“Sai số nào lớn nhất trong phép đo của em?”* – dẫn đến khái niệm sai số và giới hạn mô hình.

### Hoạt động 3 – Luyện tập (14 phút)

- Mỗi nhóm nhận một đồ thị x(t) (in sẵn hoặc xuất từ PhET).
- Xác định biên độ, chu kì, tần số góc; viết phương trình.
- Đổi bài giữa hai nhóm, kiểm tra chéo bằng cách thay t = 0 và t = T/4.
- Giáo viên chiếu một lời giải AI có lỗi đơn vị (ví dụ chu kì tính bằng giây nhưng ghi cm) và hỏi cách phát hiện.

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: thiết kế một thí nghiệm 3 bước để kiểm tra chu kì con lắc đơn phụ thuộc chiều dài, dùng dụng cụ sẵn có.
- Hai nhóm trình bày 60 giây; cả lớp chỉ ra biến nào được giữ nguyên.
- Chốt: **dự đoán – một biến – đo – giải thích chỗ lệch**.

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Dự đoán | Không ghi dự đoán | Ghi dự đoán có lý do | Dự đoán kèm công thức hoặc lập luận |
| Đo và ghi dữ liệu | Ghi rời rạc, thiếu đơn vị | Đủ số liệu, có đơn vị | Có sai số, có số lần lặp |
| Giải thích | Mô tả lại kết quả | Giải thích bằng công thức | Nêu giới hạn mô hình và sai số |

## Dùng AI đúng chỗ

**Được dùng**

- Sinh 3 bài tập cùng dạng để luyện, sau đó giáo viên kiểm tra đáp án.
- Gợi ý cách trình bày đồ thị.

**Không dùng**

- Nhập dữ liệu thí nghiệm thật của học sinh lên công cụ công khai.
- Tin lời giải AI khi chưa kiểm tra đơn vị và điều kiện.

Câu nhắc học sinh: *“AI có thể giải đúng phương trình nhưng sai đơn vị. Kiểm tra thứ nguyên trước khi tin.”*

## Prompt mẫu

```text
Vai trò: giáo viên Vật lí 11.
Nhiệm vụ: tạo 3 bài tập ngắn về con lắc lò xo, mỗi bài yêu cầu tính chu kì và tần số.
Ràng buộc: ghi rõ đơn vị; không dùng số liệu thí nghiệm thật; kèm đáp án và một lỗi sai thường gặp.
Đầu ra: đề – đáp án – lỗi sai.
```

## Phân hóa

- **Cần hỗ trợ:** phiếu có sẵn công thức và một ví dụ mẫu.
- **Trung bình:** phiếu trống, đồ thị cho sẵn.
- **Khá – giỏi:** tự chọn biến, thiết kế bảng đo, đánh giá sai số.

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có PhET | Dùng con lắc thật: dây, quả nặng, thước, đồng hồ bấm giây |
| Không có điện thoại | Đếm 10 dao động bằng đồng hồ treo tường |
| Không có máy chiếu | Vẽ đồ thị mẫu lên bảng phụ |
| Phòng chật | Chia trạm: trạm đo, trạm tính, trạm vẽ đồ thị |

:::checklist Trước khi dạy
- [ ] PhET chạy được trên máy sẽ dùng (thử trước giờ).
- [ ] Phiếu dự đoán đã in đủ nhóm.
- [ ] Đồ thị mẫu có đơn vị rõ ràng.
- [ ] Có phương án con lắc thật.
- [ ] Không có dữ liệu định danh học sinh trong tệp mẫu.
:::

## Tự kiểm tra

:::quiz
? Chu kì con lắc lò xo phụ thuộc vào gì? | Khối lượng và độ cứng lò xo* | Biên độ | Màu lò xo | T = 2π√(m/k).
? Vì sao thử biên độ lớn lại hữu ích? | Để thấy giới hạn mô hình* | Để làm đẹp đồ thị | Để tăng điểm | Mô hình chỉ gần đúng với biên độ nhỏ.
? Việc nào KHÔNG nên làm với AI? | Kiểm tra đơn vị | Nhập dữ liệu thí nghiệm thật* | Sinh bài tập luyện | Dữ liệu thật có thể lộ thông tin.
? “Một biến” trong thiết kế thí nghiệm nghĩa là gì? | Chỉ đổi một yếu tố, giữ nguyên các yếu tố khác* | Chỉ làm một lần đo | Chỉ dùng một dụng cụ | Để quy kết quả cho biến đó.
:::
</script>
<script type="text/plain" class="lesson-src" data-id="pn3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHTN THPT

:::note Mục tiêu
Một kế hoạch 30 ngày cho tổ Toán – Vật lí – Hóa – Sinh – Tin – Công nghệ, đi từ **một mô phỏng dạy thử** đến **một quy trình lab an toàn và một kho học liệu dùng chung**.
:::

## Năm bước

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Phòng lab, máy tính, phần mềm nào chạy được? | Bảng kiểm 12 dòng |
| 2. Mục tiêu SMART | 30 ngày tới bao nhiêu giáo viên, bao nhiêu bài? | 1–2 mục tiêu |
| 3. Hoạt động trọng tâm | Chọn mô phỏng, thí nghiệm hay dự án STEM? | 3 hoạt động |
| 4. Nguồn lực | Thiết bị, phần mềm, người hỗ trợ | Bảng phân công |
| 5. KPI | Đo bằng sản phẩm nào? | 5 chỉ số |

**Ví dụ mục tiêu:** *“Đến 20/12, 4/8 giáo viên của tổ dạy một tiết có mô phỏng hoặc thí nghiệm, mỗi tiết có phiếu dự đoán và một sản phẩm số; tổ có một quy trình lab an toàn được niêm yết.”*

## Bốn tuần PDCA

### Tuần 1 – Plan: hạ tầng, an toàn, chọn bài

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Kiểm tra phòng lab: điện, vòi khí, tủ hút, bình chữa cháy | Tổ trưởng + phụ trách lab | Phiếu kiểm có ảnh |
| Kiểm tra máy tính: PhET, GeoGebra, Desmos, bảng tính, LaTeX | GV Tin học | Danh sách phiên bản |
| Chọn một bài có mô phỏng hoặc thí nghiệm nhỏ | Nhóm chuyên môn | Biên bản |
| Thống nhất phiếu dự đoán và quy tắc “một biến” | Cả tổ | Mẫu phiếu |

### Tuần 2 – Do: dạy thử, ghi lỗi và sự cố

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Dạy thử theo 4 hoạt động | Giáo viên đăng ký | KHBD |
| Ghi nhật ký lỗi: phần mềm, thiết bị, thao tác học sinh | GV + phụ trách lab | Nhật ký 1 trang |
| Chụp 3 phiếu dự đoán đã ẩn tên | Giáo viên | 3 ảnh |
| Hai đồng nghiệp dự giờ | Nhóm quan sát | Phiếu quan sát |

:::warn An toàn trước tiên
Với thí nghiệm có điện, nhiệt hoặc hóa chất, giáo viên phải kiểm tra thiết bị và thử trước. Không dùng mô phỏng để thay thế hướng dẫn an toàn. Sự cố dù nhỏ cũng ghi vào sổ để rút kinh nghiệm.
:::

### Tuần 3 – Check: dữ liệu, an toàn, tính liêm chính

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Đếm tỷ lệ phiếu có dự đoán và lý do | Giáo viên | Bảng tổng hợp |
| So sánh kết quả mô phỏng với công thức hoặc số liệu chuẩn | Nhóm chuyên môn | Bảng đối chiếu |
| Kiểm tra 5 bài báo cáo: có ghi nguồn, có khai báo AI không | Tổ trưởng | Bảng kiểm |
| Rà soát dữ liệu: ảnh, tệp, bảng điểm có nằm ngoài nơi được phép | Tổ trưởng | Danh sách kiểm |

### Tuần 4 – Act: chuẩn hóa kho học liệu

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Sửa bài thành phiên bản 2, thêm “phương án không thiết bị” | Giáo viên | Tệp v2 |
| Đưa tệp GeoGebra/Desmos/LaTeX vào thư mục chung, đặt tên theo quy ước | GV nòng cốt | Thư mục |
| Niêm yết quy trình lab an toàn và quy tắc báo sự cố | Tổ trưởng + phụ trách lab | Ảnh niêm yết |
| Chọn bài tiếp theo | Cả tổ | Danh sách 2 bài |

## RACI

| Việc | Hiệu trưởng | Phó hiệu trưởng | Tổ trưởng | GV nòng cốt | GV bộ môn | Phụ trách lab |
|---|---|---|---|---|---|---|
| Phê duyệt kế hoạch | A | C | R | C | I | I |
| Kiểm tra hạ tầng, an toàn | A | R | C | I | I | R |
| Chọn bài dạy thử | I | I | A | R | C | I |
| Dạy thử | I | I | C | C | R/A | C |
| Kiểm tra liêm chính báo cáo | I | R | A | C | C | I |
| Chia sẻ trong tổ | I | I | A | R | C | I |

## Năm vùng KPI

| Vùng | Chỉ số gợi ý | Cách thu thập |
|---|---|---|
| Hồ sơ dạy học | Số bài có phiếu dự đoán | Thư mục tổ |
| Giờ dạy | Số tiết có mô phỏng/thí nghiệm | Lịch báo giảng + phiếu dự |
| Học sinh | % phiếu có dự đoán kèm lý do | Ảnh phiếu đã ẩn tên |
| An toàn | Số sự cố lab (mục tiêu: 0) | Sổ sự cố |
| Liêm chính | % báo cáo có khai báo AI và nguồn | Bảng kiểm |

## Kho học liệu dùng chung

Cấu trúc gợi ý:

```text
kho-khtn/
  toan/          (tệp .ggb, ảnh đồ thị)
  vat-li/        (tệp mô phỏng, video ngắn)
  hoa-hoc/       (mô hình phân tử, phiếu lab)
  sinh-hoc/      (bộ dữ liệu ẩn danh, hình)
  tin-cong-nghe/ (mã nguồn, hướng dẫn)
  _quy-trinh/    (lab an toàn, báo sự cố, khai báo AI)
```

Quy ước tên: `mon_khoi_bai_phien-ban`. Không đặt tên học sinh trong tên tệp. Ghi rõ giấy phép của ảnh và mô hình tải về.

## Cộng đồng chuyên môn (tùy chọn)

- “Cặp đôi số”: một giáo viên thành thạo GeoGebra/LaTeX kèm một giáo viên mới.
- Sinh hoạt 30 phút mỗi tháng: một người trình bày một mẹo, một người phản biện.
- Chủ đề gợi ý: kiểm chứng tin giả khoa học; phát hiện lỗi đơn vị của AI; an toàn dữ liệu trong báo cáo.

## Danh sách kiểm 30 ngày

:::checklist
- [ ] Đã kiểm tra điện, khí, tủ hút, bình chữa cháy.
- [ ] Đã liệt kê phần mềm chạy được và phiên bản.
- [ ] Chọn đúng một bài cho chu kỳ đầu.
- [ ] Có phiếu dự đoán và quy tắc “một biến”.
- [ ] Có người phụ trách lab và ngày hỗ trợ.
- [ ] Có nhật ký lỗi và sổ sự cố.
- [ ] Ảnh sản phẩm học sinh đã ẩn tên.
- [ ] Có phương án không thiết bị.
- [ ] Có phiên bản 2 của bài dạy.
- [ ] Kho học liệu có quy ước tên và giấy phép.
- [ ] Đã chọn bài cho chu kỳ tiếp theo.
:::

## Tự kiểm tra

:::quiz
? Sự cố nhỏ trong lab nên xử lý thế nào? | Ghi vào sổ và rút kinh nghiệm* | Bỏ qua | Chỉ báo khi có người bị thương | Ghi chép giúp phòng ngừa.
? KPI “% báo cáo có khai báo AI” thuộc vùng nào? | Liêm chính* | Hạ tầng | An toàn | Đây là chỉ số liêm chính học thuật.
? Tuần 2 nên làm gì với lỗi phần mềm? | Ghi nhật ký* | Đổi phần mềm ngay | Che giấu | Nhật ký giúp chuẩn bị phương án.
? Mục tiêu SMART cần gì? | Con số và thời hạn* | Càng nhiều bài càng tốt | Phần mềm đắt nhất | SMART phải đo được.
:::

<script>/* Phòng thực hành: sáu công cụ chạy hoàn toàn trên máy, không gửi dữ liệu đi đâu. */
(function () {
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  function downloadText(name, text) {
    const a = document.createElement("a");
    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text);
    a.download = name;
    a.click();
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast("Đã sao chép vào bộ nhớ tạm."));
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Đã sao chép."); } catch { toast("Không sao chép được, hãy chọn và sao chép thủ công."); }
    ta.remove();
  }
  let toastTimer;
  function toast(msg) {
    let box = $("#toastBox");
    if (!box) {
      box = document.createElement("div");
      box.id = "toastBox";
      box.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#10333a;color:#fff;padding:11px 18px;border-radius:9px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2)";
      document.body.appendChild(box);
    }
    box.textContent = msg;
    box.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.style.display = "none"; }, 2600);
  }
  function printHTML(title, html) {
    const surface = $("#printSurface");
    surface.innerHTML = '<div class="sheet">' + html + '</div>';
    document.body.classList.add("printing-tool");
    const done = () => { document.body.classList.remove("printing-tool"); surface.innerHTML = ""; window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => window.print(), 60);
  }

  /* ================= 1. TỰ XẾP NHÓM A/B/C ================= */
  const SELF_ITEMS = [
    ["Miền 1 · Tổ chức dạy học", "Tôi biết tổ chức một hoạt động học cơ bản trên Google Classroom, Microsoft Teams hoặc hệ thống của trường."],
    ["Miền 1 · Tổ chức dạy học", "Tôi biết chọn công cụ số phù hợp cho từng hoạt động thay vì dùng một công cụ cho mọi việc."],
    ["Miền 2 · Kiểm tra, đánh giá", "Tôi tạo được bài kiểm tra ngắn trên Quizizz, Wayground hoặc Google Forms."],
    ["Miền 2 · Kiểm tra, đánh giá", "Tôi biết dùng kết quả kiểm tra để điều chỉnh tiết học tiếp theo."],
    ["Miền 3 · Trao quyền cho người học", "Tôi tạo được học liệu đa phương tiện (ảnh, video, sơ đồ) có ghi rõ nguồn."],
    ["Miền 3 · Trao quyền cho người học", "Tôi biết thiết kế nhiệm vụ để học sinh tự tạo sản phẩm số thay vì chỉ nghe giảng."],
    ["Miền 4 · Kỹ năng công nghệ số", "Tôi biết ẩn danh hóa dữ liệu học sinh trước khi đưa vào công cụ AI."],
    ["Miền 4 · Kỹ năng công nghệ số", "Tôi biết kiểm chứng thông tin bằng quy trình SIFT trước khi chia sẻ."],
    ["Miền 5 · Phát triển chuyên môn", "Tôi tham gia hoặc chủ trì được một buổi sinh hoạt chuyên môn trực tuyến."],
    ["Miền 5 · Phát triển chuyên môn", "Tôi biết chia sẻ học liệu cho đồng nghiệp với giấy phép và ghi nguồn phù hợp."],
    ["Miền 6 · Trí tuệ nhân tạo", "Tôi biết dùng AI để gợi ý ý tưởng nhưng luôn tự kiểm tra lại kết quả."],
    ["Miền 6 · Trí tuệ nhân tạo", "Tôi biết ghi chú minh bạch phần có sử dụng AI trong sản phẩm của mình."]
  ];
  const SELF_KEY = "naem.tool.self.v1";

  function selfHTML() {
    return '<div class="tool-box"><h2>Tự xếp nhóm A/B/C</h2>' +
      '<p class="sub">Mười hai câu, khoảng 3 phút. Kết quả chỉ để chọn lộ trình học, không thay thế đánh giá chính thức theo Thông tư 18/2026/TT-BGDĐT.</p>' +
      '<div id="selfBody"></div>' +
      '<div class="tool-actions"><button class="btn primary" id="selfScore">Xem kết quả</button><button class="btn ghost" id="selfReset">Làm lại</button><button class="btn ghost" id="selfPrint">In phiếu</button></div>' +
      '<div id="selfResult"></div></div>';
  }
  function mountSelf(host) {
    const state = read(SELF_KEY, {});
    const body = $("#selfBody", host);
    body.innerHTML = SELF_ITEMS.map((it, i) => {
      const cur = state[i];
      return '<div class="q-item"><div class="qt"><b>' + (i + 1) + '.</b> ' + esc(it[1]) + '</div>' +
        '<div class="seg">' +
        [["Chưa làm được", 0], ["Làm được khi có người hỗ trợ", 1], ["Tự tin, làm thường xuyên", 2]].map((o) =>
          '<label><input type="radio" name="s' + i + '" value="' + o[1] + '"' + (cur === o[1] ? " checked" : "") + '> ' + o[0] + '</label>').join("") +
        '</div></div>';
    }).join("");
    $$('input[type=radio]', body).forEach((r) => r.addEventListener("change", () => {
      state[r.name.slice(1)] = Number(r.value);
      write(SELF_KEY, state);
    }));
    $("#selfScore", host).onclick = () => {
      let total = 0; const dom = {};
      SELF_ITEMS.forEach((it, i) => {
        const v = Number(state[i] || 0); total += v;
        const key = it[0].split(" · ")[0];
        dom[key] = (dom[key] || 0) + v;
      });
      let band, advice, color;
      if (total <= 8) { band = "Nhóm A · Cơ bản"; color = "#c2670a"; advice = "Bắt đầu từ thao tác công cụ và quy tắc an toàn. Học lần lượt Nền tảng chung, rồi chọn một khóa theo cấp học."; }
      else if (total <= 16) { band = "Nhóm B · Thành thạo"; color = "#146b7a"; advice = "Bạn đã dùng được công cụ. Tập trung thiết kế hoạt động học, prompt 4 thẻ và kế hoạch bài dạy 4C."; }
      else { band = "Nhóm C · Nâng cao"; color = "#2e6b45"; advice = "Bạn có thể dẫn dắt đồng nghiệp. Chọn vai trò cố vấn cặp đôi số, xây kho học liệu chung và kiểm định chất lượng."; }
      const bars = Object.entries(dom).map(([k, v]) =>
        '<div class="domain-row"><div class="dr-head"><span>' + esc(k) + '</span><b>' + v + '/4</b></div><div class="bar"><i style="width:' + (v / 4 * 100) + '%"></i></div></div>').join("");
      $("#selfResult", host).innerHTML = '<div class="tool-intro" style="margin-top:18px">' +
        '<div class="score-bank"><span class="badge-big" style="background:' + color + ';color:#fff">' + band + '</span><b>' + total + '/24</b><span>điểm tự đánh giá</span></div>' +
        '<p><strong>Gợi ý:</strong> ' + advice + '</p>' + bars +
        '<p class="tool-note">Ngưỡng 8 và 16 chỉ là mốc tham chiếu để chia lộ trình; điểm cao ở một miền không thay thế việc quan sát sản phẩm thực tế.</p></div>';
      $("#selfResult", host).scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    $("#selfReset", host).onclick = () => { for (let i = 0; i < 12; i++) delete state[i]; write(SELF_KEY, state); mountSelf(host); $("#selfResult", host).innerHTML = ""; };
    $("#selfPrint", host).onclick = () => {
      let rows = "";
      SELF_ITEMS.forEach((it, i) => {
        const v = Number(state[i] || 0);
        rows += "<tr><td>" + (i + 1) + "</td><td>" + esc(it[1]) + "</td><td style=\"text-align:center\">" + (v === 0 ? "0" : v === 1 ? "1" : "2") + "</td></tr>";
      });

  function siftHTML() {
    return '<div class="tool-box"><h2>Mô phỏng SIFT</h2>' +
      '<p class="sub">SIFT: Dừng lại – Điều tra nguồn – Tìm nguồn tốt hơn – Truy vết. Chọn cách làm đúng ở từng bước; công cụ sẽ giải thích ngay.</p>' +
      '<div class="tool-actions"><button class="btn ghost small" data-sc="0">Tình huống 1</button><button class="btn ghost small" data-sc="1">Tình huống 2</button><button class="btn ghost small" id="siftReset">Làm lại</button></div>' +
      '<div id="siftBody" style="margin-top:14px"></div></div>';
  }
  function mountSift(host) {
    let sc = 0;
    const answers = [{}, {}];
    function draw() {
      const s = SIFT[sc];
      let html = '<div class="scenario"><span class="tag">' + esc(s.title) + '</span><p>' + esc(s.lead) + '</p></div>';
      s.steps.forEach((step, si) => {
        const chosen = answers[sc][si];
        const done = chosen != null;
        html += '<div class="step' + (done ? (step.opts[chosen][1] ? " ok" : " no") : "") + '"><h4>Bước ' + (si + 1) + '</h4><p style="margin:.2em 0 .5em">' + esc(step.q) + '</p><div class="opt-list">' +
          step.opts.map((o, oi) =>
            '<button class="opt-btn' + (done ? (oi === chosen ? (o[1] ? " correct" : " wrong") : (o[1] && done ? " correct" : "")) : "") + '" data-step="' + si + '" data-opt="' + oi + '"' + (done ? " disabled" : "") + '>' + esc(o[0]) + '</button>').join("") +
          '</div>' + (done ? '<div class="feedback show"><strong>' + (step.opts[chosen][1] ? "Chính xác. " : "Chưa đúng. ") + '</strong>' + esc(step.opts[chosen][2]) + '</div>' : "") + '</div>';
      });
      const answered = Object.keys(answers[sc]).length;
      const correct = Object.keys(answers[sc]).filter((k) => s.steps[k].opts[answers[sc][k]][1]).length;
      html += '<div class="score-bank"><b>' + correct + '/4</b><span>bước đúng · đã trả lời ' + answered + '/4</span></div>';
      html += '<div class="callout do"><span class="callout-title">Dùng trong lớp</span><p>Phát phiếu SIFT in sẵn cho nhóm 4 học sinh; mỗi nhóm kiểm chứng một tin thật đang lan truyền ở địa phương, ghi đủ bốn bước và nguồn đối chiếu.</p></div>';
      $("#siftBody", host).innerHTML = html;
      $$("#siftBody .opt-btn", host).forEach((btn) => btn.addEventListener("click", () => {
        const si = Number(btn.dataset.step), oi = Number(btn.dataset.opt);
        if (answers[sc][si] != null) return;
        answers[sc][si] = oi;
        draw();
      }));
    }
    $$("[data-sc]", host).forEach((b) => b.onclick = () => { sc = Number(b.dataset.sc); draw(); });
    $("#siftReset", host).onclick = () => { answers[0] = {}; answers[1] = {}; draw(); };
    draw();
  }

  const ATM_STEPS = [

  const POOL_ORDER = ["s3", "s1", "s6", "s2", "s7", "s4", "s5"];

  function atmHTML() {
    return '<div class="tool-box"><h2>Ứng phó sự cố an toàn mạng</h2>' +
      '<p class="sub">Bảy bước dành cho giáo viên chủ nhiệm và cán bộ quản lý, theo bộ tài liệu NAEM 2026.</p>' +
      '<div class="scenario"><span class="tag">Tình huống</span><p>Một học sinh lớp 7 kể với giáo viên chủ nhiệm: “Có tài khoản lạ nhắn tin đòi con gửi ảnh nhạy cảm, nếu không sẽ phát tán ảnh con đã gửi trước đó. Con sợ lắm.”</p></div>' +

      '<button class="opt-btn" data-lv="2">Mức 2 · Trung bình: bắt nạt lặp lại, mạo danh – báo ban giám hiệu và phụ huynh</button>' +
      '<button class="opt-btn" data-lv="3">Mức 3 · Nghiêm trọng: dụ dỗ, tống tiền, ảnh nhạy cảm – can thiệp khẩn cấp</button>' +
      '</div><div class="feedback" id="atmLevelFb"></div>' +

      '<p style="font-size:14px;color:var(--muted);margin:0">Bấm vào từng thẻ để xếp vào ô. Bấm vào ô đã xếp để trả thẻ về.</p>' +

  }
  function mountAtm(host) {
    let level = null;
    let order = [];
    const byId = Object.fromEntries(ATM_STEPS);
    function drawPool() {
      $("#atmPool", host).innerHTML = POOL_ORDER.map((id) =>
        '<button data-id="' + id + '"' + (order.includes(id) ? " disabled" : "") + '>' + esc(byId[id].slice(0, 62)) + '…</button>').join("");
      $$("#atmPool button", host).forEach((b) => b.onclick = () => { order.push(b.dataset.id); drawPool(); drawSlots(); });
      $("#atmSlots", host).innerHTML = Array.from({ length: 7 }, (_, i) => {
        const id = order[i];
        return '<div class="order-slot" data-i="' + i + '"><span class="idx">' + (i + 1) + '</span><span>' + (id ? esc(byId[id]) : "<em style=\"color:#9a8b73\">Bấm thẻ bên trên để xếp vào đây</em>") + '</span></div>';
      }).join("");
      $$("#atmSlots .order-slot", host).forEach((s) => s.onclick = () => {
        const i = Number(s.dataset.i);
        if (order[i]) { order.splice(i, 1); drawPool(); drawSlots(); }
      });
    }
    function drawSlots() {
      $("#atmSlots", host).innerHTML = Array.from({ length: 7 }, (_, i) => {
        const id = order[i];
        return '<div class="order-slot" data-i="' + i + '"><span class="idx">' + (i + 1) + '</span><span>' + (id ? esc(byId[id]) : "<em style=\"color:#9a8b73\">Bấm thẻ bên trên để xếp vào đây</em>") + '</span></div>';
      }).join("");
      $$("#atmSlots .order-slot", host).forEach((s) => s.onclick = () => {
        const i = Number(s.dataset.i);
        if (order[i]) { order.splice(i, 1); drawPool(); drawSlots(); }
      });
    }
    $$("#atmLevel .opt-btn", host).forEach((b) => b.onclick = () => {
      level = Number(b.dataset.lv);
      $$("#atmLevel .opt-btn", host).forEach((x) => { x.disabled = true; if (Number(x.dataset.lv) === 3) x.classList.add("correct"); });
      if (level !== 3) b.classList.add("wrong");
      const fb = $("#atmLevelFb", host);
      fb.classList.add("show");
      fb.innerHTML = "<strong>" + (level === 3 ? "Đúng. " : "Chưa đúng. ") + "</strong>Đây là Mức 3: hành vi dụ dỗ, tống tiền và phát tán ảnh nhạy cảm cần can thiệp khẩn cấp, báo ban giám hiệu, gia đình và gọi 111 khi cần.";
    });
    $("#atmCheck", host).onclick = () => {
      const correct = ATM_STEPS.map((s) => s[0]);
      const ok = order.length === 7 && order.every((id, i) => id === correct[i]);
      const marks = Array.from({ length: 7 }, (_, i) => order[i] === correct[i] ? '<span class="mark ok">Đúng</span>' : '<span class="mark no">Sai</span>');
      $("#atmResult", host).innerHTML = '<div class="tool-intro" style="margin-top:16px"><strong>' + (ok ? "Chính xác! Bạn đã nắm đúng thứ tự 7 bước." : "Chưa đúng hoàn toàn. Đối chiếu các vị trí được đánh dấu.") + '</strong><ol style="margin:10px 0 0;padding-left:20px">' +
        ATM_STEPS.map((s, i) => '<li>' + esc(s[1]) + ' ' + (marks[i] || "") + '</li>').join("") + '</ol>' +
        '<p style="margin:12px 0 0"><strong>Đường dây hỗ trợ:</strong> Tổng đài Bảo vệ trẻ em 111 (miễn phí, 24/7) · Công an khẩn cấp 113 · Đầu mối an toàn số của trường.</p></div>';
    };
    $("#atmReset", host).onclick = () => { order = []; drawPool(); $("#atmResult", host).innerHTML = ""; };
    $("#atmPrint", host).onclick = () => {
      const body = ATM_STEPS.map((s, i) => '<li style="margin:6px 0">' + esc(s[1]) + '</li>').join("");
      printHTML("Thẻ 7 bước ứng phó", '<div class="sheet-kicker">THẺ DÁN TỔ CHUYÊN MÔN · AN TOÀN MẠNG</div><h3>7 bước tiếp nhận và xử lý sự cố an toàn mạng học đường</h3>' +
        '<p><em>Dành cho cán bộ quản lý và giáo viên chủ nhiệm. Không phán xét, không hứa giữ bí mật tuyệt đối, lưu bằng chứng đúng cách.</em></p><ol>' + body + '</ol>' +
        '<p><strong>Ba mức sự cố:</strong> Mức 1 – nhẹ, xử lý sư phạm. Mức 2 – trung bình, báo ban giám hiệu và phụ huynh. Mức 3 – nghiêm trọng, can thiệp khẩn cấp, gọi 111 hoặc 113.</p>' +
        '<p>Đầu mối an toàn số của trường: ................................................ Số điện thoại: ................</p>');
    };
    drawPool(); drawSlots();
  }

        '<h4>Tự kiểm trước khi nộp</h4><ul><li>Mã năng lực gắn đúng hoạt động, không chỉ ghi ở đầu bài.</li><li>Có ít nhất một phương án không cần thiết bị.</li><li>Không có dữ liệu định danh học sinh trong học liệu hay công cụ AI.</li><li>Có minh chứng đánh giá rõ ràng.</li></ul>';
      return out.innerHTML;
    }
    $("#k-build", host).onclick = () => { build(); $("#k-out", host).scrollIntoView({ behavior: "smooth", block: "nearest" }); };
    $("#k-save", host).onclick = () => { $$("[data-k]", host).forEach((i) => state[i.dataset.k] = i.value); $$("input[type=checkbox]", host).forEach((c) => { const key = c.dataset.code ? "code:" + c.dataset.code : "atm:" + c.dataset.atm; state[key] = c.checked; }); write(KHBD_KEY, state); build(); toast("Đã lưu nháp trên máy này."); };
    $("#k-print", host).onclick = () => { const html = build(); printHTML("Kế hoạch bài dạy", '<div class="sheet-kicker">KẾ HOẠCH BÀI DẠY · LƯU HÀNH NỘI BỘ</div>' + html); };
    if (Object.keys(state).length) build();
  }

  /* ================= 6. RUBRIC + PDCA ================= */
  const PLAN_KEY = "naem.tool.plan.v1";
  const RUBRIC_DEFAULT = [
    ["Khai thác và kiểm chứng thông tin (1.1, 1.2 – ATM1)", "Tin ngay thông tin đầu tiên; không kiểm tra nguồn, ngày cập nhật.", "Biết đối chiếu thêm một nguồn khi được nhắc.", "Chủ động làm đủ bốn bước SIFT, đối chiếu ít nhất hai nguồn độc lập và giải thích căn cứ."],
    ["Ứng xử số và bảo vệ dữ liệu (2.5, 4.2 – ATM2, ATM3)", "Chia sẻ thông tin cá nhân tùy tiện; bình luận thiếu tôn trọng.", "Không lộ thông tin nhạy cảm; giao tiếp lịch sự trong nhóm học tập.", "Tuân thủ 4 KHÔNG – 3 CÓ; biết bảo vệ danh tính số và hỗ trợ bạn bè khi gặp tình huống xấu."],
    ["Sáng tạo số và bản quyền (3.1, 3.3 – ATM6)", "Sao chép nguyên văn, không ghi nguồn.", "Tạo được sản phẩm số cơ bản và ghi tên nguồn tham khảo.", "Sản phẩm sáng tạo, thẩm mỹ; dùng tài nguyên mở hợp pháp, trích dẫn đầy đủ."],
    ["Sử dụng AI có trách nhiệm (6.2, 6.3 – ATM7)", "Dùng AI làm thay toàn bộ; sao chép cả lỗi; nhập dữ liệu cá nhân.", "Biết dùng AI gợi ý ý tưởng nhưng còn phụ thuộc văn phong của AI.", "Dùng AI như công cụ hỗ trợ tư duy; phát hiện và sửa lỗi; ghi chú minh bạch phần có AI hỗ trợ."]
  ];
  const PDCA_DEFAULT = [
    ["Khảo sát nhanh 10 giáo viên trong tổ; chọn 01 tiết để dạy thử.", "Dạy tiết thử với phiếu in dự phòng; ghi nhật ký 3 điểm vướng.", "Hỏi 5 học sinh và 2 đồng nghiệp dự giờ; đối chiếu mục tiêu.", "Điều chỉnh phiếu và chọn tiết thứ hai."],
    ["Nhân bản tiết mẫu cho 2 giáo viên cùng tổ.", "Mỗi người dạy 1 tiết; lưu sản phẩm học sinh vào thư mục chung.", "Đối chiếu rubric 4 tiêu chí trên sản phẩm thực tế.", "Chuẩn hóa mẫu phiếu dùng chung."],
    ["Đưa học liệu vào kho của tổ; phân quyền xem và sửa.", "Tổ chức sinh hoạt chuyên môn 30 phút chia sẻ cách làm.", "Đếm số giáo viên dùng học liệu; ghi nhận khó khăn.", "Bổ sung hướng dẫn một trang cho từng học liệu."],
    ["Chốt 3 chỉ số cuối tháng; chuẩn bị báo cáo ngắn.", "Hoàn thiện minh chứng: ảnh sản phẩm, phiếu, biên bản.", "Tự chấm mức 1–3 theo bảng KPI; xin ý kiến tổ trưởng.", "Đề xuất 3 việc cho tháng tiếp theo."]
  ];

  function planHTML() {
    return '<div class="tool-box"><h2>Đánh giá và kế hoạch 4 tuần</h2>' +
      '<p class="sub">Rubric ba mức, bảng PDCA và phân công RACI. Mọi nội dung sửa được trước khi in.</p>' +
      '<div class="tool-tabs" style="margin-bottom:14px"><button class="tool-tab active" data-ptab="rubric">Rubric</button><button class="tool-tab" data-ptab="pdca">PDCA 4 tuần</button><button class="tool-tab" data-ptab="raci">RACI và KPI</button></div>' +
      '<div class="tool-panel active" id="ptab-rubric">' +
      '<div id="rubricBody"></div>' +
      '<div class="tool-actions"><button class="btn ghost" id="rubricReset">Khôi phục mặc định</button><button class="btn primary" id="rubricPrint">In rubric</button></div></div>' +
      '<div class="tool-panel" id="ptab-pdca">' +
      '<div id="pdcaBody"></div>' +
      '<div class="tool-actions"><button class="btn ghost" id="pdcaReset">Khôi phục mặc định</button><button class="btn primary" id="pdcaPrint">In kế hoạch</button></div></div>' +
      '<div class="tool-panel" id="ptab-raci">' +
      '<h3 style="font-size:17px;margin:0 0 4px">Phân công RACI</h3><p style="font-size:13.5px;color:var(--muted);margin:0 0 10px">R = người thực hiện, A = người chịu trách nhiệm cuối, C = người được hỏi ý kiến, I = người được thông báo.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Vai trò</th><th>Việc chính trong 4 tuần</th><th>RACI</th></tr></thead><tbody id="raciBody"></tbody></table></div>' +
      '<h3 style="font-size:17px;margin:20px 0 6px">Năm chỉ số tự đánh giá</h3><div id="kpiBody"></div>' +
      '<div class="tool-actions"><button class="btn primary" id="raciPrint">In bảng phân công</button></div></div></div>';
  }
  function mountPlan(host) {
    const state = read(PLAN_KEY, {});
    $$("[data-ptab]", host).forEach((b) => b.onclick = () => {
      $$("[data-ptab]", host).forEach((x) => x.classList.toggle("active", x === b));
      $$(".tool-panel", host).forEach((p) => p.classList.toggle("active", p.id === "ptab-" + b.dataset.ptab));
    });
    const rubric = state.rubric || RUBRIC_DEFAULT.map((r) => r.slice());
    const pdca = state.pdca || PDCA_DEFAULT.map((r) => r.slice());
    const raci = state.raci || [
      ["Ban chỉ đạo chuyển đổi số", "Duyệt kế hoạch, bố trí thời gian sinh hoạt tổ", "A"],
      ["Tổ Công nghệ thông tin", "Hỗ trợ kỹ thuật, tài khoản, sao lưu học liệu", "R"],
      ["Tổ trưởng chuyên môn", "Chọn tiết dạy thử, duyệt học liệu, dự giờ", "R"],
      ["Giáo viên chủ nhiệm", "Triển khai hoạt động lớp, phối hợp phụ huynh", "R"],
      ["Đoàn, Đội", "Truyền thông an toàn mạng, câu lạc bộ số", "C"],
      ["Phụ huynh", "Đồng hành, nhắc quy tắc sử dụng thiết bị", "I"]
    ];
    function drawRubric() {
      let html = '<div class="table-wrap"><table><thead><tr><th style="width:26%">Tiêu chí</th><th>Mức 1 · Chưa đạt</th><th>Mức 2 · Đạt</th><th>Mức 3 · Tốt</th></tr></thead><tbody>';
      rubric.forEach((r, i) => {
        html += '<tr><td><strong>' + esc(r[0]) + '</strong></td>';
        for (let j = 1; j <= 3; j++) html += '<td><textarea data-r="' + i + '-' + j + '" style="width:100%;min-height:92px;border:1px solid #d8cbb4;border-radius:6px;padding:6px;font-size:13px">' + esc(r[j]) + '</textarea></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div><p class="tool-note">Gợi ý dùng: chọn 3–4 tiêu chí cho một sản phẩm; mô tả bằng hành vi quan sát được, tránh chữ “tốt”, “hay” chung chung.</p>';
      $("#rubricBody", host).innerHTML = html;
      $$("#rubricBody textarea", host).forEach((t) => t.addEventListener("input", () => {
        const [i, j] = t.dataset.r.split("-").map(Number);
        rubric[i][j] = t.value;
        state.rubric = rubric; write(PLAN_KEY, state);
      }));
    }
    function drawPdca() {
      let html = '<div class="table-wrap"><table><thead><tr><th style="width:10%">Tuần</th><th>Plan · Lên kế hoạch</th><th>Do · Làm</th><th>Check · Kiểm tra</th><th>Act · Điều chỉnh</th></tr></thead><tbody>';
      pdca.forEach((r, i) => {
        html += '<tr><td><strong>Tuần ' + (i + 1) + '</strong></td>';
        for (let j = 0; j < 4; j++) html += '<td><textarea data-p="' + i + '-' + j + '" style="width:100%;min-height:100px;border:1px solid #d8cbb4;border-radius:6px;padding:6px;font-size:13px">' + esc(r[j]) + '</textarea></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div><p class="tool-note">Nguyên tắc: mỗi tuần chỉ 1–2 việc nhỏ, có minh chứng, không gây quá tải.</p>';
      $("#pdcaBody", host).innerHTML = html;
      $$("#pdcaBody textarea", host).forEach((t) => t.addEventListener("input", () => {
        const [i, j] = t.dataset.p.split("-").map(Number);
        pdca[i][j] = t.value; state.pdca = pdca; write(PLAN_KEY, state);
      }));
    }
    function drawRaci() {
      $("#raciBody", host).innerHTML = raci.map((r, i) =>
        '<tr><td><strong>' + esc(r[0]) + '</strong></td><td><input data-raci="' + i + '" value="' + esc(r[1]) + '" style="width:100%;border:1px solid #d8cbb4;border-radius:5px;padding:5px;font-size:13px"></td>' +
        '<td><select data-rr="' + i + '" style="border:1px solid #d8cbb4;border-radius:5px;padding:5px">' + ["R", "A", "C", "I"].map((x) => '<option' + (r[2] === x ? " selected" : "") + '>' + x + '</option>').join("") + '</select></td></tr>').join("");
      $$("#raciBody input", host).forEach((inp) => inp.addEventListener("input", () => { raci[Number(inp.dataset.raci)][1] = inp.value; state.raci = raci; write(PLAN_KEY, state); }));
      $$("#raciBody select", host).forEach((sel) => sel.addEventListener("change", () => { raci[Number(sel.dataset.rr)][2] = sel.value; state.raci = raci; write(PLAN_KEY, state); }));
      const kpis = state.kpis || [
        ["Quản trị số và hồ sơ điện tử", "100% văn bản chỉ đạo, giáo án, sổ điểm được xử lý trên hệ thống; giảm ít nhất 60% hồ sơ giấy."],
        ["Tích hợp năng lực số và an toàn mạng", "100% tổ chuyên môn ghi mã TC1/TC2 hoặc NC1 và ATM1–ATM8 vào kế hoạch đúng địa chỉ."],
        ["Sư phạm số và khảo thí", "Ít nhất 80% giáo viên dùng 2 công cụ tương tác mỗi tuần; có ngân hàng câu hỏi phân hóa."],
        ["Năng lực số đội ngũ", "100% cán bộ, giáo viên hoàn thành tự đánh giá và thực hành ít nhất 2 sản phẩm ứng dụng AI có trách nhiệm."],
        ["An toàn mạng và dữ liệu", "Có quy chế bảo vệ dữ liệu cá nhân, công khai quy trình 7 bước, không để lộ dữ liệu học sinh."]
      ];
      $("#kpiBody", host).innerHTML = kpis.map((k, i) =>
        '<div class="q-item"><div class="qt"><strong>' + esc(k[0]) + '.</strong> ' + esc(k[1]) + '</div><div class="seg"><label><input type="radio" name="kpi' + i + '" value="1"> Mức 1</label><label><input type="radio" name="kpi' + i + '" value="2"> Mức 2</label><label><input type="radio" name="kpi' + i + '" value="3"> Mức 3</label></div></div>').join("");
      $$("#kpiBody input", host).forEach((r) => {
        r.checked = state["kpi" + r.name.slice(3)] === r.value;
        r.addEventListener("change", () => { state["kpi" + r.name.slice(3)] = r.value; write(PLAN_KEY, state); });
      });
    }
    function rubricTable() {
      return '<table><thead><tr><th>Tiêu chí</th><th>Mức 1</th><th>Mức 2</th><th>Mức 3</th></tr></thead><tbody>' +
        rubric.map((r) => '<tr><td><strong>' + esc(r[0]) + '</strong></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>').join("") + '</tbody></table>';
    }
    function pdcaTable() {
      return '<table><thead><tr><th>Tuần</th><th>Plan</th><th>Do</th><th>Check</th><th>Act</th></tr></thead><tbody>' +
        pdca.map((r, i) => '<tr><td>Tuần ' + (i + 1) + '</td>' + r.map((c) => '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") + '</tbody></table>';
    }
    $("#rubricReset", host).onclick = () => { RUBRIC_DEFAULT.forEach((r, i) => rubric[i] = r.slice()); delete state.rubric; write(PLAN_KEY, state); drawRubric(); };
    $("#rubricPrint", host).onclick = () => printHTML("Rubric đánh giá", '<div class="sheet-kicker">RUBRIC ĐÁNH GIÁ NĂNG LỰC SỐ</div><h3>Rubric đánh giá thường xuyên</h3><p><em>Chọn 3–4 tiêu chí cho mỗi sản phẩm. Đánh giá theo hành vi quan sát được.</em></p>' + rubricTable());
    $("#pdcaReset", host).onclick = () => { PDCA_DEFAULT.forEach((r, i) => pdca[i] = r.slice()); delete state.pdca; write(PLAN_KEY, state); drawPdca(); };
    $("#pdcaPrint", host).onclick = () => printHTML("Kế hoạch 4 tuần", '<div class="sheet-kicker">KẾ HOẠCH CẢI TIẾN 4 TUẦN</div><h3>Chu trình PDCA của tổ chuyên môn</h3>' + pdcaTable() + '<p><em>Minh chứng: ảnh sản phẩm học sinh, biên bản sinh hoạt tổ, phiếu tự đánh giá.</em></p>');
    $("#raciPrint", host).onclick = () => printHTML("Phân công RACI", '<div class="sheet-kicker">PHÂN CÔNG RACI VÀ KPI</div><h3>Phân công trách nhiệm</h3><table><thead><tr><th>Vai trò</th><th>Việc chính</th><th>RACI</th></tr></thead><tbody>' +
      raci.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join("") + '</tbody></table>' +
      '<h3 style="margin-top:16px">Ghi chú KPI</h3><p>Đánh giá cuối kỳ theo ba mức: 1 – chưa đáp ứng, 2 – đáp ứng cơ bản, 3 – đáp ứng tốt (theo Quyết định 4725/QĐ-BGDĐT).</p>');
    drawRubric(); drawPdca(); drawRaci();
  }

  const BUILDS = { self: [selfHTML, mountSelf], sift: [siftHTML, mountSift], atm: [atmHTML, mountAtm], prompt: [promptHTML, mountPrompt], khbd: [khbdHTML, mountKhbd], plan: [planHTML, mountPlan] };

  window.NAEMTools = {
    ids: Object.keys(BUILDS),
    render(id, host) {
      const tool = BUILDS[id] || BUILDS.self;
      host.innerHTML = tool[0]();
      tool[1](host);
    }
  };
})();
</script>
<script>/* Ứng dụng đọc: định tuyến, hiển thị markdown, tiến độ và phòng thực hành. */
(function () {
  const manifest = JSON.parse(document.getElementById("manifest").textContent);
  const main = document.getElementById("main");
  const sidebar = document.getElementById("sidebar");
  const sideNav = document.getElementById("sideNav");
  const scrim = document.getElementById("scrim");
  const PROGRESS_KEY = "naem.progress.v1";
  const TEXT_KEY = "naem.largeText.v1";
  const CHECK_KEY = "naem.checks.v1";

  const allLessons = manifest.tracks.flatMap((t) => t.lessons);
  const lessonById = Object.fromEntries(allLessons.map((l) => [l.id, l]));

  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const slug = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

  function read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch { return fallback; }
  }
  function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
  function progress() { return read(PROGRESS_KEY, {}); }

  /* ---------- Markdown ---------- */
  function inline(text) {
    let s = esc(text);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/\u0000C(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[Number(i)]) + "</code>");
    return s;
  }

  function parseQuiz(lines) {
    const qs = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith("//")) continue;
      const parts = line.replace(/^\?\s*/, "").split("|").map((x) => x.trim());
      if (parts.length < 3) continue;
      const question = parts[0];
      const rest = parts.slice(1);
      let explain = "";
      let opts = rest;
      const starred = rest.findIndex((o) => o.endsWith("*"));
      if (starred >= 0 && rest.length >= 3 && !rest[rest.length - 1].endsWith("*")) {
        explain = rest[rest.length - 1];
        opts = rest.slice(0, rest.length - 1);
      }
      if (opts.length < 2) continue;
      let correct = opts.findIndex((o) => o.endsWith("*"));
      if (correct < 0) correct = 0;
      opts = opts.map((o) => o.replace(/\s*\*$/, ""));
      qs.push({ question, opts, correct, explain });
    }
    return qs;
  }

  function renderQuiz(qs) {
    if (!qs.length) return "";
    let html = '<div class="quiz" data-quiz><div class="quiz-head"><b>Tự kiểm tra</b><span class="quiz-score">' + qs.length + " câu</span></div>";
    qs.forEach((q, qi) => {
      const order = q.opts.map((o, i) => i);
      let seed = q.question.length + qi;
      for (let i = order.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = seed % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
      html += '<div class="q" data-correct="' + q.correct + '"><div class="q-title">' + (qi + 1) + ". " + inline(q.question) + '</div><div class="q-opts">' +
        order.map((oi) => '<button class="q-opt" data-o="' + oi + '">' + inline(q.opts[oi]) + "</button>").join("") +
        '</div><div class="q-explain">' + (q.explain ? inline(q.explain) : "") + "</div></div>";
    });
    return html + "</div>";
  }

  function renderCallout(type, title, inner) {
    const labels = { note: "Ghi nhớ", warn: "Cảnh báo", tip: "Mẹo", case: "Tình huống", do: "Thực hành" };
    return '<div class="callout ' + type + '"><span class="callout-title">' + esc(title || labels[type] || "Ghi chú") + "</span>" + inner + "</div>";
  }

  function renderChecklist(lines, lessonId) {
    const state = read(CHECK_KEY, {});
    const items = lines.map((l) => l.replace(/^\s*[-*]\s*\[[ xX]\]\s*/, "")).filter(Boolean);
    return '<ul class="checklist">' + items.map((t, i) => {
      const key = lessonId + ":" + i;
      return '<li><input type="checkbox" id="ck-' + lessonId + "-" + i + '" data-ck="' + key + '"' + (state[key] ? " checked" : "") + '><label for="ck-' + lessonId + "-" + i + '">' + inline(t) + "</label></li>";
    }).join("") + "</ul>";
  }

  function mdToHtml(md, lessonId) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    let html = "", i = 0, para = [];
    const flush = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };

    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();

      if (/^```/.test(t)) {
        flush();
        const lang = t.slice(3).trim();
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
        i++;
        html += '<pre><code class="lang-' + esc(lang) + '">' + esc(buf.join("\n")) + "</code></pre>";
        continue;
      }

      if (/^:::(\w+)\s*(.*)$/.test(t)) {
        flush();
        const m = t.match(/^:::(\w+)\s*(.*)$/);
        const kind = m[1], title = m[2];
        const buf = []; i++;
        while (i < lines.length && lines[i].trim() !== ":::") { buf.push(lines[i]); i++; }
        i++;
        if (kind === "quiz") html += renderQuiz(parseQuiz(buf));
        else if (kind === "checklist") html += renderChecklist(buf, lessonId);
        else {
          const inner = mdToHtml(buf.join("\n"), lessonId)
            .replace(/^<p>/, "<p>").replace(/<\/p>$/, "</p>");
          html += renderCallout(["note", "warn", "tip", "case", "do"].includes(kind) ? kind : "note", title, inner);
        }
        continue;
      }

      if (/^#{1,4}\s/.test(t)) { flush(); const level = t.match(/^#+/)[0].length; html += "<h" + level + ' id="' + slug(t.replace(/^#+\s*/, "")) + '">' + inline(t.replace(/^#+\s*/, "")) + "</h" + level + ">"; i++; continue; }
      if (/^([-*_])\1{2,}$/.test(t)) { flush(); html += "<hr>"; i++; continue; }

      if (/^\|/.test(t) && i + 1 < lines.length && /^\|?[\s:-]+\|/.test(lines[i + 1].trim())) {
        flush();
        const header = t.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i].trim())) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
          i++;
        }
        html += '<div class="table-wrap"><table><thead><tr>' + header.map((h) => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
        continue;
      }

      if (/^>\s?/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
        html += "<blockquote>" + mdToHtml(buf.join("\n"), lessonId) + "</blockquote>";
        continue;
      }

      if (/^[-*]\s+/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^[-*]\s+/, "")); i++; }
        html += "<ul>" + buf.map((b) => "<li>" + inline(b) + "</li>").join("") + "</ul>";
        continue;
      }

      if (/^\d+[.)]\s+/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^\d+[.)]\s+/, "")); i++; }
        html += "<ol>" + buf.map((b) => "<li>" + inline(b) + "</li>").join("") + "</ol>";
        continue;
      }

      if (!t) { flush(); i++; continue; }
      if (/^\|/.test(t)) { flush(); html += "<p>" + inline(t) + "</p>"; i++; continue; }
      para.push(t); i++;
    }
    flush();
    return html;
  }

  /* ---------- Tiến độ, điều hướng ---------- */
  function updateProgressUI() {
    const p = progress();
    const done = allLessons.filter((l) => p[l.id]).length;
    const total = allLessons.length;
    document.getElementById("progressLabel").textContent = done + "/" + total + " bài đã xong";
    document.getElementById("progressNum").textContent = Math.round(done / total * 100) + "%";
    const ring = document.getElementById("ringFill");
    if (ring) ring.style.strokeDashoffset = String(113 - (done / total) * 113);
    document.querySelectorAll(".nav-item").forEach((li) => {
      const a = li.querySelector("a");
      if (!a) return;
      const id = a.getAttribute("href").split("/").pop();
      li.classList.toggle("done", !!p[id]);
      const tick = li.querySelector(".tick");
      if (tick) tick.textContent = p[id] ? "✓" : "";
    });
    document.querySelectorAll("[data-track-progress]").forEach((el) => {
      const tr = manifest.tracks.find((t) => t.id === el.dataset.trackProgress);
      if (!tr) return;
      const d = tr.lessons.filter((l) => p[l.id]).length;
      el.style.width = Math.round(d / tr.lessons.length * 100) + "%";
    });
  }

  /* ---------- Bài học ---------- */
  function renderLesson(id) {
    const lesson = lessonById[id];
    if (!lesson) { renderHome(); return; }
    const track = manifest.tracks.find((t) => t.id === lesson.track);
    const idx = track.lessons.findIndex((l) => l.id === id);
    const src = document.querySelector('.lesson-src[data-id="' + id + '"]');
    const md = src ? src.textContent : "# Thiếu nội dung\nTệp bài chưa được nhúng.";
    const p = progress();
    const prev = idx > 0 ? track.lessons[idx - 1] : null;
    const next = idx < track.lessons.length - 1 ? track.lessons[idx + 1] : null;
    const trackIdx = manifest.tracks.indexOf(track);
    const nextTrack = !next && trackIdx < manifest.tracks.length - 1 ? manifest.tracks[trackIdx + 1].lessons[0] : null;

    main.innerHTML = '<div class="wrap"><div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / ' + esc(track.title) + "</div>" +
      "<h1>" + esc(lesson.title) + '</h1><div class="lesson-meta"><span class="chip">' + lesson.minutes + " phút đọc</span><span class=\"chip gray\">Bài " + (idx + 1) + "/" + track.lessons.length + '</span><span class="chip amber">' + esc(track.short) + "</span></div></div>" +
      '<article class="prose" id="lessonBody">' + mdToHtml(md, id) + "</article>" +
      '<div class="lesson-foot"><div class="done-row"><label><input type="checkbox" id="doneBox"' + (p[id] ? " checked" : "") + "> Tôi đã đọc và làm xong bài này</label><span style=\"font-size:13px;color:var(--muted)\">Tiến độ lưu trên máy</span></div>" +
      '<div class="prevnext">' + (prev ? '<a class="pn" href="#/bai/' + prev.id + '"><span>Bài trước</span><b>' + esc(prev.title) + "</b></a>" : "<span></span>") +
      (next ? '<a class="pn next" href="#/bai/' + next.id + '"><span>Bài tiếp</span><b>' + esc(next.title) + "</b></a>" : nextTrack ? '<a class="pn next" href="#/bai/' + nextTrack.id + '"><span>Sang khóa ' + esc(manifest.tracks[trackIdx + 1].short) + "</span><b>" + esc(nextTrack.title) + "</b></a>" : "<span></span>") +
      "</div></div></div>";

    document.getElementById("doneBox").addEventListener("change", (e) => {
      const pr = progress();
      if (e.target.checked) pr[id] = true; else delete pr[id];
      write(PROGRESS_KEY, pr);
      updateProgressUI();
    });
    document.querySelectorAll("#lessonBody .quiz").forEach((quiz) => {
      const scoreEl = quiz.querySelector(".quiz-score");
      const total = quiz.querySelectorAll(".q").length;
      quiz.addEventListener("click", (e) => {
        const btn = e.target.closest(".q-opt");
        if (!btn) return;
        const q = btn.closest(".q");
        if (q.classList.contains("answered")) return;
        const correct = Number(q.dataset.correct);
        const chosen = Number(btn.dataset.o);
        q.classList.add("answered");
        q.querySelectorAll(".q-opt").forEach((b) => {
          b.disabled = true;
          if (Number(b.dataset.o) === correct) b.classList.add("correct");
        });
        if (chosen !== correct) btn.classList.add("wrong");
        const answered = quiz.querySelectorAll(".q.answered").length;
        const right = Array.from(quiz.querySelectorAll(".q.answered")).filter((x) => x.querySelector(".q-opt.correct") && !x.querySelector(".q-opt.wrong")).length;
        scoreEl.textContent = right + "/" + total + " đúng";
      });
    });
    document.querySelectorAll("#lessonBody .checklist input[type=checkbox]").forEach((cb) => {
      cb.addEventListener("change", () => {
        const st = read(CHECK_KEY, {});
        if (cb.checked) st[cb.dataset.ck] = true; else delete st[cb.dataset.ck];
        write(CHECK_KEY, st);
      });
    });
    setActive("#/bai/" + id);
    updateProgressUI();
    document.title = lesson.title + " · Sổ tay số Nghệ An";
    window.scrollTo(0, 0);
  }

      '<section class="sheet"><div class="sheet-kicker">PHỤ LỤC IV · KHUNG 45 PHÚT</div><h3>Kế hoạch bài dạy 4C</h3><p>Môn: ................ Lớp: ........ Bài: ................................</p><p>Yêu cầu cần đạt: ................................................................</p><table><thead><tr><th>Hoạt động</th><th>Nội dung</th><th>Tổ chức</th></tr></thead><tbody><tr><td>Mở đầu</td><td></td><td></td></tr><tr><td>Hình thành kiến thức</td><td></td><td></td></tr><tr><td>Luyện tập</td><td></td><td></td></tr><tr><td>Vận dụng</td><td></td><td></td></tr></tbody></table><p>Mã năng lực: ................ ATM: ................</p></section>' +
      '<section class="sheet"><div class="sheet-kicker">ĐÁNH GIÁ THƯỜNG XUYÊN</div><h3>Rubric 4 tiêu chí</h3><table><thead><tr><th>Tiêu chí</th><th>Mức 1</th><th>Mức 2</th><th>Mức 3</th></tr></thead><tbody><tr><td>Kiểm chứng thông tin</td><td></td><td></td><td></td></tr><tr><td>Ứng xử số, dữ liệu</td><td></td><td></td><td></td></tr><tr><td>Sáng tạo, bản quyền</td><td></td><td></td><td></td></tr><tr><td>AI có trách nhiệm</td><td></td><td></td><td></td></tr></tbody></table></section>' +
      '<section class="sheet"><div class="sheet-kicker">KẾ HOẠCH TỔ · 4 TUẦN</div><h3>PDCA</h3><table><thead><tr><th>Tuần</th><th>Plan</th><th>Do</th><th>Check</th><th>Act</th></tr></thead><tbody>' + [1, 2, 3, 4].map((w) => "<tr><td>" + w + "</td><td></td><td></td><td></td><td></td></tr>").join("") + '</tbody></table><p>RACI: R thực hiện · A chịu trách nhiệm · C hỏi ý kiến · I thông báo.</p></section>' +
      '<section class="sheet"><div class="sheet-kicker">PHIẾU CÁ NHÂN · TỰ ĐÁNH GIÁ</div><h3>Tự xếp nhóm A/B/C</h3><p>Tổng 12 câu, mỗi câu 0–2 điểm: 0 chưa làm được; 1 làm được khi có hỗ trợ; 2 tự tin, thường xuyên.</p><table><tbody>' + [1, 2, 3, 4, 5, 6].map((n) => "<tr><td>" + n + ". ................................................</td><td style=\"width:60px\">..../2</td></tr>").join("") + '</tbody></table><p>Nhóm: ☐ A (0–8) ☐ B (9–16) ☐ C (17–24)</p><p>Ba việc làm trong 4 tuần: 1) ................ 2) ................ 3) ................</p></section>' +
      "</div></div>";
    setActive("#/in");
    document.title = "Bộ phiếu in · Sổ tay số Nghệ An";
    window.scrollTo(0, 0);
  }

  /* ---------- Nguồn ---------- */
  function renderSource() {
    main.innerHTML = '<div class="wrap"><div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / Nguồn</div><h1>Nguồn và cách biên soạn</h1></div><article class="prose">' +
      "<h2>Tài liệu gốc</h2><ul>" +
      "<li>Chương trình bồi dưỡng chuyên đề chuyển đổi số, phát triển năng lực số và sư phạm số thích ứng dành cho cán bộ quản lý và giáo viên cấp THCS tỉnh Nghệ An, 2026 (03 ngày, 06 buổi).</li>" +
      "<li>04 bộ tài liệu NAEM 2026: THCS – Khoa học xã hội; THCS – Khoa học tự nhiên; THPT – Khoa học xã hội; THPT – Khoa học tự nhiên và Toán.</li></ul>" +
      "<h2>Nguyên tắc biên soạn</h2><ol><li>Giữ nguyên hệ mã: 06 miền năng lực, TC1/TC2/NC1, bốn mạch AI NLa–NLd, tám chủ đề ATM1–ATM8, bảy bước ứng phó sự cố.</li><li>Lược bỏ phần lý luận trùng lặp, giữ quy trình và ví dụ có thể làm ngay.</li><li>Mọi công cụ tương tác chỉ là phương tiện luyện tập; quyết định chuyên môn và hồ sơ chính thức vẫn dựa trên văn bản gốc.</li><li>Nội dung được rút gọn cho mục đích tập huấn nội bộ, không thay thế văn bản pháp luật.</li></ol>" +
      "<h2>Những chỗ cần đối chiếu trước khi nộp hồ sơ</h2><ul><li>Số hiệu, ngày ban hành và hiệu lực của các văn bản (Thông tư 18/2026/TT-BGDĐT; Thông tư 02/2025/TT-BGDĐT; Công văn 3456; Quyết định 2422; Công văn 6206; Quyết định 4725; Công văn 5512; Luật 91/2025, 116/2025, 134/2025; Luật Trẻ em 102/2016).</li><li>Mã năng lực cụ thể của từng bài: đối chiếu bảng ma trận trong bộ tài liệu tương ứng.</li><li>Quy định của nhà trường về đầu mối an toàn số, quy trình báo cáo và phân quyền dữ liệu.</li></ul>" +
      "<h2>Quyền riêng tư</h2><p>Trang không có máy chủ thu thập dữ liệu. Tiến độ, nháp công cụ và ô đánh dấu được lưu trong <code>localStorage</code> của trình duyệt. Khi dùng máy chung, hãy xóa dữ liệu trình duyệt sau khi học.</p>" +
      "</article></div>";
    setActive("#/nguon");
    document.title = "Nguồn biên soạn · Sổ tay số Nghệ An";
    window.scrollTo(0, 0);
  }

  /* ---------- Khởi động ---------- */
  function route() {
    const hash = location.hash || "#/";
    closeNav();
    if (hash.startsWith("#/bai/")) renderLesson(hash.slice(6));
    else if (hash.startsWith("#/cong-cu")) renderTools(hash.split("/")[2] || "");
    else if (hash === "#/in") renderPrintKit();
    else if (hash === "#/nguon") renderSource();
    else renderHome();
    if (!hash.startsWith("#/bai/") && !hash.startsWith("#/cong-cu")) window.scrollTo(0, 0);
  }

  buildSidebar();
  updateProgressUI();
  if (read(TEXT_KEY, false)) document.body.classList.add("large-text");

  document.getElementById("menuBtn").addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", String(open));
    scrim.hidden = !open;
  });
  scrim.addEventListener("click", closeNav);
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  document.getElementById("fontBtn").addEventListener("click", () => {
    const on = document.body.classList.toggle("large-text");
    write(TEXT_KEY, on);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
