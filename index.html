  const PLAN_KEY = "naem.tool.plan.v1";
  const RUBRIC_DEFAULT = [
    ["Khai thác và kiểm chứng thông tin (1.1, 1.2 – ATM1)", "Tin ngay thông tin đầu tiên; không kiểm tra nguồn, ngày cập nhật.", "Biết đối chiếu thêm một nguồn khi được nhắc.", "Chủ động làm đủ bốn bước SIFT, đối chiếu ít nhất hai nguồn độc lập và giải thích căn cứ."],
    ["Ứng xử số và bảo vệ dữ liệu (2.5, 4.2 – ATM2, ATM3)", "Chia sẻ thông tin cá nhân tùy tiện; bình luận thiếu tôn trọng.", "Không lộ thông tin nhạy cảm; giao tiếp lịch sự trong nhóm học tập.", "Tuân thủ 4 KHÔNG – 3 CÓ; biết bảo vệ danh tính số và hỗ trợ bạn bè khi gặp tình huống xấu."],
    ["Sáng tạo số và bản quyền (3.1, 3.3 – ATM6)", "Sao chép nguyên văn, không ghi nguồn.", "Tạo được sản phẩm số cơ bản và ghi tên nguồn tham khảo.", "Sản phẩm sáng tạo, thẩm mỹ; dùng tài nguyên mở hợp pháp, trích dẫn đầy đủ."],
    ["Sử dụng AI có trách nhiệm (6.2, 6.3 – ATM7)", "Dùng AI làm thay toàn bộ; sao chép cả lỗi; nhập dữ liệu cá nhân.", "Biết dùng AI gợi ý ý tưởng nhưng còn phụ thuộc văn phong của AI.", "Dùng AI như công cụ hỗ trợ tư duy; phát hiện và sửa lỗi; ghi chú minh bạch phần có AI hỗ trợ."]
  ];
  const PDCA_DEFAULT = [
    ["Khảo sát nhanh 10 giáo viên trong tổ; chọn 01 tiết để dạy thử.", "Dạy tiết thử với phiếu in dự phòng; ghi nhật ký 3 điểm vướng.", "Hỏi 5 học sinh và 2 đồng nghiệp dự giờ; đối chiếu mục tiêu.", "Điều chỉnh phiếu và chọn tiết thứ hai."],
    ["Nhân bản tiết mẫu cho 2 giáo viên cùng tổ.", "Mỗi người dạy 1 tiết; lưu sản phẩm học sinh vào thư mục chung.", "Đối chiếu rubric 4 tiêu chí trên sản phẩm thực tế.", "Chuẩn hóa mẫu phiếu dùng chung."],
    ["Đưa học liệu vào kho của tổ; phân quyền xem và sửa.", "Tổ chức sinh hoạt chuyên môn 30 phút chia sẻ cách làm.", "Đếm số giáo viên dùng học liệu; ghi nhận khó khăn.", "Bổ sung hướng dẫn một trang cho từng học liệu."],
    ["Chốt 3 chỉ số cuối tháng; chuẩn bị báo cáo ngắn.", "Hoàn thiện minh chứng: ảnh sản phẩm, phiếu, biên bản.", "Tự chấm mức 1–3 theo bảng KPI; xin ý kiến tổ trưởng.", "Đề xuất 3 việc cho tháng tiếp theo."]
  ];

  function planHTML() {
    return '<div class="tool-box"><h2>Đánh giá và kế hoạch 4 tuần</h2>' +
      '<p class="sub">Rubric ba mức, bảng PDCA và phân công RACI. Mọi nội dung sửa được trước khi in.</p>' +
      '<div class="tool-tabs" style="margin-bottom:14px"><button class="tool-tab active" data-ptab="rubric">Rubric</button><button class="tool-tab" data-ptab="pdca">PDCA 4 tuần</button><button class="tool-tab" data-ptab="raci">RACI và KPI</button></div>' +
      '<div class="tool-panel active" id="ptab-rubric">' +
      '<div id="rubricBody"></div>' +
      '<div class="tool-actions"><button class="btn ghost" id="rubricReset">Khôi phục mặc định</button><button class="btn primary" id="rubricPrint">In rubric</button></div></div>' +
      '<div class="tool-panel" id="ptab-pdca">' +
      '<div id="pdcaBody"></div>' +
      '<div class="tool-actions"><button class="btn ghost" id="pdcaReset">Khôi phục mặc định</button><button class="btn primary" id="pdcaPrint">In kế hoạch</button></div></div>' +
      '<div class="tool-panel" id="ptab-raci">' +
      '<h3 style="font-size:17px;margin:0 0 4px">Phân công RACI</h3><p style="font-size:13.5px;color:var(--muted);margin:0 0 10px">R = người thực hiện, A = người chịu trách nhiệm cuối, C = người được hỏi ý kiến, I = người được thông báo.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Vai trò</th><th>Việc chính trong 4 tuần</th><th>RACI</th></tr></thead><tbody id="raciBody"></tbody></table></div>' +
      '<h3 style="font-size:17px;margin:20px 0 6px">Năm chỉ số tự đánh giá</h3><div id="kpiBody"></div>' +
      '<div class="tool-actions"><button class="btn primary" id="raciPrint">In bảng phân công</button></div></div></div>';
  }
  function mountPlan(host) {
    const state = read(PLAN_KEY, {});
    $$("[data-ptab]", host).forEach((b) => b.onclick = () => {
      $$("[data-ptab]", host).forEach((x) => x.classList.toggle("active", x === b));
      $$(".tool-panel", host).forEach((p) => p.classList.toggle("active", p.id === "ptab-" + b.dataset.ptab));
    });
    const rubric = state.rubric || RUBRIC_DEFAULT.map((r) => r.slice());
    const pdca = state.pdca || PDCA_DEFAULT.map((r) => r.slice());
    const raci = state.raci || [
      ["Ban chỉ đạo chuyển đổi số", "Duyệt kế hoạch, bố trí thời gian sinh hoạt tổ", "A"],
      ["Tổ Công nghệ thông tin", "Hỗ trợ kỹ thuật, tài khoản, sao lưu học liệu", "R"],
      ["Tổ trưởng chuyên môn", "Chọn tiết dạy thử, duyệt học liệu, dự giờ", "R"],
      ["Giáo viên chủ nhiệm", "Triển khai hoạt động lớp, phối hợp phụ huynh", "R"],
      ["Đoàn, Đội", "Truyền thông an toàn mạng, câu lạc bộ số", "C"],
      ["Phụ huynh", "Đồng hành, nhắc quy tắc sử dụng thiết bị", "I"]
    ];
    function drawRubric() {
      let html = '<div class="table-wrap"><table><thead><tr><th style="width:26%">Tiêu chí</th><th>Mức 1 · Chưa đạt</th><th>Mức 2 · Đạt</th><th>Mức 3 · Tốt</th></tr></thead><tbody>';
      rubric.forEach((r, i) => {
        html += '<tr><td><strong>' + esc(r[0]) + '</strong></td>';
        for (let j = 1; j <= 3; j++) html += '<td><textarea data-r="' + i + '-' + j + '" style="width:100%;min-height:92px;border:1px solid #d8cbb4;border-radius:6px;padding:6px;font-size:13px">' + esc(r[j]) + '</textarea></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div><p class="tool-note">Gợi ý dùng: chọn 3–4 tiêu chí cho một sản phẩm; mô tả bằng hành vi quan sát được, tránh chữ “tốt”, “hay” chung chung.</p>';
      $("#rubricBody", host).innerHTML = html;
      $$("#rubricBody textarea", host).forEach((t) => t.addEventListener("input", () => {
        const [i, j] = t.dataset.r.split("-").map(Number);
        rubric[i][j] = t.value;
        state.rubric = rubric; write(PLAN_KEY, state);
      }));
    }
    function drawPdca() {
      let html = '<div class="table-wrap"><table><thead><tr><th style="width:10%">Tuần</th><th>Plan · Lên kế hoạch</th><th>Do · Làm</th><th>Check · Kiểm tra</th><th>Act · Điều chỉnh</th></tr></thead><tbody>';
      pdca.forEach((r, i) => {
        html += '<tr><td><strong>Tuần ' + (i + 1) + '</strong></td>';
        for (let j = 0; j < 4; j++) html += '<td><textarea data-p="' + i + '-' + j + '" style="width:100%;min-height:100px;border:1px solid #d8cbb4;border-radius:6px;padding:6px;font-size:13px">' + esc(r[j]) + '</textarea></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div><p class="tool-note">Nguyên tắc: mỗi tuần chỉ 1–2 việc nhỏ, có minh chứng, không gây quá tải.</p>';
      $("#pdcaBody", host).innerHTML = html;
      $$("#pdcaBody textarea", host).forEach((t) => t.addEventListener("input", () => {
        const [i, j] = t.dataset.p.split("-").map(Number);
        pdca[i][j] = t.value; state.pdca = pdca; write(PLAN_KEY, state);
      }));
    }
    function drawRaci() {
      $("#raciBody", host).innerHTML = raci.map((r, i) =>
        '<tr><td><strong>' + esc(r[0]) + '</strong></td><td><input data-raci="' + i + '" value="' + esc(r[1]) + '" style="width:100%;border:1px solid #d8cbb4;border-radius:5px;padding:5px;font-size:13px"></td>' +
        '<td><select data-rr="' + i + '" style="border:1px solid #d8cbb4;border-radius:5px;padding:5px">' + ["R", "A", "C", "I"].map((x) => '<option' + (r[2] === x ? " selected" : "") + '>' + x + '</option>').join("") + '</select></td></tr>').join("");
      $$("#raciBody input", host).forEach((inp) => inp.addEventListener("input", () => { raci[Number(inp.dataset.raci)][1] = inp.value; state.raci = raci; write(PLAN_KEY, state); }));
      $$("#raciBody select", host).forEach((sel) => sel.addEventListener("change", () => { raci[Number(sel.dataset.rr)][2] = sel.value; state.raci = raci; write(PLAN_KEY, state); }));
      const kpis = state.kpis || [
        ["Quản trị số và hồ sơ điện tử", "100% văn bản chỉ đạo, giáo án, sổ điểm được xử lý trên hệ thống; giảm ít nhất 60% hồ sơ giấy."],
        ["Tích hợp năng lực số và an toàn mạng", "100% tổ chuyên môn ghi mã TC1/TC2 hoặc NC1 và ATM1–ATM8 vào kế hoạch đúng địa chỉ."],
        ["Sư phạm số và khảo thí", "Ít nhất 80% giáo viên dùng 2 công cụ tương tác mỗi tuần; có ngân hàng câu hỏi phân hóa."],
        ["Năng lực số đội ngũ", "100% cán bộ, giáo viên hoàn thành tự đánh giá và thực hành ít nhất 2 sản phẩm ứng dụng AI có trách nhiệm."],
        ["An toàn mạng và dữ liệu", "Có quy chế bảo vệ dữ liệu cá nhân, công khai quy trình 7 bước, không để lộ dữ liệu học sinh."]
      ];
      $("#kpiBody", host).innerHTML = kpis.map((k, i) =>
        '<div class="q-item"><div class="qt"><strong>' + esc(k[0]) + '.</strong> ' + esc(k[1]) + '</div><div class="seg"><label><input type="radio" name="kpi' + i + '" value="1"> Mức 1</label><label><input type="radio" name="kpi' + i + '" value="2"> Mức 2</label><label><input type="radio" name="kpi' + i + '" value="3"> Mức 3</label></div></div>').join("");
      $$("#kpiBody input", host).forEach((r) => {
        r.checked = state["kpi" + r.name.slice(3)] === r.value;
        r.addEventListener("change", () => { state["kpi" + r.name.slice(3)] = r.value; write(PLAN_KEY, state); });
      });
    }
    function rubricTable() {
      return '<table><thead><tr><th>Tiêu chí</th><th>Mức 1</th><th>Mức 2</th><th>Mức 3</th></tr></thead><tbody>' +
        rubric.map((r) => '<tr><td><strong>' + esc(r[0]) + '</strong></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>').join("") + '</tbody></table>';
    }
    function pdcaTable() {
      return '<table><thead><tr><th>Tuần</th><th>Plan</th><th>Do</th><th>Check</th><th>Act</th></tr></thead><tbody>' +
        pdca.map((r, i) => '<tr><td>Tuần ' + (i + 1) + '</td>' + r.map((c) => '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") + '</tbody></table>';
    }
    $("#rubricReset", host).onclick = () => { RUBRIC_DEFAULT.forEach((r, i) => rubric[i] = r.slice()); delete state.rubric; write(PLAN_KEY, state); drawRubric(); };
    $("#rubricPrint", host).onclick = () => printHTML("Rubric đánh giá", '<div class="sheet-kicker">RUBRIC ĐÁNH GIÁ NĂNG LỰC SỐ</div><h3>Rubric đánh giá thường xuyên</h3><p><em>Chọn 3–4 tiêu chí cho mỗi sản phẩm. Đánh giá theo hành vi quan sát được.</em></p>' + rubricTable());
    $("#pdcaReset", host).onclick = () => { PDCA_DEFAULT.forEach((r, i) => pdca[i] = r.slice()); delete state.pdca; write(PLAN_KEY, state); drawPdca(); };
    $("#pdcaPrint", host).onclick = () => printHTML("Kế hoạch 4 tuần", '<div class="sheet-kicker">KẾ HOẠCH CẢI TIẾN 4 TUẦN</div><h3>Chu trình PDCA của tổ chuyên môn</h3>' + pdcaTable() + '<p><em>Minh chứng: ảnh sản phẩm học sinh, biên bản sinh hoạt tổ, phiếu tự đánh giá.</em></p>');
    $("#raciPrint", host).onclick = () => printHTML("Phân công RACI", '<div class="sheet-kicker">PHÂN CÔNG RACI VÀ KPI</div><h3>Phân công trách nhiệm</h3><table><thead><tr><th>Vai trò</th><th>Việc chính</th><th>RACI</th></tr></thead><tbody>' +
      raci.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join("") + '</tbody></table>' +
      '<h3 style="margin-top:16px">Ghi chú KPI</h3><p>Đánh giá cuối kỳ theo ba mức: 1 – chưa đáp ứng, 2 – đáp ứng cơ bản, 3 – đáp ứng tốt (theo Quyết định 4725/QĐ-BGDĐT).</p>');
    drawRubric(); drawPdca(); drawRaci();
  }

  const BUILDS = { self: [selfHTML, mountSelf], sift: [siftHTML, mountSift], atm: [atmHTML, mountAtm], prompt: [promptHTML, mountPrompt], khbd: [khbdHTML, mountKhbd], plan: [planHTML, mountPlan] };

  window.NAEMTools = {
    ids: Object.keys(BUILDS),
    render(id, host) {
      const tool = BUILDS[id] || BUILDS.self;
      host.innerHTML = tool[0]();
      tool[1](host);
    }
  };
})();
</script>
<script>/* Ứng dụng đọc: định tuyến, hiển thị markdown, tiến độ và phòng thực hành. */
(function () {
  const manifest = JSON.parse(document.getElementById("manifest").textContent);
  const main = document.getElementById("main");
  const sidebar = document.getElementById("sidebar");
  const sideNav = document.getElementById("sideNav");
  const scrim = document.getElementById("scrim");
  const PROGRESS_KEY = "naem.progress.v1";
  const TEXT_KEY = "naem.largeText.v1";
  const CHECK_KEY = "naem.checks.v1";

  const allLessons = manifest.tracks.flatMap((t) => t.lessons);
  const lessonById = Object.fromEntries(allLessons.map((l) => [l.id, l]));
  const TRAINER = JSON.parse(document.getElementById("trainerData").textContent);
  const ASSESS = JSON.parse(document.getElementById("assessData").textContent);
  const decksById = Object.fromEntries(TRAINER.slides.decks.map((d) => [d.id, d]));
  let deckKeyHandler = null;

  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const slug = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

  function read(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch { return fallback; }
  }
  function write(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }
  function progress() { return read(PROGRESS_KEY, {}); }

  /* ---------- Markdown ---------- */
  function inline(text) {
    let s = esc(text);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000C" + (codes.length - 1) + "\u0000"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/\u0000C(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[Number(i)]) + "</code>");
    return s;
  }

  function parseQuiz(lines) {
    const qs = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith("//")) continue;
      const parts = line.replace(/^\?\s*/, "").split("|").map((x) => x.trim());
      if (parts.length < 3) continue;
      const question = parts[0];
      const rest = parts.slice(1);
      let explain = "";
      let opts = rest;
      const starred = rest.findIndex((o) => o.endsWith("*"));
      if (starred >= 0 && rest.length >= 3 && !rest[rest.length - 1].endsWith("*")) {
        explain = rest[rest.length - 1];
        opts = rest.slice(0, rest.length - 1);
      }
      if (opts.length < 2) continue;
      let correct = opts.findIndex((o) => o.endsWith("*"));
      if (correct < 0) correct = 0;
      opts = opts.map((o) => o.replace(/\s*\*$/, ""));
      qs.push({ question, opts, correct, explain });
    }
    return qs;
  }

  function renderQuiz(qs) {
    if (!qs.length) return "";
    let html = '<div class="quiz" data-quiz><div class="quiz-head"><b>Tự kiểm tra</b><span class="quiz-score">' + qs.length + " câu</span></div>";
    qs.forEach((q, qi) => {
      const order = q.opts.map((o, i) => i);
      let seed = q.question.length + qi;
      for (let i = order.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = seed % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
      html += '<div class="q" data-correct="' + q.correct + '"><div class="q-title">' + (qi + 1) + ". " + inline(q.question) + '</div><div class="q-opts">' +
        order.map((oi) => '<button class="q-opt" data-o="' + oi + '">' + inline(q.opts[oi]) + "</button>").join("") +
        '</div><div class="q-explain">' + (q.explain ? inline(q.explain) : "") + "</div></div>";
    });
    return html + "</div>";
  }

  function renderCallout(type, title, inner) {
    const labels = { note: "Ghi nhớ", warn: "Cảnh báo", tip: "Mẹo", case: "Tình huống", story: "Chuyện ở trường", do: "Thực hành" };
    return '<div class="callout ' + type + '"><span class="callout-title">' + esc(title || labels[type] || "Ghi chú") + "</span>" + inner + "</div>";
  }

  function renderChecklist(lines, lessonId) {
    const state = read(CHECK_KEY, {});
    const items = lines.map((l) => l.replace(/^\s*[-*]\s*\[[ xX]\]\s*/, "")).filter(Boolean);
    return '<ul class="checklist">' + items.map((t, i) => {
      const key = lessonId + ":" + i;
      return '<li><input type="checkbox" id="ck-' + lessonId + "-" + i + '" data-ck="' + key + '"' + (state[key] ? " checked" : "") + '><label for="ck-' + lessonId + "-" + i + '">' + inline(t) + "</label></li>";
    }).join("") + "</ul>";
  }

  function mdToHtml(md, lessonId) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    let html = "", i = 0, para = [];
    const flush = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };

    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();

      if (/^```/.test(t)) {
        flush();
        const lang = t.slice(3).trim();
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
        i++;
        html += '<pre><code class="lang-' + esc(lang) + '">' + esc(buf.join("\n")) + "</code></pre>";
        continue;
      }

      if (/^:::(\w+)\s*(.*)$/.test(t)) {
        flush();
        const m = t.match(/^:::(\w+)\s*(.*)$/);
        const kind = m[1], title = m[2];
        const buf = []; i++;
        while (i < lines.length && lines[i].trim() !== ":::") { buf.push(lines[i]); i++; }
        i++;
        if (kind === "quiz") html += renderQuiz(parseQuiz(buf));
        else if (kind === "checklist") html += renderChecklist(buf, lessonId);
        else {
          const inner = mdToHtml(buf.join("\n"), lessonId)
            .replace(/^<p>/, "<p>").replace(/<\/p>$/, "</p>");
          html += renderCallout(["note", "warn", "tip", "case", "story", "do"].includes(kind) ? kind : "note", title, inner);
        }
        continue;
      }

      if (/^#{1,4}\s/.test(t)) { flush(); const level = t.match(/^#+/)[0].length; html += "<h" + level + ' id="' + slug(t.replace(/^#+\s*/, "")) + '">' + inline(t.replace(/^#+\s*/, "")) + "</h" + level + ">"; i++; continue; }
      if (/^([-*_])\1{2,}$/.test(t)) { flush(); html += "<hr>"; i++; continue; }

      if (/^\|/.test(t) && i + 1 < lines.length && /^\|?[\s:-]+\|/.test(lines[i + 1].trim())) {
        flush();
        const header = t.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i].trim())) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
          i++;
        }
        html += '<div class="table-wrap"><table><thead><tr>' + header.map((h) => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>" +
          rows.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
        continue;
      }

      if (/^>\s?/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
        html += "<blockquote>" + mdToHtml(buf.join("\n"), lessonId) + "</blockquote>";
        continue;
      }

      if (/^[-*]\s+/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^[-*]\s+/, "")); i++; }
        html += "<ul>" + buf.map((b) => "<li>" + inline(b) + "</li>").join("") + "</ul>";
        continue;
      }

      if (/^\d+[.)]\s+/.test(t)) {
        flush();
        const buf = [];
        while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) { buf.push(lines[i].trim().replace(/^\d+[.)]\s+/, "")); i++; }
        html += "<ol>" + buf.map((b) => "<li>" + inline(b) + "</li>").join("") + "</ol>";
        continue;
      }

      if (!t) { flush(); i++; continue; }
      if (/^\|/.test(t)) { flush(); html += "<p>" + inline(t) + "</p>"; i++; continue; }
      para.push(t); i++;
    }
    flush();
    return html;
  }

  function updateProgressUI() {
    const p = progress();
    const done = allLessons.filter((l) => p[l.id]).length;
    const total = allLessons.length;
    document.getElementById("progressLabel").textContent = done + "/" + total + " bài đã xong";
    document.getElementById("progressNum").textContent = Math.round(done / total * 100) + "%";
    const ring = document.getElementById("ringFill");
    if (ring) ring.style.strokeDashoffset = String(113 - (done / total) * 113);
    document.querySelectorAll(".nav-item").forEach((li) => {
      const a = li.querySelector("a");
      if (!a) return;
      const id = a.getAttribute("href").split("/").pop();
      li.classList.toggle("done", !!p[id]);
      const tick = li.querySelector(".tick");
      if (tick) tick.textContent = p[id] ? "✓" : "";
    });
    document.querySelectorAll("[data-track-progress]").forEach((el) => {
      const tr = manifest.tracks.find((t) => t.id === el.dataset.trackProgress);
      if (!tr) return;
      const d = tr.lessons.filter((l) => p[l.id]).length;
      el.style.width = Math.round(d / tr.lessons.length * 100) + "%";
    });
  }

      '<div class="prevnext">' + (prev ? '<a class="pn" href="#/bai/' + prev.id + '"><span>Bài trước</span><b>' + esc(prev.title) + "</b></a>" : "<span></span>") +
      (next ? '<a class="pn next" href="#/bai/' + next.id + '"><span>Bài tiếp</span><b>' + esc(next.title) + "</b></a>" : '<a class="pn next" href="#/khoa/' + track.id + '"><span>Hết khóa</span><b>Về tổng quan khóa</b></a>') +
      "</div></div></div>";

    document.getElementById("doneBox").addEventListener("change", (e) => {
      const pr = progress();
      if (e.target.checked) pr[id] = true; else delete pr[id];
      write(PROGRESS_KEY, pr);
      updateProgressUI();
    });
    document.querySelectorAll("#lessonBody .quiz").forEach((quiz) => {
      const scoreEl = quiz.querySelector(".quiz-score");
      const total = quiz.querySelectorAll(".q").length;
      quiz.addEventListener("click", (e) => {
        const btn = e.target.closest(".q-opt");
        if (!btn) return;
        const q = btn.closest(".q");
        if (q.classList.contains("answered")) return;
        const correct = Number(q.dataset.correct);
        const chosen = Number(btn.dataset.o);
        q.classList.add("answered");
        q.querySelectorAll(".q-opt").forEach((b) => {
          b.disabled = true;
          if (Number(b.dataset.o) === correct) b.classList.add("correct");
        });
        if (chosen !== correct) btn.classList.add("wrong");
        const answered = quiz.querySelectorAll(".q.answered").length;
        const right = Array.from(quiz.querySelectorAll(".q.answered")).filter((x) => x.querySelector(".q-opt.correct") && !x.querySelector(".q-opt.wrong")).length;
        scoreEl.textContent = right + "/" + total + " đúng";

      cb.addEventListener("change", () => {
        const st = read(CHECK_KEY, {});

        write(CHECK_KEY, st);
      });
    });
    setActive("#/bai/" + id);
    updateProgressUI();
    document.title = lesson.title + " · Sổ tay số Nghệ An";
    window.scrollTo(0, 0);

  /* ---------- Dữ liệu giảng viên ---------- */
  function collectQuizzes() {
    const groups = [];
    for (const track of manifest.tracks) {
      for (const lesson of track.lessons) {
        const src = document.querySelector('.lesson-src[data-id="' + lesson.id + '"]');
        if (!src) continue;
        const qs = [];
        const re = /:::quiz([\s\S]*?):::/g;
        let m;
        while ((m = re.exec(src.textContent))) qs.push.apply(qs, parseQuiz(m[1].split("\n")));
        if (qs.length) groups.push({ track, lesson, qs });
      }
    }
    return groups;
  }

  function printSheets(html, mode) {
    const surface = document.getElementById("printSurface");
    const cls = mode === "deck" ? "printing-deck" : "printing-tool";
    surface.innerHTML = html;
    document.body.classList.add(cls);
    const done = () => {
      document.body.classList.remove(cls);
      surface.innerHTML = "";
      window.removeEventListener("afterprint", done);
    };
    window.addEventListener("afterprint", done);
    setTimeout(() => window.print(), 60);
  }

  function renderDeck(id) {
    const deck = decksById[id];
    if (!deck) { renderDeckList(); return; }
    let idx = 0;
    document.body.classList.add("deck-mode");
    main.innerHTML = '<div class="deck"><div class="deck-top"><span class="deck-tag">' + esc(deck.day) + " · " + esc(deck.label) + " · " + esc(deck.title) + '</span><span class="deck-count" id="deckCount"></span></div>' +
      '<div class="deck-stage" id="deckStage"></div>' +
      '<div class="deck-note" id="deckNote"></div>' +
      '<div class="deck-controls"><button class="btn" id="deckPrev">← Trước</button><span class="deck-hint">← → hoặc Space · Esc thoát</span><button class="btn" id="deckNext">Sau →</button><button class="btn" id="deckPrint">In slide</button><a class="btn ghost" href="#/chieu">Danh sách</a></div></div>';
    const stage = document.getElementById("deckStage");
    const note = document.getElementById("deckNote");
    const count = document.getElementById("deckCount");
    const prev = document.getElementById("deckPrev");
    const next = document.getElementById("deckNext");
    function draw() {
      const sl = deck.slides[idx];
      stage.innerHTML = '<article class="slide' + (idx === 0 ? " cover" : "") + '"><span class="slide-kicker">' + esc(sl.k) + "</span><h2>" + esc(sl.t) + "</h2>" +
        (sl.b && sl.b.length ? "<ul>" + sl.b.map((x) => "<li>" + inline(x) + "</li>").join("") + "</ul>" : "") + "</article>";
      note.textContent = sl.n ? "Ghi chú giảng viên: " + sl.n : "";
      count.textContent = (idx + 1) + " / " + deck.slides.length;
      prev.disabled = idx === 0;
      next.disabled = idx === deck.slides.length - 1;
    }
    function go(step) { const n = Math.max(0, Math.min(deck.slides.length - 1, idx + step)); if (n !== idx) { idx = n; draw(); } }
    prev.onclick = () => go(-1);
    next.onclick = () => go(1);
    stage.onclick = () => go(1);
    document.getElementById("deckPrint").onclick = () => {
      printSheets(deck.slides.map((sl, i) =>
        '<section class="print-slide"><div class="ps-head"><span>' + esc(deck.label) + " · " + esc(deck.day) + "</span><span>" + (i + 1) + "/" + deck.slides.length + "</span></div><h2>" + esc(sl.t) + "</h2>" +
        (sl.b && sl.b.length ? "<ul>" + sl.b.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") +
        (sl.n ? '<p class="ps-note">Ghi chú giảng viên: ' + esc(sl.n) + "</p>" : "") + "</section>").join(""), "deck");
    };
    deckKeyHandler = (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
      else if (e.key === "Escape") location.hash = "#/chieu";
    };
    document.addEventListener("keydown", deckKeyHandler);
    draw();
    document.title = deck.title + " · Slide chiếu";
    window.scrollTo(0, 0);
  }

  function renderTest() {
    const T = ASSESS;
    const RES_KEY = "naem.test.v1";
    const saved = read(RES_KEY, {});
    const mode = saved.post ? "luyen" : saved.pre ? "post" : "pre";
    main.innerHTML = '<div class="wrap">' + pageHead(T.title) +
      '<p class="sched-note">' + inline(T.intro) + "</p>" +
      '<div class="test-bar"><label>Lần làm <select id="testMode">' +
      '<option value="pre"' + (mode === "pre" ? " selected" : "") + ">Đầu vào (buổi 1)</option>" +
      '<option value="post"' + (mode === "post" ? " selected" : "") + ">Đầu ra (buổi 6)</option>" +
      '<option value="luyen"' + (mode === "luyen" ? " selected" : "") + ">Luyện tập</option></select></label>" +
      '<span class="chip" id="testScore">0 / ' + T.questions.length + '</span><span class="chip gray">Chỉ lưu trên máy</span></div>' +
      '<div id="testSaved"></div><div id="testList" class="test-list">' +
      T.questions.map((q, qi) => '<div class="tq" data-correct="' + q.correct + '"><div class="tq-title"><span>' + (qi + 1) + ".</span> " + inline(q.q) + '</div><div class="tq-opts">' +
        q.opts.map((o, oi) => '<button class="tq-opt" data-o="' + oi + '">' + "ABC"[oi] + ". " + inline(o) + "</button>").join("") +
        '</div><div class="tq-explain">' + inline(q.explain) + "</div></div>").join("") + "</div>" +
      '<div id="testResult"></div>' +
      '<div class="print-actions"><button class="btn" id="testBlankPrint">In phiếu trắng A4</button><button class="btn" id="testKeyPrint">In đáp án</button><a class="btn" href="#/dap-an">Toàn bộ đáp án</a></div>' +
      '<p class="footer-note">Điểm không gửi đi đâu. Dùng cùng một đề cho buổi 1 và buổi 6 để so sánh tiến bộ.</p></div>';

    const scoreEl = document.getElementById("testScore");
    const result = document.getElementById("testResult");
    const list = document.getElementById("testList");

    function savedNote() {
      const s = read(RES_KEY, {});
      const bits = [];
      if (s.pre) bits.push("Đầu vào: " + s.pre.score + "/" + T.questions.length + " (" + s.pre.date + ")");
      if (s.post) bits.push("Đầu ra: " + s.post.score + "/" + T.questions.length + " (" + s.post.date + ")");
      const diff = s.pre && s.post ? s.post.score - s.pre.score : null;
      document.getElementById("testSaved").innerHTML = bits.length ? '<p class="saved-line">' + esc(bits.join(" · ")) + (diff == null ? "" : " · Tiến bộ " + (diff >= 0 ? "+" : "") + diff + " câu") + "</p>" : "";
    }
    savedNote();

    list.addEventListener("click", (e) => {
      const btn = e.target.closest(".tq-opt");
      if (!btn) return;
      const q = btn.closest(".tq");
      if (q.classList.contains("answered")) return;
      const correct = Number(q.dataset.correct);
      const chosen = Number(btn.dataset.o);
      q.classList.add("answered");
      q.querySelectorAll(".tq-opt").forEach((b) => {
        b.disabled = true;
        if (Number(b.dataset.o) === correct) b.classList.add("correct");
      });
      if (chosen !== correct) btn.classList.add("wrong");
      const answered = list.querySelectorAll(".tq.answered").length;
      const right = Array.from(list.querySelectorAll(".tq.answered")).filter((x) => x.querySelector(".tq-opt.correct") && !x.querySelector(".tq-opt.wrong")).length;
      scoreEl.textContent = right + " / " + T.questions.length;
      if (answered === T.questions.length) {
        const band = T.bands.find((b) => right <= b.max) || T.bands[T.bands.length - 1];
        const modeSel = document.getElementById("testMode").value;
        if (modeSel !== "luyen") {
          const s = read(RES_KEY, {});
          s[modeSel] = { score: right, date: new Date().toISOString().slice(0, 10) };
          write(RES_KEY, s);
          savedNote();
        }
        result.innerHTML = '<div class="callout do"><span class="callout-title">Kết quả: ' + right + "/" + T.questions.length + " · " + esc(band.label) + "</span><p>" + inline(band.advice) + '</p><p><a href="#/bai/c1-can-cu">Vào Nền tảng chung</a> · <a href="#/lich">Xem lịch 6 buổi</a></p><button class="btn" id="testRetry">Làm lại</button></div>';
        document.getElementById("testRetry").onclick = () => renderTest();
      }
    });
    document.getElementById("testBlankPrint").onclick = () => printSheets(testSheet(false));
    document.getElementById("testKeyPrint").onclick = () => printSheets(testSheet(true));
    setActive("#/danh-gia");
    document.title = "Kiểm tra đầu vào – đầu ra · NAEM 2026";
    window.scrollTo(0, 0);
  }

      '<div class="print-actions"><button class="btn primary" id="promptPrint">In toàn bộ ' + P.prompts.length + " prompt A4</button><a class=\"btn\" href=\"#/tro-choi\">Kho trò chơi</a><a class=\"btn ghost\" href=\"#/in\">Bộ phiếu in</a></div>" +
      '<p class="footer-note">Mẹo: dán prompt gốc, thay phần trong ngoặc vuông, rồi tự đọc lại theo bốn thẻ trước khi gửi. Không đưa dữ liệu định danh học sinh vào công cụ AI công cộng.</p></div>';
    main.querySelectorAll("[data-purpose]").forEach((b) => {

    });
    document.getElementById("promptSubject").onchange = (e) => { promptFilter.subject = e.target.value; renderPrompts(); };
    main.querySelectorAll("[data-copy]").forEach((b) => {
      b.onclick = () => {
        const p = PROMPTS.find((x) => x.id === b.dataset.copy);
        const text = promptText(p);
        const done = () => { b.textContent = "Đã chép ✓"; setTimeout(() => { b.textContent = "Chép prompt"; }, 1600); };
        const fallback = () => {
          const ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { b.textContent = "Không chép được"; }
          ta.remove();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      };
    });
    document.getElementById("promptPrint").onclick = () => printSheets(promptSheets());

  /* ---------- Kho trò chơi ---------- */

    const arcadeCards = ARCADE.games.map((g) => {

      '<p class="sched-note">' + esc(G.note) + "</p>" +
      '<div class="print-actions"><a class="btn primary" href="#/tro-choi/choi/dua-trac-nghiem">Chơi đua trắc nghiệm</a><a class="btn" href="#/tro-choi/vong-xoay">Vòng xoay</a><button class="btn ghost" id="gamePrint">In kho trò chơi A4</button></div>' +

      '<div class="game-filters">' + chips + subjSelect + '<span class="chip">' + list.length + " / " + G.games.length + " trò</span></div>" +

  /* ---------- Khóa học & học liệu ---------- */
  const PRACTICE_KEY = "naem.practice.v1";
  const PRACTICE_BEST_KEY = "naem.practice.best.v1";

  let quizBankCache = null;
  function quizBank() {
    if (quizBankCache) return quizBankCache;
    const items = [];
    for (const grp of collectQuizzes()) {
      grp.qs.forEach((q, i) => items.push({ id: grp.lesson.id + ":" + i, q, lesson: grp.lesson, track: grp.track }));
    }
    quizBankCache = items;
    return items;
  }

  const vnDate = (ts) => new Date(ts).toLocaleDateString("vi-VN");

  function packQuestions(track, n) {
    const bank = quizBank().filter((x) => x.track.id === track.id);
    const out = [];
    const seen = new Set();
    const count = Math.min(n, bank.length);
    const step = count ? bank.length / count : 1;
    for (let k = 0; k < count; k++) {
      const item = bank[Math.floor(k * step)];
      if (item && !seen.has(item.id)) { seen.add(item.id); out.push(item); }
    }
    return out;
  }

  function packSheet(track) {
    const course = courseById[track.id];
    const totalMin = track.lessons.reduce((n, l) => n + l.minutes, 0);
    const qTotal = quizBank().filter((x) => x.track.id === track.id).length;
    const sessions = course ? course.modules.flatMap((m, mi) => m.sessions.map((s) => ({ m, s, mi }))) : [];
    const refs = { tools: [], arcade: [], prompts: [], forms: [], decks: [] };
    sessions.forEach(({ s }) => {
      ["tools", "arcade", "prompts", "forms", "decks"].forEach((k) => { for (const id of (s[k] || [])) if (!refs[k].includes(id)) refs[k].push(id); });
    });
    const tools = refs.tools.map((id) => manifest.tools.find((t) => t.id === id)).filter(Boolean);
    const games = refs.arcade.map((id) => ARCADE.games.find((g) => g.id === id)).filter(Boolean);
    const prompts = refs.prompts.map((id) => promptById[id]).filter(Boolean);
    const forms = refs.forms.map((id) => FORMS.find((f) => f.id === id)).filter(Boolean);
    const decks = refs.decks.map((id) => TRAINER.slides.decks.find((d) => d.id === id)).filter(Boolean);
    const picks = packQuestions(track, 5);
    const rows = sessions.map(({ m, s, mi }, i) =>
      "<tr><td>" + (i + 1) + "</td><td><b>" + esc(s.title) + "</b><br><span class=\"pack-small\">Module " + (mi + 1) + " · " + esc(m.title) + " · " + esc(s.length) + "</span></td><td>" + esc(s.input) + "</td><td>" + esc(s.output) + "</td></tr>").join("");
    const qHtml = picks.map((it, i) =>
      '<p class="pack-q"><b>' + (i + 1) + ".</b> " + inline(it.q.question) + "</p>" +
      '<p class="pack-opts">' + it.q.opts.map((o, oi) => "ABC"[oi] + ". " + inline(o)).join(" · ") + "</p>").join("");
    const key = picks.map((it, i) => (i + 1) + "ABC"[it.q.correct]).join(" · ");
    return '<section class="sheet pack-sheet">' +
      '<div class="sheet-kicker">LỘ TRÌNH KHÓA HỌC · NAEM 2026</div>' +
      "<h3>" + esc(track.title) + "</h3>" +
      "<p>" + esc(track.desc) + "</p>" +
      (course && !/dành cho/i.test(track.desc) ? '<p class="pack-meta"><b>Dành cho:</b> ' + esc(course.audience) + "</p>" : "") +
      '<p class="pack-meta"><b>Đầu ra cuối khóa:</b> ' + esc(course ? course.outcome : "") + "</p>" +
      '<p class="pack-meta">' + track.lessons.length + " bài đọc · " + totalMin + " phút đọc · " + sessions.length + " buổi · " + qTotal + ' câu tự kiểm tra</p>' +
      "<h4>Lộ trình buổi học — đầu vào, đầu ra</h4>" +
      '<table class="pack-plan"><thead><tr><th style="width:7%">Buổi</th><th style="width:27%">Nội dung</th><th style="width:33%">Đầu vào</th><th style="width:33%">Đầu ra</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      "<h4>Học liệu của khóa</h4>" +
      '<p class="pack-mats"><b>Bài đọc:</b> ' + track.lessons.map((l) => esc(l.title) + " (" + l.minutes + "′)").join(" · ") + "</p>" +
      '<p class="pack-mats"><b>Công cụ:</b> ' + tools.map((t) => esc(t.title)).join(" · ") + "</p>" +
      '<p class="pack-mats"><b>Prompt:</b> ' + prompts.map((p) => esc(p.title)).join(" · ") + "</p>" +
      '<p class="pack-mats"><b>Trò chơi:</b> ' + games.map((g) => esc(g.name)).join(" · ") + "</p>" +
      '<p class="pack-mats"><b>Mẫu in:</b> ' + forms.map((f) => esc(f.title)).join(" · ") + "</p>" +
      (decks.length ? '<p class="pack-mats"><b>Slide:</b> ' + decks.map((d) => esc(d.label + " · " + d.title)).join(" · ") + "</p>" : "") +
      "<h4>Kiểm tra nhanh — giáo viên đọc câu hỏi, học viên chọn A/B/C</h4>" + qHtml +
      '<p class="pack-key"><b>Đáp án:</b> ' + key + "</p>" +
      '<p class="ps-b-out">Khóa này độc lập, không cần học khóa khác trước. Hoàn thành đầu ra từng buổi rồi mới chuyển buổi tiếp theo.</p>' +
      "</section>";
  }

  const COURSES = TRAINER.courses.courses;
  const courseById = Object.fromEntries(COURSES.map((c) => [c.id, c]));
  const promptById = Object.fromEntries(TRAINER.prompts.prompts.map((p) => [p.id, p]));

  function courseMinutes(c) {
    return c.modules.reduce((n, m) => n + m.sessions.reduce((x, s) => x + (parseInt(s.length, 10) || 0), 0), 0);
  }

  function courseAtLesson(c, lessonId) {
    for (let mi = 0; mi < c.modules.length; mi++) {
      const m = c.modules[mi];
      for (let si = 0; si < m.sessions.length; si++) {
        if (m.sessions[si].lessons.includes(lessonId)) return { m, s: m.sessions[si], mi, si };
      }
    }
    return null;
  }

  function renderCourse(id) {
    const course = courseById[id];
    const track = manifest.tracks.find((t) => t.id === id);
    if (!course || !track) { renderLibrary(); return; }
    const p = progress();
    const done = track.lessons.filter((l) => p[l.id]).length;
    const sessions = course.modules.reduce((n, m) => n + m.sessions.length, 0);
    const qc = quizBank().filter((x) => x.track.id === id).length;
    const first = track.lessons[0];
    const modules = course.modules.map((m, mi) => {
      const mMin = m.sessions.reduce((n, s) => n + (parseInt(s.length, 10) || 0), 0);
      const cards = m.sessions.map((se, si) => {
        const start = lessonById[se.lessons[0]];
        return '<article class="session-card">' +
          '<div class="session-head"><span class="session-tag">BUỔI ' + (si + 1) + '</span><div class="session-title"><h4>' + esc(se.title) + "</h4><span>" + se.lessons.length + " bài đọc · " + esc(se.length) + "</span></div></div>" +

          '<div class="mat-panel"><div class="mat-title">HỌC LIỆU LIÊN QUAN</div>' + courseMaterials(se) + "</div>" +
          '<div class="session-foot">' + (start ? '<a class="btn small primary" href="#/bai/' + start.id + '">Học buổi này</a>' : "") +
          '<a class="btn small ghost" href="#/luyen-tap/' + id + '">Luyện ' + qc + " câu của khóa</a></div></article>";
      }).join("");
      return '<section class="module-block"><div class="module-head"><span class="module-num">MODULE ' + (mi + 1) + '</span><div><h3>' + esc(m.title) + "</h3><p>" + esc(m.desc) + '</p></div><span class="chip gray">' + m.sessions.length + " buổi · " + mMin + " phút</span></div>" + cards + "</section>";
    }).join("");
    main.innerHTML = '<div class="wrap">' +

  /* ---------- Phòng luyện 125 câu ---------- */
  let prac = null;

  function practiceState() {
    const st = read(PRACTICE_KEY, {});
    if (!st.mastered) st.mastered = {};
    if (!st.attempts) st.attempts = 0;
    return st;
  }

  function masteredCount() { return Object.keys(practiceState().mastered).length; }

  function practiceBand(pct) {
    if (pct >= 90) return "Rất vững. Chuyển sang bộ câu của khóa khác hoặc tăng số câu mỗi lượt.";
    if (pct >= 70) return "Khá vững. Ôn lại các câu sai, đọc lại bài gốc của đúng phần đó.";
    if (pct >= 50) return "Đã nắm một nửa. Luyện lại câu sai trước khi mở rộng phạm vi.";
    return "Cần ôn lại. Đọc bài gốc của các câu sai rồi luyện lại bộ 10 câu.";
  }

  function renderPractice(preset) {
    const bank = quizBank();
    const total = bank.length;
    const mastered = masteredCount();
    const best = read(PRACTICE_BEST_KEY, {});
    const gotPreset = manifest.tracks.some((t) => t.id === preset);

      manifest.tracks.map((t) => {
        const n = bank.filter((x) => x.track.id === t.id).length;
