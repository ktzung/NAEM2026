      }).join("");
    const badges = [
      [10, "Khởi động", "Nắm 10 câu đầu tiên"],
      [40, "Bền bỉ", "Nắm 40 câu"],
      [80, "Đào sâu", "Nắm 80 câu"],
      [total, "Toàn bộ", "Nắm cả " + total + " câu"]
    ].map(([n, name, note]) => '<span class="badge' + (mastered >= n ? " on" : "") + '" title="' + esc(note) + '">' + (mastered >= n ? "✓ " : "") + esc(name) + " · " + n + "</span>").join("");
    const bestKeys = Object.keys(best);
    const bestHtml = bestKeys.length
      ? '<div class="prac-best"><b>Kỷ lục trên máy</b><div class="badge-row">' + bestKeys.map((k) => {
          const tr = manifest.tracks.find((t) => t.id === k);
          return '<span class="badge">' + esc(k === "all" ? "Tất cả" : tr ? tr.short : k) + " " + best[k].score + "/" + best[k].total + " · " + vnDate(best[k].date) + "</span>";
        }).join("") + "</div></div>"
      : "";
    main.innerHTML = '<div class="wrap">' +
      '<div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / <a href="#/kho-hoc-lieu">Khóa học &amp; học liệu</a></div><h1>Phòng luyện ' + total + ' câu</h1><div class="lesson-meta"><span class="chip">Chấm ngay</span><span class="chip amber">Giải thích kèm nguồn</span><span class="chip gray">Lưu trên máy</span></div></div>' +
      '<p class="sched-note">Bộ câu lấy từ phần tự kiểm tra của ' + allLessons.length + ' bài. Mỗi lượt chọn một khóa và số câu; trả lời đúng câu nào thì câu đó được ghi nhớ.</p>' +
      '<div class="prac-progress"><div class="prac-meter"><b>Đã nắm ' + mastered + " / " + total + ' câu</b><div class="prac-bar"><i style="width:' + Math.round(mastered / total * 100) + '%"></i></div><span>Nắm = đã trả lời đúng ít nhất một lần trên máy này.</span></div><div><div class="badge-row">' + badges + "</div>" + bestHtml + "</div></div>" +
      '<div class="game-shell"><div class="game-setup"><h3>Chọn bộ câu để luyện</h3><div class="setup-row"><label>Khóa<select id="pracTrack">' + trackOptions + '</select></label><label>Số câu<select id="pracCount"><option value="10">10 câu</option><option value="20">20 câu</option><option value="40">40 câu</option><option value="all">Tất cả</option></select></label><button class="btn primary" id="pracStart">Bắt đầu luyện</button></div><p class="game-hint">Câu hỏi xáo trộn mỗi lượt. Trả lời sai vẫn xem được giải thích và bài gốc.</p></div></div>' +
      '<div class="print-actions"><a class="btn ghost" href="#/dap-an">Xem đáp án toàn bộ</a><a class="btn ghost" href="#/kho-hoc-lieu">Về danh sách khóa</a></div></div>';
    document.getElementById("pracStart").onclick = () => {
      const trackId = document.getElementById("pracTrack").value;
      const cnt = document.getElementById("pracCount").value;
      let pool = quizBank();
      if (trackId !== "all") pool = pool.filter((x) => x.track.id === trackId);
      pool = shuffleArr(pool);
      if (cnt !== "all") pool = pool.slice(0, Math.min(Number(cnt), pool.length));
      startPractice(pool, trackId);
    };
    setActive("#/luyen-tap");
    document.title = "Phòng luyện " + total + " câu · NAEM 2026";
    window.scrollTo(0, 0);
  }

  function startPractice(pool, trackId) {
    if (!pool || !pool.length) return;
    prac = { pool, i: 0, answers: [], trackId: trackId || "all", startedAt: Date.now(), before: masteredCount(), saved: false };
    renderPracticeRun();
  }

  function renderPracticeRun() {
    if (!prac) { renderPractice(); return; }
    const item = prac.pool[prac.i];
    const total = prac.pool.length;
    const right = prac.answers.filter((a) => a.ok).length;
    const mastered = masteredCount();
    const opts = item.q.opts.map((o, oi) =>
      '<button class="opt-btn" data-o="' + oi + '"><b>' + String.fromCharCode(65 + oi) + ".</b> " + inline(o) + "</button>").join("");
    main.innerHTML = '<div class="wrap">' +
      '<div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / <a href="#/luyen-tap">Phòng luyện</a></div><h1>Luyện ' + quizBank().length + ' câu</h1><div class="lesson-meta"><span class="chip">' + esc(item.track.short) + '</span><span class="chip gray">' + esc(item.lesson.title) + "</span></div></div>" +
      '<div class="prac-top"><a class="prac-back" href="#/luyen-tap">← Về trang chọn bộ câu</a><span class="chip gray">Lưu trên máy</span></div>' +
      gameHud([["Câu", (prac.i + 1) + " / " + total], ["Đúng", String(right), "pracRight"], ["Đã nắm", mastered + " / " + quizBank().length, "pracMastered"]]) +
      '<div class="prac-bar"><i id="pracBar" style="width:' + Math.round(prac.answers.length / total * 100) + '%"></i></div>' +
      '<div class="game-shell"><p class="sprint-qtext">' + inline(item.q.question) + '</p><div class="sprint-opts" id="pracOpts">' + opts + '</div><div class="prac-fb" id="pracFb" hidden></div></div>' +
      '<p class="game-hint">Chọn đáp án để chấm ngay. Câu đã nắm được đếm một lần, kể cả khi làm lại bộ câu sai.</p></div>';
    const optsBox = document.getElementById("pracOpts");
    optsBox.addEventListener("click", (e) => {
      const btn = e.target.closest(".opt-btn");
      if (!btn || optsBox.dataset.done) return;
      optsBox.dataset.done = "1";
      const chosen = Number(btn.dataset.o);
      const ok = chosen === item.q.correct;
      optsBox.querySelectorAll(".opt-btn").forEach((b) => {
        b.disabled = true;
        if (Number(b.dataset.o) === item.q.correct) b.classList.add("ok");
      });
      if (!ok) btn.classList.add("bad");
      if (ok) {
        const st = practiceState();
        if (!st.mastered[item.id]) { st.mastered[item.id] = true; write(PRACTICE_KEY, st); }
      }
      prac.answers.push({ id: item.id, chosen, ok, q: item.q, lesson: item.lesson, track: item.track });
      const fb = document.getElementById("pracFb");
      fb.hidden = false;
      fb.className = "prac-fb " + (ok ? "ok" : "bad");
      fb.innerHTML = "<b>" + (ok ? "Chính xác." : "Chưa đúng. Đáp án: " + esc(item.q.opts[item.q.correct]) + ".") + "</b>" +
        (item.q.explain ? "<p>" + inline(item.q.explain) + "</p>" : "") +
        '<p class="prac-src">Nguồn: <a href="#/bai/' + item.lesson.id + '">' + esc(item.lesson.title) + "</a></p>" +
        '<button class="btn primary" id="pracNext">' + (prac.i + 1 < total ? "Câu tiếp" : "Xem kết quả") + "</button>";
      const hRight = document.getElementById("pracRight");
      if (hRight) hRight.textContent = String(prac.answers.filter((a) => a.ok).length);
      const hM = document.getElementById("pracMastered");
      if (hM) hM.textContent = masteredCount() + " / " + quizBank().length;
      const bar = document.getElementById("pracBar");
      if (bar) bar.style.width = Math.round(prac.answers.length / total * 100) + "%";
      document.getElementById("pracNext").onclick = () => {
        if (prac.i + 1 < total) { prac.i++; renderPracticeRun(); }
        else showPracticeResult();
      };
    });
    setActive("#/luyen-tap");
    document.title = "Luyện tập · NAEM 2026";
    window.scrollTo(0, 0);
  }

  function showPracticeResult() {
    if (!prac) { renderPractice(); return; }
    const total = prac.pool.length;
    const right = prac.answers.filter((a) => a.ok).length;
    const pct = total ? Math.round(right / total * 100) : 0;
    const st = practiceState();
    if (!prac.saved) {
      st.attempts = (st.attempts || 0) + 1;
      write(PRACTICE_KEY, st);
      const best = read(PRACTICE_BEST_KEY, {});
      const key = prac.trackId || "all";
      const prev = best[key];
      if (!prev || right / total > prev.score / prev.total) {
        best[key] = { score: right, total, date: Date.now() };
        write(PRACTICE_BEST_KEY, best);
      }
      prac.saved = true;
    }
    const gained = Math.max(0, masteredCount() - prac.before);
    const wrong = prac.answers.filter((a) => !a.ok);
    const secs = Math.round((Date.now() - prac.startedAt) / 1000);
    const timeText = secs < 60 ? secs + " giây" : Math.round(secs / 60) + " phút";
    const trackLabel = prac.trackId === "all" ? "Tất cả 8 khóa" : (manifest.tracks.find((t) => t.id === prac.trackId) || {}).title || "Một khóa";
    const wrongHtml = wrong.length
      ? '<h3>Câu cần ôn lại</h3><div class="prac-wrong">' + wrong.map((a, i) =>
          '<article><p class="prac-wq"><b>' + (i + 1) + ".</b> " + inline(a.q.question) + "</p>" +
          '<p class="prac-pick"><span>Bạn chọn:</span> ' + inline(a.q.opts[a.chosen]) + "</p>" +
          '<p class="prac-ok"><span>Đáp án:</span> ' + inline(a.q.opts[a.q.correct]) + "</p>" +
          (a.q.explain ? "<p>" + inline(a.q.explain) + "</p>" : "") +
          '<p class="prac-src"><a href="#/bai/' + a.lesson.id + '">Đọc lại: ' + esc(a.lesson.title) + "</a></p></article>").join("") + "</div>"
      : '<div class="callout do"><span class="callout-title">Không có câu sai</span><p>Toàn bộ câu trong lượt này đã đúng. Tăng số câu hoặc chuyển sang khóa khác để kiểm tra độ vững.</p></div>';
    main.innerHTML = '<div class="wrap">' +
      '<div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / <a href="#/luyen-tap">Phòng luyện</a></div><h1>Kết quả luyện tập</h1><div class="lesson-meta"><span class="chip">' + esc(trackLabel) + '</span><span class="chip amber">' + total + " câu</span></div></div>" +
      '<div class="game-shell"><div class="prac-score"><div><b>' + right + "/" + total + "</b><span>" + pct + "% đúng · " + timeText + "</span></div>" +
      '<div class="prac-score-meta"><span class="chip">Đã nắm ' + masteredCount() + " / " + quizBank().length + '</span><span class="chip gray">Mới nắm: +' + gained + '</span><span class="chip ' + (pct >= 70 ? "" : "amber") + '">' + esc(practiceBand(pct).split(".")[0]) + "</span></div></div>" +
      "<p>" + esc(practiceBand(pct)) + "</p>" +
      '<div class="print-actions"><button class="btn primary" id="pracNew">Luyện bộ mới</button>' +
      (wrong.length ? '<button class="btn" id="pracRetry">Làm lại ' + wrong.length + " câu sai</button>" : "") +
      '<button class="btn ghost" id="pracPrint">In phiếu kết quả A4</button><a class="btn ghost" href="#/kho-hoc-lieu">Về danh sách khóa</a></div></div>' +
      wrongHtml +
      '<p class="footer-note">Kỷ lục và số câu đã nắm chỉ lưu trên trình duyệt của máy này.</p></div>';
    document.getElementById("pracNew").onclick = () => renderPractice();
    if (wrong.length) {
      document.getElementById("pracRetry").onclick = () => {
        const byId = new Map(quizBank().map((x) => [x.id, x]));
        startPractice(wrong.map((a) => byId.get(a.id)).filter(Boolean), prac.trackId);
      };
    }
    document.getElementById("pracPrint").onclick = printPracticeResult;
    setActive("#/luyen-tap");
    document.title = "Kết quả luyện tập · NAEM 2026";
    window.scrollTo(0, 0);
  }

  function printPracticeResult() {
    if (!prac) return;
    const total = prac.pool.length;
    const right = prac.answers.filter((a) => a.ok).length;
    const pct = total ? Math.round(right / total * 100) : 0;
    const wrong = prac.answers.filter((a) => !a.ok);
    const trackLabel = prac.trackId === "all" ? "Tất cả 8 khóa" : (manifest.tracks.find((t) => t.id === prac.trackId) || {}).title || "Một khóa";
    const wrongRows = wrong.length
      ? wrong.map((a, i) => '<p style="margin:5px 0"><b>' + (i + 1) + ".</b> " + inline(a.q.question) + '<br><span style="color:#a9342a">Bạn chọn: ' + inline(a.q.opts[a.chosen]) + '</span> · <span style="color:#2e6b45">Đáp án: ' + inline(a.q.opts[a.q.correct]) + "</span>" + (a.q.explain ? "<br><em>" + inline(a.q.explain) + "</em>" : "") + "</p>").join("")
      : "<p>Không có câu sai.</p>";
    printSheets('<section class="sheet print-flow"><div class="sheet-kicker">PHÒNG LUYỆN ' + quizBank().length + ' CÂU · NAEM 2026</div><h3>Phiếu kết quả luyện tập</h3>' +
      '<p>Họ tên: .................................................... Lớp/tổ: ..........................</p>' +
      "<p><b>Bộ câu:</b> " + esc(trackLabel) + " · <b>Kết quả:</b> " + right + "/" + total + " (" + pct + "%) · <b>Đã nắm:</b> " + masteredCount() + "/" + quizBank().length + "</p>" +
      '<h4>Câu cần ôn lại</h4>' + wrongRows +
      '<p class="ps-b-out">Mở lại bài gốc của từng câu sai trên trang web, sau đó luyện lại đúng bộ câu này để kiểm tra tiến bộ.</p></section>');
  }

  /* ---------- Sân chơi tương tác ---------- */
  const ARCADE = TRAINER.arcade;
  const ARCADE_BEST_KEY = "naem.arcade.best.v1";
  const arcadeBest = () => read(ARCADE_BEST_KEY, {});
  const shuffleArr = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  function saveArcadeBest(id, value, lower) {
    const b = arcadeBest();
    if (b[id] == null || (lower ? value < b[id] : value > b[id])) { b[id] = value; write(ARCADE_BEST_KEY, b); return true; }
    return false;
  }
  function arcadeBestText(g) {
    const v = arcadeBest()[g.id];
    if (v == null) return "Chưa có kỷ lục";
    return "Kỷ lục: " + v + (g.type === "match" ? " lượt lật" : " điểm");
  }
  function refreshBestChip(g) {
    const el = document.getElementById("arcadeBestChip");
    if (el) el.textContent = arcadeBestText(g);
  }
  let arcadeTimer = null;
  function stopArcadeTimer() { if (arcadeTimer) { clearInterval(arcadeTimer); arcadeTimer = null; } }
  function gameHud(items) {
    return '<div class="game-hud">' + items.map((it) => '<div class="hud-item"><span>' + esc(it[0]) + "</span><b" + (it[2] ? ' id="' + it[2] + '"' : "") + ">" + esc(it[1]) + "</b></div>").join("") + "</div>";
  }

  function renderArcade(id) {
    const g = ARCADE.games.find((x) => x.id === id);
    if (!g) { renderGames(); return; }
    if (g.type === "link") { location.hash = g.href; return; }
    stopArcadeTimer();
    const idx = ARCADE.games.indexOf(g);
    const next = ARCADE.games[(idx + 1) % ARCADE.games.length];
    main.innerHTML = '<div class="wrap"><div class="lesson-head"><div class="breadcrumb"><a href="#/">Trang chủ</a> / <a href="#/tro-choi">Kho trò chơi</a> / Chơi ngay</div>' +
      "<h1>" + esc(g.name) + '</h1><div class="lesson-meta"><span class="chip">' + esc(g.genre) + '</span><span class="chip gray">' + esc(g.time) + '</span><span class="chip gray">' + esc(g.group) + '</span><span class="chip amber" id="arcadeBestChip">' + esc(arcadeBestText(g)) + "</span></div>" +
      '<p class="game-lead">' + esc(g.desc) + "</p></div>" +
      '<div class="game-shell" id="gameStage"></div>' +
      '<div class="game-note"><b>Cách tính:</b> ' + esc(g.rule) + ' <span class="muted">Điểm lưu trên máy này; dùng máy chung thì xóa dữ liệu trình duyệt sau khi chơi.</span></div>' +
      '<div class="print-actions"><a class="btn" href="#/tro-choi">Về kho trò chơi</a><a class="btn ghost" href="' + (next.type === "link" ? next.href : "#/tro-choi/choi/" + next.id) + '">Trò khác: ' + esc(next.name) + " →</a></div></div>";
    if (g.type === "sprint") gameSprint(g);
    else if (g.type === "match") gameMatch(g);
    else if (g.type === "sort") gameSort(g);
    else if (g.type === "order") gameOrder(g);
    else if (g.type === "spot") gameSpot(g);
    else if (g.type === "fill") gameFill(g);
    setActive("#/tro-choi");
    document.title = g.name + " · Trò chơi NAEM 2026";
    window.scrollTo(0, 0);
  }

  function gameSprint(g) {
    const stage = document.getElementById("gameStage");
    const bank = collectQuizzes();
    const trackOpts = [{ id: "all", title: "Tất cả khóa" }].concat(manifest.tracks.map((t) => ({ id: t.id, title: t.title })));
    let timer = null, pool = [], trackId = "all", asked = 0, right = 0, score = 0, streak = 0, left = 60, locked = false, ended = true, misses = [];

    function setup() {
      if (timer) clearInterval(timer);
      arcadeTimer = null;
      stage.innerHTML = '<div class="game-setup"><h3>Chọn khóa rồi bắt đầu</h3><div class="setup-row"><label>Khóa<select id="spTrack">' +
        trackOpts.map((t) => '<option value="' + t.id + '">' + esc(t.title) + "</option>").join("") +
        '</select></label><button class="btn primary" id="spStart">Bắt đầu 60 giây</button></div><p class="game-hint">Mỗi câu có 3 phương án; trả lời đúng liên tiếp để cộng thêm điểm chuỗi.</p></div>';
      document.getElementById("spStart").onclick = () => start(document.getElementById("spTrack").value);
    }

    function buildPool() {
      const out = [];
      bank.forEach((grp) => { if (trackId !== "all" && grp.track.id !== trackId) return; grp.qs.forEach((qq) => out.push({ q: qq, lesson: grp.lesson })); });
      return shuffleArr(out);
    }

    function start(tid) {
      trackId = tid; pool = buildPool(); asked = 0; right = 0; score = 0; streak = 0; left = 60; misses = []; ended = false; locked = false;
      stage.innerHTML = gameHud([["Thời gian", "60s", "hudTime"], ["Điểm", "0", "hudScore"], ["Chuỗi", "0", "hudStreak"], ["Đúng", "0/0", "hudRight"]]) +
        '<div class="timerbar"><i id="timerFill" style="width:100%"></i></div><div id="sprintQ"></div>';
      timer = setInterval(() => {
        left--;
        const tEl = document.getElementById("hudTime"); if (tEl) tEl.textContent = Math.max(left, 0) + "s";
        const f = document.getElementById("timerFill"); if (f) f.style.width = Math.max(0, left / 60 * 100) + "%";
        if (left <= 0) finish();
      }, 1000);
      arcadeTimer = timer;
      nextQ();
    }

    function nextQ() {
      if (ended) return;
      if (!pool.length) pool = buildPool();
      const item = pool.pop();
      if (!item) return finish();
      asked++;
      const opts = shuffleArr(item.q.opts.map((text, i) => ({ text, ok: i === item.q.correct })));
      const box = document.getElementById("sprintQ");
      if (!box) return;
      box.innerHTML = '<p class="sprint-meta">Câu ' + asked + " · " + esc(item.lesson.title) + '</p><p class="sprint-qtext">' + inline(item.q.question) + "</p>" +
        '<div class="sprint-opts">' + opts.map((o, i) => '<button class="opt-btn" data-ok="' + (o.ok ? "1" : "0") + '">' + "ABC"[i] + ". " + inline(o.text) + "</button>").join("") + "</div>";
      box.querySelectorAll(".opt-btn").forEach((b, i) => { b.onclick = () => answer(b, opts[i], item); });
      locked = false;
    }

    function answer(btn, opt, item) {
      if (locked || ended) return;
      locked = true;
      const btns = btn.parentElement.querySelectorAll(".opt-btn");
      btns.forEach((b) => { b.disabled = true; if (b.dataset.ok === "1") b.classList.add("ok"); });
      if (opt.ok) {
        right++; streak++;
        score += 10 + Math.min(streak, 10) * 2;
        btn.classList.add("ok");
      } else {
        streak = 0;
        btn.classList.add("bad");
        misses.push({ q: item.q.question, a: item.q.opts[item.q.correct] });
        if (misses.length > 4) misses.shift();
      }
      const scoreEl = document.getElementById("hudScore"); if (scoreEl) scoreEl.textContent = score;
      const streakEl = document.getElementById("hudStreak"); if (streakEl) streakEl.textContent = streak;
      const rightEl = document.getElementById("hudRight"); if (rightEl) rightEl.textContent = right + "/" + asked;
      setTimeout(() => { if (!ended) nextQ(); }, 520);
    }

    function finish() {
      if (ended) return;
      ended = true; clearInterval(timer); arcadeTimer = null;
      const isNew = saveArcadeBest(g.id, score, false);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      const missHtml = misses.length ? '<ul class="miss-list">' + misses.map((m) => "<li><b>" + inline(m.q) + "</b><br>Đáp án: " + inline(m.a) + "</li>").join("") + "</ul>" : "";
      stage.innerHTML = '<div class="game-result"><span class="res-kicker">KẾT THÚC</span><b class="res-score">' + score + '</b><span class="res-unit">điểm</span>' +
        "<p>Đúng " + right + "/" + asked + " câu." + (isNew ? " Kỷ lục mới!" : " Kỷ lục của máy: " + best + " điểm.") + "</p>" + missHtml +
        '<div class="game-actions"><button class="btn primary" id="spAgain">Chơi lại</button><button class="btn" id="spChange">Đổi khóa</button><a class="btn ghost" href="#/tro-choi">Về kho trò chơi</a></div></div>';
      document.getElementById("spAgain").onclick = () => start(trackId);
      document.getElementById("spChange").onclick = setup;
    }

    setup();
  }

  function gameMatch(g) {
    const stage = document.getElementById("gameStage");
    let cards = [], open = [], moves = 0, matched = 0, lock = false, ended = false, t0 = 0, timer = null;

    function setup() {
      if (timer) clearInterval(timer);
      arcadeTimer = null;
      stage.innerHTML = '<div class="game-setup"><h3>Lật hai thẻ để ghép thuật ngữ với nghĩa</h3><p class="game-hint">Mỗi ván dùng 6 cặp ngẫu nhiên trong kho ' + ARCADE.match.pairs.length + ' cặp. Ghép đúng thì thẻ giữ mở.</p><div class="setup-row"><button class="btn primary" id="mmStart">Chia thẻ</button></div></div>';
      document.getElementById("mmStart").onclick = start;
    }

    function start() {
      const pairs = shuffleArr(ARCADE.match.pairs).slice(0, 6);
      const deck = [];
      pairs.forEach((p, i) => { deck.push({ id: i, text: p.term }); deck.push({ id: i, text: p.def }); });
      cards = shuffleArr(deck).map((c) => ({ id: c.id, text: c.text, open: false, done: false }));
      open = []; moves = 0; matched = 0; lock = false; ended = false; t0 = Date.now();
      stage.innerHTML = gameHud([["Lượt lật", "0", "mmMoves"], ["Cặp", "0/6", "mmPairs"], ["Thời gian", "0s", "mmTime"]]) + '<div class="mem-grid" id="memGrid"></div>';
      timer = setInterval(() => { const el = document.getElementById("mmTime"); if (el && !ended) el.textContent = Math.floor((Date.now() - t0) / 1000) + "s"; }, 500);
      arcadeTimer = timer;
      drawGrid();
    }

    function drawGrid() {
      const grid = document.getElementById("memGrid");
      if (!grid) return;
      grid.innerHTML = cards.map((c, i) => '<button class="mem-card' + (c.open || c.done ? " open" : "") + (c.done ? " done" : "") + '" data-i="' + i + '" aria-label="' + (c.open || c.done ? esc(c.text) : "Thẻ úp") + '">' +
        (c.open || c.done ? esc(c.text) : '<span class="mem-back">Lật thẻ</span>') + "</button>").join("");
      grid.querySelectorAll(".mem-card").forEach((b) => { b.onclick = () => flip(Number(b.dataset.i)); });
    }

    function flip(i) {
      if (lock || ended) return;
      const c = cards[i];
      if (!c || c.open || c.done) return;
      c.open = true; open.push(i); drawGrid();
      if (open.length < 2) return;
      moves++;
      const mv = document.getElementById("mmMoves"); if (mv) mv.textContent = moves;
      const a = cards[open[0]], b = cards[open[1]];
      if (a.id === b.id) {
        a.done = b.done = true; a.open = b.open = false; open = []; matched++;
        const pr = document.getElementById("mmPairs"); if (pr) pr.textContent = matched + "/6";
        drawGrid();
        if (matched === 6) finish();
      } else {
        lock = true;
        setTimeout(() => { a.open = b.open = false; open = []; lock = false; drawGrid(); }, 800);
      }
    }

    function finish() {
      ended = true; clearInterval(timer); arcadeTimer = null;
      const secs = Math.round((Date.now() - t0) / 1000);
      const isNew = saveArcadeBest(g.id, moves, true);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      stage.innerHTML = '<div class="game-result"><span class="res-kicker">GHÉP XONG</span><b class="res-score">' + moves + '</b><span class="res-unit">lượt lật</span>' +
        "<p>Thời gian: " + secs + " giây." + (isNew ? " Kỷ lục ít lượt nhất!" : " Kỷ lục của máy: " + best + " lượt.") + "</p>" +
        '<div class="game-actions"><button class="btn primary" id="mmAgain">Chia ván mới</button><a class="btn ghost" href="#/tro-choi">Về kho trò chơi</a></div></div>';
      document.getElementById("mmAgain").onclick = start;
    }

    setup();
  }

  function gameSort(g) {
    const stage = document.getElementById("gameStage");
    const sets = ARCADE.sort.sets;
    let items = [], setIdx = 0, i = 0, score = 0;

    function setup() {
      stage.innerHTML = '<div class="game-setup"><h3>Chọn bộ thẻ</h3><div class="setup-row">' +
        sets.map((s, k) => '<button class="btn" data-set="' + k + '">' + esc(s.title) + "</button>").join("") + "</div></div>";
      stage.querySelectorAll("[data-set]").forEach((b) => { b.onclick = () => start(Number(b.dataset.set)); });
    }

    function start(idx) {
      setIdx = idx; items = shuffleArr(sets[idx].items); i = 0; score = 0; render();
    }

    function render() {
      if (i >= items.length) return finish();
      const set = sets[setIdx], it = items[i];
      stage.innerHTML = gameHud([["Thẻ", (i + 1) + "/" + items.length], ["Điểm", String(score), "soScore"]]) +
        '<div class="sort-card"><span class="sort-progress">' + esc(set.title) + "</span><p class=\"sort-text\">" + esc(it.text) + "</p><p class=\"pool-label\">" + esc(set.instruction) + "</p>" +
        '<div class="bucket-row">' + set.buckets.map((b) => '<button class="bucket-btn" data-b="' + b.id + '">' + esc(b.label) + "</button>").join("") + "</div>" +
        '<div id="sortFeed" class="sort-feed" hidden></div></div>';
      stage.querySelectorAll(".bucket-btn").forEach((b) => { b.onclick = () => pick(b.dataset.b); });
    }

    function pick(bid) {
      const it = items[i];
      const ok = it.bucket === bid;
      if (ok) score += 10;
      const sc = document.getElementById("soScore"); if (sc) sc.textContent = score;
      stage.querySelectorAll(".bucket-btn").forEach((b) => {
        b.disabled = true;
        if (b.dataset.b === it.bucket) b.classList.add("right");
        if (b.dataset.b === bid && !ok) b.classList.add("wrong");
      });
      const feed = document.getElementById("sortFeed");
      feed.hidden = false; feed.className = "sort-feed " + (ok ? "ok" : "bad");
      feed.innerHTML = "<b>" + (ok ? "Đúng." : "Chưa đúng.") + "</b> " + esc(it.note);
      setTimeout(() => { i++; render(); }, 1150);
    }

    function finish() {
      const total = items.length * 10;
      const isNew = saveArcadeBest(g.id, score, false);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      stage.innerHTML = '<div class="game-result"><span class="res-kicker">XONG BỘ THẺ</span><b class="res-score">' + score + '</b><span class="res-unit">/ ' + total + ' điểm</span>' +
        "<p>" + (isNew ? "Kỷ lục mới!" : "Kỷ lục của máy: " + best + " điểm.") + "</p>" +
        '<div class="game-actions"><button class="btn primary" id="soAgain">Chơi lại bộ này</button><button class="btn" id="soOther">Bộ khác</button><a class="btn ghost" href="#/tro-choi">Về kho trò chơi</a></div></div>';
      document.getElementById("soAgain").onclick = () => start(setIdx);
      document.getElementById("soOther").onclick = setup;
    }

    setup();
  }

  function gameOrder(g) {
    const stage = document.getElementById("gameStage");
    const sets = ARCADE.order.sets;
    let setIdx = 0, pool = [], chosen = [], set = null, checked = false;

    function setup() {
      stage.innerHTML = '<div class="game-setup"><h3>Chọn quy trình để xếp</h3><div class="setup-row">' +
        sets.map((s, k) => '<button class="btn" data-set="' + k + '">' + esc(s.title) + "</button>").join("") + "</div></div>";
      stage.querySelectorAll("[data-set]").forEach((b) => { b.onclick = () => start(Number(b.dataset.set)); });
    }

    function start(idx) {
      setIdx = idx; set = sets[idx]; chosen = []; checked = false;
      pool = shuffleArr(set.steps.map((s, k) => ({ s, idx: k })));
      stage.innerHTML = gameHud([["Đã xếp", "0/" + set.steps.length, "odCount"]]) + '<p class="order-title">' + esc(set.title) + '</p><div class="seq-line" id="seqLine"></div>' +
        '<p class="pool-label">Các bước còn lại — bấm để xếp vào vị trí trống:</p><div class="seq-pool" id="seqPool"></div>' +
        '<div class="game-actions"><button class="btn primary" id="odCheck" disabled>Kiểm tra</button><button class="btn ghost" id="odBack">Chọn bộ khác</button></div><div id="odResult"></div>';
      document.getElementById("odCheck").onclick = check;
      document.getElementById("odBack").onclick = setup;
      draw();
    }

    function draw() {
      if (!set) return;
      const line = document.getElementById("seqLine");
      line.innerHTML = set.steps.map((_, k) => {
        const it = chosen[k];
        return '<button class="seq-slot' + (it ? " filled" : "") + '" data-slot="' + k + '"><span class="seq-num">' + (k + 1) + "</span>" +
          (it ? esc(it.s) : '<span class="seq-empty">Chỗ trống — chọn bước bên dưới</span>') + "</button>";
      }).join("");
      line.querySelectorAll("[data-slot]").forEach((b) => {
        b.onclick = () => {
          if (checked) return;
          const k = Number(b.dataset.slot);
          if (k < chosen.length) { pool.push(chosen.splice(k, 1)[0]); draw(); }
        };
      });
      const poolEl = document.getElementById("seqPool");
      poolEl.innerHTML = pool.map((it, k) => '<button class="seq-item" data-p="' + k + '">' + esc(it.s) + "</button>").join("") || '<span class="muted">Đã xếp hết các bước.</span>';
      poolEl.querySelectorAll("[data-p]").forEach((b) => {
        b.onclick = () => { if (checked) return; chosen.push(pool.splice(Number(b.dataset.p), 1)[0]); draw(); };
      });
      document.getElementById("odCount").textContent = chosen.length + "/" + set.steps.length;
      document.getElementById("odCheck").disabled = checked || chosen.length !== set.steps.length;
    }

    function check() {
      checked = true;
      const okCount = chosen.filter((it, k) => it.idx === k).length;
      const score = okCount * 10;
      const line = document.getElementById("seqLine");
      line.querySelectorAll("[data-slot]").forEach((b, k) => {
        b.disabled = true;
        b.classList.add(chosen[k].idx === k ? "ok" : "bad");
      });
      const isNew = saveArcadeBest(g.id, score, false);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      document.getElementById("odCheck").disabled = true;
      document.getElementById("odResult").innerHTML = '<div class="game-result small"><span class="res-kicker">KẾT QUẢ</span><b class="res-score">' + score + '</b><span class="res-unit">điểm</span>' +
        "<p>Đúng " + okCount + "/" + set.steps.length + " vị trí." + (isNew ? " Kỷ lục mới!" : " Kỷ lục của máy: " + best + " điểm.") + "</p>" +
        '<p><b>Thứ tự đúng:</b> ' + set.steps.map((s, k) => (k + 1) + ". " + esc(s)).join(" · ") + "</p>" +
        '<div class="game-actions"><button class="btn primary" id="odAgain">Xếp lại</button></div></div>';
      document.getElementById("odAgain").onclick = () => start(setIdx);
    }

    setup();
  }

  function gameSpot(g) {
    const stage = document.getElementById("gameStage");
    const rounds = ARCADE.spot.rounds, flaws = ARCADE.spot.flaws;
    let i = 0, score = 0;

    function render() {
      if (i >= rounds.length) return finish();
      const r = rounds[i];
      stage.innerHTML = gameHud([["Câu", (i + 1) + "/" + rounds.length], ["Điểm", String(score), "stScore"]]) +
        '<div class="spot-card"><span class="sort-progress">Câu lệnh ' + (i + 1) + '</span><p class="spot-text">“' + esc(r.text) + '”</p><p class="spot-ask">Câu lệnh này mắc lỗi gì?</p>' +
        '<div class="spot-opts">' + flaws.map((f, k) => '<button class="opt-btn" data-f="' + k + '">' + esc(f) + "</button>").join("") + "</div></div><div id=\"spotFeed\"></div>";
      stage.querySelectorAll(".opt-btn").forEach((b) => { b.onclick = () => pick(Number(b.dataset.f)); });
    }

    function pick(k) {
      const r = rounds[i];
      const ok = k === r.correct;
      if (ok) score += 10;
      const sc = document.getElementById("stScore"); if (sc) sc.textContent = score;
      stage.querySelectorAll(".opt-btn").forEach((b) => {
        b.disabled = true;
        if (Number(b.dataset.f) === r.correct) b.classList.add("ok");
        if (Number(b.dataset.f) === k && !ok) b.classList.add("bad");
      });
      document.getElementById("spotFeed").innerHTML = '<div class="sort-feed ' + (ok ? "ok" : "bad") + '"><b>' + (ok ? "Đúng" : "Chưa đúng") + " — " + esc(flaws[r.correct]) + ".</b> " + esc(r.explain) + "</div>" +
        '<div class="game-actions"><button class="btn primary" id="stNext">' + (i + 1 < rounds.length ? "Câu tiếp" : "Xem kết quả") + "</button></div>";
      document.getElementById("stNext").onclick = () => { i++; render(); };
    }

    function finish() {
      const total = rounds.length * 10;
      const isNew = saveArcadeBest(g.id, score, false);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      stage.innerHTML = '<div class="game-result"><span class="res-kicker">XONG SÁU CÂU</span><b class="res-score">' + score + '</b><span class="res-unit">/ ' + total + ' điểm</span>' +
        "<p>" + (isNew ? "Kỷ lục mới!" : " Kỷ lục của máy: " + best + " điểm.") + "</p>" +
        '<div class="game-actions"><button class="btn primary" id="stAgain">Chơi lại</button><a class="btn ghost" href="#/tro-choi">Về kho trò chơi</a></div></div>';
      document.getElementById("stAgain").onclick = () => { i = 0; score = 0; render(); };
    }

    render();
  }

  function gameFill(g) {
    const stage = document.getElementById("gameStage");
    const rounds = ARCADE.fill.rounds;
    let i = 0, score = 0;

    function startRound() {
      if (i >= rounds.length) return finish();
      const r = rounds[i];
      const parts = r.sentence.split("___");
      let bank = shuffleArr(r.answers.concat(r.bank));
      const filled = new Array(r.answers.length).fill(null);
      stage.innerHTML = gameHud([["Câu", (i + 1) + "/" + rounds.length], ["Điểm", String(score), "flScore"]]) +
        '<div class="fill-card"><p class="fill-sentence" id="fillSent"></p><p class="pool-label">Kho từ — bấm để điền, bấm chỗ trống để trả lại:</p><div class="wordbank" id="wordbank"></div>' +
        '<div class="game-actions"><button class="btn primary" id="flCheck" disabled>Kiểm tra</button></div><div id="flFeed"></div></div>';

      document.getElementById("flCheck").onclick = () => {
        let right = 0;
        filled.forEach((w, k) => { if (w === r.answers[k]) right++; });
        score += right * 10;
        const sc = document.getElementById("flScore"); if (sc) sc.textContent = score;
        document.getElementById("flCheck").disabled = true;
        document.getElementById("flFeed").innerHTML = '<div class="sort-feed ' + (right === r.answers.length ? "ok" : "bad") + '"><b>Đúng ' + right + "/" + r.answers.length + " chỗ.</b> " +
          (right === r.answers.length ? "" : "Đáp án: " + esc(r.answers.join(" · ")) + ". ") + esc(r.explain) + "</div>" +
          '<div class="game-actions"><button class="btn primary" id="flNext">' + (i + 1 < rounds.length ? "Câu tiếp" : "Xem kết quả") + "</button></div>";
        document.getElementById("flNext").onclick = () => { i++; startRound(); };
      };
      draw();
      function draw() {
        const sent = document.getElementById("fillSent");
        sent.innerHTML = parts.map((p, k) => esc(p) + (k < parts.length - 1 ? '<button class="blank' + (filled[k] ? " filled" : "") + '" data-b="' + k + '">' + (filled[k] ? esc(filled[k]) : "chỗ trống") + "</button>" : "")).join("");
        sent.querySelectorAll("[data-b]").forEach((b) => {
          b.onclick = () => { const k = Number(b.dataset.b); if (filled[k]) { bank.push(filled[k]); filled[k] = null; draw(); } };
        });
        const wb = document.getElementById("wordbank");
        wb.innerHTML = bank.map((w, k) => '<button class="word" data-w="' + k + '">' + esc(w) + "</button>").join("") || '<span class="muted">Đã dùng hết từ.</span>';
        wb.querySelectorAll("[data-w]").forEach((b) => {
          b.onclick = () => { const k = filled.indexOf(null); if (k < 0) return; filled[k] = bank.splice(Number(b.dataset.w), 1)[0]; draw(); };
        });
        document.getElementById("flCheck").disabled = filled.some((x) => x == null);
      }
    }

    function finish() {
      const total = rounds.reduce((n, r) => n + r.answers.length, 0) * 10;
      const isNew = saveArcadeBest(g.id, score, false);
      refreshBestChip(g);
      const best = arcadeBest()[g.id];
      stage.innerHTML = '<div class="game-result"><span class="res-kicker">XONG NĂM CÂU</span><b class="res-score">' + score + '</b><span class="res-unit">/ ' + total + ' điểm</span>' +
        "<p>" + (isNew ? "Kỷ lục mới!" : " Kỷ lục của máy: " + best + " điểm.") + "</p>" +
        '<div class="game-actions"><button class="btn primary" id="flAgain">Chơi lại</button><a class="btn ghost" href="#/tro-choi">Về kho trò chơi</a></div></div>';
      document.getElementById("flAgain").onclick = () => { i = 0; score = 0; startRound(); };
    }

    startRound();
  }

  /* ---------- Vòng xoay may mắn ---------- */
  const WHEEL_COLORS = ["#0f4c5c", "#146b7a", "#c2670a", "#2e6b45", "#a9342a", "#5b7f8c", "#8a5a00", "#3c6e71"];

  function renderWheel() {
    const tracks = manifest.tracks.map((t) => ({ id: t.id, title: t.title }));
    main.innerHTML = '<div class="wrap">' + pageHead("Vòng xoay may mắn") +
      '<p class="sched-note">Chọn câu hỏi ôn tập lấy từ ' + collectQuizzes().reduce((n, g) => n + g.qs.length, 0) + ' câu tự kiểm tra của ' + allLessons.length + ' bài, hoặc chọn nhóm khi chia lớp. Bấm Quay để chiếu; mọi thứ chạy trên máy, không gửi dữ liệu lên mạng.</p>' +
      '<div class="wheel-layout"><div class="wheel-stage">' +
      '<div class="wheel-holder"><div class="wheel-pin"></div><canvas id="wheelCanvas" width="480" height="480" aria-label="Vòng xoay chọn câu hỏi hoặc nhóm"></canvas></div>' +
      '<div class="wheel-controls"><label>Chế độ<select id="wheelMode"><option value="q">Câu hỏi ôn tập</option><option value="g">Chọn nhóm / học sinh</option></select></label>' +
      '<label id="wheelBankWrap">Khóa<select id="wheelBank"><option value="all">Cả ' + tracks.length + ' khóa</option>' + tracks.map((t) => '<option value="' + t.id + '">' + esc(t.title) + "</option>").join("") + "</select></label>" +
      '<button class="btn primary" id="wheelSpin">Quay</button><button class="btn" id="wheelNew">Vòng mới</button></div>' +
      '<div class="wheel-names" id="wheelNamesWrap" hidden><label for="wheelNames">Mỗi dòng một tên, tối đa 8 — nên dùng tên nhóm thay vì họ tên học sinh</label><textarea id="wheelNames" rows="4">Nhóm 1\nNhóm 2\nNhóm 3\nNhóm 4</textarea></div>' +
      '</div><aside class="wheel-result" id="wheelResult"><p class="wheel-empty">Bấm <b>Quay</b> để bắt đầu. Kết quả hiện ở đây kèm đáp án để chiếu.</p></aside></div>' +
      '<div class="print-actions"><a class="btn" href="#/tro-choi">Về kho trò chơi</a><a class="btn ghost" href="#/dap-an">Đáp án đầy đủ ' + collectQuizzes().reduce((n, g) => n + g.qs.length, 0) + ' câu</a></div></div>';

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const result = document.getElementById("wheelResult");
    const modeSel = document.getElementById("wheelMode");
    const bankSel = document.getElementById("wheelBank");
    const namesWrap = document.getElementById("wheelNamesWrap");
    const namesBox = document.getElementById("wheelNames");
    let entries = [];
    let rotation = 0;
    let spinTimer = null;

    function buildEntries() {
      if (modeSel.value === "g") {
        const names = namesBox.value.split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 8);
        entries = (names.length >= 2 ? names : ["Nhóm 1", "Nhóm 2"]).map((n) => ({ label: n, group: true }));
        return;
      }
      const pool = [];
      collectQuizzes().forEach((g) => {
        if (bankSel.value !== "all" && g.track.id !== bankSel.value) return;
        g.qs.forEach((q) => pool.push({ q, lesson: g.lesson, track: g.track }));
      });
      for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
      entries = pool.slice(0, 8).map((x, i) => ({ label: "Câu " + (i + 1), q: x.q, lesson: x.lesson, track: x.track }));
    }

    function draw() {
      const n = entries.length;
      const c = 240, r = 222, seg = (Math.PI * 2) / n;
      ctx.clearRect(0, 0, 480, 480);
      entries.forEach((e, i) => {
        const start = -Math.PI / 2 + i * seg;
        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.arc(c, c, r, start, start + seg);
        ctx.closePath();
        ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(start + seg / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = "700 20px 'Segoe UI', system-ui, sans-serif";
        const label = e.label.length > 14 ? e.label.slice(0, 13) + "…" : e.label;
        ctx.fillText(label, r - 20, 0);
        ctx.restore();
      });
      ctx.beginPath();
      ctx.arc(c, c, 34, 0, Math.PI * 2);
      ctx.fillStyle = "#fbf8f1";
      ctx.fill();
      ctx.strokeStyle = "#e2d8c4";
      ctx.stroke();
      ctx.fillStyle = "#0f4c5c";
      ctx.font = "800 15px 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("QUAY", c, c);
      canvas.style.transform = "rotate(" + rotation + "deg)";
    }

    function showResult(e) {
      if (!document.getElementById("wheelCanvas")) return;
      if (e.group) {
        result.innerHTML = '<h3>Nhóm được chọn</h3><p class="wheel-name">' + esc(e.label) + "</p><p class=\"wheel-empty\">Mời nhóm trả lời câu hỏi trên màn hình hoặc câu hỏi giáo viên đang chuẩn bị.</p>";
        return;
      }
      const q = e.q;
      result.innerHTML = "<h3>Câu hỏi · " + esc(e.lesson.title) + '</h3><p class="wq">' + inline(q.question) + '</p><ol class="wq-opts" type="A">' +
        q.opts.map((o) => "<li>" + inline(o) + "</li>").join("") + "</ol>" +
        '<button class="btn small primary" id="wheelAns">Hiện đáp án</button><div id="wheelAnsBox"></div>';
      document.getElementById("wheelAns").onclick = () => {
        document.getElementById("wheelAnsBox").innerHTML = '<p class="wq-ans">Đáp án: ' + "ABC"[q.correct] + ". " + inline(q.opts[q.correct]) + "</p>" +
          (q.explain ? '<p class="wq-exp">' + inline(q.explain) + "</p>" : "") +
          '<p class="wq-exp">Nguồn: <a href="#/bai/' + e.lesson.id + '">' + esc(e.track.short) + " · " + esc(e.lesson.title) + "</a></p>";
      };
    }

    function spin() {
      if (!entries.length) buildEntries();
      if (!entries.length) return;
      if (spinTimer) clearTimeout(spinTimer);
      const n = entries.length;
      const idx = Math.floor(Math.random() * n);
      const segDeg = 360 / n;
      const targetMod = (360 - (idx + 0.5) * segDeg) % 360;
      const curMod = ((rotation % 360) + 360) % 360;
      const delta = (targetMod - curMod + 360) % 360;
      rotation += 360 * 5 + delta;
      canvas.style.transform = "rotate(" + rotation + "deg)";
      result.innerHTML = '<p class="wheel-empty">Đang quay…</p>';
      spinTimer = setTimeout(() => { spinTimer = null; showResult(entries[idx]); }, 4200);
    }

    function rebuild() {
      if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }
      buildEntries();
      rotation = 0;
      canvas.style.transition = "none";
      draw();
      void canvas.offsetWidth;
      canvas.style.transition = "";
      result.innerHTML = '<p class="wheel-empty">Bấm <b>Quay</b> để bắt đầu.</p>';
    }

    modeSel.onchange = () => { namesWrap.hidden = modeSel.value !== "g"; rebuild(); };
    bankSel.onchange = rebuild;
    namesBox.oninput = () => { if (modeSel.value === "g") rebuild(); };
    document.getElementById("wheelSpin").onclick = spin;
    document.getElementById("wheelNew").onclick = rebuild;
    rebuild();
    setActive("#/tro-choi/vong-xoay");
    document.title = "Vòng xoay may mắn · NAEM 2026";
    window.scrollTo(0, 0);
  }

  /* ---------- Khởi động ---------- */
  function route() {
    const hash = location.hash || "#/";
    closeNav();
    stopArcadeTimer();
    if (deckKeyHandler) { document.removeEventListener("keydown", deckKeyHandler); deckKeyHandler = null; }
    document.body.classList.remove("deck-mode");
    if (hash.startsWith("#/bai/")) renderLesson(hash.slice(6));
    else if (hash.startsWith("#/cong-cu")) renderTools(hash.split("/")[2] || "");
    else if (hash.startsWith("#/khoa/")) renderCourse(hash.slice(7));
    else if (hash === "#/kho-hoc-lieu") renderLibrary();
    else if (hash.startsWith("#/luyen-tap")) renderPractice(hash.split("/")[2] || "");
    else if (hash === "#/in") renderPrintKit();
    else if (hash === "#/lich") renderSchedule();
    else if (hash === "#/chieu") renderDeckList();
    else if (hash.startsWith("#/chieu/")) renderDeck(hash.slice(8));
    else if (hash === "#/dap-an") renderAnswers();
    else if (hash === "#/danh-gia") renderTest();
    else if (hash === "#/mau-bieu") renderForms();
    else if (hash === "#/prompt-mau") renderPrompts();
    else if (hash === "#/tro-choi/vong-xoay") renderWheel();
    else if (hash.startsWith("#/tro-choi/choi/")) renderArcade(hash.slice(16));
    else if (hash === "#/tro-choi") renderGames();
    else if (hash === "#/nguon") renderSource();
    else renderHome();
    if (!hash.startsWith("#/bai/") && !hash.startsWith("#/cong-cu") && !hash.startsWith("#/chieu/")) window.scrollTo(0, 0);
  }

  buildSidebar();
  updateProgressUI();
  if (read(TEXT_KEY, false)) document.body.classList.add("large-text");

  document.getElementById("menuBtn").addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", String(open));
    scrim.hidden = !open;
  });
  scrim.addEventListener("click", closeNav);
  document.getElementById("printBtn").addEventListener("click", () => window.print());
  document.getElementById("fontBtn").addEventListener("click", () => {
    const on = document.body.classList.toggle("large-text");
    write(TEXT_KEY, on);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
