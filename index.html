<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sổ tay thực hành chuyển đổi số, năng lực số và sư phạm số thích ứng cho giáo viên Nghệ An, biên soạn từ tài liệu bồi dưỡng NAEM 2026.">
<title>Sổ tay số cho giáo viên Nghệ An · NAEM 2026</title>
<style>:root {
  --ink: #1c2426;
  --ink-soft: #45585c;
  --muted: #6a7c80;
  --paper: #fbf8f1;
  --paper-2: #f3ecdd;
  --card: #ffffff;
  --line: #e2d8c4;
  --teal: #0f4c5c;
  --teal-2: #146b7a;
  --teal-soft: #e3f0f1;
  --amber: #c2670a;
  --amber-soft: #fdf1df;
  --red: #a9342a;
  --red-soft: #fbe8e4;
  --green: #2e6b45;
  --green-soft: #e7f2e9;
  --sidebar: #10333a;
  --sidebar-2: #0b272d;
  --sidebar-ink: #e9f1ef;
  --sidebar-dim: #a9c1c2;
  --radius: 14px;
  --shadow: 0 12px 32px rgba(24, 38, 40, .08);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --read: 17.5px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font); font-size: var(--read); line-height: 1.72;
  color: var(--ink); background: var(--paper);
  -webkit-text-size-adjust: 100%;
}
body.large-text { --read: 20px; }
a { color: var(--teal-2); text-underline-offset: 3px; }
a:hover { color: var(--teal); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: #fff; padding: 10px 16px; border-radius: 8px; transition: top .2s; }
.skip:focus { top: 12px; }

/* ---------- Thanh trên ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: 66px; display: flex; align-items: center; gap: 14px;
  padding: 0 22px; background: rgba(251, 248, 241, .94); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); }
.brand-mark {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--teal), #1d7a86); color: #fff;
  font-weight: 800; letter-spacing: .5px; font-size: 15px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 16px; }
.brand-text small { color: var(--muted); font-size: 12.5px; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.top-link {
  padding: 9px 12px; border-radius: 9px; text-decoration: none; color: var(--ink-soft);
  font-size: 14.5px; font-weight: 600; background: none; border: 0;
}
.top-link:hover { background: var(--paper-2); color: var(--teal); }
.top-link.ghost { border: 1px solid var(--line); background: #fff; }
.icon-btn { background: none; border: 0; padding: 8px; border-radius: 8px; }
.menu-btn { display: none; width: 44px; height: 44px; flex-direction: column; justify-content: center; gap: 5px; align-items: center; }
.menu-btn span { display: block; width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }

/* ---------- Khung ---------- */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 66px); }
.sidebar {
  position: sticky; top: 66px; height: calc(100vh - 66px); overflow-y: auto;
  background: var(--sidebar); color: var(--sidebar-ink); padding: 20px 16px 26px;
  display: flex; flex-direction: column; gap: 14px;
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: #2b5259; border-radius: 4px; }
.side-head { display: flex; align-items: center; gap: 12px; padding: 4px 6px 0; }
.progress-wrap { position: relative; width: 48px; height: 48px; flex: none; }
.progress-wrap svg { width: 48px; height: 48px; transform: rotate(-90deg); }
.ring-bg, .ring-fill { fill: none; stroke-width: 5; }
.ring-bg { stroke: #24505a; }
.ring-fill { stroke: #f0b45c; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset .4s; }
.progress-wrap span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.side-head-text { display: flex; flex-direction: column; line-height: 1.35; }
.side-head-text strong { font-size: 13.5px; }
.side-head-text span { font-size: 11.5px; color: var(--sidebar-dim); }
.side-search input {
  width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #2c555d;
  background: #0c2a30; color: #fff; font-size: 14px;
}
.side-search input::placeholder { color: #88a7aa; }
.side-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-group { margin-top: 8px; }
.nav-group-head {
  width: 100%; display: flex; align-items: center; gap: 8px; text-align: left;
  background: none; border: 0; color: var(--sidebar-dim); font-size: 11.5px; letter-spacing: .9px;
  text-transform: uppercase; font-weight: 700; padding: 8px 8px 6px;
}
.nav-group-head .chev { margin-left: auto; transition: transform .2s; font-size: 12px; }
.nav-group.closed .chev { transform: rotate(-90deg); }
.nav-group.closed .nav-list { display: none; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-item a {
  display: flex; gap: 9px; align-items: flex-start; padding: 9px 10px; border-radius: 9px;
  color: #dce9e7; text-decoration: none; font-size: 14px; line-height: 1.4;
}
.nav-item a:hover { background: #17424a; }
.nav-item.active a { background: #1e5560; color: #fff; box-shadow: inset 3px 0 #f0b45c; }
.nav-item .tick {
  flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%;
  border: 1.5px solid #4d767c; display: grid; place-items: center; font-size: 11px; color: transparent;
}
.nav-item.done .tick { background: #f0b45c; border-color: #f0b45c; color: #10333a; }
.nav-item .nav-label { flex: 1; }
.nav-item .nav-min { color: #8fb0b2; font-size: 11px; white-space: nowrap; margin-top: 2px; }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #26505a; font-size: 12.5px; color: var(--sidebar-dim); }
.side-foot a { color: #f0c987; font-weight: 600; }
.side-foot p { margin: 8px 0 0; line-height: 1.55; }

/* ---------- Nội dung ---------- */
main { min-width: 0; padding: 38px clamp(20px, 5vw, 64px) 90px; }
.wrap { max-width: 900px; margin: 0 auto; }
.wrap.wide { max-width: 1080px; }

/* Trang chủ */
.hero {
  background: radial-gradient(120% 160% at 100% 0%, #14606d 0%, #0f3f4a 55%, #0c333c 100%);
  color: #fff; border-radius: 20px; padding: clamp(26px, 5vw, 46px); position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -80px; bottom: -110px; width: 320px; height: 320px;
  border: 40px solid rgba(240, 180, 92, .16); border-radius: 50%;
}
.hero .eyebrow { text-transform: uppercase; letter-spacing: 1.6px; font-size: 12px; color: #f0c987; font-weight: 700; }
.hero h1 { font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; margin: 10px 0 14px; letter-spacing: -.5px; }
.hero p { max-width: 680px; color: #d8e8e7; font-size: 17px; margin: 0 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 650; font-size: 15px; text-decoration: none; background: #fff; color: var(--teal);
}
.btn.primary { background: #f0b45c; color: #2b1b05; }
.btn.primary:hover { background: #f6c67b; }
.btn.outline-light { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn.outline-light:hover { background: rgba(255,255,255,.1); }
.btn.small { min-height: 38px; padding: 7px 13px; font-size: 14px; }
.btn.ghost { background: #fff; border-color: var(--line); color: var(--ink-soft); }
.btn.ghost:hover { border-color: var(--teal-2); color: var(--teal); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.home-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 30px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat b { display: block; font-size: 24px; color: var(--teal); line-height: 1.2; }
.stat span { font-size: 13px; color: var(--muted); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 34px 0 14px; }
.section-head h2 { margin: 0; font-size: 24px; letter-spacing: -.2px; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
.section-head a { font-size: 14.5px; font-weight: 600; white-space: nowrap; }

.track-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.track-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; text-decoration: none; color: inherit; display: flex; flex-direction: column;
  gap: 8px; transition: transform .15s, box-shadow .15s, border-color .15s;
}
.track-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #cbbfa8; }
.track-card .kicker { font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; color: var(--amber); }
.track-card h3 { margin: 0; font-size: 20px; }
.track-card p { margin: 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.6; }
.track-card .meta { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.mini-bar { width: 110px; height: 6px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--amber); }

.tool-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tool-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px;
}
.tool-card:hover { border-color: var(--teal-2); }
.tool-card b { font-size: 15.5px; }
.tool-card span { color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.tool-card .num { font-size: 12px; font-weight: 800; color: var(--amber); letter-spacing: 1px; }

.start-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; counter-reset: step; }
.step-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 16px 54px; position: relative; }
.step-card::before {
  counter-increment: step; content: counter(step); position: absolute; left: 16px; top: 16px;
  width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700;
}
.step-card b { display: block; font-size: 15px; margin-bottom: 4px; }
.step-card span { font-size: 13.5px; color: var(--muted); line-height: 1.55; }

.notice {
  margin: 26px 0; padding: 14px 18px; border-radius: 10px; background: var(--amber-soft);
  border: 1px solid #efd3a3; font-size: 14.5px; color: #5b3c10;
}
.notice b { color: #4a3009; }

/* Bài học */
.lesson-head { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 24px; }
.breadcrumb { font-size: 12.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.breadcrumb a { color: var(--teal-2); text-decoration: none; }
.lesson-head h1 { font-size: clamp(27px, 3.6vw, 39px); line-height: 1.18; margin: 0 0 12px; letter-spacing: -.4px; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--teal-soft); color: #0b4a55; font-size: 12.5px; font-weight: 650;
}
.chip.amber { background: var(--amber-soft); color: #7a4205; }
.chip.gray { background: var(--paper-2); color: var(--ink-soft); }

.prose { font-size: var(--read); }
.prose > *:first-child { margin-top: 0; }
.prose h2 { font-size: 1.45em; line-height: 1.3; margin: 2em 0 .6em; padding-top: .2em; color: #123a42; letter-spacing: -.2px; }
.prose h3 { font-size: 1.16em; margin: 1.7em 0 .5em; color: #1a4b53; }
.prose h4 { font-size: 1.02em; margin: 1.3em 0 .4em; color: var(--ink); }
.prose p { margin: .7em 0; }
.prose ul, .prose ol { padding-left: 1.35em; margin: .7em 0; }
.prose li { margin: .34em 0; }
.prose li::marker { color: var(--amber); font-weight: 700; }
.prose strong { color: #102f36; }
.prose blockquote {
  margin: 1.2em 0; padding: 12px 18px; border-left: 4px solid var(--teal-2);
  background: #fff; border-radius: 0 10px 10px 0; color: var(--ink-soft);
}
.prose blockquote p { margin: .3em 0; }
.prose code {
  background: #efe8da; padding: .1em .38em; border-radius: 5px; font-size: .88em;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #7c3a00;
}
.prose pre {
  background: #122f35; color: #eaf2ef; padding: 16px 18px; border-radius: 10px;
  overflow-x: auto; font-size: 14px; line-height: 1.55;
}
.prose pre code { background: none; color: inherit; padding: 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
.table-wrap { overflow-x: auto; margin: 1.1em 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 560px; }
.prose th, .prose td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { background: #f6efe2; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #4b5c5e; }
.prose tr:last-child td { border-bottom: 0; }
.prose a { font-weight: 500; }

.callout {
  margin: 1.4em 0; padding: 16px 18px 16px 20px; border-radius: 10px; background: #fff;
  border: 1px solid var(--line); border-left: 5px solid var(--teal-2); position: relative;
}
.callout .callout-title {
  display: block; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase;
  font-weight: 800; color: var(--teal-2); margin-bottom: 6px;
}
.callout p:first-of-type { margin-top: 0; }
.callout p:last-child { margin-bottom: 0; }
.callout.warn { border-left-color: var(--red); background: #fffaf8; }
.callout.warn .callout-title { color: var(--red); }
.callout.tip { border-left-color: var(--amber); background: #fffdf8; }
.callout.tip .callout-title { color: var(--amber); }
.callout.case { border-left-color: #6b4fa0; background: #fbf9ff; }
.callout.case .callout-title { color: #5a3e91; }
.callout.do { border-left-color: var(--green); background: #f9fdf9; }
.callout.do .callout-title { color: var(--green); }

.quiz { margin: 1.6em 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.quiz-head b { font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber); }
.quiz-head span { font-size: 13px; color: var(--muted); }
.q { padding: 12px 0; border-top: 1px dashed var(--line); }
.q:first-of-type { border-top: 0; }
.q-title { font-weight: 650; margin-bottom: 8px; }
.q-opts { display: grid; gap: 7px; }
.q-opt {
  text-align: left; background: #fbf8f1; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-size: 14.5px; line-height: 1.5;
}
.q-opt:hover:not(:disabled) { border-color: var(--teal-2); background: var(--teal-soft); }
.q-opt.correct { background: var(--green-soft); border-color: #7fb08c; }
.q-opt.wrong { background: var(--red-soft); border-color: #d9a49d; }
.q-explain { display: none; margin-top: 8px; padding: 9px 12px; background: #f7f4ec; border-radius: 8px; font-size: 14px; color: var(--ink-soft); }
.q.answered .q-explain { display: block; }
.q.answered .q-opt { cursor: default; }

.checklist { list-style: none; padding: 0; margin: 1em 0; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; }
.checklist li:hover { background: #fff; }
.checklist input { width: 19px; height: 19px; margin-top: 3px; accent-color: var(--teal-2); flex: none; }
.checklist label { cursor: pointer; }

.lesson-foot { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
.done-row {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px;
}
.done-row label { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; font-size: 15px; }
.done-row input { width: 20px; height: 20px; accent-color: var(--green); }
.prevnext { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pn {
  display: flex; flex-direction: column; gap: 2px; padding: 13px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: #fff; text-decoration: none; color: inherit;
}
.pn span { font-size: 12px; color: var(--muted); }
.pn b { font-size: 14.5px; font-weight: 600; }
.pn.next { text-align: right; }
.pn:hover { border-color: var(--teal-2); }

/* Trang công cụ */
.tool-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 22px; }
.tool-tab {
  padding: 9px 13px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
}
.tool-tab.active { background: var(--teal); border-color: var(--teal); color: #fff; }
.tool-panel { display: none; }
.tool-panel.active { display: block; }
.tool-intro { background: var(--teal-soft); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; font-size: 15px; color: #17464e; }
.tool-intro p { margin: 0; }
.tool-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: clamp(16px, 3vw, 26px); }
.tool-box h2 { margin: 0 0 4px; font-size: 24px; }
.tool-box .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13.5px; font-weight: 650; color: var(--ink-soft); }
.field .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid #cfc4ae; border-radius: 9px; padding: 10px 12px;
  background: #fffdf9; font-size: 15px;
}
.field textarea { resize: vertical; min-height: 86px; line-height: 1.55; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--teal-2); outline: 2px solid #bfe0e3; }
.tool-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.tool-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.score-bank { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.score-bank b { font-size: 28px; color: var(--teal); }
.badge-big { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--amber); color: #2b1b05; font-weight: 800; font-size: 14px; }
.domain-row { margin: 10px 0; }
.domain-row .dr-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; margin-bottom: 4px; }
.domain-row .bar { height: 8px; background: var(--paper-2); border-radius: 5px; overflow: hidden; }
.domain-row .bar i { display: block; height: 100%; background: var(--teal-2); }
.q-item { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.q-item:last-child { border-bottom: 0; }
.q-item .qt { font-size: 15px; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid var(--line);
  border-radius: 8px; font-size: 13.5px; cursor: pointer; background: #fbf8f1;
}
.seg label:has(input:checked) { background: var(--teal-soft); border-color: var(--teal-2); font-weight: 650; color: #0d4952; }
.seg input { accent-color: var(--teal-2); }

.scenario { background: #fdf7ec; border: 1px solid #eed8b6; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.scenario .tag { font-size: 11.5px; letter-spacing: 1.2px; font-weight: 800; color: var(--amber); text-transform: uppercase; }
.scenario p { margin: 6px 0; }
.chat { background: #fff; border-radius: 10px; padding: 10px 14px; border: 1px solid #eadfca; margin: 8px 0; font-size: 14.5px; }
.chat b { color: var(--teal); }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; margin: 9px 0; background: #fff; }
.step.ok { border-color: #9bc4a5; background: #f8fdf9; }
.step.no { border-color: #dbb0aa; background: #fff9f8; }
.step h4 { margin: 0 0 6px; font-size: 15px; }
.opt-list { display: grid; gap: 7px; margin-top: 8px; }
.opt-btn {
  text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: #fbf8f1; font-size: 14px;
}
.opt-btn:hover { border-color: var(--teal-2); }
.opt-btn.correct { background: var(--green-soft); border-color: #8ab696; }
.opt-btn.wrong { background: var(--red-soft); border-color: #d6a09a; }
.opt-btn:disabled { cursor: default; }
.feedback { margin-top: 8px; font-size: 14px; padding: 9px 12px; border-radius: 8px; background: #f5f1e8; color: var(--ink-soft); display: none; }
.feedback.show { display: block; }

.order-list { display: grid; gap: 8px; margin: 12px 0; }
.order-slot {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed #cdbfa6;
  border-radius: 9px; background: #fffdf8; min-height: 48px; font-size: 14.5px;
}
.order-slot .idx { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pool button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 11px; font-size: 13.5px; }
.pool button:disabled { opacity: .35; }
.mark { font-weight: 800; }
.mark.ok { color: var(--green); }
.mark.no { color: var(--red); }

.output {
  margin-top: 18px; background: #fcfaf5; border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  white-space: pre-wrap; font-size: 14px; line-height: 1.6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.output.rich { font-family: var(--font); white-space: normal; font-size: 14.5px; }
.output h3 { margin: 0 0 6px; font-size: 18px; }
.output h4 { margin: 14px 0 4px; font-size: 15px; }
.output table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.output th, .output td { border: 1px solid #ddd2bd; padding: 7px 9px; text-align: left; vertical-align: top; }
.output ul { margin: .3em 0; padding-left: 1.2em; }
.hidden { display: none !important; }

.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0; }
.checks label { display: flex; gap: 7px; align-items: flex-start; font-size: 13.5px; padding: 3px 0; }
.checks input { margin-top: 3px; accent-color: var(--teal-2); }
.rule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rule { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13.5px; }
.rule b { display: block; color: var(--teal); margin-bottom: 4px; }

/* Trang in */
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.sheet {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  break-inside: avoid;
}
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet .sheet-kicker { font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--amber); font-weight: 800; }
.sheet p, .sheet li { font-size: 13px; line-height: 1.55; }
.sheet ol, .sheet ul { padding-left: 18px; margin: 8px 0; }
.sheet .line { border-bottom: 1px solid #c9bda8; height: 22px; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sheet th, .sheet td { border: 1px solid #c9bda8; padding: 6px; text-align: left; vertical-align: top; }
.sheet .big-rule { font-size: 15px; font-weight: 800; color: var(--teal); }
.print-tip { background: var(--amber-soft); border: 1px solid #efd3a3; padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 18px; }

.footer-note { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.6; }

.scrim { position: fixed; inset: 0; background: rgba(8, 28, 32, .45); z-index: 35; }

<script type="text/plain" class="lesson-src" data-id="c1-can-cu"># Căn cứ pháp lý trong 10 phút

:::note Mục tiêu
Sau bài này, bạn chỉ ra được **mỗi văn bản buộc bạn làm một việc gì** trong kế hoạch dạy học, hồ sơ tổ chuyên môn và cách ứng xử với học sinh. Không học thuộc toàn văn.
:::

## Vì sao giáo viên cần biết?

Ba ngày tập huấn không yêu cầu bạn đọc hết hàng trăm trang. Nhưng khi tổ trưởng hỏi “mã này lấy ở đâu?”, khi phụ huynh hỏi “vì sao con tôi phải học an toàn mạng?”, bạn cần trả lời được bằng **một câu có căn cứ**. Sáu văn bản dưới đây là đủ cho phần lớn tình huống ở trường.

## Sáu văn bản, sáu việc phải làm

| Văn bản | Quy định điều gì | Việc cụ thể của bạn |
|---|---|---|
| Thông tư 18/2026/TT-BGDĐT (hiệu lực 12/5/2026) | Khung năng lực số cho giáo viên, cán bộ quản lý: 6 miền, 20 năng lực thành phần; 3 mức Cơ bản – Thành thạo – Nâng cao | Tự đánh giá theo 6 miền; chọn 1–2 năng lực cần bồi dưỡng trong năm |
| Thông tư 02/2025/TT-BGDĐT và Công văn 3456/BGDĐT-GDPT | Khung năng lực số cho người học: 6 miền, 24 năng lực; THCS dùng TC1 (lớp 6–7) và TC2 (lớp 8–9); THPT dùng NC1 (Bậc 5) | Ghi mã TC1/TC2/NC1 vào kế hoạch bài dạy đúng chỗ, không ghi hình thức |
| Quyết định 2422/QĐ-BGDĐT | Khung nội dung giáo dục AI: 4 mạch NLa – NLb – NLc – NLd | Chọn một mạch phù hợp với bài, không biến tiết Văn thành tiết lập trình |
| Công văn 6206/BGDĐT-GDPT | Giáo dục an toàn mạng theo 8 nhóm chủ đề ATM1–ATM8 | Gắn ít nhất một chủ đề ATM vào hoạt động học có thật |

:::tip Cách nhớ
**18 – 02 – 2422 – 6206 – 4725 – 5512.** Sáu con số ứng với sáu việc: năng lực giáo viên, năng lực học sinh, giáo dục AI, an toàn mạng, chỉ số trường học, khung giáo án.
:::

## Ba mức và ba nhóm

Thông tư 18/2026 chia năng lực giáo viên thành ba mức:

- **Cơ bản:** sử dụng được công cụ ở mức cần thiết.
- **Thành thạo:** thiết kế được hoạt động sư phạm có tích hợp công nghệ.
- **Nâng cao:** sáng tạo, đổi mới và dẫn dắt đồng nghiệp.

Chương trình Nghệ An dùng cách gọi **Nhóm A – Cơ bản, Nhóm B – Thành thạo, Nhóm C – Nâng cao** để xếp lộ trình bồi dưỡng. Đây là cách phân nhóm để hỗ trợ nhau, không phải nhãn đánh giá con người. Trong [Phòng thực hành](#/cong-cu/self) có 12 câu giúp bạn tự xếp nhóm tham khảo.

## Hai phương án song hành

Nghệ An có trường ở đồng bằng, ven biển và miền núi. Vì vậy mọi hoạt động trong tài liệu đều phải trả lời được câu hỏi: **nếu lớp không có thiết bị hoặc không có mạng thì làm thế nào?**

| Có thiết bị | Không có thiết bị |
|---|---|
| Học sinh tra cứu trên điện thoại của giáo viên theo nhóm | Phiếu in sẵn nội dung và câu hỏi |
| Bài kiểm tra ngắn trên Quizizz hoặc Google Forms | Thẻ giấy, giơ tay, bảng con |
| Video, mô phỏng trên máy chiếu | Tranh in, vật thật, kịch bản đóng vai |
| Kho học liệu trên Drive của tổ | Kẹp hồ sơ in, mã QR dán ở lớp do trường phát hành |

:::warn Đừng bắt học sinh đăng ký tài khoản
Không yêu cầu học sinh đăng ký tài khoản cá nhân hoặc nhập thông tin định danh lên nền tảng công cộng để “cho đủ công nghệ”. Nếu nền tảng bắt buộc, giáo viên dùng tài khoản lớp do trường cấp và ẩn danh dữ liệu.
:::

## Việc làm ngay sau bài này

:::checklist
- [ ] Lưu sáu số hiệu văn bản vào ghi chú cá nhân.
- [ ] Mở kế hoạch bài dạy gần nhất, khoanh chỗ có thể ghi mã năng lực và chủ đề ATM.
- [ ] Viết một phương án không thiết bị cho tiết sắp dạy.
- [ ] Hỏi tổ trưởng đầu mối an toàn số của trường là ai, số điện thoại nào.
:::

<script type="text/plain" class="lesson-src" data-id="c2-ban-do"># Bản đồ năng lực và cách ghi mã

:::note Mục tiêu
Đọc đúng một mã như `1.2.TC2a` hoặc `ATM1`; biết mã đó thuộc miền nào, dùng cho hoạt động nào; tránh ghi mã cho đủ chỗ nhưng không gắn với việc học.
:::

## Bốn tấm bản đồ chồng lên nhau

Một kế hoạch bài dạy tốt có thể chạm vào bốn hệ thống khác nhau. Đừng nhầm chúng:

1. **Năng lực số của giáo viên** – Thông tư 18/2026: 6 miền, 20 năng lực thành phần, 3 mức.
2. **Năng lực số của học sinh** – Thông tư 02/2025: 6 miền, 24 năng lực; THCS dùng TC1/TC2, THPT dùng NC1.
3. **Giáo dục AI** – Quyết định 2422: 4 mạch NLa, NLb, NLc, NLd.
4. **An toàn mạng** – Công văn 6206: 8 chủ đề ATM1–ATM8.

Giáo viên thường chỉ cần ghi hai hệ thống sau vào kế hoạch bài dạy: **mã năng lực của học sinh** và **chủ đề ATM**. Hai hệ thống đầu dùng để tự đánh giá và thiết kế hoạt động.

## Sáu miền năng lực của giáo viên

| Miền | Tên miền | Việc quen thuộc | Mức cơ bản có thể bắt đầu bằng |
|---|---|---|---|
| 1 | Tổ chức dạy học trong môi trường số | Lớp học kết hợp, học liệu số, quản lý hoạt động | Tạo một lớp trên Google Classroom hoặc Teams, đăng một học liệu |
| 2 | Kiểm tra, đánh giá | Kiểm tra thường xuyên, phản hồi, portfolio | Tạo bài kiểm tra 5 câu trên Google Forms hoặc Quizizz |
| 3 | Trao quyền cho người học | Học sinh tự tạo sản phẩm, tự chọn cách thể hiện | Giao một sản phẩm số thay cho bài chép |
| 4 | Kỹ năng công nghệ số | Chọn, dùng, bảo vệ dữ liệu, xử lý sự cố | Biết ẩn danh dữ liệu trước khi đưa vào công cụ |
| 5 | Phát triển chuyên môn | Sinh hoạt tổ, chia sẻ học liệu, học liệu mở | Chia sẻ một học liệu có ghi nguồn cho đồng nghiệp |
| 6 | Trí tuệ nhân tạo | Dùng AI có trách nhiệm, kiểm chứng đầu ra | Dùng AI gợi ý ý tưởng rồi tự sửa |

Mỗi miền có các năng lực đánh số, ví dụ miền 1 có 1.1 đến 1.4; miền 6 có 6.1 đến 6.4. Tổng cộng 20 năng lực thành phần.

:::tip Cách tự đánh giá nhanh
Chọn **một việc** trong mỗi miền mà bạn đã làm được mà không cần ai giúp. Đó là mức Cơ bản. Việc bạn làm được nhưng còn lúng túng khi học sinh hỏi lại là mức Thành thạo đang hình thành. Việc bạn có thể hướng dẫn đồng nghiệp làm là mức Nâng cao.
:::

## Mã năng lực của học sinh: TC1, TC2, NC1

Cách đọc một mã:

**`1.2.TC2a`**

- `1` – miền thứ nhất (khai thác dữ liệu và thông tin).
- `2` – năng lực thành phần thứ hai trong miền.
- `TC2` – trình độ Trung cấp 2, dành cho lớp 8–9.
- `a` – chỉ báo cụ thể trong nhóm năng lực đó.

| Cấp | Lớp | Ký hiệu | Cách hiểu đơn giản |
|---|---|---|---|
| THCS | 6–7 | TC1 – Bậc 3 | Học sinh làm được việc quen thuộc với sự hướng dẫn |
| THCS | 8–9 | TC2 – Bậc 4 | Học sinh tự tổ chức việc học, biết phản biện ở mức phù hợp |
| THPT | 10–12 | NC1 – Bậc 5 | Học sinh tự chủ, biết dẫn dắt nhóm và đánh giá nguồn |

Một số mã hay dùng:

| Việc học | Mã THCS | Mã THPT |
|---|---|---|
| Tìm kiếm có chiến lược, đánh giá nguồn tin | 1.1.TC2b; 1.2.TC2a | 1.1.NC1b; 1.2.NC1a |
| Hợp tác trực tuyến, trích dẫn nguồn | 2.5.TC2a; 2.2.TC2c | 2.5.NC1a; 2.2.NC1c |
| Tạo sản phẩm số, bản quyền | 3.1.TC2b; 3.3.TC2a | 3.1.NC1a; 3.3.NC1a |
| Bảo vệ dữ liệu, nhận diện lừa đảo | 4.1.TC2b; 4.2.TC2c | 4.1.NC1b; 4.2.NC1a |
| Giải quyết vấn đề bằng công cụ số | 5.2.TC2b; 5.4.TC2b | 5.2.NC1b |
| Dùng AI có trách nhiệm | 6.2.TC2c; 6.3.TC2a | 6.2.NC1c; 6.3.NC1a |

## Bốn mạch giáo dục AI

| Mạch | Nội dung | Ví dụ trong môn học |
|---|---|---|
| **NLa** – Tư duy lấy con người làm trung tâm | AI phục vụ con người, không thay thế phán đoán | Thảo luận: máy chấm điểm có công bằng với học sinh vùng khó? |
| **NLb** – Đạo đức AI | Thiên lệch, quyền riêng tư, trách nhiệm | Phân tích vì sao không được đưa ảnh học sinh vào AI tạo ảnh |
| **NLc** – Kỹ thuật và ứng dụng AI | Cách AI hoạt động, dùng đúng việc | Dùng AI tóm tắt tư liệu rồi kiểm chứng lại |
| **NLd** – Thiết kế hệ thống AI | Hiểu hệ thống, quy trình, giới hạn | Vẽ sơ đồ luồng: dữ liệu vào – xử lý – đầu ra – người kiểm tra |

Không cần dạy cả bốn mạch trong một tiết. Chọn **một mạch** gắn tự nhiên với nội dung bài.

## Tám chủ đề an toàn mạng

| Mã | Chủ đề | Tình huống lớp học |
|---|---|---|
| ATM1 | Tin giả, tin nửa sự thật, bóp méo ngữ cảnh | Ảnh chụp thông báo nghỉ học lan trong nhóm Zalo |
| ATM2 | Bắt nạt mạng, quấy rối trực tuyến | Nhóm chat lớp dùng biệt danh chế giễu một bạn |
| ATM3 | Bảo vệ dữ liệu cá nhân | Ảnh CCCD, số điện thoại bị đăng công khai |
| ATM4 | Lừa đảo trực tuyến, dụ dỗ | Tài khoản lạ rủ chơi game, đòi ảnh riêng tư |
| ATM5 | Sức khỏe số và môi trường | Thức khuya vì video ngắn; pin cũ vứt bừa |
| ATM6 | Bản quyền, tôn trọng môi trường số | Dùng nhạc, ảnh không ghi nguồn trong video |
| ATM7 | Sử dụng AI an toàn, trung thực | AI bịa nguồn; học sinh nộp bài AI nguyên văn |
| ATM8 | Tìm trợ giúp, phục hồi sau sự cố | Tài khoản bị chiếm; biết gọi ai, báo ở đâu |

## Ghi mã đúng chỗ: ba ví dụ

**Ví dụ 1 – Ngữ văn 8, bài văn bản thông tin.** Học sinh kiểm chứng một tin lan truyền bằng SIFT. Ghi: `1.2.TC2a` (đánh giá độ tin cậy nguồn tin) và `ATM1`. Mạch AI phù hợp: NLb (trách nhiệm khi chia sẻ) hoặc NLc (giới hạn của công cụ tìm kiếm).

**Ví dụ 2 – Toán 8, thu thập dữ liệu.** Học sinh khảo sát ẩn danh rồi vẽ biểu đồ. Ghi: `1.3.TC2b` (quản lý dữ liệu có cấu trúc) hoặc `2.5.TC2a` (thảo luận, trình bày), kèm `ATM3`. Không ghi ATM1 nếu bài không có nội dung kiểm chứng tin.

**Ví dụ 3 – Vật lí 11, dao động.** Học sinh dự đoán rồi kiểm chứng bằng mô phỏng. Ghi: `1.1.NC1b` (tìm kiếm chuyên sâu) và `5.2.NC1b` (dùng công cụ giải quyết vấn đề), có thể thêm `ATM7` nếu học sinh dùng AI để giải thích.

:::warn Ba lỗi thường gặp
1. **Ghi mã ở đầu bài nhưng hoạt động không dạy mã đó.** Hãy ghi mã ngay cạnh hoạt động tương ứng.
2. **Ghi càng nhiều mã càng tốt.** Một bài nên có 1–2 mã năng lực và 1 chủ đề ATM.
3. **Dùng mã của giáo viên cho học sinh.** Mã 6.2.TC2c là của học sinh; mã miền 6 của giáo viên dùng để tự đánh giá, không chép vào cột học sinh.
:::

<script type="text/plain" class="lesson-src" data-id="c3-an-toan"># An toàn số: SIFT, 4 KHÔNG – 3 CÓ và 7 bước ứng phó

:::note Mục tiêu
Có trong tay ba thứ dùng được ngay: quy trình kiểm chứng tin trong 4 bước, bộ quy tắc dán ở lớp, và quy trình 7 bước khi một học sinh gặp sự cố trên mạng.
:::

## Phần 1 · SIFT: bốn bước trước khi tin hoặc chia sẻ

SIFT là viết tắt của **Stop – Investigate – Find – Trace**, tiếng Việt là **Dừng lại – Điều tra – Tìm nguồn – Truy vết**.

| Bước | Việc làm | Câu hỏi tự đặt |
|---|---|---|
| **Dừng lại** | Không bấm chia sẻ, không bình luận vội | “Mình đang cảm thấy thế nào? Có đang bị cuốn theo cảm xúc không?” |
| **Điều tra nguồn** | Xem ai đăng, đăng khi nào, có phải kênh chính thức không, ảnh có dấu hiệu chỉnh sửa không | “Người đăng có trách nhiệm về thông tin này không?” |
| **Tìm nguồn tốt hơn** | Tìm báo chí chính thống, cổng thông tin của trường, cơ quan chức năng | “Có nguồn nào đáng tin hơn đang nói về việc này?” |
| **Truy vết** | Đối chiếu bản gốc, mã văn bản, ngày ban hành, gọi người có trách nhiệm xác nhận | “Thông tin này bắt đầu từ đâu, có bị cắt khỏi ngữ cảnh không?” |

:::case Tình huống thật trong trường
Nhóm Zalo lớp lan truyền ảnh chụp thông báo “toàn tỉnh nghỉ học ngày mai vì bão”. Ảnh mờ, không có mã văn bản, người gửi là tài khoản lạ.

- **Dừng:** không chuyển tiếp.
- **Điều tra:** tài khoản đăng không phải cổng trường; ảnh không có ngày, không có số văn bản.
- **Tìm nguồn tốt hơn:** mở cổng thông tin của trường và Sở GD&ĐT; không thấy thông báo.
- **Truy vết:** gọi văn phòng trường xác nhận; kết luận: tin sai, có thể là ảnh cũ bị chỉnh ngày.
:::

:::tip Dạy SIFT trong 15 phút
Phát cho mỗi nhóm một tin thật đang lan ở địa phương và phiếu bốn ô. Nhóm ghi bằng chứng cho từng ô, không ghi cảm xúc. Sau đó mỗi nhóm trình bày trong 1 phút: “Chúng em kết luận tin này vì…”. Giáo viên chỉ hỏi thêm: “Nguồn thứ hai độc lập với nguồn thứ nhất ở chỗ nào?”
:::

## Phần 2 · 4 KHÔNG – 3 CÓ

Bộ quy tắc này được niêm yết ở lớp và phòng Tin học. Có thể in thành thẻ A4 ở [Bộ phiếu in](#/in).

### 4 KHÔNG

1. **Không nhập thông tin định danh cá nhân** – họ tên đầy đủ, số định danh, địa chỉ, số điện thoại, bảng điểm, ảnh riêng tư của mình hoặc của người khác – lên công cụ AI công cộng và nền tảng không rõ nguồn gốc.
2. **Không dùng AI để đạo văn, làm hộ bài kiểm tra**, hoặc tạo ảnh, âm thanh cắt ghép (deepfake) nhằm bôi nhọ, bắt nạt người khác.
3. **Không tin tuyệt đối kết quả AI** khi chưa đối chiếu sách giáo khoa hoặc nguồn khoa học chính thống.
4. **Không chia sẻ mật khẩu, mã OTP, không bấm link lạ**, và không im lặng khi mình hoặc bạn bị đe dọa trên mạng.

### 3 CÓ

1. **Có kiểm chứng** bằng quy trình 4 bước SIFT trước khi tin và chia sẻ.
2. **Có minh bạch và tôn trọng bản quyền:** ghi nguồn tài liệu, hình ảnh; chú thích rõ phần có sử dụng AI hỗ trợ.
3. **Có kết nối trợ giúp:** báo ngay giáo viên chủ nhiệm, tổ tư vấn học đường, cha mẹ hoặc Tổng đài 111 khi phát hiện nguy cơ mất an toàn.

:::warn Điều giáo viên hay quên
“Không tin tuyệt đối AI” không chỉ là lời nhắc học sinh. Chính giáo viên cũng phải kiểm tra lại mọi nội dung AI gợi ý trước khi đưa vào bài giảng, đặc biệt là số liệu, mốc lịch sử, địa danh và trích dẫn.
:::

## Phần 3 · Quy trình 7 bước ứng phó sự cố

Quy trình dành cho cán bộ quản lý và giáo viên chủ nhiệm, theo tài liệu NAEM 2026.

1. **Tiếp nhận bình tĩnh, không phán xét.** Lắng nghe, khẳng định học sinh đã làm đúng khi tìm sự hỗ trợ. Không trách mắng, không tịch thu thiết bị vội vàng, không đổ lỗi cho nạn nhân – kể cả khi tài khoản của em bị chiếm quyền và dùng để nhắn tin xấu.
2. **Không hứa giữ bí mật tuyệt đối.** Giải thích nhẹ nhàng rằng thầy cô cần phối hợp với người có trách nhiệm để bảo vệ em, và thông tin chỉ chia sẻ cho đúng người có thẩm quyền.
3. **Lưu bằng chứng đúng cách.** Chụp màn hình hiển thị rõ nội dung vi phạm, tên hoặc ID tài khoản, đường dẫn và thời gian; lưu vào thư mục bảo mật, phân quyền riêng.
4. **Phân loại ba mức độ** (xem bảng bên dưới).
5. **Báo ngay đầu mối an toàn số của trường:** Phó Hiệu trưởng phụ trách hoặc Tổ tư vấn tâm lý học đường.
6. **Phối hợp gia đình và cơ quan chức năng.** Với Mức 3, gọi Tổng đài Quốc gia Bảo vệ Trẻ em **111** (miễn phí, 24/7) hoặc công an địa phương.
7. **Theo dõi, phục hồi tâm lý và phòng ngừa tái diễn.** Hỗ trợ học sinh ổn định, khóa hoặc khôi phục tài khoản an toàn, rút kinh nghiệm kín trong sinh hoạt lớp.

### Ba mức sự cố

| Mức | Dấu hiệu | Ai xử lý |
|---|---|---|
| **Mức 1 – Nhẹ** | Trêu chọc, hiểu lầm trong nhóm chat | Giáo viên chủ nhiệm xử lý sư phạm |
| **Mức 2 – Trung bình** | Bắt nạt lặp lại, mạo danh, lộ thông tin cá nhân | Báo ban giám hiệu, phối hợp phụ huynh |
| **Mức 3 – Nghiêm trọng** | Dụ dỗ tình dục (grooming), tống tiền, phát tán ảnh nhạy cảm, đe dọa tự hại | Can thiệp khẩn cấp; gọi 111, 113; báo cơ quan chức năng |

:::do Câu nói mẫu khi học sinh vừa kể sự cố
“Cảm ơn em đã nói với thầy/cô. Em làm đúng khi tìm người lớn. Việc này không phải lỗi của em. Thầy/cô sẽ cùng em xử lý từng bước, nhưng thầy/cô cần báo cho người có trách nhiệm để bảo vệ em an toàn. Mình sẽ không công khai câu chuyện của em.”
:::

:::warn Ba việc không làm
- Không yêu cầu học sinh kể lại trước lớp hoặc lấy câu chuyện thật làm ví dụ công khai.
- Không xóa bằng chứng trước khi chụp lại.
- Không tự liên hệ với người gây hại để “nói chuyện cho rõ”.
:::

## Phần 4 · Phòng ngừa trong lớp học

- Dạy SIFT bằng tin thật, không dùng tin gây sốc.
- Có hộp thư kín hoặc kênh báo riêng để học sinh không phải nói trước lớp.
- Niêm yết đầu mối an toàn số và số 111 ở nơi học sinh dễ thấy.
- Nhắc lại 4 KHÔNG – 3 CÓ mỗi đầu học kỳ, không chỉ một lần.
- Với lớp không có thiết bị: dùng thẻ tình huống in sẵn, đóng vai “người quan sát tích cực”.

## Việc làm ngay

:::checklist
- [ ] In 4 KHÔNG – 3 CÓ và dán ở lớp.
- [ ] Viết số 111, 113 và số đầu mối an toàn số của trường lên bảng phụ.
- [ ] Lưu quy trình 7 bước vào điện thoại hoặc kẹp hồ sơ chủ nhiệm.
- [ ] Thử dạy SIFT bằng một tin thật trong 15 phút.
:::

## Tự kiểm tra

:::quiz
? Bước đầu tiên của SIFT là gì? | Tìm nguồn tốt hơn | Dừng lại, không chia sẻ ngay* | Truy vết bản gốc | Dừng lại trước khi tiếp tục lan truyền.
? Khi học sinh bị đe dọa tống tiền bằng ảnh nhạy cảm, đây là mức nào? | Mức 1 | Mức 2 | Mức 3* | Dụ dỗ, tống tiền, phát tán ảnh nhạy cảm là Mức 3 – can thiệp khẩn cấp.
? Việc nào đúng khi lưu bằng chứng? | Xóa tin nhắn ngay để học sinh đỡ sợ | Chụp màn hình rõ nội dung, tài khoản, thời gian* | Chỉ nghe kể, không cần bằng chứng | Cần bằng chứng rõ ràng, lưu bảo mật.
? Câu nào không nên nói với học sinh? | “Em làm đúng khi tìm hỗ trợ.” | “Thầy/cô hứa sẽ không nói với ai.”* | “Việc này không phải lỗi của em.” | Không hứa giữ bí mật tuyệt đối; cần phối hợp người có trách nhiệm.
:::

## Sang bài tiếp

An toàn là nền. Bài tiếp theo chuyển sang phần giáo viên sẽ dùng hằng ngày: **AI có trách nhiệm và cách viết câu lệnh để AI trả về việc có ích, có kiểm chứng.**
</script>
<script type="text/plain" class="lesson-src" data-id="c4-ai"># AI có trách nhiệm và prompt 4 thẻ

:::note Mục tiêu
Hiểu AI đứng ở đâu trong lớp học; nhận ra năm lỗi thường gặp; viết được một câu lệnh đủ rõ để dùng, đủ an toàn để không làm hại học sinh.
:::

## Phần 1 · Tương tác ba chiều: Giáo viên – Học sinh – AI

AI không phải người dạy thứ hai. Trong mô hình ba chiều của tài liệu, mỗi bên có một vai trò:

| Bên | Vai trò | Việc cụ thể |
|---|---|---|
| **Giáo viên** | Kiến trúc sư sư phạm, người điều phối | Thiết kế nhiệm vụ, phân tầng theo TC1/TC2/NC1, cài lỗi sai để học sinh phản biện, thẩm định đầu ra |
| **Học sinh** | Người học chủ động, người phản biện | Dùng AI như gia sư gợi mở, không dùng để làm thay; bắt buộc kiểm chứng với nguồn chính thống |
| **AI** | Công cụ gợi ý, không có trách nhiệm | Sinh phương án, tóm tắt, tạo bản nháp; có thể sai, có thể bịa, không chịu trách nhiệm sư phạm |

:::case Một tiết học ba chiều
Giáo viên giao nhiệm vụ: “Nhóm em hãy nhờ AI tóm tắt ba ý về phong trào công nhân, rồi đối chiếu với sách giáo khoa, đánh dấu chỗ AI nói sai hoặc thiếu.” Học sinh làm việc, ghi lại chỗ AI sai. Giáo viên không chấm câu trả lời của AI mà chấm **quá trình kiểm chứng** của học sinh. Đó là dạy AI có trách nhiệm.
:::

## Phần 2 · Năm lỗi thường gặp và cách kiểm

| Lỗi | Biểu hiện | Cách kiểm |
|---|---|---|
| **Ảo giác tri thức** | AI khẳng định chắc chắn một sự kiện, con số không có thật | Đối chiếu sách giáo khoa và ít nhất một nguồn chính thống |
| **Trích dẫn bịa** | Tên bài báo, tác giả, đường link trông rất thật nhưng không tồn tại | Mở thử link; tìm đúng tên tài liệu trên nguồn gốc |
| **Thiên lệch** | AI nghiêng về một quan điểm, bỏ qua nhóm yếu thế | So sánh kết quả của hai công cụ; tìm thêm tiếng nói địa phương |
| **Sai tính toán hoặc logic** | Lời giải có bước nhảy, kết quả không khớp | Tự tính lại; kiểm tra đơn vị, dấu, điều kiện |
| **Nội dung không phù hợp lứa tuổi** | Ví dụ, hình ảnh, cách diễn đạt chưa phù hợp học sinh | Đọc toàn bộ đầu ra trước khi chiếu; không chiếu trực tiếp từ màn hình AI |

:::warn Không đổ lỗi cho AI
Khi AI trả lời sai, đó là dữ liệu để dạy học sinh cách kiểm chứng. Nhưng khi giáo viên đưa nội dung sai vào bài giảng, trách nhiệm thuộc về giáo viên. Vì vậy nguyên tắc là: **AI tạo bản nháp, giáo viên chịu trách nhiệm bản cuối.**
:::

## Phần 3 · Prompt 4 thẻ

Một câu lệnh tốt không cần dài, nhưng cần đủ bốn thẻ:

| Thẻ | Trả lời câu hỏi | Ví dụ |
|---|---|---|
| **1. Ngữ cảnh** | Ai học, học bài gì, trong bao lâu, điều kiện lớp thế nào? | Lớp 8, 40 học sinh, 5 em chưa có thiết bị, tiết 45 phút |
| **2. Dữ liệu** | Được dùng nguồn nào, cấm đưa gì vào? | Chỉ dùng sách giáo khoa và tư liệu của trường; không nhập tên, điểm, ảnh học sinh |
| **3. Hướng dẫn** | AI phải làm gì, theo định dạng nào, phân hóa ra sao? | Gợi ý 4 hoạt động, mỗi hoạt động 4 mục; mức cơ bản và mở rộng |
| **4. Kết quả** | Nhận sản phẩm gì, đạt tiêu chí nào, phải kiểm chứng chỗ nào? | Kế hoạch bài dạy 45 phút; nêu 3 điểm giáo viên phải kiểm tra lại |

### Mẫu câu lệnh ngắn

> “Bạn là người phản biện sư phạm cho giáo viên Ngữ văn THCS, không làm thay giáo viên. **Ngữ cảnh:** lớp 8, bài văn bản thông tin, 45 phút, một số học sinh chưa có thiết bị. **Dữ liệu:** chỉ dùng sách giáo khoa Ngữ văn 8 và Công văn 5512; không đưa tên, điểm, ảnh học sinh vào. **Hướng dẫn:** gợi ý tiến trình 4 hoạt động giúp học sinh kiểm chứng một tin lan truyền bằng SIFT; ghi mã 1.2.TC2a và ATM1 ở đúng hoạt động; có phương án phiếu in. **Kết quả:** bảng 4 hoạt động, mỗi hoạt động gồm mục tiêu, nội dung, sản phẩm, tổ chức; cuối cùng liệt kê 3 điểm tôi phải kiểm chứng lại.”

Câu lệnh này có thể tạo tự động trong [công cụ Prompt 4 thẻ](#/cong-cu/prompt).

:::tip Mẹo sửa câu lệnh
Nếu AI trả lời chung chung, đừng viết lại từ đầu. Thêm một câu: “Chỉ rõ hoạt động nào học sinh làm, hoạt động nào giáo viên làm; bỏ các hoạt động không thể thực hiện khi lớp không có mạng.”
:::

## Phần 4 · Dữ liệu nào không được đưa vào AI

- Họ tên đầy đủ, số định danh cá nhân, địa chỉ nhà, số điện thoại.
- Bảng điểm, nhận xét hạnh kiểm, hồ sơ tâm lý.
- Ảnh chân dung, ảnh nhóm có thể nhận diện học sinh.
- Nội dung trao đổi riêng giữa giáo viên và phụ huynh.

Nếu cần dùng dữ liệu thật để phân tích, hãy thay bằng mã: **HS01, HS02**, bỏ ngày sinh chính xác, bỏ địa chỉ, chỉ giữ thông tin cần cho bài học. Với dữ liệu nhạy cảm, dùng bảng tính nội bộ thay vì công cụ AI công cộng.

## Phần 5 · Minh bạch khi dùng AI

Ba mẫu câu có thể dùng ngay:

- Trong học liệu: “Học liệu được giáo viên biên soạn, có tham khảo gợi ý của công cụ AI ngày …; nội dung đã được kiểm chứng với sách giáo khoa và văn bản hiện hành.”
- Trong bài của học sinh: “Phần tìm ý và dàn ý có sử dụng AI; phần viết, chỉnh sửa và kiểm chứng do em thực hiện.”
- Trong biên bản tổ: “Tổ đã dùng AI để gợi ý cấu trúc biên bản; tổ trưởng rà soát và chịu trách nhiệm nội dung cuối.”

:::do Quy ước với học sinh
Trước khi giao bài có dùng AI, nói rõ ba điều: (1) được dùng AI ở bước nào; (2) phải ghi chú phần có AI hỗ trợ; (3) phải nêu ít nhất một chỗ AI sai hoặc chưa đủ mà em đã sửa. Điều thứ ba biến AI từ “máy làm bài” thành “bài tập kiểm chứng”.
:::

## Việc làm ngay

:::checklist
- [ ] Viết một prompt 4 thẻ cho tiết sắp dạy bằng công cụ trong phòng thực hành.
- [ ] Thử một lần để AI trả lời sai và ghi lại cách bạn phát hiện.
- [ ] Thêm câu ghi chú minh bạch AI vào mẫu học liệu của tổ.
- [ ] Kiểm tra lại danh sách dữ liệu cấm trong sổ chủ nhiệm.
:::

## Tự kiểm tra

:::quiz
? Trong mô hình ba chiều, ai chịu trách nhiệm cuối về nội dung bài giảng? | AI | Học sinh | Giáo viên* | AI chỉ tạo bản nháp; giáo viên chịu trách nhiệm bản cuối.
? Đâu là dấu hiệu AI bịa trích dẫn? | Link mở được và đúng tên bài | Tên tài liệu rất thật nhưng link không tồn tại* | Có nhiều số liệu | Trích dẫn bịa thường có tên và link trông hợp lý nhưng không mở được.
? Thẻ nào trong prompt 4 thẻ nêu nguồn được dùng và dữ liệu cấm? | Ngữ cảnh | Dữ liệu* | Hướng dẫn | Thẻ Dữ liệu quy định nguồn và điều cấm.
? Việc nào đúng khi dùng bài tập có AI? | Yêu cầu học sinh nộp nguyên văn | Yêu cầu ghi chú phần AI hỗ trợ và nêu chỗ đã sửa* | Cấm học sinh dùng AI mà không dạy cách kiểm chứng | Minh bạch và kiểm chứng là yêu cầu cốt lõi.
:::

## Sang bài tiếp

Bạn đã có cách dùng AI an toàn. Bài cuối của phần nền tảng ghép mọi thứ vào **năm trụ cột chuyển đổi số** và cách tích hợp để không biến tiết học thành bài giảng kỹ thuật.
</script>
<script type="text/plain" class="lesson-src" data-id="c5-tru-cot"># Năm trụ cột và tích hợp đúng địa chỉ

:::note Mục tiêu
Nhìn một hoạt động học và trả lời được: nó nằm ở trụ cột nào, dùng công cụ gì, nếu mất mạng thì thay bằng gì. Không cần nhớ toàn bộ lý luận.
:::

## Năm trụ cột

Tài liệu dùng năm trụ cột để một trường không “làm công nghệ rời rạc”. THCS và THPT khác nhau ở trụ cột 2 và 3:

| Trụ cột | THCS | THPT |
|---|---|---|
| 1 | Quản trị số tinh gọn, tối ưu vận hành học đường | Quản trị số tinh gọn, tối ưu vận hành tổ chuyên môn |
| 2 | Sư phạm số thích ứng, trực quan và trò chơi hóa | Sư phạm số thích ứng, phản biện đa chiều và đồng sáng tạo văn hóa |
| 3 | Kết nối cộng đồng số linh hoạt và đồng thuận | Kết nối cộng đồng số linh hoạt, tôn trọng và đồng thuận hướng nghiệp |
| 4 | Phát triển nhân lực số nòng cốt và nâng đỡ nội bộ | Phát triển nhân lực số nòng cốt và cộng đồng học tập chuyên môn |
| 5 | Hạ tầng số an toàn và bảo mật định danh học đường | Hạ tầng số an toàn, bảo mật dữ liệu và thượng tôn pháp luật số |

### Năm giải pháp đi kèm

1. **Văn phòng điện tử liên thông** – giảm giấy, giảm nhập lại dữ liệu.
2. **Chuyển từ truyền thụ sang kiến tạo trải nghiệm** – học sinh làm ra sản phẩm, không chỉ nghe.
3. **Sổ liên lạc điện tử đồng bộ** – một nguồn thông tin giữa trường và gia đình.
4. **Cộng đồng học tập chuyên môn** – tổ cùng soạn, cùng dự giờ, cùng sửa học liệu.
5. **“Vùng xanh” Internet học đường** – phân vùng truy cập, bảo vệ dữ liệu, có quy trình sự cố.

:::tip Cách nhớ
**Một trường số không phải là trường mua nhiều thiết bị.** Đó là trường trả lời được năm câu: việc hành chính đã gọn chưa, học sinh có làm ra sản phẩm chưa, gia đình có nhận đúng thông tin chưa, giáo viên có học cùng nhau chưa, dữ liệu và học sinh có được bảo vệ chưa.
:::

## Tích hợp “đúng địa chỉ”

Bốn nguyên tắc từ tài liệu:

1. **Tin học giữ vai trò chủ đạo** về kiến thức nền; các môn khác tạo bối cảnh thực tiễn để vận dụng.
2. **Đúng địa chỉ, không khiên cưỡng.** Đối chiếu yêu cầu cần đạt của bài với bảng mã TC1/TC2 hoặc NC1 và ATM; chỉ lồng ghép khi hoạt động thật sự cần.
3. **An toàn tâm lý và dữ liệu.** Không dùng tình huống gây sốc, không bắt học sinh kể sự cố cá nhân trước lớp, không dùng vụ việc thật làm ví dụ công khai, ẩn danh dữ liệu trước khi đưa vào AI.
4. **Dùng ma trận tích hợp** để ghi mã vào kế hoạch, không suy diễn.

:::warn Ví dụ về tích hợp khiên cưỡng
Tiết Lịch sử về phong trào công nhân không cần dạy học sinh cài đặt phần mềm. Nhưng hoạt động “kiểm chứng một đoạn tư liệu lịch sử lan truyền trên mạng” lại rất phù hợp: học sinh dùng SIFT, ghi mã 1.2.TC2a và ATM1. Cùng một bài, chọn địa chỉ đúng thì tự nhiên; chọn sai thì thành tiết Tin học gắn mác Lịch sử.
:::

## Mô hình 4C cho một tiết 45 phút

| Bước | Giáo viên làm gì | Học sinh làm gì | Câu hỏi kiểm tra |
|---|---|---|---|
| **Context – Ngữ cảnh** | Nêu một tình huống thật, gần gũi | Nhận ra vấn đề, đặt câu hỏi | “Vì sao việc này liên quan đến em?” |
| **Challenge – Thử thách** | Giao nhiệm vụ có độ khó vừa phải | Thử, sai, trao đổi, điều chỉnh | “Em cần làm gì để giải quyết?” |
| **Concept – Khái niệm** | Gợi mở, không giảng hết | Khám phá, đối chiếu sách giáo khoa, hình thành kiến thức | “Em rút ra được gì?” |
| **Conclusion – Kết luận** | Tổ chức tổng kết, giao vận dụng | Tóm tắt, áp dụng vào tình huống mới | “Em dùng điều này ở đâu?” |

Bốn bước này khớp với bốn hoạt động của Công văn 5512: Mở đầu, Hình thành kiến thức, Luyện tập, Vận dụng. Khi soạn, bạn chỉ cần điền nội dung vào bốn ô, không cần tạo thêm cấu trúc mới.

- **Trò chơi hóa:** Quizizz, Wayground hoặc thẻ giấy; mục tiêu là phản hồi nhanh, không phải xếp hạng học sinh.
- **Học liệu mở:** dùng tài nguyên có giấy phép Creative Commons, ghi nguồn ở trang cuối.

:::

## Từ một tiết đến cả trường

Một tiết dạy tốt chưa phải chuyển đổi số. Muốn bền, cần chu trình:

1. Chọn một tiết làm mẫu.
2. Dạy thử, ghi ba điểm vướng.
3. Điều chỉnh học liệu.
4. Chia sẻ cho tổ, cùng dạy lại.
5. Đo bằng sản phẩm học sinh, không đếm số lần dùng công cụ.

## Học sinh 11–14 tuổi đang ở đâu?

Học sinh THCS bắt đầu hình thành ý thức cá nhân, dùng điện thoại và mạng xã hội nhiều hơn, nhưng chưa đủ kinh nghiệm để nhận ra rủi ro. Ba đặc điểm ảnh hưởng trực tiếp đến cách dạy:

- **Tin vào cảm xúc trước, kiểm chứng sau.** Một tiêu đề giật gân dễ được chia sẻ hơn một văn bản khô khan.
- **Sợ bị tách khỏi nhóm.** Bắt nạt mạng thường diễn ra trong nhóm chat lớp, nơi học sinh không muốn “làm lớn chuyện”.
- **Học tốt nhất qua tình huống và vai.** Đóng vai, tranh biện, làm sản phẩm hiệu quả hơn nghe quy tắc.

Vì vậy, khối KHXH có lợi thế lớn: môn học vốn đã có văn bản, tư liệu, tình huống và tranh luận. Không cần thêm công nghệ mới, chỉ cần đổi **cách học sinh làm việc với tư liệu**.

## Ba địa chỉ tích hợp tự nhiên

### 1. Ngữ văn 8 – văn bản thông tin và tin giả

Bài “Văn bản thông tin – cách tiếp nhận tin tức” có sẵn yêu cầu đánh giá tính khách quan của thông tin. Địa chỉ tích hợp:

- Hoạt động luyện tập: học sinh kiểm chứng một tin đang lan trong trường bằng SIFT.
- Mã: `1.2.TC2a` (đánh giá độ tin cậy nguồn tin), `ATM1`.
- Sản phẩm: phiếu SIFT bốn ô, kết luận có căn cứ.
- Phương án không thiết bị: phát bản in của một bài báo và một ảnh chụp màn hình; học sinh đối chiếu trên giấy.

### 2. Lịch sử và Địa lí 8 – tư liệu và chủ quyền

Khi dạy một sự kiện lịch sử, cho học sinh so sánh hai đoạn tư liệu: một đoạn trong sách giáo khoa, một đoạn lan truyền trên mạng. Địa chỉ:

- Mã: `1.2.TC2a` (so sánh, phản biện nguồn tin), `ATM1`.
- Mạch AI: NLb – trách nhiệm khi chia sẻ thông tin lịch sử sai lệch.
- Lưu ý: dùng tư liệu về địa danh theo Thông tư 17/2025/TT-BGDĐT khi dạy Địa lí.

### 3. GDCD và Hoạt động trải nghiệm – ứng xử trên mạng

Bài về tình bạn, tôn trọng, pháp luật có thể gắn với bắt nạt mạng:

- Mã: `2.5.TC2a` (chuẩn mực ứng xử trên mạng) và `2.6.TC2c` (quản lý dấu vết số), `ATM2`.
- Hoạt động: ba tiêu chí phân biệt “mâu thuẫn thông thường” và “bắt nạt” – **cố ý, lặp lại, mất cân bằng quyền lực**; học sinh đóng vai người quan sát tích cực.
- Sản phẩm: bộ quy ước nhóm chat của lớp, không nêu tên cá nhân.

## Hai điều nên tránh

1. **Biến tiết Văn thành tiết dạy công cụ.** Học sinh không cần học cách tạo tài khoản Canva trong giờ Văn; các em cần học cách đọc, đánh giá và tạo sản phẩm văn học.
2. **Dùng vụ việc thật của học sinh làm ví dụ.** Kể cả khi đã ẩn tên, câu chuyện có thể bị nhận ra. Hãy hư cấu tình huống dựa trên nhiều vụ việc.

:::do Bài tập 10 phút
Chọn một bài sắp dạy. Viết ba dòng:

1. Hoạt động nào học sinh phải **đọc, đối chiếu hoặc tranh luận**?
2. Trong hoạt động đó, học sinh dùng **nguồn nào**, kiểm chứng bằng cách nào?
3. Ghi mã năng lực và ATM tương ứng.

Nếu dòng 3 không khớp với hoạt động, quay lại chọn địa chỉ khác – đừng gắn mã cho đủ.
:::

## Bài mẫu: “Đọc văn bản thông tin và kiểm chứng tin tức”

**Thông tin chung**

- Môn: Ngữ văn 8. Thời lượng: 45 phút.
- Chủ đề: văn bản thông tin; kỹ năng đánh giá độ tin cậy.
- Mã tích hợp: `1.2.TC2a`, `ATM1`; mạch NLb.
- Thiết bị: máy chiếu (nếu có), phiếu SIFT in sẵn, 4 bộ ảnh/tin in trên giấy.

**Yêu cầu cần đạt**

1. Chỉ ra được đặc điểm của văn bản thông tin: nhan đề, sapo, nguồn, dữ liệu, ảnh minh họa.
2. Đánh giá được độ tin cậy của một thông tin bằng bốn bước SIFT.
3. Viết được đoạn kết luận 5–7 câu, nêu căn cứ và đề xuất cách xử lý.

### Hoạt động 1 – Mở đầu (6 phút)

- Giáo viên chiếu một ảnh chụp “thông báo nghỉ học” không rõ nguồn (do giáo viên hư cấu).
- Câu hỏi: *“Nếu nhận được ảnh này trong nhóm lớp, em làm gì trong 30 giây đầu?”*
- Học sinh trả lời miệng; giáo viên ghi ba hành vi lên bảng, chưa kết luận đúng sai.
- Chốt: hôm nay học cách **dừng lại trước khi chia sẻ**.

### Hoạt động 2 – Hình thành kiến thức (15 phút)

- Chia nhóm 4. Mỗi nhóm nhận một bộ tư liệu: một bài báo có nguồn rõ và một ảnh chụp màn hình không rõ nguồn.
- Nhiệm vụ theo phiếu SIFT: **Dừng lại – Điều tra – Tìm nguồn – Truy vết**.
- Giáo viên đi từng nhóm, hỏi đúng một câu: *“Căn cứ nào cho câu trả lời này?”*
- Nhóm ghi kết quả vào bốn ô; đại diện 2 nhóm trình bày 60 giây.
- Giáo viên hệ thống: ba dấu hiệu của nguồn đáng tin (tác giả, cơ quan, ngày, dữ liệu kiểm chứng được).

### Hoạt động 3 – Luyện tập (14 phút)

- Cá nhân viết đoạn 5–7 câu: thông tin đó đáng tin ở mức nào, vì sao, nên làm gì.
- Đổi bài theo cặp, dùng rubric ba tiêu chí bên dưới để góp ý.
- Giáo viên chọn một bài tốt và một bài còn mơ hồ, đọc trước lớp (ẩn tên), cả lớp chỉ ra chỗ cần thêm căn cứ.

### Hoạt động 4 – Vận dụng (10 phút)

- Nhiệm vụ về nhà: theo dõi một tin trong tuần, ghi phiếu SIFT, nộp vào đầu giờ tuần sau.
- Học sinh nêu một việc sẽ **không** làm nữa (ví dụ: không chuyển tiếp khi chưa xem nguồn).
- Giáo viên chốt ba câu: *dừng lại; kiểm tra nguồn; chỉ chia sẻ khi có căn cứ.*

## Rubric ba mức

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Xác định nguồn | Chưa nêu tác giả/cơ quan | Nêu được nguồn nhưng thiếu ngày | Nêu tác giả, cơ quan, ngày, dữ liệu |
| Lập luận | Kết luận không có căn cứ | Có 1–2 căn cứ | Căn cứ gắn với từng bước SIFT |
| Đề xuất hành động | Chung chung | Có hành động cụ thể | Có hành động và cách phòng ngừa |

:::warn Rubric không phải điểm số
Ba mức dùng để góp ý trong giờ. Nếu chuyển thành điểm, phải quy đổi theo quy định của nhà trường và thông báo trước cho học sinh.
:::

## Chỗ nào dùng AI, chỗ nào không

**Nên dùng AI**

- Sinh thêm 3 tình huống hư cấu cùng dạng để học sinh luyện.
- Rút gọn một văn bản dài thành 5 ý, sau đó giáo viên đối chiếu lại với bản gốc.

**Không nên dùng AI**

- Chấm đoạn văn thay giáo viên.
- Tạo “dẫn chứng” lịch sử. AI có thể bịa số liệu và tên riêng.
- Đưa bài làm thật của học sinh lên công cụ công khai.

Nếu dùng AI để soạn ngữ liệu, ghi một dòng trong kế hoạch: *“Ngữ liệu do giáo viên biên soạn với hỗ trợ của AI và đã đối chiếu nguồn.”*

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | In ảnh và bài báo khổ A4, phát mỗi nhóm một bộ |
| Không có Internet | Dùng bản in; bước “Tìm nguồn” chuyển thành đối chiếu với sách giáo khoa và báo giấy |
| Học sinh không có điện thoại | Toàn bộ phiếu làm trên giấy; không yêu cầu chụp ảnh |
| Mất điện | Chuyển sang đóng vai: một học sinh là người đăng tin, ba học sinh phản biện |

## Dạy phân hóa trong cùng một lớp

- **Nhóm cần hỗ trợ:** phiếu SIFT có câu hỏi gợi ý ở từng ô.
- **Nhóm trung bình:** phiếu trống, chỉ có bốn tiêu đề.
- **Nhóm khá – giỏi:** thêm nhiệm vụ so sánh hai nguồn trái chiều và giải thích vì sao cùng một sự việc lại được đưa tin khác nhau.

## Prompt mẫu để soạn ngữ liệu

```text
Vai trò: giáo viên Ngữ văn THCS.
Nhiệm vụ: tạo 2 tình huống hư cấu về một thông báo lan truyền trong nhóm lớp.
Ràng buộc: không dùng tên người thật, không dùng tên trường thật, không mô tả hành vi nguy hiểm.
Đầu ra: mỗi tình huống 120 từ, kèm 3 dấu hiệu để học sinh kiểm chứng.
```

:::checklist Trước khi dạy
- [ ] Đã in phiếu SIFT đủ số nhóm.
- [ ] Ảnh/tin mẫu là hư cấu hoặc đã được phép sử dụng.
- [ ] Rubric đã chiếu hoặc phát cho học sinh.
- [ ] Có phương án không thiết bị.
- [ ] Đã xóa tên học sinh khỏi mọi tệp mẫu.
:::

## Tự kiểm tra

:::quiz
? Hoạt động “Mở đầu” trong 4C tương ứng với chữ nào? | Context* | Concept | Conclusion | Mở đầu tạo bối cảnh.
? Việc nào KHÔNG nên giao cho AI? | Sinh tình huống hư cấu | Chấm điểm bài làm của học sinh* | Rút gọn văn bản để giáo viên đối chiếu | Chấm điểm cần giáo viên chịu trách nhiệm.
? Bước SIFT thứ hai là gì? | Dừng lại | Điều tra* | Truy vết | Thứ tự: Dừng lại – Điều tra – Tìm nguồn – Truy vết.
? Khi mất mạng, bước “Tìm nguồn” thay bằng gì? | Bỏ qua bước này | Đối chiếu sách giáo khoa và báo giấy* | Cho học sinh tự đoán | Vẫn phải kiểm chứng, chỉ đổi công cụ.
:::

<script type="text/plain" class="lesson-src" data-id="tx3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHXH

:::note Mục tiêu
Chuyển từ “ai cũng thấy cần chuyển đổi số” sang **một kế hoạch 30 ngày làm được**, có người chịu trách nhiệm, có bằng chứng và có vòng cải tiến.
:::

## Năm bước lập kế hoạch

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Tổ đang ở đâu? Bao nhiêu giáo viên dùng công cụ gì, tuần mấy tiết? | Bảng kiểm 10 dòng |
| 2. Mục tiêu SMART | 30 ngày tới thay đổi điều gì, đo bằng gì? | 1–2 mục tiêu |
| 3. Hoạt động trọng tâm | Việc nhỏ nhất tạo khác biệt là gì? | 3 hoạt động |
| 4. Nguồn lực, thời gian | Ai làm, khi nào, cần gì? | Bảng phân công |
| 5. KPI, giám sát | Biết thành công nhờ đâu? | 5 chỉ số + lịch kiểm |

:::tip Mục tiêu SMART viết trong một câu
“Đến ngày 20/12, **6/8 giáo viên** của tổ có **ít nhất một bài dạy** dùng khung 4C, mỗi bài có **một học liệu số** và **một phiếu đánh giá học sinh** được lưu trong thư mục chung.”
:::

## Kế hoạch 4 tuần PDCA

### Tuần 1 – Plan: chọn một bài, không chọn mười bài

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Kiểm tra hạ tầng: mạng ở 3 phòng, máy chiếu, thiết bị học sinh | Tổ trưởng + phụ trách thiết bị | Ảnh chụp/phiếu kiểm |
| Chọn 1 bài có địa chỉ tích hợp rõ (ví dụ văn bản thông tin lớp 8) | Nhóm Văn | Biên bản chọn bài |
| Thống nhất rubric 3 tiêu chí | Cả tổ | Tệp rubric |
| Đăng ký dạy thử 1 tiết | 1 giáo viên tình nguyện | Lịch dạy |

**Kết thúc tuần 1:** có một bài, một người dạy thử, một thời điểm.

### Tuần 2 – Do: dạy thử, ghi lại

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Dạy thử theo 4 hoạt động | Giáo viên đăng ký | Kế hoạch bài dạy |
| 2 đồng nghiệp dự, ghi phiếu quan sát 4 mục | Nhóm quan sát | Phiếu quan sát |
| Chụp 3 sản phẩm học sinh (đã ẩn tên) | Giáo viên | 3 ảnh/tệp |
| Ghi 3 điều hiệu quả, 3 điều cần sửa | Giáo viên | Ghi chú 1 trang |

**Không làm trong tuần này:** không tổ chức hội thảo, không mời chuyên gia, không đổi phần mềm.

### Tuần 3 – Check: nhìn dữ liệu, không nhìn cảm giác

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Đối chiếu sản phẩm học sinh với rubric | Giáo viên + nhóm | Bảng tổng hợp mức |
| Hỏi 5 học sinh: “việc nào giúp em hiểu bài nhất?” | Giáo viên | 5 câu trả lời ẩn danh |
| Kiểm tra dữ liệu: tệp có tên học sinh không, có nằm trên dịch vụ công khai không | Tổ trưởng | Danh sách kiểm |
| So sánh thời gian chuẩn bị thực tế với dự kiến | Giáo viên | 1 dòng ghi chú |

### Tuần 4 – Act: chuẩn hóa và nhân ra

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Sửa bài dạy thành phiên bản 2 | Giáo viên | Tệp v2 |
| Chia sẻ 10 phút trong sinh hoạt tổ | Giáo viên + tổ trưởng | Biên bản |
| Đưa mẫu vào thư mục chung của tổ | Tổ trưởng | Đường dẫn thư mục |
| Chọn bài tiếp theo cho chu kỳ sau | Cả tổ | Danh sách 2 bài |

:::warn Đừng bỏ tuần 4
Nếu dừng sau tuần 2, sáng kiến sẽ chết khi giáo viên bận. Tuần 4 là lúc biến một lần làm thử thành **tài sản của tổ**.
:::

## Phân công RACI

R = người làm, A = người chịu trách nhiệm cuối, C = người được hỏi ý, I = người được thông báo.

| Việc | Hiệu trưởng | Phó hiệu trưởng | Tổ trưởng | GV nòng cốt | GV bộ môn | GVCN |
|---|---|---|---|---|---|---|
| Phê duyệt kế hoạch 30 ngày | A | C | R | C | I | I |
| Chọn bài dạy thử | I | I | A | R | C | I |
| Dạy thử | I | I | C | C | R/A | I |
| Kiểm tra dữ liệu học sinh | A | R | C | I | C | I |
| Chia sẻ trong tổ | I | I | A | R | C | I |
| Báo cáo kết quả | A | R | R | C | I | I |

:::tip Nguyên tắc một chữ A
Mỗi việc chỉ có **một** người chịu trách nhiệm cuối. Nếu hai người cùng A, việc sẽ dừng khi cả hai bận.
:::

## Năm vùng KPI

Không đặt quá 3 chỉ số mỗi vùng trong 30 ngày đầu.

| Vùng | Chỉ số gợi ý | Cách thu thập |
|---|---|---|
| Hồ sơ dạy học | Số bài có KHBD 4C được duyệt | Thư mục tổ |
| Giờ dạy | Số tiết có ít nhất một hoạt động số | Lịch báo giảng + phiếu dự |
| Học sinh | % học sinh nộp sản phẩm đúng hạn | Bảng theo dõi lớp |
| An toàn dữ liệu | Số tệp chứa dữ liệu cá nhân ngoài nơi được phép (mục tiêu: 0) | Danh sách kiểm |
| Chia sẻ chuyên môn | Số lượt chia sẻ trong sinh hoạt tổ | Biên bản |

## Thư mục bằng chứng

Tạo một thư mục chung, cấu trúc cố định:

```text
30-ngay-KHXH/
  01-ke-hoach/
  02-bai-day/
  03-san-pham-hoc-sinh/   (đã ẩn tên)
  04-phieu-quan-sat/
  05-tong-hop/
```

Quy ước đặt tên: `YYYYMMDD_mon-bai_phien-ban`. Không đặt tên học sinh trong tên tệp.

## Danh sách kiểm 30 ngày

:::checklist
- [ ] Đã có bảng thực trạng 10 dòng.
- [ ] Mục tiêu SMART viết trong một câu, có con số và hạn.
- [ ] Chọn đúng một bài cho chu kỳ đầu.
- [ ] Có lịch dạy thử và người dự.
- [ ] Có rubric 3 tiêu chí đã thống nhất.
- [ ] Sản phẩm học sinh được ẩn tên trước khi lưu.
- [ ] Có ít nhất 5 ý kiến học sinh.
- [ ] Có phiên bản 2 của bài dạy.
- [ ] Có biên bản chia sẻ trong tổ.
- [ ] Đã chọn bài cho chu kỳ tiếp theo.
:::

## Tự kiểm tra

:::quiz
? Trong 30 ngày đầu nên chọn bao nhiêu bài để làm thử? | Một bài* | Ba bài | Cả học kỳ | Một bài đủ để tạo mẫu và rút kinh nghiệm.
? Tuần 3 của PDCA là gì? | Plan | Do | Check* | Tuần 3 đối chiếu dữ liệu.
? Mỗi việc trong RACI có mấy người chịu trách nhiệm cuối? | Một* | Hai | Càng nhiều càng tốt | Một chữ A cho mỗi việc.
? Chỉ số “0 tệp dữ liệu cá nhân ngoài nơi được phép” thuộc vùng nào? | Hồ sơ dạy học | An toàn dữ liệu* | Chia sẻ chuyên môn | Đây là chỉ số an toàn dữ liệu.
? Việc nào KHÔNG cần làm ở tuần 2? | Dạy thử | Thu phiếu quan sát | Mời chuyên gia về tập huấn* | Tuần 2 chỉ dạy thử và ghi lại.

<script type="text/plain" class="lesson-src" data-id="tn1-dac-thu"># Đặc thù khối KHTN THCS và ma trận tích hợp

:::note Mục tiêu
Chọn đúng một địa chỉ tích hợp cho Toán, KHTN, Tin học, Công nghệ; phân biệt học liệu mô phỏng với “ảo giác” của AI; biết mã năng lực và chủ đề ATM đi kèm.
:::

## Học sinh 11–14 tuổi với môn tự nhiên

Khối KHTN có lợi thế về **thí nghiệm, mô hình và dữ liệu**, nhưng cũng dễ rơi vào hai cái bẫy:

- **Mô phỏng thay cho quan sát thật.** Học sinh bấm thí nghiệm ảo nhưng không hiểu vì sao kết quả đổi.
- **Tin vào con số.** Một biểu đồ đẹp, một lời giải AI trôi chảy được coi là đúng.

Ba nguyên tắc thực hành:

1. **Luôn có dự đoán trước khi bấm.** Học sinh ghi dự đoán vào phiếu, sau đó mới chạy mô phỏng.
2. **Luôn có nguồn thứ hai.** Kết quả AI phải đối chiếu sách giáo khoa hoặc số liệu đo được.
3. **Luôn có bản không thiết bị.** Một thí nghiệm thật nhỏ vẫn học được khi mất mạng.

## Ma trận tích hợp rút gọn

| Miền | Mã lớp 6–7 (TC1) | Mã lớp 8–9 (TC2) | ATM và mạch AI | Ví dụ đặc thù KHTN |
|---|---|---|---|---|
| I. Khai thác dữ liệu | 1.1.TC1b; 1.2.TC1a; 1.2.TC1b | 1.1.TC2b; 1.2.TC2a; 1.3.TC2b | ATM1; NLa, NLb | Toán 6–8: biểu đồ vẽ sai tỉ lệ trục tung; KHTN: SIFT tin giả khoa học |
| II. Giao tiếp, hợp tác | 2.4.TC1a; 2.5.TC1a; 2.6.TC1b | 2.2.TC2c; 2.5.TC2a; 2.6.TC2c | ATM2; NLb | Bộ quy ước nhóm chat học tập; tách tài khoản học tập và cá nhân |
| III. Sáng tạo nội dung | 3.1.TC1a; 3.2.TC1a; 3.3.TC1a | 3.1.TC2b; 3.3.TC2a; 3.4.TC2a | ATM6; NLb | Infographic dự án; Scratch/Python; ảnh có giấy phép CC |
| IV. An toàn, an sinh | 4.1.TC1b; 4.2.TC1a; 4.3.TC1a; 4.4.TC1a | 4.1.TC2b; 4.2.TC2c; 4.3.TC2b; 4.4.TC2a | ATM3, ATM4, ATM5 | Mật khẩu thiết bị IoT; bóc trần “quay số trúng thưởng”; rác thải điện tử |
| V. Giải quyết vấn đề | 5.1.TC1b; 5.3.TC1b | 5.2.TC2b; 5.4.TC2b | ATM8; NLc | Sơ đồ luồng xử lý khi tài khoản bị chiếm; Trello nhóm STEM |
| VI. Ứng dụng AI | 6.1.TC1a; 6.2.TC1c; 6.3.TC1b | 6.1.TC2a; 6.2.TC2c; 6.3.TC2a | ATM7; NLa–NLd | Đối chiếu lời giải AI với sách giáo khoa; phát hiện lỗi đơn vị, cân bằng phương trình |

:::tip Chọn theo “một chỗ chạm”
Đừng cố phủ cả sáu miền trong một bài. Một bài KHTN thường chỉ chạm **miền I hoặc miền VI**; bài Tin học chạm **miền III và V**; bài Công nghệ chạm **miền IV**.
:::

## Ba địa chỉ tích hợp tự nhiên

### 1. Toán 8 – biểu đồ và trục tung bị “cắt”

Khi dạy biểu đồ cột, đưa hai biểu đồ cùng số liệu nhưng một biểu đồ bắt đầu trục tung từ 90 thay vì 0.

- Mã: `1.2.TC2b` (phân tích, đánh giá dữ liệu), `ATM1`.
- Hoạt động: học sinh đo chiều cao cột, tính chênh lệch thật, viết một câu cảnh báo cho người đọc.
- Sản phẩm: phiếu “hai biểu đồ – một sự thật”.
- Mở rộng: bài xác suất thực nghiệm gắn với trò “quay số trúng thưởng 100%” (`4.1.TC2b`, `ATM4`).

### 2. KHTN – thí nghiệm ảo và kiểm chứng

Dùng PhET hoặc một mô phỏng đơn giản khi không có thiết bị thật.

- Trước khi chạy: học sinh ghi dự đoán vào phiếu.
- Trong khi chạy: đổi **một** biến, ghi kết quả.
- Sau khi chạy: so sánh với dự đoán; giải thích chỗ lệch.
- Mã: `1.2.TC1a` / `1.2.TC2a` (đánh giá độ tin cậy), `ATM1`.
- Lưu ý an toàn: mô phỏng không thay thế quy tắc an toàn phòng thí nghiệm.

### 3. Tin học 9 và Công nghệ – sự cố tài khoản, thiết bị IoT

- Tin học 9: vẽ **sơ đồ luồng** xử lý khi tài khoản mạng xã hội bị chiếm quyền điều khiển. Mã `4.1.TC2b` (kịch bản ứng phó), `ATM8`.
- Công nghệ: đặt mật khẩu mạnh cho thiết bị IoT trong gia đình/trường; giải mã cơ chế “vòng lặp phần thưởng” gây nghiện màn hình. Mã `4.2.TC1a`, `ATM3`; `4.3.TC1a`, `ATM5`.
- Sản phẩm: một tờ hướng dẫn A4 dán ở phòng máy.

## Dùng AI trong môn tự nhiên: ba kiểm tra

| Kiểm tra | Câu hỏi | Ví dụ lỗi thường gặp |
|---|---|---|
| Đơn vị | Kết quả có đúng đơn vị? | AI đổi km/h sang m/s sai hệ số |
| Dữ kiện | Số liệu có trong đề không? | AI tự thêm “khối lượng Trái Đất” |
| Logic | Bước nào nhảy cóc? | Bỏ qua điều kiện cân bằng |

Mã gắn với hoạt động này: `6.3.TC2a` (đánh giá, so sánh hiệu quả công cụ AI) và `ATM7`.

:::warn Ba điều không nhập vào AI
Không nhập: dữ liệu học sinh thật, ảnh chụp sổ điểm, mã OTP hoặc mật khẩu. Ba loại này không bao giờ cần thiết để giải một bài KHTN.
:::

<script type="text/plain" class="lesson-src" data-id="tn2-khbd"># Kế hoạch bài dạy 4C – Toán 8

:::note Mục tiêu
Có một bài mẫu thu thập – phân loại – biểu diễn dữ liệu, chạy được cả trên bảng tính và trên giấy, kèm rubric và cách dùng AI đúng chỗ.
:::

## Bài mẫu: “Thu thập và phân loại dữ liệu”

**Thông tin chung**

- Môn: Toán 8. Thời lượng: 45 phút.
- Chủ đề: thu thập, phân loại, biểu diễn dữ liệu.
- Mã tích hợp: `1.2.TC2b` (phân tích, đánh giá dữ liệu), `ATM1`; mạch NLc.
- Thiết bị: 1 máy tính + máy chiếu; phiếu khảo sát in; bảng tính có sẵn trên máy giáo viên (nếu có).

**Yêu cầu cần đạt**

1. Phân biệt được dữ liệu định tính và định lượng.
2. Lập được bảng tần số đơn giản từ dữ liệu thu thập.
3. Chọn được loại biểu đồ phù hợp và nêu một nhận xét có căn cứ.
4. Nêu được một rủi ro khi thu thập dữ liệu cá nhân.

:::warn Dữ liệu trong bài phải là dữ liệu hư cấu hoặc ẩn danh
Không thu tên, số điện thoại, địa chỉ. Chỉ thu một con số hoặc một lựa chọn. Nếu học sinh tự nguyện ghi tên, giáo viên cắt bỏ trước khi tổng hợp.
:::

## Bốn hoạt động

### Hoạt động 1 – Mở đầu (6 phút)

- Chiếu hai biểu đồ về “thời gian dùng điện thoại của học sinh khối 8”. Một biểu đồ có trục tung bắt đầu từ 0, một biểu đồ bắt đầu từ 5.
- Hỏi: *“Hai biểu đồ này nói cùng một điều không? Vì sao nhìn khác nhau?”*
- Học sinh phát biểu 30 giây; giáo viên chưa chốt.
- Dẫn vào bài: muốn biểu đồ không nói dối, phải làm đúng từ bước thu thập.

### Hoạt động 2 – Hình thành kiến thức (17 phút)

Chia lớp thành 6 nhóm, mỗi nhóm nhận một phiếu khảo sát 3 câu:

1. Bạn dùng điện thoại cho việc học bao nhiêu phút mỗi ngày? (số phút)
2. Bạn thường dùng điện thoại vào lúc nào? (sáng/trưa/tối)
3. Bạn có kiểm tra nguồn tin trước khi chia sẻ không? (luôn luôn/thỉnh thoảng/không)

Nhiệm vụ:

- Nhóm thu kết quả của **các nhóm khác** (không thu của cả trường).
- Phân loại từng câu: định tính hay định lượng.
- Lập bảng tần số cho câu 2 và câu 3.
- Chọn biểu đồ: cột cho câu 2, tròn hoặc cột cho câu 3.

Giáo viên hỏi từng nhóm một câu: *“Mẫu của nhóm em có đại diện cho cả khối không? Vì sao?”* – để học sinh thấy vấn đề chọn mẫu.

### Hoạt động 3 – Luyện tập (14 phút)

- Nhóm dựng bảng tính: nhập 20–30 dòng dữ liệu, tạo bảng tần số, vẽ biểu đồ cột.
- Nếu không có máy: kẻ bảng trên giấy, đếm bằng gạch, vẽ cột bằng thước.
- Mỗi nhóm viết **một nhận xét** theo mẫu: *“Trong mẫu của nhóm em, … chiếm nhiều nhất; tuy nhiên mẫu chỉ gồm … học sinh nên chưa thể kết luận cho cả khối.”*
- Giáo viên chiếu một bảng tính có lỗi (nhập chữ vào cột số) và hỏi cách sửa.

### Hoạt động 4 – Vận dụng (8 phút)

- Nhiệm vụ: thiết kế một phiếu khảo sát 3 câu cho vấn đề thật của lớp (ví dụ: thời gian tự học, thói quen đọc sách), trong đó **không có câu nào hỏi thông tin định danh**.
- Hai nhóm đổi phiếu, chỉ ra một câu có thể gây khó chịu hoặc thu thập quá mức.
- Chốt ba câu: dữ liệu phải đủ; mẫu phải nói rõ; biểu đồ phải trung thực.

## Rubric ba tiêu chí

| Tiêu chí | Mức 1 – Cần hỗ trợ | Mức 2 – Đạt | Mức 3 – Tốt |
|---|---|---|---|
| Thu thập | Phiếu thiếu câu, khó trả lời | Phiếu đủ 3 câu, trả lời được | Câu hỏi rõ, không thu thông tin định danh |
| Phân loại – biểu diễn | Lẫn định tính/định lượng | Phân loại đúng, biểu đồ phù hợp | Bảng tần số đúng, biểu đồ có tiêu đề và đơn vị |
| Nhận xét | Nhận xét cảm tính | Nhận xét có số liệu | Nêu số liệu, giới hạn mẫu và đề xuất |

## Phân hóa

- **Cần hỗ trợ:** phiếu có sẵn bảng tần số khung; chỉ cần điền số.
- **Trung bình:** tự lập bảng tần số từ dữ liệu thô.
- **Khá – giỏi:** thêm nhiệm vụ phát hiện một biểu đồ sai trong một bài báo và giải thích chỗ sai.

## Dùng AI ở đâu

**Được dùng**

- Sinh một bộ dữ liệu hư cấu 30 dòng để học sinh luyện vẽ biểu đồ.
- Gợi ý ba loại biểu đồ phù hợp với một câu hỏi, sau đó giáo viên chọn.

**Không dùng**

- Nhập dữ liệu khảo sát thật của học sinh.
- Để AI “nhận xét thay” vì AI không biết giới hạn mẫu của lớp.

Câu nhắc học sinh: *“Số liệu do AI tạo là số liệu giả để luyện tập; không trích dẫn như số liệu thật.”*

## Prompt mẫu

```text
Vai trò: giáo viên Toán 8.
Nhiệm vụ: tạo bảng 30 dòng dữ liệu hư cấu gồm 3 cột: số phút dùng điện thoại mỗi ngày, thời điểm dùng, có kiểm tra nguồn tin hay không.
Ràng buộc: không có tên người, không có địa chỉ, số phút trong khoảng 0–300.
Đầu ra: bảng văn bản dễ sao chép vào bảng tính, kèm 3 câu hỏi phân tích.
```

## Phương án không thiết bị

| Tình huống | Cách chạy |
|---|---|
| Không có máy chiếu | Vẽ hai biểu đồ lên bảng hoặc bảng phụ |
| Không có máy tính | Khảo sát bằng phiếu giấy, đếm gạch, vẽ cột bằng thước |
| Mất mạng | Bỏ bước bảng tính, giữ nguyên bước phân loại và nhận xét |
| Lớp quá đông | Mỗi nhóm 6–8 học sinh, thu mẫu chéo giữa các nhóm |

:::checklist Trước khi dạy
- [ ] Phiếu khảo sát không có câu hỏi định danh.
- [ ] Có hai biểu đồ mẫu (một trung thực, một cắt trục).
- [ ] Có bảng tính mẫu hoặc bảng giấy khung.
- [ ] Đã thử nhập dữ liệu vào bảng tính trước giờ học.
- [ ] Có phương án không thiết bị.
:::

## Tự kiểm tra

:::quiz
? “Thời điểm dùng điện thoại” là dữ liệu gì? | Định tính* | Định lượng | Không phải dữ liệu | Đây là dữ liệu phân loại.
? Biểu đồ cột phù hợp nhất với dữ liệu nào? | Số phút trung bình theo nhóm* | Tên học sinh | Địa chỉ nhà | Cột so sánh số liệu giữa các nhóm.
? Vì sao không thu tên học sinh trong phiếu? | Để chấm nhanh hơn | Giảm rủi ro dữ liệu cá nhân* | Vì không cần thiết cho mọi bài | Nguyên tắc tối thiểu dữ liệu.
? Câu nào nên có trong nhận xét? | “Lớp em ai cũng nghiện điện thoại” | “Trong mẫu 30 bạn, nhóm dùng buổi tối chiếm nhiều nhất”* | “Theo em là vậy” | Nhận xét cần số liệu và phạm vi mẫu.
:::

<script type="text/plain" class="lesson-src" data-id="tn3-ke-hoach"># Kế hoạch hành động 30 ngày – tổ KHTN

:::note Mục tiêu
Một kế hoạch 30 ngày cho tổ Toán – KHTN – Tin – Công nghệ, tập trung vào **một bài mô phỏng hoặc một dự án STEM nhỏ**, có phân công, bằng chứng và chỉ số an toàn thiết bị.
:::

## Năm bước, bản KHTN

| Bước | Câu hỏi | Sản phẩm |
|---|---|---|
| 1. Thực trạng | Phòng máy, mạng, thiết bị mô phỏng, số tiết có thí nghiệm | Bảng kiểm 10 dòng |
| 2. Mục tiêu SMART | 30 ngày tới bao nhiêu giáo viên, bao nhiêu bài, đo bằng gì? | 1–2 mục tiêu |
| 3. Hoạt động trọng tâm | Chọn mô phỏng hay dự án nào? | 3 hoạt động |
| 4. Nguồn lực | Thiết bị, phần mềm, người hỗ trợ kỹ thuật | Bảng phân công |
| 5. KPI | Biết thành công nhờ dữ liệu nào? | 5 chỉ số |

**Ví dụ mục tiêu:** *“Đến 20/12, 4/6 giáo viên của tổ dạy ít nhất một tiết có mô phỏng hoặc dự án STEM, mỗi tiết có phiếu dự đoán của học sinh và một sản phẩm lưu trong thư mục chung.”*

:::warn Chỉ số không nên là “số lần mở phần mềm”
Mở phần mềm không chứng minh học sinh học được. Chỉ số phải gắn với **sản phẩm của học sinh** hoặc **phiếu dự đoán – kết luận**.
:::

## Bốn tuần PDCA

### Tuần 1 – Plan: kiểm tra hạ tầng trước khi chọn bài

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Kiểm tra 3 phòng: mạng, ổ cắm, máy chiếu, số máy hoạt động | Tổ trưởng + phụ trách thiết bị | Phiếu kiểm có ảnh |
| Liệt kê phần mềm đã có: bảng tính, GeoGebra, PhET (bản cài/ngoại tuyến) | GV Tin học | Danh sách |
| Chọn 1 bài có mô phỏng hoặc thí nghiệm nhỏ | Nhóm Toán hoặc Lí – Hóa – Sinh | Biên bản chọn |
| Thống nhất phiếu dự đoán 3 dòng | Cả tổ | Mẫu phiếu |

**Kết thúc tuần 1:** biết chính xác phòng nào chạy được, bài nào dạy, ai dạy thử.

### Tuần 2 – Do: dạy thử, ghi lỗi kỹ thuật

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Dạy thử theo 4 hoạt động, có bước dự đoán | Giáo viên đăng ký | KHBD |
| Ghi nhật ký lỗi: máy nào lỗi, mạng rớt lúc nào, thao tác nào học sinh lúng túng | GV + phụ trách thiết bị | Nhật ký 1 trang |
| Chụp 3 phiếu dự đoán đã ẩn tên | Giáo viên | 3 ảnh |
| Hai đồng nghiệp dự, ghi phiếu quan sát | Nhóm quan sát | Phiếu |

:::tip Quy tắc “ba trước khi hỏi thầy”
Khi gặp lỗi kỹ thuật, học sinh: (1) đọc lại thông báo lỗi, (2) thử một thao tác đơn giản, (3) hỏi bạn cùng nhóm – rồi mới giơ tay. Quy tắc này giảm tải cho giáo viên và dạy học sinh tự xử lý.
:::

### Tuần 3 – Check: so sánh dự đoán với kết quả

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Đếm tỷ lệ phiếu có dự đoán đúng hướng | Giáo viên | Bảng tổng hợp |
| Hỏi 5 học sinh: “phần nào giúp em hiểu nhất?” | Giáo viên | 5 câu trả lời ẩn danh |
| Kiểm tra an toàn: dây điện, ổ cắm, thiết bị IoT, tài khoản dùng chung | Phụ trách thiết bị | Danh sách kiểm |
| Đo thời gian chuẩn bị thực tế | Giáo viên | 1 dòng ghi chú |

### Tuần 4 – Act: chuẩn hóa thành quy trình của tổ

| Việc | Người làm | Bằng chứng |
|---|---|---|
| Sửa bài thành phiên bản 2, thêm “phương án không thiết bị” | Giáo viên | Tệp v2 |
| Chia sẻ 10 phút: điều gì hiệu quả, điều gì bỏ | Giáo viên + tổ trưởng | Biên bản |
| Lưu mẫu phiếu dự đoán và danh sách kiểm thiết bị vào thư mục chung | Tổ trưởng | Đường dẫn |
| Chọn bài tiếp theo | Cả tổ | Danh sách 2 bài |

## RACI

| Việc | Hiệu trưởng | Phó hiệu trưởng | Tổ trưởng | GV nòng cốt | GV bộ môn | Phụ trách thiết bị |
|---|---|---|---|---|---|---|
| Phê duyệt kế hoạch | A | C | R | C | I | I |
| Kiểm tra hạ tầng | I | I | A | C | I | R |
| Chọn bài dạy thử | I | I | A | R | C | I |
| Dạy thử | I | I | C | C | R/A | C |
| Kiểm tra an toàn thiết bị | A | R | C | I | I | R |
| Chia sẻ trong tổ | I | I | A | R | C | I |

Mỗi việc chỉ một chữ **A**. Nếu phụ trách thiết bị kiêm nhiệm nhiều trường, ghi rõ ngày hỗ trợ trong tuần 1.

## Năm vùng KPI

| Vùng | Chỉ số gợi ý | Cách thu thập |
|---|---|---|
| Hồ sơ dạy học | Số bài có KHBD 4C và phiếu dự đoán | Thư mục tổ |
| Giờ dạy | Số tiết có mô phỏng/thí nghiệm | Lịch báo giảng + phiếu dự |
| Học sinh | % phiếu dự đoán có ghi lý do | Ảnh phiếu đã ẩn tên |
| An toàn | Số sự cố thiết bị/điện xảy ra (mục tiêu: 0) | Sổ sự cố |
| Chia sẻ | Số lượt chia sẻ trong sinh hoạt tổ | Biên bản |

## Thư mục bằng chứng

```text
30-ngay-KHTN/
  01-ke-hoach/
  02-bai-day/

Không lưu ảnh có mặt học sinh rõ ràng nếu chưa có sự đồng ý của phụ huynh theo quy định của nhà trường.
